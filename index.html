<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#1a1b2e">
    <title>Gettic</title>
    <link rel="manifest" href="data:application/json,{}">
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        :root {
            --bg: #1a1b2e;
            --bg2: #1f2038;
            --bg3: #252740;
            --hover: #2a2c45;
            --active: #2f3150;
            --accent: #4a6cf7;
            --green: #22c55e;
            --yellow: #eab308;
            --red: #ef4444;
            --text: #e8e8f0;
            --text2: #a0a3b8;
            --text3: #6b6e80;
            --border: #2a2c42;
            --radius: 10px;
            --radius-sm: 6px;
            --font: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            --shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
        }
        .theme-light {
            --bg: #f2f3f5;
            --bg2: #ffffff;
            --bg3: #e8e9ec;
            --hover: #e0e1e5;
            --active: #d4d5d9;
            --text: #1a1b2e;
            --text2: #4a4b5e;
            --text3: #7a7b8e;
            --border: #d0d1d5;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .screen {
            display: none;
            width: 100%;
            height: 100%;
        }
        .screen.active {
            display: flex;
        }
        #auth-screen {
            justify-content: center;
            align-items: center;
            background: linear-gradient(145deg, #1a1b2e 0%, #1e2040 40%, #1a1d3a 100%);
            padding: 20px;
        }
        .auth-box {
            background: var(--bg2);
            padding: 44px 36px;
            border-radius: 18px;
            width: 440px;
            max-width: 94%;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }
        .auth-box .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .auth-box .logo h1 {
            font-size: 2.2em;
            font-weight: 800;
            background: linear-gradient(135deg, #4a6cf7, #7c8cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .auth-box .logo p {
            color: var(--text2);
            font-size: 13px;
            margin-top: 4px;
        }
        .tabs {
            display: flex;
            background: var(--bg3);
            border-radius: 10px;
            padding: 3px;
            margin-bottom: 24px;
            gap: 3px;
        }
        .tabs button {
            flex: 1;
            padding: 11px;
            border: none;
            background: transparent;
            color: var(--text2);
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: 0.2s;
        }
        .tabs button.active {
            background: var(--accent);
            color: #fff;
        }
        .fg {
            display: none;
            flex-direction: column;
            gap: 15px;
        }
        .fg.active {
            display: flex;
        }
        .if {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .if label {
            font-size: 11px;
            font-weight: 700;
            color: var(--text2);
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }
        .iw {
            display: flex;
            background: var(--bg3);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            transition: 0.2s;
        }
        .iw:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(74, 108, 247, 0.15);
        }
        .iw input {
            flex: 1;
            padding: 12px 14px;
            background: transparent;
            border: none;
            color: var(--text);
            font-size: 14px;
            outline: none;
            min-width: 0;
        }
        .iw input::placeholder {
            color: var(--text3);
        }
        .iw .eye {
            background: none;
            border: none;
            padding: 0 12px;
            cursor: pointer;
            color: var(--text3);
            font-size: 16px;
        }
        .btn {
            padding: 13px;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-weight: 700;
            font-size: 14px;
            transition: 0.2s;
        }
        .btn-primary {
            background: var(--accent);
            color: #fff;
        }
        .btn-danger {
            background: var(--red);
            color: #fff;
        }
        .btn-green {
            background: var(--green);
            color: #fff;
        }
        .btn-sm {
            padding: 6px 14px;
            font-size: 12px;
            border-radius: 4px;
            width: auto;
        }
        .link-text {
            text-align: center;
            font-size: 12px;
            color: var(--text3);
            margin-top: 4px;
        }
        .link-text span {
            color: var(--accent);
            cursor: pointer;
            font-weight: 600;
        }

        #main-screen {
            flex-direction: row;
        }
        .server-list {
            width: 60px;
            background: #151628;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px 0;
            gap: 5px;
            border-right: 1px solid var(--border);
            flex-shrink: 0;
            overflow-y: auto;
        }
        .server-icon {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--bg2);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-weight: 700;
            font-size: 14px;
            color: var(--text2);
            transition: 0.2s;
            position: relative;
            flex-shrink: 0;
        }
        .server-icon:hover,
        .server-icon.active {
            border-radius: 24%;
            background: var(--accent);
            color: #fff;
        }
        .server-icon.add {
            color: var(--green);
            font-size: 20px;
        }
        .server-sep {
            width: 28px;
            height: 2px;
            background: var(--border);
            border-radius: 1px;
            margin: 2px 0;
        }
        .server-tip {
            display: none;
            position: absolute;
            left: 52px;
            background: #000;
            color: #fff;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 11px;
            white-space: nowrap;
            z-index: 999;
            pointer-events: none;
        }

        .sidebar {
            width: 250px;
            background: var(--bg2);
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border);
            flex-shrink: 0;
        }
        .sidebar-header {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
            font-weight: 700;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .section-title {
            padding: 16px 16px 4px;
            font-size: 11px;
            font-weight: 700;
            color: var(--text3);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
        }
        .voice-item,
        .room-item,
        .dm-item {
            padding: 7px 12px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text2);
            font-size: 13px;
            transition: 0.15s;
            margin: 0 6px 1px;
        }
        .voice-item:hover,
        .room-item:hover,
        .dm-item:hover {
            background: var(--hover);
            color: var(--text);
        }
        .voice-item.active,
        .room-item.active,
        .dm-item.active {
            background: var(--active);
            color: #fff;
        }
        .sidebar-footer {
            padding: 8px 12px;
            background: #1a1b2e;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid var(--border);
        }
        .avatar {
            width: 33px;
            height: 33px;
            border-radius: 50%;
            background: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 13px;
            color: #fff;
            background-size: cover;
            background-position: center;
        }
        .chat-wrap {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            background: var(--bg);
        }
        .voice-bar {
            display: none;
            padding: 8px 16px;
            background: #1a2e20;
            border-bottom: 1px solid var(--green);
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }
        .voice-bar.open {
            display: flex;
        }
        .chat-top {
            padding: 10px 20px;
            background: var(--bg);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        .msg-area {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
        }
        .msg {
            padding: 5px 12px;
            border-radius: var(--radius-sm);
            transition: background 0.15s;
        }
        .msg:hover {
            background: var(--hover);
        }
        .msg .mhdr {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .msg .mava {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 12px;
            color: #fff;
        }
        .msg .muser {
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
        }
        .msg .mtime {
            font-size: 10px;
            color: var(--text3);
        }
        .msg .mbody {
            margin-left: 42px;
            font-size: 13px;
            color: var(--text);
            line-height: 1.5;
            word-break: break-word;
        }
        .input-zone {
            padding: 0 16px 18px;
            flex-shrink: 0;
        }
        .input-row {
            display: flex;
            gap: 8px;
            background: var(--bg2);
            padding: 8px 14px;
            border-radius: var(--radius-sm);
            align-items: flex-end;
            border: 1px solid transparent;
        }
        .input-row:focus-within {
            border-color: var(--accent);
        }
        .input-row textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text);
            font-size: 13px;
            resize: none;
            outline: none;
            max-height: 130px;
            font-family: inherit;
        }
        .input-row .send {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 8px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 600;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal.open {
            display: flex;
        }
        .modal-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
        }
        .modal-box {
            background: var(--bg2);
            border-radius: 14px;
            padding: 28px;
            width: 460px;
            max-width: 95%;
            z-index: 1;
            border: 1px solid var(--border);
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: var(--shadow);
        }
        #toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 26px;
            border-radius: 20px;
            color: #fff;
            font-weight: 600;
            z-index: 9999;
            font-size: 12px;
            display: none;
        }
        .online-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--green);
            flex-shrink: 0;
        }
        .poll-option {
            padding: 6px 10px;
            background: var(--bg3);
            border-radius: 4px;
            margin: 2px 0;
            cursor: pointer;
        }
        .poll-option:hover {
            background: var(--hover);
        }
    </style>
</head>
<body>
    <div id="auth-screen" class="screen active">
        <div class="auth-box">
            <div class="logo"><h1>Gettic</h1><p>Takıl, konuş, paylaş</p></div>
            <div class="tabs"><button id="tab-login" class="active" onclick="switchTab('login')">Giriş</button><button id="tab-register" onclick="switchTab('register')">Kayıt</button></div>
            <div id="form-login" class="fg active">
                <div class="if"><label>Kullanıcı Adı</label><div class="iw"><input type="text" id="login-user" placeholder="Kullanıcı adınız" autocomplete="off"></div></div>
                <div class="if"><label>Şifre</label><div class="iw"><input type="password" id="login-pass" placeholder="Şifreniz"><button class="eye" onclick="togglePass('login-pass',this)">👁</button></div></div>
                <button class="btn btn-primary" onclick="doLogin()">Giriş Yap</button>
                <p class="link-text">Hesabın yok mu? <span onclick="switchTab('register')">Kayıt Ol</span></p>
            </div>
            <div id="form-register" class="fg">
                <div class="if"><label>Kullanıcı Adı</label><div class="iw"><input type="text" id="reg-user" placeholder="Kullanıcı adı seç" autocomplete="off" minlength="3" maxlength="20"></div></div>
                <div class="if"><label>Şifre</label><div class="iw"><input type="password" id="reg-pass" placeholder="En az 6 karakter" minlength="6"><button class="eye" onclick="togglePass('reg-pass',this)">👁</button></div></div>
                <button class="btn btn-primary" onclick="doRegister()">Kayıt Ol</button>
                <p class="link-text">Hesabın var mı? <span onclick="switchTab('login')">Giriş Yap</span></p>
            </div>
        </div>
    </div>

    <div id="main-screen" class="screen">
        <div class="server-list"><div class="server-icon active">G<span class="server-tip">Ana Sunucu</span></div><div class="server-sep"></div><div class="server-icon add" onclick="showServerModal()">+<span class="server-tip">Sunucu Ekle</span></div></div>
        <div class="sidebar">
            <div class="sidebar-header"><span id="server-name">Gettic</span><button onclick="showServerSettings()">⚙</button></div>
            <div class="section-title">💬 DM</div>
            <div class="dm-list" id="dm-list"></div>
            <div class="section-title">🔊 Sesli</div>
            <div class="voice-list" id="voice-list"></div>
            <div class="section-title">📝 Yazılı</div>
            <div class="room-list" id="room-list"></div>
            <div class="sidebar-footer">
                <div class="user-row" onclick="showProfileModal()"><div class="avatar" id="my-avatar">?</div><div class="user-meta"><span id="my-name">Misafir</span><span id="my-status">Çevrimiçi</span></div></div>
                <div class="btns"><button onclick="showSettingsModal()">⚙</button><button onclick="doLogout()">🚪</button></div>
            </div>
        </div>
        <div class="chat-wrap">
            <div class="voice-bar" id="voice-bar"><span id="v-info">🔊 Bağlanıyor...</span><div class="v-btns"><button class="v-btn" id="btn-mute" onclick="toggleMute()">🎤</button><button class="v-btn" onclick="toggleCamera()">📷</button><button class="v-btn" onclick="toggleScreen()">🖥</button><button class="v-btn btn-danger" onclick="leaveVoice()">✕</button></div></div>
            <div class="chat-top"><span>#<span id="room-name">genel</span></span><span id="online-count">0 çevrimiçi</span></div>
            <div class="msg-area" id="messages"><div class="welcome"><h2>Gettic'e Hoş Geldin!</h2></div></div>
            <div class="input-zone"><div class="input-row"><textarea id="msg-input" placeholder="Mesaj yaz..." rows="1" onkeydown="handleInput(event)"></textarea><button class="send" onclick="sendMsg()">Gönder</button></div></div>
        </div>
    </div>

    <div id="room-modal" class="modal"><div class="modal-bg" onclick="closeRoomModal()"></div><div class="modal-box"><h3>Kanal Oluştur</h3><select id="new-room-type"><option value="text">Yazılı</option><option value="voice">Sesli</option></select><input type="text" id="new-room-name" placeholder="Ad"><input type="text" id="new-room-cat" placeholder="Kategori"><button class="btn btn-primary" onclick="createRoom()">Oluştur</button></div></div>
    <div id="server-modal" class="modal"><div class="modal-bg" onclick="closeServerModal()"></div><div class="modal-box"><h3>Sunucu</h3><input id="new-server-name" placeholder="Ad"><button class="btn btn-primary" onclick="createServer()">Oluştur</button></div></div>
    <div id="settings-modal" class="modal"><div class="modal-bg" onclick="closeSettingsModal()"></div><div class="modal-box"><h3>Ayarlar</h3><select id="theme-select" onchange="changeTheme(this.value)"><option value="dark">Koyu</option><option value="light">Açık</option></select><button class="btn btn-primary" onclick="closeSettingsModal()">Kapat</button></div></div>
    <div id="profile-modal" class="modal"><div class="modal-bg" onclick="closeProfileModal()"></div><div class="modal-box"><h3>Profil</h3><div id="profile-content"></div></div></div>
    <div id="toast"></div>

    <script>
        (function() {
            var API = window.location.origin;
            var socket, me, token, cRoom = 'genel',
                reply = null,
                rooms = [],
                voiceRooms = [{ id: 'genel', name: 'Genel Sesli', users: [] }],
                dms = [],
                friends = [],
                inVoice = null,
                localStream, screenStream, notifications = true,
                theme = 'dark';

            if (localStorage.getItem('gt_token')) {
                token = localStorage.getItem('gt_token');
                me = JSON.parse(localStorage.getItem('gt_user'));
                openApp();
            }

            window.switchTab = function(t) { document.getElementById('tab-login').classList.toggle('active', t ===
                    'login');
                document.getElementById('tab-register').classList.toggle('active', t === 'register');
                document.getElementById('form-login').classList.toggle('active', t === 'login');
                document.getElementById('form-register').classList.toggle('active', t === 'register'); };
            window.togglePass = function(id, btn) { var i = document.getElementById(id);
                i.type = i.type === 'password' ? 'text' : 'password';
                btn.textContent = i.type === 'password' ? '👁' : '🙈'; };
            window.doLogin = function() { var u = document.getElementById('login-user').value.trim(),
                    p = document.getElementById('login-pass').value;
                fetch(API + '/api/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: u, password: p }) }).then(r => r.json()).then(d => { if (d
                        .error) return toast(d.error, 'error');
                    me = d.user;
                    token = d.token;
                    localStorage.setItem('gt_token', token);
                    localStorage.setItem('gt_user', JSON.stringify(me));
                    openApp(); }).catch(function() { toast('Bağlantı hatası', 'error'); }); };
            window.doRegister = function() { var u = document.getElementById('reg-user').value.trim(),
                    p = document.getElementById('reg-pass').value;
                fetch(API + '/api/auth/register', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: u, password: p }) }).then(r => r.json()).then(d => { if (d
                        .error) return toast(d.error, 'error');
                    me = d.user;
                    token = d.token;
                    localStorage.setItem('gt_token', token);
                    localStorage.setItem('gt_user', JSON.stringify(me));
                    openApp(); }).catch(function() { toast('Bağlantı hatası', 'error'); }); };
            window.doLogout = function() { localStorage.clear();
                location.reload(); };

            function openApp() {
                document.getElementById('auth-screen').classList.remove('active');
                document.getElementById('main-screen').classList.add('active');
                document.getElementById('my-name').textContent = me.username;
                document.getElementById('my-avatar').textContent = me.username.charAt(0).toUpperCase();
                connectSocket();
                loadData();
            }

            function connectSocket() { socket = io(API);
                socket.on('receive-message', m => showMsg(m));
                socket.on('room-user-count', c => document.getElementById('online-count').textContent = c + ' çevrimiçi'); }

            function loadData() { fetch(API + '/api/rooms').then(r => r.json()).then(d => { rooms = d || [];
                    renderUI(); }); }

            function renderUI() {
                var rl = document.getElementById('room-list'),
                    vl = document.getElementById('voice-list'),
                    dl = document.getElementById('dm-list');
                rl.innerHTML = '';
                vl.innerHTML = '';
                dl.innerHTML = '';
                rooms.forEach(r => { var d = document.createElement('div');
                    d.className = 'room-item';
                    d.innerHTML = '# ' + r.name;
                    d.onclick = () => joinRoom(r._id || r.name, r.name);
                    rl.appendChild(d); });
                voiceRooms.forEach(v => { var d = document.createElement('div');
                    d.className = 'voice-item';
                    d.innerHTML = '🔊 ' + v.name;
                    d.onclick = () => joinVoice(v.id);
                    vl.appendChild(d); });
                dms.forEach(dm => { var d = document.createElement('div');
                    d.className = 'dm-item';
                    d.innerHTML = '@ ' + dm.name;
                    d.onclick = () => joinRoom('dm-' + dm.id, dm.name);
                    dl.appendChild(d); });
            }

            window.joinRoom = function(id, name) { cRoom = id;
                document.getElementById('room-name').textContent = name;
                document.getElementById('messages').innerHTML = ''; if (socket) socket.emit('join-room', id); };
            window.sendMsg = function() { var t = document.getElementById('msg-input').value.trim(); if (!t || !socket)
                    return;
                socket.emit('send-message', { content: t, senderId: me._id, senderName: me.username, roomId: cRoom,
                    type: 'text' });
                document.getElementById('msg-input').value = ''; };

            function showMsg(m) {
                var d = document.createElement('div');
                d.className = 'msg';
                d.innerHTML = '<div class="mhdr"><div class="mava">' + m.senderName.charAt(0) + '</div><span class="muser">' +
                    m.senderName + '</span></div><div class="mbody">' + m.content + '</div>';
                document.getElementById('messages').appendChild(d);
            }

            window.joinVoice = async function(vid) {
                if (inVoice) leaveVoice();
                try { localStream = await navigator.mediaDevices.getUserMedia({ audio: true }); } catch (e) { return toast(
                        'Mikrofon izni gerekli', 'error'); }
                inVoice = vid;
                document.getElementById('voice-bar').classList.add('open');
                document.getElementById('v-info').textContent = '🔊 Bağlandın'; };
            window.leaveVoice = function() { if (localStream) localStream.getTracks().forEach(t => t.stop());
                document.getElementById('voice-bar').classList.remove('open');
                inVoice = null; };
            window.toggleMute = function() { if (localStream) { var m = !localStream.getAudioTracks()[0]
                    .enabled;
                    localStream.getAudioTracks()[0].enabled = !m;
                    document.getElementById('btn-mute').textContent = m ? '🔇' : '🎤'; } };
            window.toggleCamera = async function() { try { var vs = await navigator.mediaDevices.getUserMedia({ video: true });
                    toast('Kamera açıldı', 'success'); } catch (e) { toast('Kamera izni gerekli', 'error'); } };
            window.toggleScreen = async function() { try { screenStream = await navigator.mediaDevices.getDisplayMedia({
                    video: true });
                    toast('Ekran paylaşılıyor', 'success'); } catch (e) { toast('İptal', 'error'); } };

            window.showRoomModal = function() { document.getElementById('room-modal').classList.add('open'); };
            window.closeRoomModal = function() { document.getElementById('room-modal').classList.remove('open'); };
            window.createRoom = function() { var n = document.getElementById('new-room-name').value.trim(); if (!n)
                    return;
                fetch(API + '/api/rooms', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: n }) }).then(r => r.json()).then(() => { loadData();
                    closeRoomModal(); }); };
            window.showServerModal = function() { document.getElementById('server-modal').classList.add('open'); };
            window.closeServerModal = function() { document.getElementById('server-modal').classList.remove('open'); };
            window.createServer = function() { var n = document.getElementById('new-server-name').value.trim(); if (n)
                    document.getElementById('server-name').textContent = n;
                closeServerModal(); };
            window.showServerSettings = function() { toast('Sunucu ayarları', 'info'); };
            window.showSettingsModal = function() { document.getElementById('settings-modal').classList.add('open'); };
            window.closeSettingsModal = function() { document.getElementById('settings-modal').classList.remove(
            'open'); };
            window.changeTheme = function(t) { theme = t;
                document.body.classList.toggle('theme-light', t === 'light');
                localStorage.setItem('gt_theme', t); };
            window.showProfileModal = function() { document.getElementById('profile-modal').classList.add('open');
                document.getElementById('profile-content').innerHTML = '<h2>' + me.username +
                '</h2><p>Çevrimiçi</p><button class="btn btn-sm btn-primary">Arkadaş Ekle</button>'; };
            window.closeProfileModal = function() { document.getElementById('profile-modal').classList.remove(
            'open'); };
            window.handleInput = function(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault();
                    sendMsg(); } };

            function toast(m, t) { var e = document.getElementById('toast');
                e.textContent = m;
                e.style.background = t === 'error' ? '#ef4444' : '#4a6cf7';
                e.style.display = 'block';
                setTimeout(() => e.style.display = 'none', 3000); }
            window.toast = toast;
            document.addEventListener('click', function(e) { if (e.target.classList.contains('modal-bg')) e.target
                    .parentElement.classList.remove('open'); });
            if (localStorage.getItem('gt_theme') === 'light') changeTheme('light');
        })();
    </script>
</body>
                                                  </html>
