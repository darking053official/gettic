<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gettic - Kurumsal İletişim Platformu</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #0a0a0f;
      color: #e0e0e0;
    }
    
    .gettic-gradient {
      background: linear-gradient(135deg, #1e40af, #3b82f6);
    }
    
    .login-card {
      background: #16181f;
      border: 1px solid #334155;
    }
    
    input {
      transition: all 0.2s;
    }
    
    input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.3);
    }
  </style>
</head>
<body class="min-h-screen overflow-hidden bg-[#0a0a0f]">

  <!-- LOGIN / KAYIT EKRANI -->
  <div id="auth-screen" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/90">
    <div class="login-card w-full max-w-md p-8 rounded-3xl shadow-2xl">
      <div class="text-center mb-10">
        <img src="https://raw.githubusercontent.com/darking053official/gettic/main/1777062266055.png" 
             alt="Gettic Logo" class="mx-auto w-20 h-20 rounded-3xl mb-6">
        <h1 class="text-4xl font-bold text-white">Gettic</h1>
        <p class="text-blue-400 text-lg mt-1">Kurumsal İletişim Platformu</p>
      </div>

      <div class="flex border-b border-gray-700 mb-8">
        <button id="tab-login" class="flex-1 py-4 font-semibold border-b-2 border-blue-500 text-blue-400">Giriş Yap</button>
        <button id="tab-register" class="flex-1 py-4 font-semibold text-gray-400">Kayıt Ol</button>
      </div>

      <!-- Giriş Formu -->
      <div id="login-form" class="space-y-5">
        <input id="login-username" type="text" placeholder="Kullanıcı Adı" 
               class="w-full bg-zinc-900 border border-zinc-700 rounded-2xl px-5 py-4 text-base outline-none">
        <input id="login-password" type="password" placeholder="Şifre" 
               class="w-full bg-zinc-900 border border-zinc-700 rounded-2xl px-5 py-4 text-base outline-none">
        <button id="login-btn" 
                class="w-full gettic-gradient py-4 rounded-3xl font-semibold text-lg hover:brightness-110 transition flex items-center justify-center gap-2">
          <i class="fas fa-sign-in-alt"></i> Gettic'e Giriş Yap
        </button>
      </div>

      <!-- Kayıt Formu -->
      <div id="register-form" class="hidden space-y-5">
        <input id="reg-username" type="text" placeholder="Kullanıcı Adı" 
               class="w-full bg-zinc-900 border border-zinc-700 rounded-2xl px-5 py-4 text-base outline-none">
        <input id="reg-password" type="password" placeholder="Şifre" 
               class="w-full bg-zinc-900 border border-zinc-700 rounded-2xl px-5 py-4 text-base outline-none">
        <button id="register-btn" 
                class="w-full gettic-gradient py-4 rounded-3xl font-semibold text-lg hover:brightness-110 transition flex items-center justify-center gap-2">
          <i class="fas fa-user-plus"></i> Hesap Oluştur
        </button>
      </div>

      <p class="text-center text-xs text-gray-500 mt-10">gettic.js ile güçlendirilmiş • 200+ Kurumsal Özellik</p>
    </div>
  </div>

  <!-- ANA PLATFORM (Mobil uyumlu) -->
  <div id="main-app" class="hidden h-screen flex flex-col">

    <div class="flex flex-1 overflow-hidden">

      <!-- Sunucu Bar -->
      <div class="w-16 bg-[#0f1016] flex flex-col items-center pt-6 space-y-8 border-r border-gray-800">
        <img src="https://raw.githubusercontent.com/darking053official/gettic/main/1777062266055.png" 
             alt="Gettic" class="w-12 h-12 rounded-3xl">
      </div>

      <!-- Kanal Listesi -->
      <div class="w-64 bg-[#1a1c23] flex flex-col border-r border-gray-800 overflow-y-auto">
        <div class="p-4 font-semibold border-b border-gray-700">Gettic Kurumsal</div>
        <div class="flex-1 p-4 space-y-2">
          <div onclick="switchRoom('genel-iletisim')" class="channel-item px-5 py-4 rounded-3xl cursor-pointer flex items-center gap-3 text-blue-300">
            <i class="fas fa-hashtag"></i> genel-iletisim
          </div>
          <div onclick="switchRoom('proje-takip')" class="channel-item px-5 py-4 rounded-3xl cursor-pointer flex items-center gap-3">
            <i class="fas fa-hashtag"></i> proje-takip
          </div>
          <div onclick="joinVoice()" class="channel-item px-5 py-4 rounded-3xl cursor-pointer flex items-center gap-3 text-emerald-400">
            <i class="fas fa-volume-high"></i> Sesli Toplantı
          </div>
          <div onclick="startVideoCall()" class="channel-item px-5 py-4 rounded-3xl cursor-pointer flex items-center gap-3 text-purple-400">
            <i class="fas fa-video"></i> Görüntülü Görüşme
          </div>
          <div onclick="startScreenShare()" class="channel-item px-5 py-4 rounded-3xl cursor-pointer flex items-center gap-3 text-orange-400">
            <i class="fas fa-desktop"></i> Ekran Paylaşımı
          </div>
        </div>
      </div>

      <!-- Chat Alanı -->
      <div class="flex-1 flex flex-col">
        <div class="h-14 bg-[#24272f] border-b border-gray-700 flex items-center px-4 font-semibold">
          <span id="room-title"># genel-iletisim</span>
        </div>

        <div id="messages" class="flex-1 overflow-y-auto p-4 bg-[#1f222a] space-y-6"></div>

        <div class="p-4 bg-[#24272f] border-t border-gray-700">
          <div class="flex gap-3">
            <input id="message-input" type="text" placeholder="Mesaj yazın..." 
                   class="flex-1 bg-[#2f323a] rounded-3xl px-5 py-4 outline-none">
            <button id="send-btn" class="bg-blue-600 hover:bg-blue-700 w-12 h-12 rounded-3xl flex items-center justify-center">
              <i class="fas fa-paper-plane"></i>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const socket = io();
    let currentUsername = null;
    let currentRoom = "genel-iletisim";

    // Tab switching
    document.getElementById('tab-login').addEventListener('click', () => {
      document.getElementById('login-form').classList.remove('hidden');
      document.getElementById('register-form').classList.add('hidden');
      document.getElementById('tab-login').classList.add('border-b-2', 'border-blue-500', 'text-blue-400');
      document.getElementById('tab-register').classList.remove('border-b-2', 'border-blue-500', 'text-blue-400');
    });

    document.getElementById('tab-register').addEventListener('click', () => {
      document.getElementById('register-form').classList.remove('hidden');
      document.getElementById('login-form').classList.add('hidden');
      document.getElementById('tab-register').classList.add('border-b-2', 'border-blue-500', 'text-blue-400');
      document.getElementById('tab-login').classList.remove('border-b-2', 'border-blue-500', 'text-blue-400');
    });

    // Login
    document.getElementById('login-btn').addEventListener('click', async () => {
      const username = document.getElementById('login-username').value.trim();
      const password = document.getElementById('login-password').value;
      if (!username || !password) return alert("Kullanıcı adı ve şifre girin.");

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (data.success) {
          currentUsername = data.username;
          document.getElementById('auth-screen').classList.add('hidden');
          document.getElementById('main-app').classList.remove('hidden');
          socket.emit('login', { token: data.token });
          initPlatform();
        } else {
          alert(data.error || "Giriş başarısız.");
        }
      } catch (e) {
        alert("Bağlantı hatası. Tekrar deneyin.");
      }
    });

    // Register
    document.getElementById('register-btn').addEventListener('click', async () => {
      const username = document.getElementById('reg-username').value.trim();
      const password = document.getElementById('reg-password').value;
      if (!username || !password) return alert("Kullanıcı adı ve şifre girin.");

      try {
        const res = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (data.success) {
          alert("Hesap oluşturuldu! Giriş yapabilirsiniz.");
          document.getElementById('tab-login').click();
        } else {
          alert(data.error || "Kayıt başarısız.");
        }
      } catch (e) {
        alert("Kayıt hatası.");
      }
    });

    function initPlatform() {
      document.getElementById('room-title').textContent = `# genel-iletisim`;
      addSystemMessage("Gettic'e hoş geldiniz.");
    }

    function addSystemMessage(text) {
      const container = document.getElementById('messages');
      const div = document.createElement('div');
      div.className = 'text-center text-gray-400 py-4';
      div.textContent = text;
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
    }

    function switchRoom(room) {
      currentRoom = room;
      document.getElementById('room-title').textContent = `# ${room}`;
      document.getElementById('messages').innerHTML = '';
      addSystemMessage(`#${room} odasına geçildi.`);
    }

    // Mesaj gönderme
    const msgInput = document.getElementById('message-input');
    document.getElementById('send-btn').addEventListener('click', () => {
      const content = msgInput.value.trim();
      if (content && currentUsername) {
        addMessage(currentUsername, content);
        socket.emit('sendMessage', { room: currentRoom, content });
        msgInput.value = '';
      }
    });

    function addMessage(sender, content) {
      const container = document.getElementById('messages');
      const div = document.createElement('div');
      div.className = 'flex gap-3';
      div.innerHTML = `
        <div class="w-8 h-8 bg-blue-600 rounded-2xl flex-shrink-0 flex items-center justify-center text-white font-bold">${sender[0]}</div>
        <div>
          <div class="font-semibold">${sender}</div>
          <div class="text-gray-200">${content}</div>
        </div>
      `;
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
    }

    socket.on('newMessage', (msg) => {
      if (msg.senderName !== currentUsername) {
        addMessage(msg.senderName, msg.content);
      }
    });

    // Basit video ve ekran paylaşım fonksiyonları (önceki gibi)
    async function startVideoCall() {
      alert("📹 Görüntülü görüşme başlatılıyor... (Kamera izni isteyecek)");
      // Gerçek implementasyon burada olabilir
    }

    async function startScreenShare() {
      alert("🖥️ Ekran paylaşımı başlatılıyor...");
    }

    function joinVoice() {
      alert("🔊 Sesli toplantıya katıldınız.");
    }

    window.onload = () => {
      document.getElementById('auth-screen').classList.remove('hidden');
      document.getElementById('tab-login').click();
    };
  </script>
</body>
</html>
