<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gettic | Kurumsal İletişim</title>
    <style>
        :root {
            --bg-darker: #0b0b0e;
            --bg-sidebar: #15151b;
            --bg-chat: #1c1c24;
            --accent: #4f46e5;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --border: #2d2d39;
        }

        body, html { margin: 0; height: 100vh; font-family: 'Inter', sans-serif; background: var(--bg-darker); color: var(--text-main); overflow: hidden; }
        .app-container { display: flex; height: 100vh; }

        /* PNG İkon Ayarları */
        .icon { width: 20px; height: 20px; filter: brightness(0) invert(1); opacity: 0.7; transition: 0.2s; }
        .icon:hover { opacity: 1; }

        /* Sol Sidebar - Sunucular */
        .workspace-bar { width: 72px; background: var(--bg-darker); display: flex; flex-direction: column; align-items: center; padding: 12px 0; border-right: 1px solid var(--border); }
        .workspace-item { width: 48px; height: 48px; background: var(--bg-sidebar); border-radius: 16px; margin-bottom: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.3s; }
        .workspace-item:hover { border-radius: 12px; background: var(--accent); }

        /* Kanal Sidebar */
        .channel-sidebar { width: 240px; background: var(--bg-sidebar); display: flex; flex-direction: column; border-right: 1px solid var(--border); }
        .sidebar-header { padding: 16px; font-weight: bold; border-bottom: 1px solid var(--border); font-size: 14px; }
        .channel-list { flex: 1; padding: 10px; overflow-y: auto; }
        .channel-item { display: flex; align-items: center; padding: 8px 12px; border-radius: 6px; cursor: pointer; margin-bottom: 2px; color: var(--text-muted); }
        .channel-item:hover, .channel-item.active { background: #2d2d39; color: white; }
        .channel-item img { margin-right: 10px; }

        /* Ana Mesajlaşma Alanı */
        .chat-area { flex: 1; display: flex; flex-direction: column; background: var(--bg-chat); }
        .chat-header { height: 56px; display: flex; align-items: center; padding: 0 20px; border-bottom: 1px solid var(--border); font-weight: 600; }
        .messages-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
        
        /* Mesaj Tasarımı */
        .message { display: flex; gap: 14px; }
        .user-avatar { width: 40px; height: 40px; border-radius: 8px; background: var(--accent); }
        .message-content { display: flex; flex-direction: column; }
        .sender-name { font-weight: bold; font-size: 14px; margin-bottom: 4px; }
        .text-content { font-size: 14px; color: #cbd5e1; line-height: 1.5; }

        /* Input Alanı */
        .input-box { padding: 20px; background: var(--bg-chat); }
        .input-wrapper { background: #2d2d39; border-radius: 10px; display: flex; align-items: center; padding: 4px 12px; border: 1px solid transparent; }
        .input-wrapper:focus-within { border-color: var(--accent); }
        input { flex: 1; background: transparent; border: none; color: white; padding: 12px; outline: none; font-size: 14px; }
        .action-btn { background: none; border: none; cursor: pointer; padding: 8px; display: flex; align-items: center; }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="workspace-bar">
            <div class="workspace-item"><img src="/assets/icons/home.png" class="icon" style="width: 24px;"></div>
            <div class="workspace-item"><img src="/assets/icons/work.png" class="icon" style="width: 24px;"></div>
        </div>

        <div class="channel-sidebar">
            <div class="sidebar-header">GETTIC CORPORATE</div>
            <div class="channel-list">
                <div class="channel-item active">
                    <img src="/assets/icons/chat.png" class="icon">
                    <span>genel-iletisim</span>
                </div>
                <div class="channel-item">
                    <img src="/assets/icons/announcement.png" class="icon">
                    <span>duyurular</span>
                </div>
                <div class="channel-item">
                    <img src="/assets/icons/voice.png" class="icon">
                    <span>toplanti-odasi</span>
                </div>
            </div>
        </div>

        <div class="chat-area">
            <div class="chat-header">
                <img src="/assets/icons/hash.png" class="icon" style="margin-right: 10px;">
                genel-iletisim
            </div>
            
            <div class="messages-container" id="msgBox">
                </div>

            <div class="input-box">
                <div class="input-wrapper">
                    <button class="action-btn"><img src="/assets/icons/attach.png" class="icon"></button>
                    <input type="text" id="msgInput" placeholder="Mesajınızı buraya yazın...">
                    <button class="action-btn" onclick="sendMsg()"><img src="/assets/icons/send.png" class="icon"></button>
                </div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const msgBox = document.getElementById('msgBox');
        const msgInput = document.getElementById('msgInput');
        const currentRoom = 'genel-iletisim';
        const username = "Kullanıcı_" + Math.floor(Math.random() * 1000);

        socket.emit('joinRoom', currentRoom);

        socket.on('loadHistory', (history) => {
            msgBox.innerHTML = '';
            history.forEach(appendMessage);
        });

        socket.on('receiveMessage', (msg) => {
            appendMessage(msg);
        });

        function sendMsg() {
            const content = msgInput.value.trim();
            if(content) {
                socket.emit('sendMessage', {
                    room: currentRoom,
                    sender: username,
                    content: content
                });
                msgInput.value = '';
            }
        }

        function appendMessage(msg) {
            const div = document.createElement('div');
            div.className = 'message';
            div.innerHTML = `
                <div class="user-avatar"></div>
                <div class="message-content">
                    <span class="sender-name">${msg.sender}</span>
                    <span class="text-content">${msg.content}</span>
                </div>
            `;
            msgBox.appendChild(div);
            msgBox.scrollTop = msgBox.scrollHeight;
        }

        msgInput.addEventListener('keypress', (e) => {
            if(e.key === 'Enter') sendMsg();
        });
    </script>
</body>
</html>
