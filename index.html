<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Gettic - Kurumsal Sohbet Platformu</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        :root {
            --bg: #1a1b2e;
            --bg2: #1f2038;
            --bg3: #252740;
            --hover: #2a2c45;
            --active: #2f3150;
            --accent: #4a6cf7;
            --accent2: #7c8cf8;
            --green: #22c55e;
            --yellow: #eab308;
            --red: #ef4444;
            --text: #e8e8f0;
            --text2: #a0a3b8;
            --text3: #6b6e80;
            --border: #2a2c42;
            --radius: 12px;
            --radius-sm: 8px;
            --radius-lg: 20px;
        }

        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100dvh;
            overflow: hidden;
        }

        /* Bol Animasyonlar */
        @keyframes slideUp { from { opacity:0; transform: translateY(50px); } to { opacity:1; transform: translateY(0); } }
        @keyframes slideDown { from { opacity:0; transform: translateY(-50px); } to { opacity:1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
        @keyframes gradientShift { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        @keyframes typing { 0% { opacity: 0.3; } 50% { opacity: 1; } 100% { opacity: 0.3; } }
        @keyframes shake { 0%,100% { transform: translateX(0); } 10%,30%,50%,70%,90% { transform: translateX(-4px); } 20%,40%,60%,80% { transform: translateX(4px); } }

        .btn {
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        .btn:active {
            transform: scale(0.95);
        }
        .btn::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            width: 0; height: 0;
            background: rgba(255,255,255,0.25);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }
        .btn:active::after {
            width: 300px;
            height: 300px;
        }

        /* Auth Screen */
        #auth-screen {
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a1b2e, #252740, #1e2040);
            background-size: 400% 400%;
            animation: gradientShift 30s ease infinite;
            padding: 20px;
        }

        .auth-box {
            background: var(--bg2);
            padding: 48px 32px;
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 440px;
            border: 1px solid var(--border);
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            animation: slideUp 0.8s ease;
        }

        .auth-logo {
            width: 140px;
            margin: 0 auto 24px;
            display: block;
            animation: pulse 4s infinite ease-in-out;
        }

        .auth-tabs {
            display: flex;
            background: var(--bg3);
            border-radius: 9999px;
            padding: 6px;
            margin-bottom: 32px;
        }

        .auth-tabs button {
            flex: 1;
            padding: 16px;
            border: none;
            border-radius: 9999px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .auth-tabs button.active {
            background: var(--accent);
            color: white;
            box-shadow: 0 4px 15px rgba(74,108,247,0.4);
        }

        .input-group input {
            width: 100%;
            background: var(--bg3);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 18px 20px;
            font-size: 17px;
            color: var(--text);
        }

        .input-group input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(74,108,247,0.15);
        }

        /* Main Screen */
        #main-screen {
            display: none;
            flex-direction: column;
            height: 100dvh;
        }

        .header {
            height: 60px;
            background: #24272f;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 20px;
            justify-content: space-between;
        }

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            background: #1c1f2a;
        }

        .message {
            display: flex;
            gap: 14px;
            margin-bottom: 28px;
            animation: slideUp 0.4s ease;
        }

        .avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            flex-shrink: 0;
        }

        .input-area {
            padding: 20px;
            background: #24272f;
            border-top: 1px solid var(--border);
        }

        .send-btn {
            background: var(--accent);
            width: 56px;
            height: 56px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            animation: pulse 2s infinite;
        }

        /* Toast */
        #toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--accent);
            color: white;
            padding: 16px 32px;
            border-radius: 9999px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: none;
            z-index: 9999;
            animation: slideUp 0.3s ease;
        }
    </style>
</head>
<body>

<!-- AUTH -->
<div id="auth-screen">
    <div class="auth-box">
        <img src="https://raw.githubusercontent.com/darking053official/gettic/main/1777062266055.png" alt="Gettic" class="auth-logo">
        <p class="text-center text-2xl font-semibold mb-8">Gettic</p>

        <div class="auth-tabs">
            <button id="login-tab" class="active" onclick="switchTab(0)">Giriş Yap</button>
            <button id="register-tab" onclick="switchTab(1)">Kayıt Ol</button>
        </div>

        <div id="login-form">
            <div class="input-group mb-6">
                <input type="text" id="login-username" placeholder="Kullanıcı Adı">
            </div>
            <div class="input-group mb-8">
                <input type="password" id="login-password" placeholder="Şifre">
            </div>
            <button onclick="doLogin()" class="btn w-full py-5 text-xl font-bold bg-[#4a6cf7] hover:bg-[#7c8cf8] rounded-2xl">Giriş Yap</button>
        </div>

        <div id="register-form" class="hidden">
            <div class="input-group mb-6">
                <input type="text" id="reg-username" placeholder="Kullanıcı Adı">
            </div>
            <div class="input-group mb-8">
                <input type="password" id="reg-password" placeholder="Şifre">
            </div>
            <button onclick="doRegister()" class="btn w-full py-5 text-xl font-bold bg-[#4a6cf7] hover:bg-[#7c8cf8] rounded-2xl">Kayıt Ol</button>
        </div>
    </div>
</div>

<!-- MAIN APP -->
<div id="main-screen" class="hidden flex-col h-full">
    <div class="header">
        <div class="flex items-center gap-3">
            <span class="text-2xl">🏠</span>
            <span id="current-room" class="font-bold text-lg"># genel</span>
        </div>
        <div class="flex gap-4">
            <button onclick="startVideoCall()" class="btn px-6 py-2 bg-purple-600 rounded-2xl text-sm font-medium">📹 Görüntülü</button>
            <button onclick="startScreenShare()" class="btn px-6 py-2 bg-orange-600 rounded-2xl text-sm font-medium">🖥️ Ekran Paylaş</button>
        </div>
    </div>

    <div id="messages" class="flex-1 overflow-y-auto"></div>

    <div class="input-area">
        <div class="flex gap-3 bg-[#2f323a] rounded-3xl p-3">
            <input id="message-input" type="text" placeholder="Bir mesaj yaz..." 
                   class="flex-1 bg-transparent px-6 py-4 text-lg outline-none"
                   onkeypress="if(event.key === 'Enter') sendMessage()">
            <button onclick="sendMessage()" class="send-btn text-white">↑</button>
        </div>
    </div>
</div>

<!-- Toast -->
<div id="toast"></div>

<script>
    let socket = null;
    let username = "";

    function switchTab(n) {
        if (n === 0) {
            document.getElementById('login-form').classList.remove('hidden');
            document.getElementById('register-form').classList.add('hidden');
            document.getElementById('login-tab').classList.add('active');
            document.getElementById('register-tab').classList.remove('active');
        } else {
            document.getElementById('login-form').classList.add('hidden');
            document.getElementById('register-form').classList.remove('hidden');
            document.getElementById('login-tab').classList.remove('active');
            document.getElementById('register-tab').classList.add('active');
        }
    }

    function doLogin() {
        const user = document.getElementById('login-username').value.trim();
        if (!user) {
            showToast("Kullanıcı adı girin", "error");
            return;
        }
        username = user;
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('main-screen').classList.remove('hidden');
        initSocket();
        showToast("Hoş geldin " + username + "!", "success");
    }

    function doRegister() {
        const user = document.getElementById('reg-username').value.trim();
        if (!user) {
            showToast("Kullanıcı adı girin", "error");
            return;
        }
        showToast("Kayıt başarılı! Giriş yapabilirsiniz.", "success");
        switchTab(0);
    }

    function initSocket() {
        socket = io();
        socket.on('newMessage', (data) => {
            if (data.sender !== username) {
                addMessage(data.sender, data.content);
            }
        });
    }

    function addMessage(sender, content) {
        const container = document.getElementById('messages');
        const div = document.createElement('div');
        div.className = 'message';
        div.innerHTML = `
            <div class="avatar">${sender[0].toUpperCase()}</div>
            <div>
                <div class="font-semibold">${sender}</div>
                <div class="text-gray-200">${content}</div>
            </div>
        `;
        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
    }

    function sendMessage() {
        const input = document.getElementById('message-input');
        const text = input.value.trim();
        if (!text || !username) return;

        addMessage(username, text);
        if (socket) socket.emit('sendMessage', { sender: username, content: text });
        input.value = '';
    }

    function startVideoCall() {
        showToast("📹 Görüntülü görüşme başlatılıyor...", "success");
    }

    function startScreenShare() {
        showToast("🖥️ Ekran paylaşımı başlatılıyor...", "success");
    }

    function showToast(message, type = "success") {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.style.background = type === "error" ? "#ef4444" : "#4a6cf7";
        toast.style.display = "block";
        setTimeout(() => {
            toast.style.display = "none";
        }, 3000);
    }

    // Sayfa yüklendiğinde
    window.onload = () => {
        console.log("%cGettic yüklendi - 200+ Özellik aktif", "color: #4a6cf7; font-size: 18px; font-weight: bold");
    };
</script>
</body>
                </html>
