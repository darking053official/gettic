<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gettic - Kurumsal İletişim Platformu</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #0a0a0f;
      color: #e0e0e0;
    }
    
    .gettic-gradient {
      background: linear-gradient(135deg, #1e40af, #3b82f6);
    }
    
    .login-card {
      background: #16181f;
      border: 1px solid #334155;
    }
    
    .channel-item {
      transition: all 0.2s ease;
    }
    
    .channel-item:hover {
      background: #272a32;
      transform: translateX(6px);
    }
    
    .message:hover {
      background: #272a32;
    }
    
    .video-container {
      background: #1f222a;
      border-radius: 16px;
      overflow: hidden;
      position: relative;
    }
    
    .video-container video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    .overlay {
      position: absolute;
      bottom: 10px;
      left: 10px;
      background: rgba(0,0,0,0.8);
      padding: 4px 12px;
      border-radius: 9999px;
      font-size: 0.85rem;
    }
  </style>
</head>
<body class="min-h-screen overflow-hidden">

  <!-- ====================== LOGIN / KAYIT EKRANI ====================== -->
  <div id="auth-screen" class="fixed inset-0 z-50 flex items-center justify-center bg-black/90 p-4">
    <div class="login-card w-full max-w-lg mx-auto p-8 md:p-10 rounded-3xl shadow-2xl">
      <div class="text-center mb-10">
        <img src="https://raw.githubusercontent.com/darking053official/gettic/main/1777062266055.png" 
             alt="Gettic Logo" class="mx-auto w-20 h-20 md:w-24 md:h-24 rounded-3xl mb-6 shadow-xl">
        <h1 class="text-4xl md:text-5xl font-bold tracking-tighter text-white">Gettic</h1>
        <p class="text-blue-400 mt-2 text-lg md:text-xl">Kurumsal İletişim Platformu</p>
      </div>

      <div class="flex border-b border-gray-700 mb-8">
        <button id="tab-login" 
                class="flex-1 py-4 font-semibold text-base md:text-lg border-b-2 border-blue-500 text-blue-400">Giriş Yap</button>
        <button id="tab-register" 
                class="flex-1 py-4 font-semibold text-base md:text-lg text-gray-400">Kayıt Ol</button>
      </div>

      <!-- Giriş Formu -->
      <div id="login-form" class="space-y-6">
        <input id="login-username" type="text" placeholder="Kullanıcı Adı" 
               class="w-full bg-zinc-900 border border-zinc-700 focus:border-blue-500 rounded-3xl px-6 py-4 outline-none text-base md:text-lg">
        <input id="login-password" type="password" placeholder="Şifre" 
               class="w-full bg-zinc-900 border border-zinc-700 focus:border-blue-500 rounded-3xl px-6 py-4 outline-none text-base md:text-lg">
        <button id="login-btn" 
                class="w-full gettic-gradient py-4 md:py-5 rounded-3xl font-semibold text-lg md:text-xl hover:brightness-110 transition-all flex items-center justify-center gap-3">
          <i class="fas fa-sign-in-alt"></i>
          Gettic'e Giriş Yap
        </button>
      </div>

      <!-- Kayıt Formu -->
      <div id="register-form" class="hidden space-y-6">
        <input id="reg-username" type="text" placeholder="Kullanıcı Adı" 
               class="w-full bg-zinc-900 border border-zinc-700 focus:border-blue-500 rounded-3xl px-6 py-4 outline-none text-base md:text-lg">
        <input id="reg-password" type="password" placeholder="Şifre" 
               class="w-full bg-zinc-900 border border-zinc-700 focus:border-blue-500 rounded-3xl px-6 py-4 outline-none text-base md:text-lg">
        <button id="register-btn" 
                class="w-full gettic-gradient py-4 md:py-5 rounded-3xl font-semibold text-lg md:text-xl hover:brightness-110 transition-all flex items-center justify-center gap-3">
          <i class="fas fa-user-plus"></i>
          Hesap Oluştur
        </button>
      </div>

      <p class="text-center text-xs md:text-sm text-gray-500 mt-10">gettic.js ile güçlendirilmiş • 200+ Kurumsal Özellik</p>
    </div>
  </div>

  <!-- ====================== ANA PLATFORM ====================== -->
  <div id="main-app" class="hidden h-screen flex flex-col">

    <div class="flex flex-1 overflow-hidden">

      <!-- Sunucu Bar -->
      <div class="w-16 md:w-20 bg-[#0f1016] flex flex-col items-center pt-6 space-y-8 border-r border-gray-800">
        <img src="https://raw.githubusercontent.com/darking053official/gettic/main/1777062266055.png" 
             alt="Gettic" class="w-12 h-12 md:w-16 md:h-16 rounded-3xl cursor-pointer">
      </div>

      <!-- Kanal Sidebar -->
      <div class="w-64 md:w-72 bg-[#1a1c23] flex flex-col border-r border-gray-800 overflow-y-auto">
        <div class="p-5 font-semibold text-lg border-b border-gray-700">Gettic Kurumsal</div>
        
        <div class="flex-1 p-4 space-y-1">
          <div onclick="switchRoom('genel-iletisim')" class="channel-item px-5 py-4 rounded-3xl cursor-pointer flex items-center gap-4 text-blue-300 font-medium">
            <i class="fas fa-hashtag"></i> genel-iletisim
          </div>
          <div onclick="switchRoom('proje-takip')" class="channel-item px-5 py-4 rounded-3xl cursor-pointer flex items-center gap-4">
            <i class="fas fa-hashtag"></i> proje-takip
          </div>

          <div class="pt-8">
            <div class="uppercase text-xs text-gray-400 px-5 mb-3">Ses & Video</div>
            <div onclick="joinVoice()" class="channel-item px-5 py-4 rounded-3xl cursor-pointer flex items-center gap-4 text-emerald-400">
              <i class="fas fa-volume-high"></i> Sesli Toplantı
            </div>
            <div onclick="startVideoCall()" class="channel-item px-5 py-4 rounded-3xl cursor-pointer flex items-center gap-4 text-purple-400">
              <i class="fas fa-video"></i> Görüntülü Görüşme
            </div>
            <div onclick="startScreenShare()" class="channel-item px-5 py-4 rounded-3xl cursor-pointer flex items-center gap-4 text-orange-400">
              <i class="fas fa-desktop"></i> Ekran Paylaşımı
            </div>
          </div>
        </div>
      </div>

      <!-- Chat Alanı -->
      <div class="flex-1 flex flex-col">
        <div class="h-14 md:h-16 bg-[#24272f] border-b border-gray-700 flex items-center px-4 md:px-8 font-semibold">
          <span id="room-title" class="text-base md:text-lg"># genel-iletisim</span>
          
          <div class="ml-auto flex gap-2 md:gap-4 text-sm">
            <button onclick="startVideoCall()" class="flex items-center gap-2 bg-purple-600 hover:bg-purple-700 px-4 md:px-6 py-2 rounded-3xl transition">
              <i class="fas fa-video"></i> <span class="hidden md:inline">Görüntülü</span>
            </button>
            <button onclick="startScreenShare()" class="flex items-center gap-2 bg-orange-600 hover:bg-orange-700 px-4 md:px-6 py-2 rounded-3xl transition">
              <i class="fas fa-desktop"></i> <span class="hidden md:inline">Ekran Paylaş</span>
            </button>
          </div>
        </div>

        <div id="messages" class="flex-1 overflow-y-auto p-4 md:p-8 space-y-6 bg-[#1f222a]"></div>

        <div class="p-4 md:p-6 bg-[#24272f] border-t border-gray-700">
          <div class="flex gap-3">
            <input id="message-input" type="text" placeholder="Gettic'te mesaj yazın..." 
                   class="flex-1 bg-[#2f323a] rounded-3xl px-6 py-4 outline-none text-base md:text-lg">
            <button id="send-btn" 
                    class="bg-blue-600 hover:bg-blue-700 w-12 h-12 md:w-14 md:h-14 rounded-3xl flex items-center justify-center transition">
              <i class="fas fa-paper-plane"></i>
            </button>
          </div>
        </div>
      </div>

      <!-- Sağ Panel -->
      <div class="hidden lg:flex w-80 bg-[#1a1c23] border-l border-gray-800 flex-col">
        <div class="p-6 border-b border-gray-700 font-medium">Çevrimiçi Üyeler</div>
        <div id="members-list" class="flex-1 p-6 overflow-y-auto space-y-6"></div>
        
        <div class="p-6 border-t border-gray-700">
          <div class="text-xs uppercase tracking-widest text-gray-400 mb-4">Canlı Görüşme</div>
          <div id="video-grid" class="space-y-4"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ... (Önceki mesajımdaki script kısmını olduğu gibi kullanabilirsin, 
    // sadece CSS ve layout değişti. Script aynı kalabilir.)

    const socket = io();
    let currentUsername = null;
    let currentRoom = "genel-iletisim";
    let localStream = null;

    // Tab ve buton event listener'ları (önceki kodla aynı)
    document.getElementById('tab-login').addEventListener('click', () => {
      document.getElementById('login-form').classList.remove('hidden');
      document.getElementById('register-form').classList.add('hidden');
      document.getElementById('tab-login').classList.add('border-b-2', 'border-blue-500', 'text-blue-400');
      document.getElementById('tab-register').classList.remove('border-b-2', 'border-blue-500', 'text-blue-400');
    });

    document.getElementById('tab-register').addEventListener('click', () => {
      document.getElementById('register-form').classList.remove('hidden');
      document.getElementById('login-form').classList.add('hidden');
      document.getElementById('tab-register').classList.add('border-b-2', 'border-blue-500', 'text-blue-400');
      document.getElementById('tab-login').classList.remove('border-b-2', 'border-blue-500', 'text-blue-400');
    });

    // Login butonu
    document.getElementById('login-btn').addEventListener('click', async () => {
      const username = document.getElementById('login-username').value.trim();
      const password = document.getElementById('login-password').value;
      if (!username || !password) return alert("Kullanıcı adı ve şifre girin.");

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (data.success) {
          currentUsername = data.username;
          document.getElementById('auth-screen').classList.add('hidden');
          document.getElementById('main-app').classList.remove('hidden');
          socket.emit('login', { token: data.token });
          initPlatform();
        } else {
          alert(data.error || "Giriş başarısız.");
        }
      } catch (e) {
        alert("Bağlantı hatası.");
      }
    });

    // Register butonu
    document.getElementById('register-btn').addEventListener('click', async () => {
      const username = document.getElementById('reg-username').value.trim();
      const password = document.getElementById('reg-password').value;
      if (!username || !password) return alert("Kullanıcı adı ve şifre zorunludur.");

      try {
        const res = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (data.success) {
          alert("Hesap oluşturuldu! Giriş yapabilirsiniz.");
          document.getElementById('tab-login').click();
        } else {
          alert(data.error || "Kayıt başarısız.");
        }
      } catch (e) {
        alert("Kayıt hatası.");
      }
    });

    function initPlatform() {
      loadMembers();
      switchRoom(currentRoom);
      addSystemMessage("Gettic Kurumsal Platforma hoş geldiniz.");
    }

    function switchRoom(room) {
      currentRoom = room;
      document.getElementById('room-title').textContent = `# ${room}`;
      document.getElementById('messages').innerHTML = '';
      addSystemMessage(`#${room} odasına geçildi.`);
    }

    function loadMembers() {
      document.getElementById('members-list').innerHTML = `
        <div class="flex items-center gap-4">
          <div class="w-12 h-12 bg-emerald-500 rounded-3xl flex items-center justify-center text-2xl">👤</div>
          <div class="font-medium">${currentUsername || 'Kurumsal Kullanıcı'}</div>
        </div>
        <div class="flex items-center gap-4">
          <div class="w-12 h-12 bg-blue-600 rounded-3xl flex items-center justify-center text-white font-bold">GB</div>
          <div><div class="font-medium">GetticBot</div><div class="text-xs text-emerald-400">gettic.js aktif</div></div>
        </div>
      `;
    }

    function addSystemMessage(text) {
      const container = document.getElementById('messages');
      const div = document.createElement('div');
      div.className = 'text-center text-gray-400 py-6 text-sm';
      div.textContent = text;
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
    }

    function addMessage(sender, content) {
      const container = document.getElementById('messages');
      const div = document.createElement('div');
      div.className = 'message flex gap-4 p-4 rounded-3xl';
      div.innerHTML = `
        <div class="w-11 h-11 bg-gradient-to-br from-blue-500 to-indigo-600 rounded-3xl flex items-center justify-center text-white font-bold text-2xl flex-shrink-0">${sender[0]}</div>
        <div class="flex-1">
          <div class="font-semibold">${sender}</div>
          <div class="text-gray-200">${content}</div>
        </div>
      `;
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
    }

    // Mesaj gönderme
    const msgInput = document.getElementById('message-input');
    document.getElementById('send-btn').addEventListener('click', sendMessage);
    msgInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

    function sendMessage() {
      const content = msgInput.value.trim();
      if (!content) return;
      addMessage(currentUsername, content);
      socket.emit('sendMessage', { room: currentRoom, content });
      msgInput.value = '';
    }

    socket.on('newMessage', (msg) => {
      if (msg.senderName !== currentUsername) addMessage(msg.senderName, msg.content);
    });

    // Görüntülü Görüşme
    async function startVideoCall() {
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        const grid = document.getElementById('video-grid');
        const container = document.createElement('div');
        container.className = 'video-container';
        container.innerHTML = `<video autoplay playsinline></video><div class="overlay">Siz</div>`;
        grid.appendChild(container);
        container.querySelector('video').srcObject = localStream;
        addSystemMessage("📹 Görüntülü görüşme başladı.");
      } catch (err) {
        alert("Kamera erişimi reddedildi.");
      }
    }

    // Ekran Paylaşımı
    async function startScreenShare() {
      try {
        const screen = await navigator.mediaDevices.getDisplayMedia({ video: true });
        const grid = document.getElementById('video-grid');
        const container = document.createElement('div');
        container.className = 'video-container';
        container.innerHTML = `<video autoplay playsinline></video><div class="overlay">Ekran Paylaşımı</div>`;
        grid.appendChild(container);
        container.querySelector('video').srcObject = screen;
        addSystemMessage("🖥️ Ekran paylaşımı aktif.");
      } catch (err) {
        alert("Ekran paylaşımı başlatılamadı.");
      }
    }

    function joinVoice() {
      addSystemMessage("🔊 Sesli toplantıya katıldınız.");
    }

    window.onload = () => {
      document.getElementById('auth-screen').classList.remove('hidden');
      document.getElementById('tab-login').click();
    };
  </script>
</body>
  </html>
