<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gettic - Sohbet Platformu</title>
    <link rel="stylesheet" href="/style.css">
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>
    <!-- Giriş Ekranı -->
    <div id="auth-screen" class="screen active">
        <div class="auth-container">
            <div class="auth-header">
                <h1>🎧 Gettic</h1>
                <p>Takıl, konuş, paylaş</p>
            </div>
            
            <div class="auth-tabs">
                <button class="tab-btn active" onclick="switchTab('login')">Giriş Yap</button>
                <button class="tab-btn" onclick="switchTab('register')">Kayıt Ol</button>
            </div>

            <form id="login-form" class="auth-form active" onsubmit="login(event)">
                <input type="email" id="login-email" placeholder="Email" required>
                <input type="password" id="login-password" placeholder="Şifre" required>
                <button type="submit">Giriş Yap</button>
            </form>

            <form id="register-form" class="auth-form" onsubmit="register(event)">
                <input type="text" id="register-username" placeholder="Kullanıcı Adı" required minlength="3">
                <input type="email" id="register-email" placeholder="Email" required>
                <input type="password" id="register-password" placeholder="Şifre" required minlength="6">
                <button type="submit">Kayıt Ol</button>
            </form>
        </div>
    </div>

    <!-- Ana Ekran -->
    <div id="main-screen" class="screen">
        <!-- Sol Sidebar - Sunucular -->
        <div class="server-sidebar">
            <div class="server-list" id="server-list">
                <div class="server-icon active" onclick="selectRoom('genel')" title="Genel">
                    <span>#</span>
                </div>
            </div>
            <div class="server-add" onclick="showCreateRoom()" title="Oda Oluştur">+</div>
        </div>

        <!-- Sol Panel - Odalar -->
        <div class="room-sidebar">
            <div class="room-header">
                <h3>Gettic</h3>
                <button class="settings-btn" onclick="toggleSettings()">⚙️</button>
            </div>
            <div class="room-search">
                <input type="text" id="room-search" placeholder="Oda ara..." oninput="filterRooms()">
            </div>
            <div class="room-list" id="room-list">
                <div class="room-item active" onclick="joinRoom('genel')">
                    <span class="room-icon">#</span>
                    <span>genel</span>
                </div>
            </div>
            <div class="user-panel">
                <div class="user-info">
                    <div class="user-avatar" id="user-avatar"></div>
                    <div class="user-details">
                        <span id="user-name"></span>
                        <span class="user-status" id="user-status">🟢 Çevrimiçi</span>
                    </div>
                </div>
                <button class="logout-btn" onclick="logout()" title="Çıkış Yap">🚪</button>
            </div>
        </div>

        <!-- Sohbet Alanı -->
        <div class="chat-area">
            <div class="chat-header">
                <div class="chat-room-info">
                    <span class="room-icon">#</span>
                    <span id="current-room-name">genel</span>
                    <span class="room-divider">|</span>
                    <span id="room-description">Genel sohbet odası</span>
                </div>
                <div class="chat-actions">
                    <span id="online-count">0 çevrimiçi</span>
                    <button onclick="showRoomMembers()" title="Üyeler">👥</button>
                </div>
            </div>

            <div class="messages-area" id="messages">
                <div class="welcome-message">
                    <h2>🎧 Gettic'e Hoş Geldin!</h2>
                    <p>Burası #genel odasının başlangıcı. Sohbete başla!</p>
                </div>
            </div>

            <div class="typing-indicator" id="typing-indicator"></div>

            <div class="input-area">
                <div class="reply-preview" id="reply-preview" style="display:none;">
                    <div class="reply-content">
                        <strong>Yanıtlanıyor:</strong>
                        <span id="reply-text"></span>
                    </div>
                    <button onclick="cancelReply()">✕</button>
                </div>
                <div class="input-wrapper">
                    <textarea id="message-input" placeholder="Mesaj yaz..." rows="1" onkeydown="handleInput(event)"></textarea>
                    <button onclick="sendMessage()" title="Gönder">📤</button>
                </div>
            </div>
        </div>

        <!-- Sağ Panel - Kullanıcılar -->
        <div class="member-sidebar" id="member-sidebar">
            <div class="member-header">
                <h3>Kullanıcılar</h3>
                <button onclick="toggleMemberSidebar()">✕</button>
            </div>
            <div class="member-list" id="member-list"></div>
        </div>
    </div>

    <!-- Oda Oluşturma Modal -->
    <div id="create-room-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Oda Oluştur</h3>
                <button onclick="closeCreateRoom()">✕</button>
            </div>
            <form onsubmit="createRoom(event)">
                <input type="text" id="room-name" placeholder="Oda adı" required>
                <input type="text" id="room-description" placeholder="Açıklama (opsiyonel)">
                <div class="checkbox-wrapper">
                    <input type="checkbox" id="room-private" onchange="toggleRoomPassword()">
                    <label for="room-private">Özel oda</label>
                </div>
                <input type="password" id="room-password" placeholder="Oda şifresi" style="display:none;">
                <button type="submit">Oluştur</button>
            </form>
        </div>
    </div>

    <!-- Ayarlar Modal -->
    <div id="settings-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Ayarlar</h3>
                <button onclick="toggleSettings()">✕</button>
            </div>
            <div class="settings-body">
                <div class="setting-item">
                    <label>Durum</label>
                    <select id="status-select" onchange="updateStatus()">
                        <option value="online">🟢 Çevrimiçi</option>
                        <option value="idle">🌙 Boşta</option>
                        <option value="dnd">⛔ Rahatsız Etme</option>
                        <option value="offline">⚫ Görünmez</option>
                    </select>
                </div>
                <div class="setting-item">
                    <label>Özel Durum Mesajı</label>
                    <input type="text" id="custom-status" placeholder="Ne düşünüyorsun?" maxlength="50">
                    <button onclick="updateCustomStatus()">Kaydet</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/script.js"></script>
</body>
                  </html>
