<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gettic - Kurumsal İletişim Platformu</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.js"></script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #0a0a0f; color: #e0e0e0; }
    .gettic-gradient { background: linear-gradient(135deg, #1e40af, #3b82f6); }
    .login-card { background: #16181f; border: 1px solid #334155; }
    .message:hover { background: #272a32; }
    .channel-item:hover { background: #272a32; }
    .video-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; padding: 16px; }
    .video-container { background: #1f222a; border-radius: 16px; overflow: hidden; position: relative; aspect-ratio: 16/9; }
    .video-container video { width: 100%; height: 100%; object-fit: cover; }
    .overlay { position: absolute; bottom: 12px; left: 12px; background: rgba(0,0,0,0.7); padding: 4px 12px; border-radius: 9999px; font-size: 0.85rem; }
  </style>
</head>
<body class="min-h-screen overflow-hidden">

  <!-- ====================== LOGIN / KAYIT EKRANI ====================== -->
  <div id="auth-screen" class="fixed inset-0 z-50 flex items-center justify-center bg-black/90">
    <div class="login-card w-full max-w-md mx-4 p-8 rounded-3xl shadow-2xl">
      <div class="text-center mb-8">
        <img src="https://raw.githubusercontent.com/darking053official/gettic/main/1777062266055.png" 
             alt="Gettic Logo" class="mx-auto w-20 h-20 rounded-3xl mb-4">
        <h1 class="text-4xl font-bold text-white">Gettic</h1>
        <p class="text-blue-400 mt-1">Kurumsal İletişim Platformu</p>
      </div>

      <div class="flex border-b border-gray-700 mb-6">
        <button id="tab-login" class="flex-1 py-4 font-semibold border-b-2 border-blue-500 text-blue-400">Giriş Yap</button>
        <button id="tab-register" class="flex-1 py-4 font-semibold text-gray-400">Kayıt Ol</button>
      </div>

      <!-- Giriş Formu -->
      <div id="login-form">
        <input id="login-username" type="text" placeholder="Kullanıcı Adı" 
               class="w-full bg-zinc-900 border border-zinc-700 rounded-2xl px-5 py-4 mb-4 outline-none focus:border-blue-500">
        <input id="login-password" type="password" placeholder="Şifre" 
               class="w-full bg-zinc-900 border border-zinc-700 rounded-2xl px-5 py-4 mb-6 outline-none focus:border-blue-500">
        <button id="login-btn" 
                class="w-full gettic-gradient py-4 rounded-3xl font-semibold text-lg hover:brightness-110 transition">
          Gettic'e Giriş Yap
        </button>
      </div>

      <!-- Kayıt Formu -->
      <div id="register-form" class="hidden">
        <input id="reg-username" type="text" placeholder="Kullanıcı Adı" 
               class="w-full bg-zinc-900 border border-zinc-700 rounded-2xl px-5 py-4 mb-4 outline-none focus:border-blue-500">
        <input id="reg-password" type="password" placeholder="Şifre" 
               class="w-full bg-zinc-900 border border-zinc-700 rounded-2xl px-5 py-4 mb-6 outline-none focus:border-blue-500">
        <button id="register-btn" 
                class="w-full gettic-gradient py-4 rounded-3xl font-semibold text-lg hover:brightness-110 transition">
          Gettic Hesabı Oluştur
        </button>
      </div>

      <p class="text-center text-xs text-gray-500 mt-8">gettic.js ile güçlendirilmiş • 200+ Kurumsal Özellik</p>
    </div>
  </div>

  <!-- ====================== ANA PLATFORM ====================== -->
  <div id="main-app" class="hidden h-screen flex flex-col">

    <div class="flex flex-1 overflow-hidden">

      <!-- Sunucu Bar -->
      <div class="w-20 bg-[#0f1016] flex flex-col items-center pt-6 space-y-8 border-r border-gray-800">
        <img src="https://raw.githubusercontent.com/darking053official/gettic/main/1777062266055.png" 
             alt="Gettic" class="w-14 h-14 rounded-3xl cursor-pointer">
      </div>

      <!-- Kanal Listesi -->
      <div class="w-72 bg-[#1a1c23] flex flex-col border-r border-gray-800">
        <div class="p-4 font-semibold border-b border-gray-700">Gettic Kurumsal</div>
        <div class="flex-1 p-4 space-y-1 overflow-y-auto">
          <div onclick="switchRoom('genel-iletisim')" class="channel-item px-4 py-3 rounded-2xl cursor-pointer flex items-center gap-3">
            <i class="fas fa-hashtag text-blue-400"></i> genel-iletisim
          </div>
          <div onclick="switchRoom('proje-takip')" class="channel-item px-4 py-3 rounded-2xl cursor-pointer flex items-center gap-3">
            <i class="fas fa-hashtag"></i> proje-takip
          </div>
          
          <!-- Sesli & Görüntülü Kanallar -->
          <div onclick="joinVoice()" class="channel-item px-4 py-3 rounded-2xl cursor-pointer flex items-center gap-3 text-emerald-400">
            <i class="fas fa-volume-high"></i> Sesli Toplantı
          </div>
          <div onclick="startVideoCall()" class="channel-item px-4 py-3 rounded-2xl cursor-pointer flex items-center gap-3 text-purple-400">
            <i class="fas fa-video"></i> Görüntülü Görüşme
          </div>
          <div onclick="startScreenShare()" class="channel-item px-4 py-3 rounded-2xl cursor-pointer flex items-center gap-3 text-orange-400">
            <i class="fas fa-desktop"></i> Ekran Paylaşımı
          </div>
        </div>
      </div>

      <!-- Chat + Video Alanı -->
      <div class="flex-1 flex flex-col">
        <div class="h-14 bg-[#24272f] border-b border-gray-700 flex items-center px-6">
          <span id="room-title" class="font-semibold text-lg"># genel-iletisim</span>
          
          <div class="ml-auto flex items-center gap-3">
            <button onclick="startVideoCall()" class="flex items-center gap-2 bg-purple-600 hover:bg-purple-700 px-5 py-2 rounded-2xl text-sm">
              <i class="fas fa-video"></i> Görüntülü Görüşme
            </button>
            <button onclick="startScreenShare()" class="flex items-center gap-2 bg-orange-600 hover:bg-orange-700 px-5 py-2 rounded-2xl text-sm">
              <i class="fas fa-desktop"></i> Ekran Paylaş
            </button>
          </div>
        </div>

        <!-- Mesaj Alanı -->
        <div id="messages" class="flex-1 overflow-y-auto p-6 space-y-6 bg-[#1f222a]"></div>

        <!-- Mesaj Girişi -->
        <div class="p-5 bg-[#24272f] border-t border-gray-700">
          <div class="flex gap-3">
            <input id="message-input" type="text" placeholder="Mesaj yazın..." 
                   class="flex-1 bg-[#2f323a] rounded-3xl px-6 py-4 outline-none text-lg">
            <button id="send-btn" class="bg-blue-600 hover:bg-blue-700 w-14 h-14 rounded-3xl flex items-center justify-center">
              <i class="fas fa-paper-plane"></i>
            </button>
          </div>
        </div>
      </div>

      <!-- Sağ Panel (Üyeler + Video) -->
      <div class="w-96 bg-[#1a1c23] border-l border-gray-800 flex flex-col">
        <div class="p-4 border-b border-gray-700 font-medium">Çevrimiçi Üyeler</div>
        <div id="members-list" class="flex-1 p-4 overflow-y-auto space-y-4"></div>

        <!-- Video Alanı -->
        <div class="p-4 border-t border-gray-700">
          <div class="text-xs uppercase tracking-widest text-gray-400 mb-3">Görüntülü Görüşme</div>
          <div id="video-grid" class="video-grid"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const socket = io();
    let currentUsername = null;
    let currentRoom = "genel-iletisim";
    let localStream = null;
    let peerConnection = null;

    // ====================== AUTH ======================
    document.getElementById('tab-login').addEventListener('click', () => {
      document.getElementById('login-form').classList.remove('hidden');
      document.getElementById('register-form').classList.add('hidden');
      document.getElementById('tab-login').classList.add('border-b-2', 'border-blue-500', 'text-blue-400');
      document.getElementById('tab-register').classList.remove('border-b-2', 'border-blue-500', 'text-blue-400');
    });

    document.getElementById('tab-register').addEventListener('click', () => {
      document.getElementById('register-form').classList.remove('hidden');
      document.getElementById('login-form').classList.add('hidden');
      document.getElementById('tab-register').classList.add('border-b-2', 'border-blue-500', 'text-blue-400');
      document.getElementById('tab-login').classList.remove('border-b-2', 'border-blue-500', 'text-blue-400');
    });

    // Login
    document.getElementById('login-btn').addEventListener('click', async () => {
      const username = document.getElementById('login-username').value.trim();
      const password = document.getElementById('login-password').value;
      if (!username || !password) return alert("Kullanıcı adı ve şifre giriniz.");

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (data.success) {
          currentUsername = data.username;
          document.getElementById('auth-screen').classList.add('hidden');
          document.getElementById('main-app').classList.remove('hidden');
          socket.emit('login', { token: data.token });
          initPlatform();
        } else {
          alert(data.error || "Giriş başarısız.");
        }
      } catch (e) {
        alert("Bağlantı hatası.");
      }
    });

    // Register
    document.getElementById('register-btn').addEventListener('click', async () => {
      const username = document.getElementById('reg-username').value.trim();
      const password = document.getElementById('reg-password').value;
      if (!username || !password) return alert("Kullanıcı adı ve şifre zorunludur.");

      try {
        const res = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (data.success) {
          alert("Hesap oluşturuldu! Şimdi giriş yapabilirsiniz.");
          document.getElementById('tab-login').click();
        } else {
          alert(data.error || "Kayıt başarısız.");
        }
      } catch (e) {
        alert("Kayıt sırasında hata oluştu.");
      }
    });

    function initPlatform() {
      loadMembers();
      switchRoom(currentRoom);
      addSystemMessage("Gettic Kurumsal Platforma hoş geldiniz. Görüntülü görüşme ve ekran paylaşımı aktif.");
    }

    function switchRoom(room) {
      currentRoom = room;
      document.getElementById('room-title').textContent = `# ${room}`;
      document.getElementById('messages').innerHTML = '';
      addSystemMessage(`#${room} odasına geçildi.`);
    }

    function loadMembers() {
      document.getElementById('members-list').innerHTML = `
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 bg-emerald-500 rounded-2xl flex items-center justify-center text-white font-bold">${currentUsername ? currentUsername[0] : 'U'}</div>
          <div><span class="font-medium">${currentUsername || 'Kurumsal Kullanıcı'}</span></div>
        </div>
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 bg-blue-600 rounded-2xl flex items-center justify-center text-white font-bold">GB</div>
          <div><span class="font-medium">GetticBot</span> <span class="text-xs text-emerald-400">(gettic.js)</span></div>
        </div>
      `;
    }

    function addSystemMessage(text) {
      const div = document.createElement('div');
      div.className = 'text-center text-gray-400 text-sm py-4';
      div.textContent = text;
      document.getElementById('messages').appendChild(div);
      document.getElementById('messages').scrollTop = 999999;
    }

    function addMessage(sender, content) {
      const div = document.createElement('div');
      div.className = 'message flex gap-4 p-3 rounded-2xl';
      div.innerHTML = `
        <div class="w-10 h-10 bg-gradient-to-br from-blue-500 to-indigo-600 rounded-2xl flex items-center justify-center text-white font-bold flex-shrink-0">${sender[0]}</div>
        <div class="flex-1">
          <div class="font-semibold">${sender}</div>
          <div class="text-gray-200">${content}</div>
        </div>
      `;
      document.getElementById('messages').appendChild(div);
      document.getElementById('messages').scrollTop = 999999;
    }

    // ====================== MESAJ GÖNDERME ======================
    const msgInput = document.getElementById('message-input');
    document.getElementById('send-btn').addEventListener('click', sendMessage);
    msgInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

    function sendMessage() {
      const content = msgInput.value.trim();
      if (!content || !currentUsername) return;
      addMessage(currentUsername, content);
      socket.emit('sendMessage', { room: currentRoom, content });
      msgInput.value = '';
    }

    socket.on('newMessage', (msg) => {
      if (msg.senderName !== currentUsername) {
        addMessage(msg.senderName, msg.content);
      }
    });

    // ====================== GÖRÜNTÜLÜ GÖRÜŞME ======================
    async function startVideoCall() {
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        addLocalVideo();
        addSystemMessage("📹 Görüntülü görüşme başlatıldı. Kamera ve mikrofon açık.");
      } catch (err) {
        alert("Kamera veya mikrofon erişimi reddedildi.");
      }
    }

    function addLocalVideo() {
      const grid = document.getElementById('video-grid');
      const container = document.createElement('div');
      container.className = 'video-container';
      container.innerHTML = `
        <video id="local-video" autoplay playsinline></video>
        <div class="overlay">Siz</div>
      `;
      grid.appendChild(container);
      const video = document.getElementById('local-video');
      video.srcObject = localStream;
    }

    // ====================== EKRAN PAYLAŞIMI ======================
    async function startScreenShare() {
      try {
        const screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
        const container = document.createElement('div');
        container.className = 'video-container';
        container.innerHTML = `
          <video id="screen-video" autoplay playsinline></video>
          <div class="overlay">Ekran Paylaşımı</div>
        `;
        document.getElementById('video-grid').appendChild(container);
        document.getElementById('screen-video').srcObject = screenStream;
        addSystemMessage("🖥️ Ekran paylaşımı başladı.");
      } catch (err) {
        alert("Ekran paylaşımı başlatılamadı.");
      }
    }

    function joinVoice() {
      addSystemMessage("🔊 Sesli toplantı odasına katıldınız.");
    }

    // ====================== SAYFA BAŞLANGICI ======================
    window.onload = () => {
      document.getElementById('auth-screen').classList.remove('hidden');
      document.getElementById('tab-login').click();
    };
  </script>
</body>
    </html>
