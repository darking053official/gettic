<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#c94d8c">
    <meta name="description" content="Gettic - Modern Türkçe sohbet platformu. Gerçek zamanlı mesajlaşma, sesli kanallar, görsel oluşturma.">
    <meta property="og:title" content="Gettic - Sohbet Platformu">
    <meta property="og:image" content="https://raw.githubusercontent.com/darking053official/gettic/main/1777062266055.png">
    <link rel="icon" href="https://raw.githubusercontent.com/darking053official/gettic/main/1777062266055.png">
    <title>Gettic - Sohbet Platformu</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/chat.css">
    <link rel="stylesheet" href="css/modals.css">
    <link rel="stylesheet" href="css/responsive.css">
    <style>
        [v-cloak],[data-cloak]{display:none}
        #ls{position:fixed;inset:0;background:#faf6f0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .3s}
        #ls.hide{opacity:0;pointer-events:none}
        .spin{width:34px;height:34px;border-radius:50%;border:3px solid rgba(0,0,0,.08);border-top-color:#c94d8c;animation:spin .75s linear infinite}
        @keyframes spin{to{transform:rotate(360deg)}}
        .ls-logo{font-size:20px;font-weight:800;background:linear-gradient(135deg,#c94d8c,#d4689e);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .hidden{display:none!important}
        .flex{display:flex!important}
    </style>
</head>
<body>
    <noscript><div style="padding:20px;text-align:center;background:#c94d8c;color:#fff;font-family:sans-serif">JavaScript gerekli</div></noscript>
    
    <div id="ls"><div class="spin"></div><div class="ls-logo">gettic</div></div>

    <div data-controller="app" id="root">
        <!-- ==================== GİRİŞ EKRANI ==================== -->
        <div data-app-target="login" class="auth-wrap">
            <div class="auth-box">
                <img src="https://raw.githubusercontent.com/darking053official/gettic/main/1777062266055.png" class="auth-logo" alt="Gettic">
                <div class="auth-title">Gettic - Sohbet Platformu</div>
                <div class="auth-sub">Gettic'e devam etmek için giriş yapın</div>
                <div class="auth-tabs">
                    <button class="auth-tab act" data-action="click->app#setTab" data-tab="login">Giriş</button>
                    <button class="auth-tab" data-action="click->app#setTab" data-tab="register">Kayıt</button>
                </div>
                <input class="mi" data-app-target="username" placeholder="Kullanıcı adı" autocomplete="username">
                <input class="mi" type="password" data-app-target="password" placeholder="Şifre" autocomplete="current-password" data-action="keydown.enter->app#submitAuth">
                <button class="mb" data-action="click->app#submitAuth" data-app-target="authBtn">Giriş</button>
                <div data-app-target="authError" style="color:#e74c3c;font-size:11px;margin-top:8px;display:none"></div>
            </div>
        </div>

        <!-- ==================== ANA ARAYÜZ ==================== -->
        <div data-app-target="main" class="app hidden" style="--ac:#c94d8c">
            <!-- SERVER RAIL -->
            <nav class="rail">
                <div class="ri act" title="Gettic">#</div>
                <div class="ri-sep"></div>
                <div class="ri" title="Kanal Ekle" data-action="click->app#openModal:addChannel">+</div>
                <div class="ri" title="Tema" data-action="click->app#openModal:theme">🎨</div>
                <div class="ri" title="DM" data-action="click->app#openModal:dm">💬</div>
                <div class="ri ri-push" title="Çıkış" data-action="click->app#logout">🚪</div>
            </nav>

            <!-- SIDEBAR -->
            <nav data-app-target="sidebar" class="sidebar">
                <div class="sidebar-header"><span>#</span> <span data-app-target="serverName">Gettic</span></div>
                <div class="sidebar-scroll" data-app-target="channelList">
                    <div class="ch-cat">METİN <button data-action="click->app#openModal:addChannel">+</button></div>
                    <div class="ch-item act" data-action="click->app#switchChannel" data-channel="genel-sohbet">
                        <span class="ch-name"># genel-sohbet</span>
                    </div>
                    <div class="ch-cat">SES <button>+</button></div>
                    <div class="ch-item" data-action="click->app#joinVoice" data-channel="genel-ses">
                        <span>🔊</span> <span class="ch-name">Genel Ses</span>
                    </div>
                </div>
                <div class="sidebar-user" data-action="click->app#openModal:profile">
                    <div class="su-av" data-app-target="avatar">G</div>
                    <div class="su-info">
                        <div class="su-name" data-app-target="displayName">Kullanıcı</div>
                        <div class="su-tag">🟢 Çevrimiçi</div>
                    </div>
                </div>
            </nav>

            <!-- CHAT AREA -->
            <main class="chat">
                <header class="chat-header">
                    <span>#</span>
                    <div class="ch-hname" data-app-target="channelName">genel-sohbet</div>
                    <div class="hacts">
                        <button class="ib" title="Ara" data-action="click->app#openModal:search">🔍</button>
                        <button class="ib" title="Bildirimler">🔔</button>
                        <button class="ib" title="Sidebar" data-action="click->app#toggleSidebar">☰</button>
                        <button class="ib" title="Panel" data-action="click->app#togglePanel">👤</button>
                    </div>
                </header>

                <div class="msgs" data-app-target="messages">
                    <div class="empty-ch">
                        <h4># genel-sohbet</h4>
                        <p>Sohbete hoş geldin! İlk mesajı sen gönder.</p>
                    </div>
                </div>

                <div class="typing" data-app-target="typing"></div>

                <div class="input-area">
                    <button class="ib" title="Emoji" data-action="click->app#toggleEmoji">😊</button>
                    <div data-app-target="emojiPanel" class="epop hidden" style="bottom:60px;left:10px">
                        <div class="egrid" data-app-target="emojiGrid"></div>
                    </div>
                    <button class="ib" title="Görsel" data-action="click->app#openModal:imageGen">🖼️</button>
                    <button class="ib" title="Anket" data-action="click->app#openModal:poll">📊</button>
                    <textarea class="msg-inp" data-app-target="input" placeholder="Mesaj yaz..." data-action="keydown.enter->app#sendMessage" rows="1"></textarea>
                    <button class="ib" style="background:var(--gr)" data-action="click->app#sendMessage">➤</button>
                </div>
            </main>

            <!-- USER PANEL -->
            <aside data-app-target="userPanel" class="sidebar hidden" style="right:0;width:252px;border-right:none;border-left:1px solid var(--b2)">
                <div class="sidebar-header">Panel</div>
                <div class="sidebar-scroll" style="padding:8px">
                    <button class="mb" data-action="click->app#openModal:dm">💬 DM</button>
                    <button class="mb" data-action="click->app#openModal:addFriend">👤 Arkadaş Ekle</button>
                    <button class="mb" data-action="click->app#openModal:theme">🎨 Tema</button>
                    <button class="mb" data-action="click->app#openModal:poll">📊 Anket</button>
                    <button class="mb" data-action="click->app#openModal:serverSettings">⚙️ Ayarlar</button>
                    <button class="mb" data-action="click->app#openModal:roles">🛡️ Roller</button>
                    <button class="mb danger" data-action="click->app#logout">🚪 Çıkış</button>
                </div>
            </aside>
        </div>

        <!-- ==================== MODALLAR ==================== -->
        <div data-app-target="modal" class="modal hidden" data-action="click->app#closeModal">
            <div class="mbox" data-app-target="modalContent"></div>
        </div>

        <!-- ==================== TOAST ==================== -->
        <div data-app-target="toast" class="toast hidden"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@hotwired/stimulus@3/dist/stimulus.min.js"></script>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/icons.js"></script>
    <script src="js/store.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/chat.js"></script>
    <script src="js/channels.js"></script>
    <script src="js/dm.js"></script>
    <script src="js/voice.js"></script>
    <script src="js/polls.js"></script>
    <script src="js/roles.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app-stimulus.js"></script>
</body>
                          </html>
