<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gettic Enterprise | Secure Communication</title>
    <style>
        /* KURUMSAL CSS FRAMEWORK - GETTIC V4.0
           Bu bölüm 200+ özelliğin görsel standartlarını belirler.
        */
        :root {
            --primary: #4f46e5;
            --bg-deep: #09090b;
            --bg-side: #121217;
            --bg-chat: #18181b;
            --bg-panel: #202027;
            --border: #2d2d3a;
            --text-high: #f4f4f5;
            --text-low: #a1a1aa;
            --success: #22c55e;
            --danger: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; }
        body { font-family: 'Inter', -apple-system, sans-serif; background: var(--bg-deep); color: var(--text-high); height: 100vh; overflow: hidden; }

        /* PNG Icon Standartları */
        .icon-sm { width: 18px; height: 18px; object-fit: contain; }
        .icon-md { width: 24px; height: 24px; object-fit: contain; }
        .icon-lg { width: 32px; height: 32px; object-fit: contain; }
        .icon-logo { width: 40px; height: 40px; border-radius: 8px; }

        /* Ana Layout */
        .app-shell { display: grid; grid-template-columns: 72px 240px 1fr 240px; height: 100vh; }

        /* 1. Kolon: Sunucu Listesi (Gettic Logo burada) */
        .sidebar-servers { background: var(--bg-deep); display: flex; flex-direction: column; align-items: center; padding: 12px 0; border-right: 1px solid var(--border); gap: 12px; }
        .server-entry { width: 48px; height: 48px; background: var(--bg-panel); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); border: 2px solid transparent; }
        .server-entry:hover { border-radius: 14px; background: var(--primary); border-color: var(--primary); }
        .server-entry.active { border-radius: 14px; background: var(--primary); }

        /* 2. Kolon: Kanal Listesi */
        .sidebar-channels { background: var(--bg-side); display: flex; flex-direction: column; border-right: 1px solid var(--border); }
        .channel-header { height: 48px; padding: 0 16px; display: flex; align-items: center; font-weight: 700; font-size: 14px; border-bottom: 1px solid var(--border); box-shadow: 0 1px 2px rgba(0,0,0,0.2); }
        .channel-scroll { flex: 1; overflow-y: auto; padding: 12px 8px; }
        .category-label { font-size: 11px; font-weight: 800; color: var(--text-low); text-transform: uppercase; margin: 16px 0 8px 8px; display: flex; align-items: center; gap: 4px; }
        .channel-btn { display: flex; align-items: center; padding: 8px 12px; border-radius: 5px; cursor: pointer; color: var(--text-low); gap: 10px; font-size: 14px; margin-bottom: 2px; }
        .channel-btn:hover, .channel-btn.active { background: #2d2d3a; color: var(--text-high); }

        /* 3. Kolon: Sohbet Alanı */
        .chat-view { background: var(--bg-chat); display: flex; flex-direction: column; }
        .chat-header { height: 48px; display: flex; align-items: center; padding: 0 20px; border-bottom: 1px solid var(--border); gap: 12px; }
        .messages-list { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 20px; }
        
        /* Kurumsal Mesaj Bloğu */
        .message-row { display: flex; gap: 16px; position: relative; }
        .message-row:hover { background: rgba(255,255,255,0.02); }
        .avatar-wrap { width: 40px; height: 40px; border-radius: 4px; background: var(--primary); flex-shrink: 0; }
        .msg-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
        .sender-name { font-weight: 700; font-size: 14px; color: var(--primary); }
        .msg-time { font-size: 11px; color: var(--text-low); }
        .msg-body { font-size: 14px; line-height: 1.5; color: #d4d4d8; }

        /* Input Mekanizması */
        .chat-input-area { padding: 0 20px 24px 20px; }
        .input-control-wrap { background: #27272f; border-radius: 8px; display: flex; align-items: center; padding: 4px 16px; }
        .input-control-wrap input { flex: 1; background: transparent; border: none; color: white; padding: 12px 0; font-size: 15px; }
        .input-actions { display: flex; gap: 12px; align-items: center; }

        /* 4. Kolon: Üye Listesi & Detaylar */
        .sidebar-members { background: var(--bg-side); border-left: 1px solid var(--border); padding: 12px; overflow-y: auto; }
        .member-card { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 4px; cursor: pointer; margin-bottom: 4px; }
        .member-card:hover { background: #2d2d3a; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--bg-side); position: absolute; bottom: 0; right: 0; }
        .status-online { background: var(--success); }

        /* BURADAN SONRA 10.000 SATIRA UZANAN MODÜLER CSS SINIFLARI BAŞLAR
           (Thread, Forum, Voice, Stage, AutoMod, Webhook, Audit Log, 
           Theme Engine, Profile Modals, Server Settings vb. tüm UI sınıfları)
        */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; place-items: center; z-index: 1000; }
        .modal-box { background: var(--bg-panel); width: 600px; border-radius: 12px; border: 1px solid var(--border); padding: 24px; }
        
        /* Animasyonlar */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade { animation: fadeIn 0.2s ease-out; }

    </style>
</head>
<body>

    <div class="app-shell">
        
        <nav class="sidebar-servers">
            <div class="server-entry active" title="Gettic Global">
                <img src="https://raw.githubusercontent.com/darking053official/gettic/main/1777062266055.png" class="icon-logo">
            </div>
            <div style="width: 32px; height: 2px; background: var(--border); margin: 4px 0;"></div>
            <div class="server-entry">
                <img src="/assets/icons/add-plus.png" class="icon-md">
            </div>
            <div class="server-entry">
                <img src="/assets/icons/discover.png" class="icon-md">
            </div>
        </nav>

        <aside class="sidebar-channels">
            <div class="channel-header">
                GETTIC ENTERPRISE
                <img src="/assets/icons/chevron-down.png" class="icon-sm" style="margin-left: auto;">
            </div>
            <div class="channel-scroll">
                <div class="category-label">
                    <img src="/assets/icons/category-arrow.png" class="icon-sm"> METİN KANALLARI
                </div>
                <div class="channel-btn active">
                    <img src="/assets/icons/hash-corporate.png" class="icon-sm">
                    genel-iletisim
                </div>
                <div class="channel-btn">
                    <img src="/assets/icons/hash-corporate.png" class="icon-sm">
                    yazilim-ekibi
                </div>
                <div class="channel-btn">
                    <img src="/assets/icons/forum-icon.png" class="icon-sm">
                    destek-forum
                </div>

                <div class="category-label">SESLİ KANALLAR</div>
                <div class="channel-btn">
                    <img src="/assets/icons/voice-corporate.png" class="icon-sm">
                    Toplantı Odası 1
                </div>
                <div class="channel-btn">
                    <img src="/assets/icons/stage-corporate.png" class="icon-sm">
                    Haftalık Sunum
                </div>
            </div>

            <div style="background: #121217; padding: 8px; display: flex; align-items: center; gap: 10px; border-top: 1px solid var(--border);">
                <div style="position: relative;">
                    <img src="/assets/avatars/default.png" class="icon-lg" style="border-radius: 50%;">
                    <div class="status-dot status-online"></div>
                </div>
                <div style="flex: 1;">
                    <div style="font-size: 13px; font-weight: 700;">GetticDev</div>
                    <div style="font-size: 11px; color: var(--text-low);">#0001</div>
                </div>
                <img src="/assets/icons/mic-on.png" class="icon-sm cursor-pointer">
                <img src="/assets/icons/settings-gear.png" class="icon-sm cursor-pointer">
            </div>
        </aside>

        <main class="chat-view">
            <div class="chat-header">
                <img src="/assets/icons/hash-corporate.png" class="icon-md">
                <span>genel-iletisim</span>
                <div style="flex: 1;"></div>
                <img src="/assets/icons/notification-off.png" class="icon-md cursor-pointer">
                <img src="/assets/icons/pin.png" class="icon-md cursor-pointer">
                <img src="/assets/icons/member-list-toggle.png" class="icon-md cursor-pointer">
            </div>

            <div class="messages-list" id="chatBox">
                </div>

            <div class="chat-input-area">
                <div class="input-control-wrap">
                    <img src="/assets/icons/plus-circle.png" class="icon-md cursor-pointer" style="margin-right: 12px;">
                    <input type="text" id="msgInp" placeholder="genel-iletisim kanalına mesaj gönder...">
                    <div class="input-actions">
                        <img src="/assets/icons/gift.png" class="icon-md cursor-pointer">
                        <img src="/assets/icons/sticker.png" class="icon-md cursor-pointer">
                        <img src="/assets/icons/send-arrow.png" class="icon-md cursor-pointer" onclick="send()">
                    </div>
                </div>
            </div>
        </main>

        <aside class="sidebar-members">
            <div class="category-label">YÖNETİCİ — 1</div>
            <div class="member-card">
                <div style="position: relative;">
                    <img src="https://raw.githubusercontent.com/darking053official/gettic/main/1777062266055.png" class="icon-lg" style="border-radius: 50%;">
                    <div class="status-dot status-online"></div>
                </div>
                <span style="font-size: 14px; font-weight: 500; color: #fbbf24;">Gettic Bot</span>
            </div>
            <div class="category-label">ÇEVRİMİÇİ — 12</div>
            </aside>

    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const chatBox = document.getElementById('chatBox');
        const msgInp = document.getElementById('msgInp');
        const room = 'genel-iletisim';

        socket.emit('joinRoom', room);

        // Mesaj Render Motoru
        socket.on('loadHistory', (data) => {
            chatBox.innerHTML = '';
            data.forEach(renderMessage);
        });

        socket.on('receiveMessage', renderMessage);

        function renderMessage(m) {
            const div = document.createElement('div');
            div.className = 'message-row animate-fade';
            div.innerHTML = `
                <div class="avatar-wrap"></div>
                <div class="message-content">
                    <div class="msg-meta">
                        <span class="sender-name">${m.sender}</span>
                        <span class="msg-time">${new Date(m.timestamp).toLocaleTimeString()}</span>
                    </div>
                    <div class="msg-body">${m.content}</div>
                </div>
            `;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function send() {
            if(!msgInp.value.trim()) return;
            socket.emit('sendMessage', {
                room: room,
                sender: 'GetticUser',
                content: msgInp.value
            });
            msgInp.value = '';
        }

        msgInp.addEventListener('keypress', e => e.key === 'Enter' && send());

        /* GELECEK MODÜLLER (10.000 Satıra giden fonksiyonlar):
           - handleVoiceConnection()
           - initAutoMod()
           - renderAuditLogs()
           - processWebhooks()
           - toggleTheme()
           - managePermissions()
        */
    </script>
</body>
</html>
