<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gettic - Kurumsal İletişim Platformu</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; background: #0a0a0f; color: #e0e0e0; }
    .gettic-gradient { background: linear-gradient(135deg, #1e40af, #3b82f6); }
    input { transition: all 0.2s; }
    input:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.3); }
  </style>
</head>
<body class="min-h-screen bg-[#0a0a0f]">

  <!-- Login / Kayıt Ekranı -->
  <div id="auth-screen" class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-[#16181f] border border-[#334155] w-full max-w-md rounded-3xl p-8 shadow-2xl">
      <div class="text-center mb-8">
        <img src="https://raw.githubusercontent.com/darking053official/gettic/main/1777062266055.png" 
             alt="Gettic" class="mx-auto w-20 h-20 rounded-3xl mb-4">
        <h1 class="text-4xl font-bold text-white">Gettic</h1>
        <p class="text-blue-400 mt-1">Kurumsal İletişim Platformu</p>
      </div>

      <div class="flex border-b border-gray-700 mb-6">
        <button id="tab-login" class="flex-1 py-3 font-medium border-b-2 border-blue-500 text-blue-400">Giriş Yap</button>
        <button id="tab-register" class="flex-1 py-3 font-medium text-gray-400">Kayıt Ol</button>
      </div>

      <div id="login-form" class="space-y-5">
        <input id="login-username" type="text" placeholder="Kullanıcı Adı" 
               class="w-full bg-zinc-900 border border-zinc-700 rounded-2xl px-5 py-4 text-base">
        <input id="login-password" type="password" placeholder="Şifre" 
               class="w-full bg-zinc-900 border border-zinc-700 rounded-2xl px-5 py-4 text-base">
        <button id="login-btn" class="w-full gettic-gradient py-4 rounded-3xl font-semibold text-lg">
          Gettic'e Giriş Yap
        </button>
      </div>

      <div id="register-form" class="hidden space-y-5">
        <input id="reg-username" type="text" placeholder="Kullanıcı Adı" 
               class="w-full bg-zinc-900 border border-zinc-700 rounded-2xl px-5 py-4 text-base">
        <input id="reg-password" type="password" placeholder="Şifre" 
               class="w-full bg-zinc-900 border border-zinc-700 rounded-2xl px-5 py-4 text-base">
        <button id="register-btn" class="w-full gettic-gradient py-4 rounded-3xl font-semibold text-lg">
          Hesap Oluştur
        </button>
      </div>

      <p class="text-center text-xs text-gray-500 mt-8">gettic.js ile güçlendirilmiş • 200+ Özellik</p>
    </div>
  </div>

  <!-- Ana Uygulama (Şimdilik basit tutuldu) -->
  <div id="main-app" class="hidden h-screen flex flex-col">
    <div class="flex-1 flex flex-col">
      <div class="h-14 bg-[#24272f] flex items-center px-4 border-b border-gray-700">
        <span id="room-title" class="font-semibold"># genel-iletisim</span>
      </div>
      <div id="messages" class="flex-1 overflow-y-auto p-4 bg-[#1f222a]"></div>
      <div class="p-4 bg-[#24272f]">
        <div class="flex gap-2">
          <input id="message-input" type="text" placeholder="Mesaj yazın..." 
                 class="flex-1 bg-[#2f323a] rounded-3xl px-5 py-3">
          <button id="send-btn" class="bg-blue-600 px-6 rounded-3xl">Gönder</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const socket = io();
    let currentUsername = null;

    // Tab değiştirme
    document.getElementById('tab-login').addEventListener('click', () => {
      document.getElementById('login-form').classList.remove('hidden');
      document.getElementById('register-form').classList.add('hidden');
      document.getElementById('tab-login').classList.add('border-b-2', 'border-blue-500', 'text-blue-400');
      document.getElementById('tab-register').classList.remove('border-b-2', 'border-blue-500', 'text-blue-400');
    });

    document.getElementById('tab-register').addEventListener('click', () => {
      document.getElementById('register-form').classList.remove('hidden');
      document.getElementById('login-form').classList.add('hidden');
      document.getElementById('tab-register').classList.add('border-b-2', 'border-blue-500', 'text-blue-400');
      document.getElementById('tab-login').classList.remove('border-b-2', 'border-blue-500', 'text-blue-400');
    });

    // Login
    document.getElementById('login-btn').addEventListener('click', async () => {
      const username = document.getElementById('login-username').value.trim();
      const password = document.getElementById('login-password').value;
      if (!username || !password) return alert("Kullanıcı adı ve şifre girin.");

      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();
      if (data.success) {
        currentUsername = data.username;
        document.getElementById('auth-screen').classList.add('hidden');
        document.getElementById('main-app').classList.remove('hidden');
        socket.emit('login', { token: data.token });
      } else {
        alert(data.error || "Giriş başarısız.");
      }
    });

    // Register (basit)
    document.getElementById('register-btn').addEventListener('click', async () => {
      const username = document.getElementById('reg-username').value.trim();
      const password = document.getElementById('reg-password').value;
      if (!username || !password) return alert("Kullanıcı adı ve şifre girin.");

      const res = await fetch('/api/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();
      if (data.success) {
        alert("Hesap oluşturuldu! Şimdi giriş yapabilirsiniz.");
        document.getElementById('tab-login').click();
      } else {
        alert(data.error || "Kayıt başarısız.");
      }
    });

    // Mesaj gönderme
    document.getElementById('send-btn').addEventListener('click', () => {
      const input = document.getElementById('message-input');
      if (input.value.trim()) {
        // Mesaj ekleme burada yapılabilir
        input.value = '';
      }
    });

    window.onload = () => {
      document.getElementById('tab-login').click();
    };
  </script>
</body>
</html>
