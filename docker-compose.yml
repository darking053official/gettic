version: '3.8'

services:
  # ========== Veritabanları ==========
  mongo:
    image: mongo:7
    container_name: gettic-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: gettic
    networks:
      - gettic-net
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gettic-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - gettic-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ========== Backend'ler ==========
  node-server:
    build:
      context: .
      dockerfile: Dockerfile.node
    container_name: gettic-node
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGODB_URI=mongodb://mongo:27017/gettic
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=gettic2024secret
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gettic-net

  go-server:
    build:
      context: .
      dockerfile: Dockerfile.go
    container_name: gettic-go
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - MONGODB_URI=mongodb://mongo:27017
    depends_on:
      - mongo
    networks:
      - gettic-net

  rust-server:
    build:
      context: .
      dockerfile: Dockerfile.rust
    container_name: gettic-rust
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - MONGODB_URI=mongodb://mongo:27017
    depends_on:
      - mongo
    networks:
      - gettic-net

  # ========== Nginx ==========
  nginx:
    image: nginx:alpine
    container_name: gettic-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - node-server
      - go-server
      - rust-server
    networks:
      - gettic-net

networks:
  gettic-net:
    driver: bridge

volumes:
  mongo_data:
  redis_data:
