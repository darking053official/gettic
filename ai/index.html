<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gettic AI</title>
    <style>
        :root {
            --bg: #0d0d0d;
            --sidebar: #111111;
            --card: #1a1a1a;
            --accent: #7c3aed;
            --accent2: #a78bfa;
            --text: #ffffff;
            --muted: #a1a1aa;
            --border: #27272a;
            --user-bg: #1e1b4b;
            --ai-bg: #18181b;
            --hover: #27272a;
            --fast: #10b981;
            --think: #f59e0b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* SIDEBAR */
        .sidebar {
            width: 260px;
            min-width: 260px;
            background: var(--sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar-logo {
            width: 32px; height: 32px;
            border-radius: 8px;
            background: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.8rem;
        }

        .sidebar-header h2 {
            font-size: 1rem;
            font-weight: 600;
        }

        .new-chat-btn {
            margin: 12px;
            padding: 10px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .new-chat-btn:hover {
            background: var(--hover);
            border-color: var(--accent);
        }

        .chat-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        .chat-list-section {
            font-size: 0.7rem;
            color: var(--muted);
            padding: 8px 12px 4px;
            font-weight: 600;
        }

        .chat-list-item {
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8rem;
            color: var(--muted);
            transition: all 0.2s;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chat-list-item:hover {
            background: var(--hover);
            color: var(--text);
        }

        .sidebar-footer {
            padding: 12px;
            border-top: 1px solid var(--border);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            color: var(--muted);
        }

        .user-avatar {
            width: 28px; height: 28px;
            border-radius: 50%;
            background: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            font-weight: 600;
        }

        /* MAIN */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            min-width: 0;
        }

        .chat-header {
            padding: 12px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .mode-selector {
            display: flex;
            gap: 4px;
            background: var(--card);
            border-radius: 20px;
            padding: 3px;
        }

        .mode-btn {
            padding: 8px 16px;
            border-radius: 18px;
            border: none;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 500;
            transition: all 0.3s;
            background: transparent;
            color: var(--muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .mode-btn.active {
            background: var(--accent);
            color: white;
        }

        .mode-btn.fast.active {
            background: var(--fast);
        }

        .mode-btn.think.active {
            background: var(--think);
        }

        .mode-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: currentColor;
        }

        .mode-dot.fast { background: var(--fast); }
        .mode-dot.think { background: var(--think); }

        .chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .chat-box::-webkit-scrollbar { width: 4px; }
        .chat-box::-webkit-scrollbar-track { background: transparent; }
        .chat-box::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

        .empty-chat {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            gap: 16px;
            color: var(--muted);
            text-align: center;
        }

        .empty-chat h2 {
            font-size: 1.5rem;
            color: var(--text);
            font-weight: 600;
        }

        .empty-chat p {
            font-size: 0.9rem;
            max-width: 400px;
        }

        .message {
            display: flex;
            gap: 12px;
            animation: msgIn 0.3s ease;
        }

        @keyframes msgIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user { flex-direction: row-reverse; }

        .msg-avatar {
            width: 32px; height: 32px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .message.user .msg-avatar { background: var(--accent); }
        .message.ai .msg-avatar { background: var(--border); color: var(--accent2); }

        .msg-content {
            max-width: 70%;
        }

        .msg-bubble {
            padding: 12px 16px;
            border-radius: 16px;
            line-height: 1.6;
            font-size: 0.9rem;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .message.user .msg-bubble {
            background: var(--user-bg);
            border-bottom-right-radius: 4px;
        }

        .message.ai .msg-bubble {
            background: var(--ai-bg);
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
        }

        .msg-time {
            font-size: 0.65rem;
            color: var(--muted);
            margin-top: 4px;
            text-align: right;
        }

        .message.user .msg-time { text-align: left; }

        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .typing-dots {
            display: flex;
            gap: 3px;
            padding: 12px 16px;
            background: var(--ai-bg);
            border-radius: 16px;
            border: 1px solid var(--border);
        }

        .typing-dots span {
            width: 6px; height: 6px;
            background: var(--accent);
            border-radius: 50%;
            animation: typingBounce 1.2s infinite;
        }

        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typingBounce {
            0%, 60%, 100% { opacity: 0.3; }
            30% { opacity: 1; }
        }

        /* INPUT - Sabit altta */
        .chat-input-area {
            padding: 16px 24px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 10px;
            align-items: center;
            flex-shrink: 0;
            background: var(--bg);
        }

        .mode-label {
            font-size: 0.75rem;
            color: var(--muted);
            padding: 6px 12px;
            background: var(--card);
            border-radius: 16px;
            white-space: nowrap;
        }

        .mode-label.fast { color: var(--fast); }
        .mode-label.think { color: var(--think); }

        .chat-input-area input {
            flex: 1;
            padding: 12px 18px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 25px;
            color: var(--text);
            font-size: 0.9rem;
            outline: none;
            transition: all 0.3s;
        }

        .chat-input-area input:focus {
            border-color: var(--accent);
        }

        .chat-input-area input::placeholder {
            color: var(--muted);
        }

        .send-btn {
            width: 40px; height: 40px;
            background: var(--accent);
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            flex-shrink: 0;
        }

        .send-btn:hover { background: var(--accent2); }
        .send-btn svg { width: 18px; height: 18px; }

        /* LOGIN */
        .login-screen {
            display: none;
            position: fixed;
            inset: 0;
            background: var(--bg);
            z-index: 100;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .login-screen.active {
            display: flex;
        }

        .login-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            width: 380px;
            max-width: 90vw;
        }

        .login-card img {
            width: 80px; height: 80px;
            border-radius: 16px;
            margin-bottom: 16px;
        }

        .login-card h1 {
            font-size: 1.5rem;
            margin-bottom: 8px;
        }

        .login-card p {
            color: var(--muted);
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        .login-card input {
            width: 100%;
            padding: 12px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-size: 0.9rem;
            margin-bottom: 10px;
            outline: none;
        }

        .login-card input:focus {
            border-color: var(--accent);
        }

        .login-card button {
            width: 100%;
            padding: 12px;
            background: var(--accent);
            border: none;
            border-radius: 10px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.95rem;
        }

        .login-card .limit {
            margin-top: 10px;
            font-size: 0.75rem;
            color: var(--muted);
        }

        @media (max-width: 768px) {
            .sidebar { display: none; }
            .msg-content { max-width: 85%; }
        }
    </style>
</head>
<body>

    <!-- LOGIN -->
    <div class="login-screen active" id="loginScreen">
        <div class="login-card">
            <img src="https://github.com/darking053official/gettic/blob/main/1777062266055.png?raw=true" alt="Logo" onerror="this.style.display='none'" />
            <h1>Gettic AI</h1>
            <p>Hızlı ve düşünen mod ile akıllı sohbet</p>
            <input type="text" id="usernameInput" placeholder="Kullanıcı adı" />
            <input type="password" id="passwordInput" placeholder="Şifre" />
            <button onclick="startChat()">Sohbete Başla</button>
            <div class="limit" id="loginLimit">Kalan: 15 sohbet</div>
        </div>
    </div>

    <!-- SIDEBAR -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo">G</div>
            <h2>Gettic AI</h2>
        </div>
        <button class="new-chat-btn" onclick="newChat()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
            Yeni Sohbet
        </button>
        <div class="chat-list" id="chatList">
            <div class="chat-list-section">Bugün</div>
            <div class="chat-list-item">Yeni sohbet</div>
        </div>
        <div class="sidebar-footer">
            <div class="user-info">
                <div class="user-avatar" id="sidebarAvatar">G</div>
                <span id="sidebarUser">Kullanıcı</span>
            </div>
        </div>
    </div>

    <!-- MAIN -->
    <div class="main">
        <div class="chat-header">
            <div class="mode-selector">
                <button class="mode-btn fast active" id="fastModeBtn" onclick="setMode('fast')">
                    <span class="mode-dot fast"></span> Hızlı mod
                </button>
                <button class="mode-btn think" id="thinkModeBtn" onclick="setMode('think')">
                    <span class="mode-dot think"></span> Düşünen mod
                </button>
            </div>
        </div>

        <div class="chat-box" id="chatBox">
            <div class="empty-chat" id="emptyState">
                <h2>Gettic AI</h2>
                <p>Hızlı modda anında yanıtlar, düşünen modda derinlemesine cevaplar alın.</p>
            </div>
        </div>

        <div class="chat-input-area">
            <span class="mode-label fast" id="modeLabel">⚡ Hızlı</span>
            <input type="text" id="userInput" placeholder="Mesaj yazın..." onkeypress="if(event.key==='Enter') sendMessage()" autocomplete="off" />
            <button class="send-btn" onclick="sendMessage()">
                <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
            </button>
        </div>
    </div>

    <script>
        let username = '';
        let currentMode = 'fast';
        let currentChatId = null;
        let isFirstMessage = true;
        let remainingChats = 15;

        function timeNow() {
            return new Date().toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
        }

        function updateUI() {
            document.getElementById('loginLimit').textContent = `Kalan: ${remainingChats} sohbet`;
            document.getElementById('sidebarUser').textContent = username || 'Kullanıcı';
            document.getElementById('sidebarAvatar').textContent = username ? username.charAt(0).toUpperCase() : 'G';
        }

        function setMode(mode) {
            currentMode = mode;
            document.getElementById('fastModeBtn').classList.toggle('active', mode === 'fast');
            document.getElementById('thinkModeBtn').classList.toggle('active', mode === 'think');
            
            const label = document.getElementById('modeLabel');
            if (mode === 'fast') {
                label.textContent = '⚡ Hızlı';
                label.className = 'mode-label fast';
            } else {
                label.textContent = '🧠 Düşünen';
                label.className = 'mode-label think';
            }
        }

        async function checkRemaining() {
            try {
                const res = await fetch(`https://gettic-j49l.onrender.com/api/chats/${encodeURIComponent(username)}`);
                const chats = await res.json();
                if (Array.isArray(chats)) {
                    remainingChats = 15 - chats.length;
                    if (remainingChats < 0) remainingChats = 0;
                }
                updateUI();
            } catch (e) {}
        }

        async function startChat() {
            const name = document.getElementById('usernameInput').value.trim();
            const pass = document.getElementById('passwordInput').value.trim();
            if (!name) return alert('Kullanıcı adı girin!');
            if (!pass || pass.length < 4) return alert('Şifre en az 4 karakter!');

            username = name;
            await checkRemaining();
            if (remainingChats <= 0) return alert('Günlük limit doldu!');

            document.getElementById('loginScreen').classList.remove('active');
            updateUI();
            document.getElementById('userInput').focus();
        }

        function newChat() {
            currentChatId = null;
            isFirstMessage = true;
            document.getElementById('chatBox').innerHTML = `
                <div class="empty-chat" id="emptyState">
                    <h2>Gettic AI</h2>
                    <p>${currentMode === 'fast' ? 'Hızlı yanıtlar için hazırım!' : 'Derin düşünüyorum...'}</p>
                </div>`;
        }

        function addMessage(sender, text) {
            if (isFirstMessage) {
                document.getElementById('emptyState')?.remove();
                isFirstMessage = false;
            }
            const box = document.getElementById('chatBox');
            const div = document.createElement('div');
            div.className = `message ${sender}`;
            div.innerHTML = `
                <div class="msg-avatar">${sender === 'user' ? username.charAt(0).toUpperCase() : 'AI'}</div>
                <div class="msg-content">
                    <div class="msg-bubble">${text}</div>
                    <div class="msg-time">${timeNow()}</div>
                </div>`;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        function showTyping() {
            if (isFirstMessage) {
                document.getElementById('emptyState')?.remove();
                isFirstMessage = false;
            }
            const div = document.createElement('div');
            div.className = 'typing-indicator';
            div.id = 'typingIndicator';
            div.innerHTML = `
                <div class="msg-avatar">AI</div>
                <div class="typing-dots"><span></span><span></span><span></span></div>`;
            document.getElementById('chatBox').appendChild(div);
            document.getElementById('chatBox').scrollTop = document.getElementById('chatBox').scrollHeight;
        }

        function hideTyping() {
            document.getElementById('typingIndicator')?.remove();
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const msg = input.value.trim();
            if (!msg) return;

            addMessage('user', msg);
            input.value = '';
            input.focus();
            showTyping();

            try {
                const response = await fetch('https://gettic-j49l.onrender.com/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: msg,
                        sessionId: username,
                        chatId: currentChatId,
                        mode: currentMode
                    })
                });

                const data = await response.json();
                hideTyping();

                if (data.reply) {
                    if (data.chatId) currentChatId = data.chatId;
                    if (data.remainingChats !== undefined) {
                        remainingChats = data.remainingChats;
                        updateUI();
                    }
                    addMessage('ai', data.reply);
                } else {
                    addMessage('ai', '❌ ' + (data.error || 'Hata'));
                }
            } catch (e) {
                hideTyping();
                addMessage('ai', '❌ Bağlantı hatası');
            }
        }

        // Enter tuşu
        document.getElementById('usernameInput').addEventListener('keypress', e => {
            if (e.key === 'Enter') document.getElementById('passwordInput').focus();
        });
        document.getElementById('passwordInput').addEventListener('keypress', e => {
            if (e.key === 'Enter') startChat();
        });
    </script>
</body>
                </html>
