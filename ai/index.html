<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gettic AI | Akıllı Asistan</title>
    <style>
        :root {
            --bg: #0a0a14;
            --card: #12122a;
            --accent: #8b5cf6;
            --accent2: #a78bfa;
            --accent3: #c4b5fd;
            --text: #f5f3ff;
            --muted: #a5b4fc;
            --border: #1e1e40;
            --user-bg: #1e1b4b;
            --ai-bg: #0f172a;
            --danger: #ef4444;
            --success: #10b981;
            --warning: #f59e0b;
            --gradient: linear-gradient(135deg, #8b5cf6, #6366f1, #4f46e5);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .bg-particles {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            background: var(--accent);
            animation: particleFloat 15s infinite;
            opacity: 0.1;
        }

        @keyframes particleFloat {
            0%, 100% { transform: translateY(100vh) scale(0); }
            10% { opacity: 0.3; }
            50% { transform: translateY(50vh) scale(1); opacity: 0.1; }
            90% { opacity: 0.3; }
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            animation: orbFloat 25s infinite ease-in-out;
        }

        .orb-1 {
            width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(139,92,246,0.15) 0%, transparent 70%);
            top: -200px; right: -200px;
        }

        .orb-2 {
            width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(99,102,241,0.12) 0%, transparent 70%);
            bottom: -150px; left: -150px;
            animation-delay: -12s;
        }

        @keyframes orbFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(50px, -50px) scale(1.1); }
            66% { transform: translate(-50px, 50px) scale(0.9); }
        }

        .login-screen {
            display: none;
            text-align: center;
            z-index: 1;
            animation: fadeIn 0.5s ease;
        }
        .login-screen.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 25px 80px rgba(0,0,0,0.6);
            width: 400px;
            max-width: 90vw;
        }

        .login-logo {
            width: 100px;
            height: 100px;
            border-radius: 20px;
            margin: 0 auto 20px;
            display: block;
            object-fit: cover;
            box-shadow: 0 8px 32px rgba(139,92,246,0.3);
            animation: logoFloat 3s ease-in-out infinite;
        }

        @keyframes logoFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        .login-icon {
            display: none;
        }

        .login-card h1 {
            font-size: 2rem;
            font-weight: 700;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .login-card p {
            color: var(--muted);
            margin-bottom: 24px;
        }

        .login-card input {
            width: 100%;
            padding: 14px 18px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            font-size: 1rem;
            outline: none;
            margin-bottom: 12px;
            transition: all 0.3s;
        }

        .login-card input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 25px rgba(139,92,246,0.15);
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: var(--gradient);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(139,92,246,0.3);
        }

        .login-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .login-limit {
            margin-top: 12px;
            font-size: 0.8rem;
            color: var(--warning);
        }

        .app-container {
            display: none;
            z-index: 1;
            width: 95%;
            max-width: 850px;
            animation: fadeIn 0.5s ease;
        }
        .app-container.active { display: block; }

        .chat-container {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 25px 80px rgba(0,0,0,0.6);
        }

        .chat-header {
            background: var(--gradient);
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .chat-header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chat-avatar {
            width: 36px;
            height: 36px;
            background: rgba(255,255,255,0.2);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .chat-info h3 {
            font-size: 0.95rem;
            font-weight: 600;
        }

        .chat-info span {
            font-size: 0.7rem;
            opacity: 0.8;
        }

        .chat-actions {
            display: flex;
            gap: 8px;
        }

        .chat-actions button {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.1);
            color: white;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .chat-actions button:hover {
            background: rgba(255,255,255,0.2);
        }

        .chat-box {
            height: 420px;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .chat-box::-webkit-scrollbar { width: 5px; }
        .chat-box::-webkit-scrollbar-track { background: transparent; }
        .chat-box::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

        .empty-chat {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            gap: 12px;
            color: var(--muted);
            text-align: center;
        }

        .empty-chat svg {
            width: 60px;
            height: 60px;
            opacity: 0.4;
            animation: floatIcon 3s ease-in-out infinite;
        }

        @keyframes floatIcon {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .message {
            display: flex;
            gap: 10px;
            animation: msgIn 0.3s ease;
        }

        @keyframes msgIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user { flex-direction: row-reverse; }

        .msg-avatar {
            width: 30px; height: 30px;
            border-radius: 8px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            font-weight: 700;
        }

        .message.user .msg-avatar { background: var(--gradient); }
        .message.ai .msg-avatar { background: var(--ai-bg); border: 1px solid var(--border); }

        .msg-content {
            max-width: 72%;
        }

        .msg-name {
            font-size: 0.7rem;
            color: var(--muted);
            margin-bottom: 2px;
        }

        .message.user .msg-name { text-align: right; }

        .msg-bubble {
            padding: 10px 14px;
            border-radius: 14px;
            line-height: 1.5;
            font-size: 0.9rem;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .message.user .msg-bubble {
            background: var(--user-bg);
            border-bottom-right-radius: 4px;
        }

        .message.ai .msg-bubble {
            background: var(--ai-bg);
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
        }

        .msg-time {
            font-size: 0.6rem;
            color: var(--muted);
            margin-top: 4px;
        }

        .message.user .msg-time { text-align: right; }

        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 4px 0;
        }

        .typing-dots {
            display: flex;
            gap: 3px;
            padding: 10px 14px;
            background: var(--ai-bg);
            border-radius: 14px;
            border: 1px solid var(--border);
        }

        .typing-dots span {
            width: 6px; height: 6px;
            background: var(--accent);
            border-radius: 50%;
            animation: typingBounce 1.2s infinite;
        }

        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typingBounce {
            0%, 60%, 100% { opacity: 0.3; }
            30% { opacity: 1; }
        }

        .chat-input-area {
            display: flex;
            gap: 8px;
            padding: 14px 20px;
            border-top: 1px solid var(--border);
        }

        .chat-input-area input {
            flex: 1;
            padding: 12px 16px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 25px;
            color: var(--text);
            font-size: 0.9rem;
            outline: none;
            transition: all 0.3s;
        }

        .chat-input-area input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 20px rgba(139,92,246,0.1);
        }

        .send-btn {
            width: 42px; height: 42px;
            background: var(--gradient);
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            flex-shrink: 0;
        }

        .send-btn:hover { transform: scale(1.05); }
        .send-btn:active { transform: scale(0.95); }
        .send-btn svg { width: 18px; height: 18px; }

        .chat-footer {
            text-align: center;
            padding: 8px 20px;
            font-size: 0.7rem;
            color: var(--muted);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
        }

        @media (max-width: 600px) {
            .chat-box { height: 350px; padding: 12px; }
            .msg-bubble { font-size: 0.85rem; }
            .msg-content { max-width: 80%; }
            .login-card { padding: 24px; width: 95vw; }
        }
    </style>
</head>
<body>

    <div class="bg-particles" id="particles"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <!-- LOGIN EKRANI -->
    <div class="login-screen active" id="loginScreen">
        <div class="login-card">
            <img src="https://github.com/darking053official/gettic/blob/main/1777062266055.png?raw=true" 
                 alt="Gettic Logo" 
                 class="login-logo"
                 onerror="this.style.display='none'" />
            
            <h1>Gettic AI</h1>
            <p>Akıllı sohbet asistanına hoş geldiniz</p>
            
            <input type="text" id="usernameInput" placeholder="Kullanıcı adınız" autocomplete="off" />
            <input type="password" id="passwordInput" placeholder="Şifreniz" autocomplete="off" />
            
            <button class="login-btn" id="loginBtn" onclick="startChat()">Sohbete Başla</button>
            <p class="login-limit" id="loginLimit">Kalan sohbet hakkı: 15</p>
        </div>
    </div>

    <!-- CHAT EKRANI -->
    <div class="app-container" id="chatScreen">
        <div class="chat-container">
            <div class="chat-header">
                <div class="chat-header-left">
                    <div class="chat-avatar">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M8 12h2l2-3 1 6 2-3h2"/></svg>
                    </div>
                    <div class="chat-info">
                        <h3>Gettic AI</h3>
                        <span id="onlineStatus">Çevrimiçi</span>
                    </div>
                </div>
                <div class="chat-actions">
                    <button onclick="newChat()" title="Yeni Sohbet">+</button>
                    <button onclick="logout()" title="Çıkış">←</button>
                </div>
            </div>

            <div class="chat-box" id="chatBox">
                <div class="empty-chat" id="emptyState">
                    <svg viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="30" cy="30" r="28" stroke="#8b5cf6" stroke-width="1" opacity="0.3"/>
                        <path d="M22 28h16M22 34h10M22 40h14" stroke="#8b5cf6" stroke-width="1.2" stroke-linecap="round" opacity="0.4"/>
                    </svg>
                    <p>Merhaba! Sana nasıl yardımcı olabilirim?</p>
                </div>
            </div>

            <div class="chat-input-area">
                <input type="text" id="userInput" placeholder="Mesaj yazın..." onkeypress="if(event.key==='Enter') sendMessage()" autocomplete="off" />
                <button class="send-btn" onclick="sendMessage()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
                </button>
            </div>

            <div class="chat-footer">
                <span id="msgCount">0 mesaj</span>
                <span id="remainingChats">15 sohbet hakkı</span>
            </div>
        </div>
    </div>

    <script>
        let username = '';
        let msgCount = 0;
        const MAX_CHATS = 15;
        let currentChatId = null;
        let isFirstMessage = true;
        let remainingChats = MAX_CHATS;

        // Particle effect
        const particlesEl = document.getElementById('particles');
        for (let i = 0; i < 30; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.left = Math.random() * 100 + '%';
            p.style.width = p.style.height = (Math.random() * 4 + 2) + 'px';
            p.style.animationDelay = Math.random() * 15 + 's';
            p.style.animationDuration = (Math.random() * 10 + 10) + 's';
            particlesEl.appendChild(p);
        }

        function timeNow() {
            return new Date().toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
        }

        function updateRemaining() {
            document.getElementById('loginLimit').textContent = `Kalan sohbet hakkı: ${remainingChats}`;
            document.getElementById('remainingChats').textContent = `${remainingChats} sohbet hakkı`;
        }

        async function checkRemaining() {
            try {
                const res = await fetch(`https://gettic-j49l.onrender.com/api/chats/${encodeURIComponent(username)}`);
                const chats = await res.json();
                if (Array.isArray(chats)) {
                    remainingChats = MAX_CHATS - chats.length;
                }
                updateRemaining();
            } catch (e) {
                remainingChats = MAX_CHATS;
                updateRemaining();
            }
        }

        async function startChat() {
            const name = document.getElementById('usernameInput').value.trim();
            const password = document.getElementById('passwordInput').value.trim();
            
            if (!name) return alert('Kullanıcı adı girin!');
            if (!password) return alert('Şifre girin!');
            if (password.length < 4) return alert('Şifre en az 4 karakter olmalı!');

            username = name;
            localStorage.setItem('ai_password', password);
            
            await checkRemaining();

            if (remainingChats <= 0) {
                alert('Günlük sohbet limitiniz doldu (15/15)! Yarın tekrar gelin.');
                return;
            }

            document.getElementById('loginScreen').classList.remove('active');
            document.getElementById('chatScreen').classList.add('active');
            document.getElementById('onlineStatus').textContent = `👋 ${username}`;
            updateRemaining();
            document.getElementById('userInput').focus();
        }

        function newChat() {
            currentChatId = null;
            isFirstMessage = true;
            msgCount = 0;
            document.getElementById('chatBox').innerHTML = `
                <div class="empty-chat" id="emptyState">
                    <svg viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="30" cy="30" r="28" stroke="#8b5cf6" stroke-width="1" opacity="0.3"/>
                        <path d="M22 28h16M22 34h10M22 40h14" stroke="#8b5cf6" stroke-width="1.2" stroke-linecap="round" opacity="0.4"/>
                    </svg>
                    <p>Yeni sohbet başladı!</p>
                </div>`;
            document.getElementById('msgCount').textContent = '0 mesaj';
            document.getElementById('userInput').focus();
        }

        function logout() {
            document.getElementById('chatScreen').classList.remove('active');
            document.getElementById('loginScreen').classList.add('active');
            document.getElementById('passwordInput').value = '';
            username = '';
            currentChatId = null;
            isFirstMessage = true;
            updateRemaining();
        }

        function addMessage(sender, text, time) {
            if (isFirstMessage) {
                const es = document.getElementById('emptyState');
                if (es) es.remove();
                isFirstMessage = false;
            }

            const chatBox = document.getElementById('chatBox');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;
            msgDiv.innerHTML = `
                <div class="msg-avatar">${sender === 'user' ? username.charAt(0).toUpperCase() : 'AI'}</div>
                <div class="msg-content">
                    <div class="msg-name">${sender === 'user' ? username : 'Gettic AI'}</div>
                    <div class="msg-bubble">${escapeHtml(text)}</div>
                    <div class="msg-time">${time || timeNow()}</div>
                </div>`;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
            msgCount++;
            document.getElementById('msgCount').textContent = msgCount + ' mesaj';
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showTyping() {
            if (isFirstMessage) {
                const es = document.getElementById('emptyState');
                if (es) es.remove();
                isFirstMessage = false;
            }
            const typingDiv = document.createElement('div');
            typingDiv.className = 'typing-indicator';
            typingDiv.id = 'typingIndicator';
            typingDiv.innerHTML = `
                <div class="msg-avatar">AI</div>
                <div class="typing-dots"><span></span><span></span><span></span></div>`;
            document.getElementById('chatBox').appendChild(typingDiv);
            document.getElementById('chatBox').scrollTop = document.getElementById('chatBox').scrollHeight;
            document.getElementById('onlineStatus').textContent = 'Yazıyor...';
        }

        function hideTyping() {
            const t = document.getElementById('typingIndicator');
            if (t) t.remove();
            document.getElementById('onlineStatus').textContent = `👋 ${username}`;
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const message = input.value.trim();
            if (!message) return;

            addMessage('user', message, timeNow());
            input.value = '';
            input.focus();
            showTyping();

            try {
                const response = await fetch('https://gettic-j49l.onrender.com/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        message: message,
                        sessionId: username,
                        chatId: currentChatId
                    })
                });

                const text = await response.text();
                hideTyping();

                let data;
                try {
                    data = JSON.parse(text);
                } catch (e) {
                    addMessage('ai', '❌ Sunucu hatası. Lütfen tekrar deneyin.', timeNow());
                    return;
                }

                if (data.reply) {
                    if (data.chatId) currentChatId = data.chatId;
                    if (data.remainingChats !== undefined) {
                        remainingChats = data.remainingChats;
                        updateRemaining();
                    }
                    addMessage('ai', data.reply, timeNow());
                } else if (data.error) {
                    addMessage('ai', '❌ ' + data.error, timeNow());
                    if (data.error.includes('limit')) {
                        remainingChats = 0;
                        updateRemaining();
                    }
                } else {
                    addMessage('ai', '❌ Bilinmeyen hata oluştu.', timeNow());
                }
            } catch (error) {
                hideTyping();
                addMessage('ai', '❌ Bağlantı hatası: ' + error.message, timeNow());
            }
        }

        // Enter ile login
        document.getElementById('usernameInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') document.getElementById('passwordInput').focus();
        });
        
        document.getElementById('passwordInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') startChat();
        });
    </script>
</body>
                    </html>
