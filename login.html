<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap - Gettic</title>
    <meta name="description" content="Gettic hesabınıza giriş yapın">
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a0a0f">
    <link rel="icon" type="image/png" href="logo.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'bg-primary': '#0a0a0f',
                        'bg-secondary': '#12121a',
                        'bg-tertiary': '#1a1a24',
                        'bg-hover': '#22222e',
                        'accent': '#7c3aed',
                        'accent-hover': '#8b5cf6',
                        'border-dark': '#1f1f2e',
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body class="bg-bg-primary text-white min-h-screen font-sans antialiased flex items-center justify-center p-4">

    <div class="w-full max-w-md">
        
        <!-- Logo -->
        <div class="text-center mb-8">
            <a href="index.html" class="inline-flex items-center gap-3">
                <img src="logo.png" alt="Gettic Logo" class="w-12 h-12 rounded-xl">
                <span class="text-3xl font-bold tracking-tight">Gettic</span>
            </a>
            <p class="text-gray-400 mt-2">Tekrar hoş geldiniz</p>
        </div>

        <!-- Login Form -->
        <div class="bg-bg-secondary rounded-2xl border border-border-dark p-8 shadow-2xl">
            
            <h1 class="text-2xl font-bold mb-6">Giriş Yap</h1>
            
            <form id="loginForm" class="space-y-5">
                
                <!-- Email -->
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-300 mb-2">
                        Email
                    </label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        required 
                        autocomplete="email"
                        placeholder="ornek@email.com"
                        class="w-full bg-bg-tertiary border border-border-dark rounded-lg px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-accent focus:border-transparent transition"
                    >
                </div>

                <!-- Şifre -->
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-300 mb-2">
                        Şifre
                    </label>
                    <div class="relative">
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            required 
                            autocomplete="current-password"
                            placeholder="••••••••"
                            class="w-full bg-bg-tertiary border border-border-dark rounded-lg px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-accent focus:border-transparent transition"
                        >
                        <button 
                            type="button" 
                            onclick="togglePassword()"
                            class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-white transition"
                        >
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Hata Mesajı -->
                <div id="errorMessage" class="hidden bg-red-500/10 border border-red-500/30 rounded-lg p-3 text-red-400 text-sm">
                </div>

                <!-- Submit Button -->
                <button 
                    type="submit" 
                    class="w-full bg-accent hover:bg-accent-hover text-white font-semibold py-3 rounded-lg transition shadow-lg shadow-accent/30"
                >
                    Giriş Yap
                </button>

            </form>

            <!-- Sosyal Medya -->
            <div class="mt-6">
                <div class="relative">
                    <div class="absolute inset-0 flex items-center">
                        <div class="w-full border-t border-border-dark"></div>
                    </div>
                    <div class="relative flex justify-center text-sm">
                        <span class="px-4 bg-bg-secondary text-gray-500">veya</span>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4 mt-6">
                    <button 
                        type="button"
                        onclick="loginWithGoogle()"
                        class="flex items-center justify-center gap-2 bg-bg-tertiary hover:bg-bg-hover border border-border-dark rounded-lg py-3 transition"
                    >
                        <svg class="w-5 h-5" viewBox="0 0 24 24">
                            <path fill="#EA4335" d="M12 5.04c1.62 0 3.06.56 4.2 1.64l3.12-3.12C17.46 1.8 14.96.84 12 .84 7.56.84 3.72 3.36 1.8 7.08l3.6 2.76C6.36 6.84 8.94 5.04 12 5.04z"/>
                            <path fill="#4285F4" d="M23.16 12.24c0-.84-.06-1.44-.18-2.16H12v4.08h6.36c-.12 1.08-.84 2.64-2.4 3.72l3.48 2.7c2.16-1.98 3.72-4.92 3.72-8.34z"/>
                            <path fill="#FBBC05" d="M5.4 14.16c-.24-.72-.36-1.44-.36-2.16s.12-1.44.36-2.16L1.8 7.08C.96 8.64.48 10.26.48 12s.48 3.36 1.32 4.92l3.6-2.76z"/>
                            <path fill="#34A853" d="M12 23.16c3.12 0 5.76-1.02 7.68-2.76l-3.48-2.7c-.96.66-2.28 1.14-4.2 1.14-3.06 0-5.64-1.8-6.6-4.44l-3.6 2.76c1.92 3.84 5.76 6.36 10.2 6.36z"/>
                        </svg>
                        Google
                    </button>

                    <button 
                        type="button"
                        onclick="loginWithGithub()"
                        class="flex items-center justify-center gap-2 bg-bg-tertiary hover:bg-bg-hover border border-border-dark rounded-lg py-3 transition"
                    >
                        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M12 0C5.37 0 0 5.37 0 12c0 5.3 3.438 9.8 8.205 11.385.6.113.82-.26.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61-.546-1.385-1.333-1.754-1.333-1.754-1.09-.745.082-.73.082-.73 1.205.085 1.84 1.237 1.84 1.237 1.07 1.834 2.807 1.304 3.492.997.108-.776.418-1.305.762-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.468-2.38 1.235-3.22-.123-.3-.535-1.52.117-3.16 0 0 1.008-.322 3.3 1.23.96-.267 1.98-.4 3-.405 1.02.005 2.04.138 3 .405 2.29-1.552 3.297-1.23 3.297-1.23.653 1.64.24 2.86.118 3.16.768.84 1.233 1.91 1.233 3.22 0 4.61-2.804 5.625-5.476 5.92.43.37.824 1.102.824 2.22 0 1.602-.015 2.894-.015 3.287 0 .32.216.694.825.576C20.565 21.795 24 17.295 24 12c0-6.63-5.37-12-12-12z"/>
                        </svg>
                        GitHub
                    </button>
                </div>
            </div>
        </div>

        <!-- Kayıt Linki -->
        <p class="text-center text-gray-400 mt-6">
            Hesabınız yok mu? 
            <a href="register.html" class="text-accent hover:text-accent-hover font-semibold transition">
                Kayıt Ol
            </a>
        </p>

        <!-- Geri Dön -->
        <p class="text-center mt-4">
            <a href="index.html" class="text-gray-500 hover:text-white transition text-sm">
                ← Ana Sayfaya Dön
            </a>
        </p>
    </div>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // Şifre göster/gizle
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
            } else {
                passwordInput.type = 'password';
            }
        }

        // Form submit
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('errorMessage');
            
            errorMessage.classList.add('hidden');
            
            if (!email) {
                errorMessage.textContent = 'Email gerekli';
                errorMessage.classList.remove('hidden');
                return;
            }
            
            if (!password) {
                errorMessage.textContent = 'Şifre gerekli';
                errorMessage.classList.remove('hidden');
                return;
            }
            
            const result = await authManager.login(email, password);
            
            if (result.success) {
                window.location.href = 'chat.html';
            } else {
                errorMessage.textContent = result.error || 'Giriş başarısız';
                errorMessage.classList.remove('hidden');
            }
        });

        // Google ile giriş
        async function loginWithGoogle() {
            try {
                const { data, error } = await supabase.auth.signInWithOAuth({
                    provider: 'google',
                    options: {
                        redirectTo: window.location.origin + '/chat.html'
                    }
                });
                
                if (error) throw error;
            } catch (error) {
                console.error('Google giriş hatası:', error);
                alert('Google girişi başarısız: ' + error.message);
            }
        }

        // GitHub ile giriş
        async function loginWithGithub() {
            try {
                const { data, error } = await supabase.auth.signInWithOAuth({
                    provider: 'github',
                    options: {
                        redirectTo: window.location.origin + '/chat.html'
                    }
                });
                
                if (error) throw error;
            } catch (error) {
                console.error('GitHub giriş hatası:', error);
                alert('GitHub girişi başarısız: ' + error.message);
            }
        }
    </script>
</body>
</html>
