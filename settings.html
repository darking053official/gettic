<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ayarlar - Gettic</title>
<meta name="description" content="Gettic ayarlar sayfası">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0a0f">
<link rel="icon" type="image/png" href="logo.png">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>tailwind.config={darkMode:'class',theme:{extend:{colors:{'bg-primary':'#0a0a0f','bg-secondary':'#12121a','bg-tertiary':'#1a1a24','bg-hover':'#22222e','accent':'#7c3aed','accent-hover':'#8b5cf6','border-dark':'#1f1f2e'}}}}</script>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-bg-primary text-white min-h-screen font-sans antialiased">

<nav class="fixed top-0 w-full z-50 glass-strong border-b border-border-dark">
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
<div class="flex items-center justify-between h-16">
<div class="flex items-center gap-3">
<a href="chat.html" class="text-gray-400 hover:text-white transition mr-2"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg></a>
<img src="logo.png" class="w-10 h-10 rounded-xl">
<span class="text-2xl font-bold gradient-text">Gettic</span>
</div>
<div class="flex gap-3">
<a href="chat.html" class="px-4 py-2 bg-bg-tertiary hover:bg-bg-hover rounded-lg transition">Sohbet</a>
<a href="profile.html" class="px-4 py-2 bg-bg-tertiary hover:bg-bg-hover rounded-lg transition">Profil</a>
</div>
</div>
</div>
</nav>

<div class="pt-24 pb-12">
<div class="max-w-3xl mx-auto px-4">
<h1 class="text-3xl font-bold mb-8 gradient-text">Ayarlar</h1>
<div id="messageBox" class="hidden mb-6 rounded-lg p-4 text-sm"></div>

<div class="card-premium p-8 mb-6">
<h2 class="text-xl font-bold mb-6">Hesap Ayarları</h2>
<div class="mb-8">
<h3 class="font-semibold mb-3">Email Değiştir</h3>
<form id="emailForm" class="space-y-4">
<div><label class="block text-sm font-medium text-gray-300 mb-2">Yeni Email</label>
<input type="email" id="newEmail" placeholder="yeni@email.com" class="input-premium"></div>
<button type="submit" class="btn btn-primary">Email Güncelle</button>
</form>
</div>
<div class="border-t border-border-dark pt-6">
<h3 class="font-semibold mb-3">Şifre Değiştir</h3>
<form id="passwordForm" class="space-y-4">
<div><label class="block text-sm font-medium text-gray-300 mb-2">Yeni Şifre</label>
<input type="password" id="newPassword" placeholder="••••••••" class="input-premium"></div>
<div><label class="block text-sm font-medium text-gray-300 mb-2">Yeni Şifre Tekrar</label>
<input type="password" id="confirmNewPassword" placeholder="••••••••" class="input-premium"></div>
<button type="submit" class="btn btn-primary">Şifre Güncelle</button>
</form>
</div>
</div>

<div class="card-premium p-8 mb-6">
<h2 class="text-xl font-bold mb-6">Bildirim Ayarları</h2>
<div class="space-y-4">
<label class="flex items-center justify-between cursor-pointer"><span>Masaüstü Bildirimleri</span><input type="checkbox" id="desktopNotifications" class="w-5 h-5 accent-accent"></label>
<label class="flex items-center justify-between cursor-pointer"><span>Sesli Bildirimler</span><input type="checkbox" id="soundNotifications" class="w-5 h-5 accent-accent"></label>
<label class="flex items-center justify-between cursor-pointer"><span>Mesaj Önizleme</span><input type="checkbox" id="messagePreview" class="w-5 h-5 accent-accent"></label>
<label class="flex items-center justify-between cursor-pointer"><span>Çevrimiçi Durumu Göster</span><input type="checkbox" id="showOnlineStatus" class="w-5 h-5 accent-accent"></label>
</div>
</div>

<div class="card-premium p-8 mb-6">
<h2 class="text-xl font-bold mb-6">Gizlilik Ayarları</h2>
<div class="space-y-4">
<label class="flex items-center justify-between cursor-pointer"><span>Son Görülmeyi Göster</span><input type="checkbox" id="showLastSeen" class="w-5 h-5 accent-accent"></label>
<label class="flex items-center justify-between cursor-pointer"><span>Okundu Bilgisi Gönder</span><input type="checkbox" id="sendReadReceipts" class="w-5 h-5 accent-accent"></label>
<label class="flex items-center justify-between cursor-pointer"><span>Profilimi Herkese Aç</span><input type="checkbox" id="publicProfile" class="w-5 h-5 accent-accent"></label>
</div>
</div>

<div class="card-premium p-8 mb-6">
<h2 class="text-xl font-bold mb-6">Görünüm</h2>
<div class="space-y-4">
<div><label class="block text-sm font-medium text-gray-300 mb-2">Tema</label>
<select id="theme" class="input-premium"><option value="dark">Koyu Tema</option><option value="darker">Daha Koyu</option><option value="amoled">AMOLED</option></select></div>
<div><label class="block text-sm font-medium text-gray-300 mb-2">Yazı Boyutu</label>
<select id="fontSize" class="input-premium"><option value="small">Küçük</option><option value="medium" selected>Orta</option><option value="large">Büyük</option></select></div>
</div>
</div>

<button onclick="saveSettings()" class="shimmer-button w-full mb-6">Ayarları Kaydet</button>

<div class="card-premium p-8">
<h2 class="text-xl font-bold mb-4">Oturum</h2>
<p class="text-gray-400 mb-4">Mevcut oturumunuzdan çıkış yapın.</p>
<button onclick="logout()" class="btn btn-danger">Çıkış Yap</button>
</div>
</div>
</div>

<script>
const SUPABASE_URL='https://ayucfychcemsvzlgsdqq.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF5dWNmeWNoY2Vtc3Z6bGdzZHFxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4MDAwODksImV4cCI6MjEwNDM3NjA4OX0.XhXZjzy58cWuAhejswK_44_Y8JJKdSzPI4QCUrS8ipg';
const supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

window.showMessage=function(msg,type){const el=document.getElementById('messageBox');el.textContent=msg;el.classList.remove('hidden','bg-red-500/10','border-red-500/30','text-red-400','bg-green-500/10','border-green-500/30','text-green-400','border');if(type==='success'){el.classList.add('bg-green-500/10','border','border-green-500/30','text-green-400')}else{el.classList.add('bg-red-500/10','border','border-red-500/30','text-red-400')}setTimeout(()=>el.classList.add('hidden'),4000)};

window.saveSettings=function(){const s={desktopNotifications:document.getElementById('desktopNotifications').checked,soundNotifications:document.getElementById('soundNotifications').checked,messagePreview:document.getElementById('messagePreview').checked,showOnlineStatus:document.getElementById('showOnlineStatus').checked,showLastSeen:document.getElementById('showLastSeen').checked,sendReadReceipts:document.getElementById('sendReadReceipts').checked,publicProfile:document.getElementById('publicProfile').checked,theme:document.getElementById('theme').value,fontSize:document.getElementById('fontSize').value};localStorage.setItem('gettic_settings',JSON.stringify(s));showMessage('Ayarlar kaydedildi','success')};

window.logout=async function(){try{const{data:{user}}=await supabase.auth.getUser();if(user){await supabase.from('profiles').update({status:'offline',last_seen:new Date().toISOString()}).eq('id',user.id)}await supabase.auth.signOut();window.location.href='auth.html'}catch(e){window.location.href='auth.html'}};

document.addEventListener('DOMContentLoaded',async()=>{const{data:{user}}=await supabase.auth.getUser();if(!user){window.location.href='auth.html';return}loadSettings()});

function loadSettings(){const s=JSON.parse(localStorage.getItem('gettic_settings')||'{}');document.getElementById('desktopNotifications').checked=s.desktopNotifications??true;document.getElementById('soundNotifications').checked=s.soundNotifications??true;document.getElementById('messagePreview').checked=s.messagePreview??true;document.getElementById('showOnlineStatus').checked=s.showOnlineStatus??true;document.getElementById('showLastSeen').checked=s.showLastSeen??true;document.getElementById('sendReadReceipts').checked=s.sendReadReceipts??true;document.getElementById('publicProfile').checked=s.publicProfile??false;document.getElementById('theme').value=s.theme||'dark';document.getElementById('fontSize').value=s.fontSize||'medium'}

document.getElementById('emailForm').addEventListener('submit',async(e)=>{e.preventDefault();const newEmail=document.getElementById('newEmail').value.trim();if(!newEmail.includes('@')){showMessage('Geçersiz email','error');return}const{error}=await supabase.auth.updateUser({email:newEmail});if(error){showMessage('Hata: '+error.message,'error');return}showMessage('Email güncellendi! Doğrulama maili gönderildi.','success');document.getElementById('newEmail').value=''});

document.getElementById('passwordForm').addEventListener('submit',async(e)=>{e.preventDefault();const newPass=document.getElementById('newPassword').value;const confirmPass=document.getElementById('confirmNewPassword').value;if(newPass!==confirmPass){showMessage('Şifreler eşleşmiyor','error');return}if(newPass.length<8){showMessage('Şifre en az 8 karakter olmalı','error');return}const{error}=await supabase.auth.updateUser({password:newPass});if(error){showMessage('Hata: '+error.message,'error');return}showMessage('Şifre güncellendi','success');document.getElementById('newPassword').value='';document.getElementById('confirmNewPassword').value=''});
</script>
</body>
</html>
