<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gettic - Sohbet</title>
<meta name="description" content="Gettic sohbet uygulaması">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0a0f">
<link rel="icon" type="image/png" href="logo.png">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>tailwind.config={darkMode:'class',theme:{extend:{colors:{'bg-primary':'#0a0a0f','bg-secondary':'#12121a','bg-tertiary':'#1a1a24','bg-hover':'#22222e','accent':'#7c3aed','accent-hover':'#8b5cf6','border-dark':'#1f1f2e'}}}}</script>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/chat.css">
</head>
<body class="bg-bg-primary text-white h-screen overflow-hidden font-sans antialiased">

<div class="flex h-full">
<div class="w-80 bg-bg-secondary border-r border-border-dark flex flex-col flex-shrink-0">
<div class="p-4 border-b border-border-dark flex items-center justify-between">
<div class="flex items-center gap-3">
<img id="userAvatar" src="logo.png" class="w-10 h-10 rounded-xl">
<div><h2 id="userName" class="font-semibold">Kullanıcı</h2><span class="text-sm text-green-400">● Çevrimiçi</span></div>
</div>
<div class="flex gap-2">
<a href="profile.html" class="text-gray-400 hover:text-white transition" title="Profil"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg></a>
<button onclick="logout()" class="text-gray-400 hover:text-white transition" title="Çıkış"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg></button>
</div>
</div>
<div class="p-4"><div class="relative">
<input type="text" id="searchUser" placeholder="Kullanıcı ara..." class="w-full bg-bg-tertiary rounded-lg px-4 py-2 pl-10 focus:outline-none focus:ring-2 focus:ring-accent transition">
<svg class="w-5 h-5 text-gray-500 absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
</div></div>
<div id="chatList" class="flex-1 overflow-y-auto"><div class="text-center text-gray-500 py-8"><p>Sohbet yok</p></div></div>
<div class="p-4 border-t border-border-dark"><button onclick="showNewChatModal()" class="shimmer-button w-full text-sm">+ Yeni Sohbet</button></div>
</div>

<div class="flex-1 flex flex-col">
<div class="p-4 border-b border-border-dark flex items-center justify-between bg-bg-secondary">
<div class="flex items-center gap-3">
<img id="chatAvatar" src="logo.png" class="w-10 h-10 rounded-xl">
<div><h2 id="chatName" class="font-semibold">Sohbet Seçin</h2><span id="chatStatus" class="text-sm text-gray-400"></span></div>
</div>
</div>
<div id="messagesContainer" class="flex-1 overflow-y-auto p-4 space-y-4"><div class="text-center text-gray-500 py-20"><p class="text-lg">Sohbet seçin veya yeni başlatın</p></div></div>
<div class="p-4 border-t border-border-dark bg-bg-secondary"><div class="flex items-center gap-3">
<input type="text" id="messageInput" placeholder="Mesaj yazın..." class="flex-1 bg-bg-tertiary rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-accent transition">
<button onclick="sendMessage()" class="bg-accent hover:bg-accent-hover rounded-lg p-2 transition glow-effect"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg></button>
</div></div>
</div>
</div>

<div id="newChatModal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
<div class="bg-bg-secondary rounded-2xl border border-border-dark p-6 w-full max-w-md shadow-2xl">
<h3 class="text-xl font-bold mb-4 gradient-text">Yeni Sohbet Başlat</h3>
<div class="mb-4"><input type="text" id="newChatSearch" placeholder="Kullanıcı adı ara..." class="input-premium"></div>
<div id="userSearchResults" class="max-h-60 overflow-y-auto space-y-2"></div>
<div class="flex justify-end mt-4"><button onclick="hideNewChatModal()" class="btn btn-secondary">İptal</button></div>
</div>
</div>

<script>
const SUPABASE_URL='https://ayucfychcemsvzlgsdqq.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF5dWNmeWNoY2Vtc3Z6bGdzZHFxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4MDAwODksImV4cCI6MjEwNDM3NjA4OX0.XhXZjzy58cWuAhejswK_44_Y8JJKdSzPI4QCUrS8ipg';
const supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
let currentUser=null,currentConversation=null,realtimeChannel=null;

window.logout=async function(){try{if(currentUser)await supabase.from('profiles').update({status:'offline',last_seen:new Date().toISOString()}).eq('id',currentUser.id);await supabase.auth.signOut();window.location.href='auth.html'}catch(e){window.location.href='auth.html'}};
window.showNewChatModal=function(){document.getElementById('newChatModal').classList.remove('hidden');document.getElementById('newChatSearch').focus()};
window.hideNewChatModal=function(){document.getElementById('newChatModal').classList.add('hidden');document.getElementById('newChatSearch').value='';document.getElementById('userSearchResults').innerHTML=''};
window.sendMessage=async function(){const input=document.getElementById('messageInput');const content=input.value.trim();if(!content||!currentConversation||!currentUser)return;input.value='';const{error}=await supabase.from('messages').insert([{conversation_id:currentConversation,sender_id:currentUser.id,content:content,type:'text'}]);if(error){alert('Mesaj gönderilemedi: '+error.message);input.value=content}};

document.addEventListener('DOMContentLoaded',async()=>{await checkAuth();if(!currentUser)return;await loadUserProfile();await loadConversations();setupRealtime();setupEventListeners()});

async function checkAuth(){const{data:{user}}=await supabase.auth.getUser();if(!user){window.location.href='auth.html';return}currentUser=user}

async function loadUserProfile(){const{data:profile}=await supabase.from('profiles').select('*').eq('id',currentUser.id).single();if(profile){document.getElementById('userName').textContent=profile.username||'Kullanıcı';document.getElementById('userAvatar').src=profile.avatar_url||'logo.png'}await supabase.from('profiles').update({status:'online',last_seen:new Date().toISOString()}).eq('id',currentUser.id)}

async function loadConversations(){const{data:conversations,error}=await supabase.from('conversation_members').select(`conversation_id,conversations(id,type,name,updated_at,conversation_members(user_id,profiles(id,username,avatar_url,status)))`).eq('user_id',currentUser.id).order('updated_at',{ascending:false});if(error){console.error(error);return}displayConversations(conversations)}

function displayConversations(conversations){const chatList=document.getElementById('chatList');chatList.innerHTML='';if(!conversations||conversations.length===0){chatList.innerHTML='<div class="text-center text-gray-500 py-8"><p>Sohbet yok</p></div>';return}conversations.forEach(({conversations:conv})=>{if(!conv)return;const otherMember=conv.conversation_members.find(m=>m.user_id!==currentUser.id);if(!otherMember||!otherMember.profiles)return;const div=document.createElement('div');div.className='p-3 hover:bg-bg-hover cursor-pointer transition flex items-center gap-3 hover-lift';div.onclick=()=>openConversation(conv.id,otherMember);div.innerHTML=`<div class="relative"><img src="${otherMember.profiles.avatar_url||'logo.png'}" class="w-12 h-12 rounded-xl">${otherMember.profiles.status==='online'?'<span class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 rounded-full border-2 border-bg-secondary"></span>':''}</div><div class="flex-1"><h3 class="font-semibold">${otherMember.profiles.username||'Kullanıcı'}</h3><p class="text-sm text-gray-400">${otherMember.profiles.status==='online'?'Çevrimiçi':'Çevrimdışı'}</p></div>`;chatList.appendChild(div)})}

async function openConversation(id,member){currentConversation=id;document.getElementById('chatName').textContent=member.profiles.username||'Kullanıcı';document.getElementById('chatAvatar').src=member.profiles.avatar_url||'logo.png';document.getElementById('chatStatus').textContent=member.profiles.status==='online'?'Çevrimiçi':'Çevrimdışı';await loadMessages(id)}

async function loadMessages(id){const{data:messages}=await supabase.from('messages').select('*').eq('conversation_id',id).order('created_at',{ascending:true});displayMessages(messages||[])}

function displayMessages(messages){const c=document.getElementById('messagesContainer');c.innerHTML='';messages.forEach(m=>appendMessage(m));c.scrollTop=c.scrollHeight}

function appendMessage(message){if(!message||!message.content)return;const c=document.getElementById('messagesContainer');const isSent=message.sender_id===currentUser.id;const div=document.createElement('div');div.className=`flex ${isSent?'justify-end':'justify-start'}`;const time=new Date(message.created_at).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});div.innerHTML=`<div class="message-bubble-premium ${isSent?'sent':'received'}"><p class="break-words">${message.content}</p><p class="text-xs ${isSent?'text-gray-300':'text-gray-500'} text-right mt-1">${time}</p></div>`;c.appendChild(div);c.scrollTop=c.scrollHeight}

async function searchUsers(term){if(term.length<2){document.getElementById('userSearchResults').innerHTML='<p class="text-gray-500 text-center py-4">En az 2 karakter yazın</p>';return}const{data:users}=await supabase.from('profiles').select('*').ilike('username',`%${term}%`).neq('id',currentUser.id).limit(10);displaySearchResults(users||[])}

function displaySearchResults(users){const c=document.getElementById('userSearchResults');c.innerHTML='';if(!users||users.length===0){c.innerHTML='<p class="text-gray-500 text-center py-4">Kullanıcı bulunamadı</p>';return}users.forEach(user=>{const div=document.createElement('div');div.className='flex items-center gap-3 p-2 hover:bg-bg-hover rounded-lg cursor-pointer transition';div.onclick=()=>startNewConversation(user);div.innerHTML=`<img src="${user.avatar_url||'logo.png'}" class="w-10 h-10 rounded-xl"><div><p class="font-semibold">${user.username}</p><p class="text-sm text-gray-400">${user.status==='online'?'Çevrimiçi':'Çevrimdışı'}</p></div>`;c.appendChild(div)})}

async function startNewConversation(user){const{data:existingConvs}=await supabase.from('conversation_members').select('conversation_id').eq('user_id',currentUser.id);if(existingConvs){for(const conv of existingConvs){const{data:members}=await supabase.from('conversation_members').select('user_id').eq('conversation_id',conv.conversation_id);const memberIds=(members||[]).map(m=>m.user_id);if(memberIds.includes(user.id)&&memberIds.length===2){hideNewChatModal();await loadConversations();openConversation(conv.conversation_id,{profiles:user});return}}}const{data:newConv,error}=await supabase.from('conversations').insert([{type:'direct',created_by:currentUser.id}]).select().single();if(error){alert('Sohbet oluşturulamadı: '+error.message);return}const{error:memberError}=await supabase.from('conversation_members').insert([{conversation_id:newConv.id,user_id:currentUser.id},{conversation_id:newConv.id,user_id:user.id}]);if(memberError){alert('Üyeler eklenemedi: '+memberError.message);return}hideNewChatModal();await loadConversations();openConversation(newConv.id,{profiles:user})}

function setupRealtime(){realtimeChannel=supabase.channel('messages-realtime').on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},payload=>{if(payload.new.conversation_id===currentConversation)appendMessage(payload.new)}).subscribe()}

function setupEventListeners(){const s=document.getElementById('newChatSearch');if(s)s.addEventListener('input',e=>searchUsers(e.target.value.trim()));const su=document.getElementById('searchUser');if(su)su.addEventListener('input',e=>{const term=e.target.value.trim().toLowerCase();document.querySelectorAll('#chatList > div').forEach(item=>{const name=item.querySelector('h3')?.textContent.toLowerCase()||'';item.style.display=name.includes(term)?'':'none'})});const m=document.getElementById('messageInput');if(m)m.addEventListener('keypress',e=>{if(e.key==='Enter')window.sendMessage()});const modal=document.getElementById('newChatModal');if(modal)modal.addEventListener('click',e=>{if(e.target===modal)window.hideNewChatModal()})}
</script>
</body>
</html>
