function esc(s){if(!s)return'';return String(s).replace(/[&<>]/g,m=>m==='&'?'&amp;':m==='<'?'&lt;':'&gt;');}
function toast(msg,err=false){
  const t=document.createElement('div');
  t.style.cssText=`position:fixed;bottom:60px;right:16px;background:var(--bg2);padding:10px 16px;border-radius:10px;color:${err?'#ef4444':'#22c55e'};z-index:2000;border:1px solid var(--b2);font-size:13px;font-weight:600;animation:fadeIn .2s ease;`;
  t.textContent=msg;document.body.appendChild(t);
  setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .3s';setTimeout(()=>t.remove(),300);},2500);
}
function openModal(id){const el=document.getElementById(id);if(el)el.classList.add('show');}
function closeModal(id){const el=document.getElementById(id);if(el)el.classList.remove('show');}
function genId(){return Date.now().toString(36)+Math.random().toString(36).substr(2,6);}
function getUserRoles(uid){return userRoles[uid]||['r5'];}
function getHighestRole(uid){const rids=getUserRoles(uid);let highest=roles[roles.length-1];rids.forEach(rid=>{const r=roles.find(x=>x.id===rid);if(r&&r.position<highest.position)highest=r;});return highest;}
function hasPermission(uid,perm){const rids=getUserRoles(uid);for(const rid of rids){const r=roles.find(x=>x.id===rid);if(r&&(r.permissions.all||r.permissions[perm]))return true;}return false;}

function connectSocket(){
  if(!currentToken)return;if(socket){socket.disconnect();socket=null;}
  socket=io(API_URL,{auth:{token:currentToken},transports:['websocket','polling']});
  socket.on('connect',()=>{socket.emit('join_channel',currentChannel.id);});
  socket.on('new_message',msg=>{if(msg.channelId===currentChannel.id)addMessageToChat(msg);});
  socket.on('user_typing',({username,channelId})=>{if(channelId===currentChannel.id&&username!==currentUser?.username)showTyping(username);});
}

async function joinVoiceChannel(chId){
  const ch=channels.find(c=>c.id===chId);if(!ch)return;toast(`🎙️ ${ch.name} kanalına bağlanılıyor...`);
  try{localStream=await navigator.mediaDevices.getUserMedia({audio:true});document.getElementById('voiceBar').style.display='flex';document.getElementById('voiceChannelName').textContent=ch.name;isInVoice=true;setupVoice(chId);toast(`✅ ${ch.name} kanalına katıldınız`);}catch(e){toast('Mikrofon erişimi reddedildi',true);}
}
function setupVoice(chId){
  socket.emit('voice_join',{channel:chId});peerConnection=new RTCPeerConnection(rtcConfig);
  localStream.getTracks().forEach(t=>peerConnection.addTrack(t,localStream));
  peerConnection.onicecandidate=e=>{if(e.candidate)socket.emit('voice_candidate',{candidate:e.candidate,channel:chId});};
  socket.on('voice_answer',async d=>{if(d.sdp)await peerConnection.setRemoteDescription(new RTCSessionDescription(d.sdp));});
  socket.on('voice_candidate',d=>{if(d.candidate)peerConnection.addIceCandidate(new RTCIceCandidate(d.candidate));});
  peerConnection.createOffer().then(o=>{peerConnection.setLocalDescription(o);socket.emit('voice_offer',{sdp:o,channel:chId});});
  document.getElementById('muteBtn').onclick=()=>{if(!localStream)return;isMuted=!isMuted;localStream.getAudioTracks().forEach(t=>t.enabled=!isMuted);const btn=document.getElementById('muteBtn');btn.innerHTML=isMuted?Icons.micOff:Icons.mic;btn.classList.toggle('muted',isMuted);};
  document.getElementById('leaveVoiceBtn').onclick=()=>leaveVoiceChannel();
}
function leaveVoiceChannel(){
  if(localStream){localStream.getTracks().forEach(t=>t.stop());localStream=null;}if(peerConnection){peerConnection.close();peerConnection=null;}
  if(socket)socket.emit('voice_leave',{channel:currentChannel.id});document.getElementById('voiceBar').style.display='none';isInVoice=false;isMuted=false;
  const muteBtn=document.getElementById('muteBtn');if(muteBtn){muteBtn.innerHTML=Icons.mic;muteBtn.classList.remove('muted');}toast('Sesli kanaldan ayrıldınız');
}

function deleteRole(){const id=document.getElementById('editRoleId').value;roles=roles.filter(r=>r.id!==id);closeModal('editRoleModal');renderRoles();toast('Rol silindi');}
function addRole(){
  const name=document.getElementById('newRoleName')?.value.trim();const color=document.getElementById('newRoleColor')?.value||'#9ca3af';
  if(!name)return toast('Rol adı gerekli',true);
  roles.push({id:genId(),name,color,permissions:{sendMsg:true},position:roles.length});closeModal('addRoleModal');renderRoles();toast('Rol eklendi');
}

function loadDMList(){
  const container=document.getElementById('dmList');if(!container)return;
  if(!dmFriends.length){container.innerHTML='<div style="text-align:center;padding:20px;color:var(--t3);">Henüz DM yok</div>';return;}
  container.innerHTML=dmFriends.map(f=>`<div class="dm-item" onclick="openDM('${f.id}','${esc(f.username)}')"><div class="dm-avatar">${f.username.charAt(0).toUpperCase()}</div><div class="dm-info"><div class="dm-name">${esc(f.username)}</div><div class="dm-last-msg">${esc(f.last||'')}</div></div></div>`).join('');
}
function openDMNew(){closeModal('dmModal');openModal('dmNewModal');}
function openGroupDM(){closeModal('dmModal');openModal('groupDMModal');}
function startDM(){const u=document.getElementById('dmNewUsername')?.value.trim();if(!u)return toast('Kullanıcı adı gerekli',true);dmFriends.push({id:genId(),username:u,last:'',time:'Şimdi'});loadDMList();closeModal('dmNewModal');openModal('dmModal');toast(`${u} ile DM başladı`);}
function startGroupDM(){const users=document.getElementById('groupDmUsers')?.value.split(',').map(s=>s.trim()).filter(Boolean);if(!users.length)return toast('En az bir kullanıcı gerekli',true);const name=users.join(', ');dmFriends.push({id:genId(),username:name,last:'Grup DM',time:'Şimdi',isGroup:true});loadDMList();closeModal('groupDMModal');openModal('dmModal');toast('Grup DM oluşturuldu');}
window.openDM=(id,uname)=>{document.getElementById('dmChatArea').style.display='block';document.getElementById('dmMessages').innerHTML='';document.getElementById('sendDmBtn').onclick=()=>{const inp=document.getElementById('dmInput');if(!inp||!inp.value.trim())return;const div=document.getElementById('dmMessages');div.innerHTML+=`<div style="padding:4px 0;"><b>${esc(currentUser?.username||'Sen')}:</b> ${esc(inp.value)}</div>`;div.scrollTop=div.scrollHeight;inp.value='';};};
function addFriend(){const u=document.getElementById('friendUsername')?.value.trim();if(!u)return toast('Kullanıcı adı gerekli',true);dmFriends.push({id:genId(),username:u,last:'Arkadaş eklendi',time:'Şimdi'});closeModal('addFriendModal');toast(`${u} eklendi`);}
function loadDiscover(){document.getElementById('discoverList').innerHTML=['MLBB Topluluğu','Müzik Odası','Teknoloji'].map(n=>`<div class="dm-item" onclick="joinDiscover('${n}')"><div class="dm-avatar">${n.charAt(0)}</div><div class="dm-info"><div class="dm-name">${n}</div></div></div>`).join('');}
window.joinDiscover=(n)=>{toast(`${n} sunucusuna katılıyorsunuz...`);closeModal('discoverModal');};

function performSearch(){const q=document.getElementById('searchInput')?.value.toLowerCase();const results=document.getElementById('searchResults');if(!results)return;if(!q){results.innerHTML='';return;}
  const found=searchIndex.filter(m=>m.content.toLowerCase().includes(q)||m.senderName.toLowerCase().includes(q)).slice(0,10);
  results.innerHTML=found.length?found.map(m=>`<div class="dm-item" onclick="switchChannel('${m.channelId}');closeModal('searchModal');"><div class="dm-avatar">${m.senderName.charAt(0).toUpperCase()}</div><div class="dm-info"><div class="dm-name">${esc(m.senderName)}</div><div class="dm-last-msg">${esc(m.content.substring(0,60))}</div></div></div>`).join(''):'<div style="text-align:center;padding:20px;color:var(--t3);">Sonuç bulunamadı</div>';
}
function renderNotifications(){document.getElementById('notifList').innerHTML=notifications.length?notifications.map(n=>`<div style="padding:8px;border-bottom:1px solid var(--b);font-size:12px;">${n.text}</div>`).join(''):'<div style="text-align:center;padding:20px;color:var(--t3);">Bildirim yok</div>';}
function createPoll(){
  const q=document.getElementById('pollQuestion')?.value;const opts=[document.getElementById('pollOption1')?.value,document.getElementById('pollOption2')?.value,document.getElementById('pollOption3')?.value,document.getElementById('pollOption3')?.value].filter(Boolean);
  if(!q||opts.length<2)return toast('Soru ve en az 2 seçenek gerekli',true);
  const pollText=`📊 **Anket:** ${q}\n`+opts.map((o,i)=>`${i+1}️⃣ ${o}`).join('\n');
  const inp=document.getElementById('messageInput');if(inp)inp.value=pollText;closeModal('pollModal');toast('Anket hazır, gönder tuşuna basın');
}
function exportChat(format){
  const msgs=Array.from(document.querySelectorAll('.message')).map(m=>({sender:m.querySelector('.message-header')?.textContent?.split(' ')[0]||'',content:m.querySelector('.message-text')?.textContent||'',time:m.querySelector('span')?.textContent||''}));
  let data=format==='json'?JSON.stringify(msgs,null,2):'sender,content,time\n'+msgs.map(m=>`"${m.sender}","${m.content}","${m.time}"`).join('\n');
  const blob=new Blob([data],{type:format==='json'?'application/json':'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`chat-export.${format}`;a.click();closeModal('exportModal');toast('Dışa aktarıldı');
}
function exportBackup(){
  const backup={serverSettings,channels,categories,roles,pinnedMessages,userRoles};
  const blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='gettic-backup.json';a.click();toast('Yedek indirildi');
}
function importBackup(){
  const file=document.getElementById('backupFile')?.files[0];if(!file)return;
  const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(reader.result);Object.assign(serverSettings,data.serverSettings||{});channels=data.channels||channels;categories=data.categories||categories;roles=data.roles||roles;Object.assign(pinnedMessages,data.pinnedMessages||{});Object.assign(userRoles,data.userRoles||{});renderChannels();closeModal('backupModal');toast('Yedek geri yüklendi');}catch(e){toast('Geçersiz yedek dosyası',true);}};reader.readAsText(file);
}
function applyCustomTheme(){const p=document.getElementById('customPrimary')?.value||'#c084fc';const s=document.getElementById('customSecondary')?.value||'#e879f9';setTheme(p,s);closeModal('customThemeModal');}

function setTheme(p,s){document.documentElement.style.setProperty('--ac',p);document.documentElement.style.setProperty('--ac2',s);document.documentElement.style.setProperty('--acg',p+'4D');document.documentElement.style.setProperty('--acd',p+'1A');localStorage.setItem('gt_theme_primary',p);localStorage.setItem('gt_theme_secondary',s);toast('Tema değiştirildi');}
function loadTheme(){const p=localStorage.getItem('gt_theme_primary'),s=localStorage.getItem('gt_theme_secondary');if(p&&s){document.documentElement.style.setProperty('--ac',p);document.documentElement.style.setProperty('--ac2',s);document.documentElement.style.setProperty('--acg',p+'4D');document.documentElement.style.setProperty('--acd',p+'1A');}}
function initEmojiPicker(){
  const picker=document.getElementById('emojiPicker');if(!picker)return;
  const emojis=['😀','😂','❤️','🔥','🎉','👍','👎','🙏','🎮','💻','✨','✅','❌','🎵','😮','😢','😡','🥳','🤖','👑','🛡️','🔨','💎','📌','🔗','📊','📁'];
  picker.innerHTML=emojis.map(e=>`<div class="emoji-option">${e}</div>`).join('');
  picker.querySelectorAll('.emoji-option').forEach(o=>o.addEventListener('click',()=>{const inp=document.getElementById('messageInput');if(inp){inp.value+=o.textContent;inp.focus();}picker.classList.remove('show');}));
  document.addEventListener('click',e=>{if(!picker.contains(e.target)&&e.target.id!=='emojiBtn')picker.classList.remove('show');});
}
function copyId(id){const el=document.getElementById(id);if(el){navigator.clipboard.writeText(el.textContent);toast('Kopyalandı!');}}
function logout(){localStorage.removeItem('gt_token');localStorage.removeItem('gt_user');currentUser=null;currentToken=null;if(socket){socket.disconnect();socket=null;}if(localStream){localStream.getTracks().forEach(t=>t.stop());localStream=null;}if(peerConnection){peerConnection.close();peerConnection=null;}renderApp();toast('Çıkış yapıldı');}

function init(){
  setTimeout(()=>document.getElementById('loadingScreen')?.classList.add('hide'),600);
  const stored=localStorage.getItem('gt_user');if(stored&&currentToken){try{currentUser=JSON.parse(stored);userRoles[currentUser._id]=['r5'];}catch(e){currentUser=null;currentToken=null;}}
  renderApp();
  window.setTheme=setTheme;window.openModal=openModal;window.closeModal=closeModal;
  window.createServer=createServer;window.createChannel=createChannel;window.addCategoryConfirm=addCategoryConfirm;
  window.saveServerSettings=saveServerSettings;window.saveProfile=saveProfile;window.addFriend=addFriend;
  window.openDMNew=openDMNew;window.startDM=startDM;window.openGroupDM=openGroupDM;window.startGroupDM=startGroupDM;
  window.joinVoiceChannel=joinVoiceChannel;window.openDM=window.openDM||(()=>{});window.joinDiscover=window.joinDiscover||(()=>{});
  window.addReaction=addReaction;window.deleteMessage=deleteMessage;window.editMessage=editMessage;window.pinMessage=pinMessage;
  window.openEditRole=openEditRole;window.deleteRole=deleteRole;window.addRole=addRole;window.saveRoleEdit=saveRoleEdit;
  window.deleteServer=deleteServer;window.deleteChannel=deleteChannel;window.saveChannelEdit=saveChannelEdit;
  window.openEditChannel=openEditChannel;window.deleteChannelById=deleteChannelById;
  window.switchChannel=switchChannel;window.copyId=copyId;
  window.exportChat=exportChat;window.exportBackup=exportBackup;window.importBackup=importBackup;
  window.createPoll=createPoll;window.applyCustomTheme=applyCustomTheme;
  if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js').catch(()=>{});}
}
init();
})();
</script>
</body>
