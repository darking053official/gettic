<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover, maximum-scale=1.0">
  <title>Gettic — Sohbet Platformu</title>
  <link rel="icon" href="https://raw.githubusercontent.com/darking053official/gettic/main/1777062266055.png">
  <meta name="theme-color" content="#b57bee">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    /* ===== CSS VARIABLES ===== */
    :root {
      --bg:#0a0a14;--bg1:#0c0c1a;--bg2:#111122;--bg3:#181830;
      --b:rgba(255,255,255,.04);--b2:rgba(255,255,255,.07);--b3:rgba(255,255,255,.10);
      --ac:#b57bee;--ac2:#c99df2;--ac3:#dbbff9;--acg:rgba(181,123,238,.25);--acd:rgba(181,123,238,.10);--acdh:rgba(181,123,238,.18);
      --t1:#e8e8f8;--t2:#9898b8;--t3:#585878;
      --gr:#22c55e;--re:#ef4444;--ye:#f59e0b;--bl:#3b82f6;
      --radius:10px;--tr:.15s cubic-bezier(.3,.8,.4,1);
      --font:'Segoe UI',system-ui,-apple-system,sans-serif;--mono:'JetBrains Mono','Fira Code',monospace;
      --sidebar-w:240px;--userpanel-w:250px;--serverrail-w:62px;
      --safe-top:env(safe-area-inset-top,0px);
      --safe-bottom:env(safe-area-inset-bottom,0px);
      --safe-left:env(safe-area-inset-left,0px);
      --safe-right:env(safe-area-inset-right,0px);
    }
    /* ===== LIGHT MODE ===== */
    body.light {
      --bg:#f0f0fa;--bg1:#e8e8f5;--bg2:#ddddf0;--bg3:#d0d0e8;
      --b:rgba(0,0,0,.06);--b2:rgba(0,0,0,.10);--b3:rgba(0,0,0,.14);
      --t1:#111128;--t2:#444466;--t3:#8888aa;
      --acg:rgba(181,123,238,.20);--acd:rgba(181,123,238,.12);
    }
    /* ===== RESET ===== */
    *{margin:0;padding:0;box-sizing:border-box;}
    body{
      font-family:var(--font);background:var(--bg);color:var(--t1);
      height:100vh;height:100dvh;overflow:hidden;user-select:none;
      -webkit-tap-highlight-color:transparent;touch-action:manipulation;
      padding-top:var(--safe-top);padding-bottom:var(--safe-bottom);
      padding-left:var(--safe-left);padding-right:var(--safe-right);
    }
    canvas#bg-canvas{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;}
    /* ===== SCROLLBAR ===== */
    ::-webkit-scrollbar{width:3px;height:3px;}
    ::-webkit-scrollbar-track{background:transparent;}
    ::-webkit-scrollbar-thumb{background:var(--ac);border-radius:3px;}
    scrollbar-width:thin;scrollbar-color:var(--ac) transparent;
    /* ===== FOCUS ===== */
    :focus-visible{outline:2px solid var(--ac);outline-offset:2px;border-radius:4px;}
    /* ===== LAYOUT ===== */
    .app{display:flex;height:100vh;height:100dvh;position:relative;z-index:1;}
    /* ===== LOADING ===== */
    .loading-screen{
      position:fixed;inset:0;background:var(--bg);z-index:99999;
      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
      transition:opacity .5s ease,visibility .5s ease;
    }
    .loading-screen.hide{opacity:0;visibility:hidden;pointer-events:none;}
    .loader{
      width:36px;height:36px;border-radius:50%;
      border:3px solid var(--b2);border-top-color:var(--ac);
      animation:spin .8s linear infinite;
    }
    @keyframes spin{to{transform:rotate(360deg)}}
    .loading-logo{
      font-size:22px;font-weight:800;letter-spacing:.08em;
      background:linear-gradient(135deg,var(--ac),var(--ac3));
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
    }
    /* ===== SERVER RAIL ===== */
    .server-rail{
      width:var(--serverrail-w);background:var(--bg);display:flex;flex-direction:column;
      align-items:center;padding:10px 0;gap:8px;overflow-y:auto;overflow-x:hidden;
      border-right:1px solid var(--b);flex-shrink:0;z-index:10;
    }
    .server-icon{
      width:44px;height:44px;background:var(--bg2);border-radius:50%;
      display:flex;align-items:center;justify-content:center;cursor:pointer;
      transition:border-radius .2s ease,background .15s,transform .15s,box-shadow .15s;
      position:relative;flex-shrink:0;
    }
    .server-icon svg{width:20px;height:20px;stroke:var(--t2);stroke-width:1.5;fill:none;transition:stroke .15s;}
    .server-icon:hover,.server-icon.active{
      border-radius:14px;background:var(--ac);
      transform:translateY(-2px);box-shadow:0 4px 20px var(--acg);
    }
    .server-icon:hover svg,.server-icon.active svg{stroke:#fff;}
    .server-icon.active::after{
      content:'';position:absolute;right:-7px;top:50%;transform:translateY(-50%);
      width:4px;height:18px;background:var(--ac);border-radius:2px;
    }
    .rail-divider{width:30px;height:1px;background:var(--b2);margin:2px 0;}
    /* ===== CHANNEL SIDEBAR ===== */
    .channel-sidebar{
      width:var(--sidebar-w);background:var(--bg1);display:flex;flex-direction:column;
      border-right:1px solid var(--b);flex-shrink:0;z-index:10;overflow:hidden;
      transition:transform .25s ease,left .25s ease;
    }
    .channel-header{
      height:46px;padding:0 12px;display:flex;align-items:center;gap:8px;
      border-bottom:1px solid var(--b);font-weight:800;background:var(--bg);
      font-size:13px;flex-shrink:0;letter-spacing:.01em;cursor:pointer;
    }
    .channel-header:hover{background:var(--bg2);}
    .channel-header svg{width:16px;height:16px;stroke:var(--ac);fill:none;flex-shrink:0;}
    .channel-categories-wrap{flex:1;overflow-y:auto;padding-bottom:8px;}
    .channel-category{
      padding:14px 12px 4px;font-size:10px;font-weight:700;text-transform:uppercase;
      color:var(--t3);letter-spacing:.8px;display:flex;justify-content:space-between;align-items:center;
    }
    .channel-category button{
      background:none;border:none;color:var(--t3);cursor:pointer;
      font-size:16px;padding:0 3px;border-radius:3px;line-height:1;transition:color .12s;
    }
    .channel-category button:hover{color:var(--ac);}
    .channel-item{
      padding:7px 12px;margin:1px 6px;border-radius:7px;display:flex;align-items:center;
      gap:7px;cursor:pointer;font-size:12px;color:var(--t2);
      transition:background .10s,color .10s;position:relative;
    }
    .channel-item svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.5;flex-shrink:0;}
    .channel-item:hover,.channel-item:focus-visible{background:var(--bg2);color:var(--t1);outline:none;}
    .channel-item.active{background:var(--acd);color:var(--ac3);font-weight:600;}
    .channel-item .ch-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .channel-item .ch-actions{display:none;gap:2px;align-items:center;}
    .channel-item:hover .ch-actions,.channel-item:focus-within .ch-actions{display:flex;}
    .ch-actions button{
      background:none;border:none;color:var(--t3);cursor:pointer;padding:2px;
      border-radius:3px;display:flex;align-items:center;justify-content:center;transition:color .12s;
    }
    .ch-actions button:hover{color:var(--re);}
    .channel-item .unread-badge{
      background:var(--re);color:#fff;font-size:9px;padding:1px 5px;
      border-radius:8px;font-weight:700;min-width:18px;text-align:center;flex-shrink:0;
    }
    .add-category-btn{
      padding:8px 18px;font-size:11px;color:var(--t3);cursor:pointer;background:none;
      border:none;text-align:left;width:100%;margin-top:2px;font-weight:600;transition:color .12s;
    }
    .add-category-btn:hover{color:var(--ac);}
    /* ===== CHAT AREA ===== */
    .chat-area{flex:1;display:flex;flex-direction:column;background:var(--bg1);min-width:0;}
    .chat-header{
      height:46px;padding:0 16px;display:flex;align-items:center;gap:8px;
      border-bottom:1px solid var(--b);background:var(--bg);flex-shrink:0;
    }
    .chat-header svg{width:16px;height:16px;stroke:var(--ac);fill:none;flex-shrink:0;}
    .channel-name{font-weight:700;font-size:14px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .channel-topic{font-size:10px;color:var(--t3);flex-shrink:0;}
    .header-actions{display:flex;gap:5px;margin-left:auto;}
    .icon-btn{
      background:var(--bg2);border:none;width:30px;height:30px;border-radius:7px;cursor:pointer;
      display:flex;align-items:center;justify-content:center;
      transition:background var(--tr),transform var(--tr);flex-shrink:0;
    }
    .icon-btn svg{width:14px;height:14px;stroke:var(--t2);fill:none;stroke-width:1.5;transition:stroke .12s;}
    .icon-btn:hover,.icon-btn:focus-visible{background:var(--ac);transform:scale(1.05);}
    .icon-btn:hover svg,.icon-btn:focus-visible svg{stroke:#fff;}
    .icon-btn.active{background:var(--ac);}
    .icon-btn.active svg{stroke:#fff;}
    /* ===== CONNECTION BAR ===== */
    #connectionBar{
      height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;
      gap:8px;font-size:11px;font-weight:600;color:#fff;
      background:var(--re);transition:height .25s ease;flex-shrink:0;
    }
    #connectionBar.offline{height:30px;}
    #connectionBar button{
      background:rgba(255,255,255,.2);border:none;padding:2px 10px;
      border-radius:4px;color:#fff;cursor:pointer;font-size:11px;font-weight:600;
    }
    #connectionBar button:hover{background:rgba(255,255,255,.35);}
    #connectionBar svg{width:14px;height:14px;stroke:#fff;fill:none;stroke-width:1.5;}
    /* ===== MESSAGES ===== */
    .messages-container{flex:1;overflow-y:auto;overflow-x:hidden;scroll-behavior:smooth;contain:layout style;}
    .messages-inner{display:flex;flex-direction:column;gap:1px;padding:12px 14px 20px;}
    .empty-channel{
      text-align:center;padding:50px 20px;color:var(--t3);
      animation:fadeUp .35s ease;margin:auto;
    }
    .empty-channel svg{width:52px;height:52px;stroke:var(--t3);margin-bottom:14px;opacity:.3;fill:none;}
    .empty-channel h4{font-size:16px;margin-bottom:6px;color:var(--t2);font-weight:700;}
    .empty-channel p{font-size:12px;}
    @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
    /* ===== MESSAGE ITEM ===== */
    .message{
      display:flex;align-items:flex-start;gap:9px;padding:5px 7px;border-radius:7px;
      transition:background .08s;position:relative;word-break:break-word;
      overflow-wrap:break-word;animation:fadeUp .15s ease;
    }
    .message:hover,.message:focus-within{background:var(--bg2);}
    .message:hover .msg-actions,.message:focus-within .msg-actions{display:flex;}
    .message.pinned-msg{background:rgba(245,158,11,.07);border-left:3px solid var(--ye);padding-left:10px;}
    .message-avatar{
      width:32px;height:32px;
      background:linear-gradient(135deg,var(--ac),var(--ac2));
      border-radius:50%;display:flex;align-items:center;justify-content:center;
      font-weight:700;flex-shrink:0;font-size:13px;color:#fff;cursor:pointer;
      transition:transform .12s,box-shadow .12s;
    }
    .message-avatar:hover{transform:scale(1.08);box-shadow:0 2px 10px var(--acg);}
    .message-content{flex:1;min-width:0;overflow:hidden;}
    .message-header{font-size:11px;font-weight:700;margin-bottom:2px;display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
    .message-username{cursor:pointer;transition:color .12s;}
    .message-username:hover{color:var(--ac);}
    .role-badge{
      font-size:8px;padding:1px 5px;border-radius:3px;font-weight:700;
      text-transform:uppercase;letter-spacing:.4px;
    }
    .message-time{font-weight:400;font-size:9px;margin-left:2px;color:var(--t3);}
    .message-text{
      font-size:12.5px;line-height:1.5;word-wrap:break-word;
      color:var(--t2);overflow-wrap:anywhere;
    }
    .message-text b{color:var(--t1);font-weight:700;}
    .message-text i{font-style:italic;color:var(--t2);}
    .message-text code{
      background:var(--bg3);padding:1px 5px;border-radius:4px;
      font-family:var(--mono);font-size:10.5px;color:var(--ac3);
    }
    .message-text pre{
      background:var(--bg3);padding:10px 12px;border-radius:7px;
      font-family:var(--mono);font-size:11px;overflow-x:auto;margin-top:5px;
      border:1px solid var(--b2);
    }
    .message-edited{font-size:9px;color:var(--t3);margin-left:4px;}
    /* ===== MSG ACTIONS ===== */
    .msg-actions{
      display:none;position:absolute;right:7px;top:-12px;
      background:var(--bg3);border-radius:6px;padding:2px;gap:1px;
      box-shadow:0 4px 14px rgba(0,0,0,.3);z-index:5;border:1px solid var(--b2);
    }
    .msg-actions button{
      background:none;border:none;color:var(--t2);cursor:pointer;padding:4px 6px;
      border-radius:4px;font-size:13px;display:flex;align-items:center;transition:background .1s,color .1s;
    }
    .msg-actions button:hover{background:var(--bg2);color:var(--t1);}
    .msg-actions button svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.5;}
    /* ===== REACTIONS ===== */
    .msg-reactions{display:flex;gap:3px;margin-top:3px;flex-wrap:wrap;}
    .msg-reaction{
      background:var(--bg3);border-radius:6px;padding:2px 7px;font-size:11px;
      cursor:pointer;transition:all .08s;border:1px solid transparent;display:flex;align-items:center;gap:3px;
    }
    .msg-reaction:hover{border-color:var(--b2);background:var(--bg2);}
    .msg-reaction.me{background:var(--acd);border-color:var(--ac);}
    /* ===== POLL ===== */
    .poll-wrapper{
      background:var(--bg2);border:1px solid var(--b2);border-radius:10px;
      padding:10px 12px;margin-top:6px;max-width:360px;
    }
    .poll-question{font-size:12px;font-weight:700;margin-bottom:8px;color:var(--t1);}
    .poll-options{display:flex;flex-direction:column;gap:6px;}
    .poll-option{
      background:var(--bg3);border-radius:7px;padding:7px 10px;cursor:pointer;
      font-size:11px;display:flex;align-items:center;gap:8px;transition:all .12s;
      border:1px solid transparent;position:relative;overflow:hidden;
    }
    .poll-option:hover{border-color:var(--b2);}
    .poll-option.voted{background:var(--acd);border-color:var(--ac);}
    .poll-option .bar{
      position:absolute;left:0;top:0;bottom:0;background:var(--acg);
      border-radius:7px;transition:width .4s ease;z-index:0;
    }
    .poll-option span{position:relative;z-index:1;}
    .poll-pct{margin-left:auto;font-size:10px;color:var(--t3);position:relative;z-index:1;}
    /* ===== TYPING INDICATOR ===== */
    .typing-indicator{padding:3px 16px;font-size:10px;color:var(--t3);font-style:italic;height:22px;flex-shrink:0;}
    .typing-dots{display:inline-flex;gap:2px;vertical-align:middle;}
    .typing-dots span{width:3px;height:3px;background:var(--t3);border-radius:50%;animation:blink 1.2s infinite;}
    .typing-dots span:nth-child(2){animation-delay:.2s;}
    .typing-dots span:nth-child(3){animation-delay:.4s;}
    @keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
    /* ===== INPUT AREA ===== */
    .input-area{
      padding:8px 14px 12px;background:var(--bg);border-top:1px solid var(--b);
      display:flex;gap:6px;align-items:center;flex-shrink:0;
    }
    .message-input{
      flex:1;background:var(--bg2);border:1px solid var(--b2);border-radius:22px;
      padding:10px 16px;color:var(--t1);font-size:13px;outline:none;
      transition:border-color var(--tr),box-shadow var(--tr);font-family:var(--font);
      resize:none;max-height:120px;line-height:1.4;
    }
    .message-input:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--acg);}
    .message-input::placeholder{color:var(--t3);}
    /* ===== EMOJI POPUP ===== */
    .emoji-popup{
      position:absolute;bottom:62px;left:260px;background:var(--bg2);border-radius:13px;
      display:none;z-index:200;border:1px solid var(--b2);box-shadow:0 8px 28px rgba(0,0,0,.4);
      max-height:240px;overflow-y:auto;width:296px;padding:8px;
    }
    .emoji-popup.show{display:block;animation:fadeUp .12s ease;}
    .emoji-grid{display:flex;flex-wrap:wrap;gap:3px;}
    .emoji-suggestion{
      font-size:18px;cursor:pointer;padding:5px;border-radius:6px;
      transition:background .08s;line-height:1;
    }
    .emoji-suggestion:hover{background:var(--bg3);}
    /* ===== USER PANEL ===== */
    .user-panel{
      width:var(--userpanel-w);background:var(--bg);border-left:1px solid var(--b);
      padding:12px;display:flex;flex-direction:column;gap:5px;flex-shrink:0;z-index:10;overflow-y:auto;
    }
    .user-profile{
      display:flex;gap:9px;align-items:center;padding:6px 0 12px;
      border-bottom:1px solid var(--b);cursor:pointer;border-radius:8px;
      padding:8px;transition:background .12s;
    }
    .user-profile:hover{background:var(--bg2);}
    .user-avatar{
      width:42px;height:42px;
      background:linear-gradient(135deg,var(--ac),var(--ac2));
      border-radius:50%;display:flex;align-items:center;justify-content:center;
      font-weight:700;font-size:16px;color:#fff;flex-shrink:0;position:relative;
    }
    .status-dot{
      position:absolute;bottom:1px;right:1px;width:10px;height:10px;
      border-radius:50%;border:2px solid var(--bg);
    }
    .status-dot.online{background:var(--gr);}
    .status-dot.idle{background:var(--ye);}
    .status-dot.dnd{background:var(--re);}
    .status-dot.offline{background:var(--t3);}
    .user-info{flex:1;min-width:0;}
    .user-name{font-weight:700;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .user-status{font-size:10px;color:var(--t3);margin-top:1px;}
    .panel-section-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--t3);padding:8px 2px 3px;}
    .panel-btn{
      background:var(--bg2);border:none;padding:8px 10px;border-radius:8px;
      color:var(--t2);cursor:pointer;font-weight:500;display:flex;align-items:center;
      gap:9px;width:100%;transition:background .12s,color .12s;font-size:12px;
      font-family:var(--font);text-align:left;
    }
    .panel-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;flex-shrink:0;}
    .panel-btn:hover,.panel-btn:focus-visible{background:var(--bg3);color:var(--t1);}
    .panel-btn.danger{color:var(--re);}
    .panel-btn.danger:hover{background:rgba(239,68,68,.12);}
    /* ===== VOICE BAR ===== */
    .voice-bar{
      background:var(--bg2);border-radius:9px;padding:7px 9px;
      display:flex;align-items:center;gap:7px;font-size:11px;
      font-weight:600;border:1px solid var(--b2);margin-bottom:4px;
      /* Fix 10: Smooth animation using max-height + opacity instead of display toggle */
      max-height:0;opacity:0;overflow:hidden;padding-top:0;padding-bottom:0;
      transition:max-height .3s ease,opacity .25s ease,padding .25s ease,margin .25s ease;
      margin-bottom:0;
    }
    .voice-bar.show{
      max-height:80px;opacity:1;padding:7px 9px;margin-bottom:4px;
    }
    .voice-bar-info{flex:1;min-width:0;}
    .voice-bar-ch{font-size:10px;color:var(--t3);}
    .voice-bar-status{display:flex;align-items:center;gap:4px;color:var(--gr);font-size:11px;}
    .voice-pulse{width:6px;height:6px;border-radius:50%;background:var(--gr);animation:pulse 1.2s infinite;}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
    .voice-controls{display:flex;gap:4px;}
    .voice-btn{
      background:var(--bg3);border:none;width:28px;height:28px;border-radius:6px;
      cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .12s;
    }
    .voice-btn svg{width:14px;height:14px;stroke:var(--t2);fill:none;stroke-width:1.5;transition:stroke .12s;}
    .voice-btn:hover,.voice-btn:focus-visible{background:var(--ac);}
    .voice-btn:hover svg,.voice-btn:focus-visible svg{stroke:#fff;}
    .voice-btn.muted{background:var(--re);}
    .voice-btn.muted svg{stroke:#fff;}
    .voice-participants{font-size:10px;color:var(--t3);}
    /* ===== VOLUME SLIDER ===== */
    .volume-wrap{display:flex;align-items:center;gap:6px;padding:2px 0 6px;}
    .volume-wrap svg{width:13px;height:13px;stroke:var(--t3);fill:none;flex-shrink:0;}
    .remote-volume{flex:1;height:4px;background:var(--bg3);border-radius:2px;cursor:pointer;}
    .remote-volume-fill{height:100%;background:var(--gr);border-radius:2px;width:80%;transition:width .1s;}
    /* ===== MODALS ===== */
    .modal{
      position:fixed;inset:0;background:rgba(0,0,0,.82);backdrop-filter:blur(8px);
      -webkit-backdrop-filter:blur(8px);
      display:none;align-items:center;justify-content:center;z-index:1000;
    }
    .modal.show{display:flex;animation:fadeUp .15s ease;}

    ],

    unreadCounts:{}, blockedUsers:[], messageDb:[], polls:{},
    lang:localStorage.getItem('gt_lang')||'tr',
    dmUnread:{}, offlineQueue:[], channelScrollPositions:{},
    captchaVerified:false, userStatus:'online',
  };
  let s = {...defaults, peerConnections: new Map()};
  return {
    get:()=>s,
    update:(k,v)=>{ s[k]=v; },
    reset:()=>{ const token=s.token; s={...defaults, peerConnections:new Map()}; s.token=token; },
    persist:()=>{
      try{
        const safe = {};
        for(const k of Object.keys(s)){
          if(s[k] instanceof Map || s[k] instanceof MediaStream || k==='socket' || k==='messageDb') continue;
          safe[k]=s[k];
        }
        // Fix 6: messageDb goes to IndexedDB, everything else to localStorage
        localStorage.setItem('gt_state', JSON.stringify(safe));
        IDB.saveMessages(s.messageDb).catch(()=>{
          // Fallback: store in localStorage if IDB fails
          try{ localStorage.setItem('gt_msgs', JSON.stringify(s.messageDb.slice(-200))); }catch(e){}
        });
      }catch(e){ console.warn('Persist failed:', e); }
    }
  };
})();

  let h = s.roles[s.roles.length-1];

    const r = s.roles.find(x=>x.id===rid);

  });

    if(r && (r.permissions.all || r.permissions[perm])) return true;
  }
  return false;
}

let _captchaCode = '';
function generateCaptcha(){ return Math.random().toString(36).substring(2,6).toUpperCase(); }
function drawCaptcha(canvas){
  const ctx = canvas.getContext('2d'), w = canvas.width, h = canvas.height;
  ctx.fillStyle = '#111122'; ctx.fillRect(0,0,w,h);
  for(let i=0;i<5;i++){
    ctx.beginPath(); ctx.moveTo(Math.random()*w,Math.random()*h);
    ctx.lineTo(Math.random()*w,Math.random()*h);
    ctx.strokeStyle=`rgba(181,123,238,${Math.random()*.4+.1})`; ctx.lineWidth=Math.random()*2+.5; ctx.stroke();
  }
  for(let i=0;i<25;i++){
    ctx.beginPath(); ctx.arc(Math.random()*w,Math.random()*h,Math.random()*2,0,Math.PI*2);
    ctx.fillStyle=`rgba(255,255,255,${Math.random()*.25+.05})`; ctx.fill();
  }
  ctx.textBaseline='middle';
  _captchaCode.split('').forEach((c,i)=>{
    const x = w/(5)*(i+.7);
    const y = h/2+Math.random()*8-4;
    ctx.save(); ctx.translate(x,y); ctx.rotate(Math.random()*.4-.2);
    ctx.font=`bold ${28+Math.random()*4}px "Courier New",monospace`;
    ctx.fillStyle=`hsl(${260+Math.random()*40},70%,${68+Math.random()*22}%)`;
    ctx.fillText(c,0,0); ctx.restore();
  });
}

  const overlay = document.getElementById('captchaOverlay');
  overlay.innerHTML = `

      <img src="https://raw.githubusercontent.com/darking053official/gettic/main/1777062266055.png" class="captcha-logo" alt="Gettic">
      <div class="captcha-title">${t('captchaTitle')}</div>

/* ===== INDEXED DB for messageDb ===== */
// Fix 6: Use IndexedDB for large message data, localStorage for small state
const IDB = (()=>{
  let db=null;
  const DB_NAME='gettic_db', DB_VER=1, STORE='messages';
  function open(){
    return new Promise((res,rej)=>{
      if(db){ res(db); return; }
      const req=indexedDB.open(DB_NAME,DB_VER);
      req.onupgradeneeded=e=>{ e.target.result.createObjectStore(STORE,{keyPath:'_id'}); };
      req.onsuccess=e=>{ db=e.target.result; res(db); };
      req.onerror=()=>rej(req.error);
    });
  }
  return {
    async saveMessages(msgs){
      try{
        const d=await open(); const tx=d.transaction(STORE,'readwrite'); const st=tx.objectStore(STORE);
        // Keep only recent MAX_DB messages to avoid unbounded growth
        const toSave=msgs.slice(-MAX_DB);
        // Clear old then add new
        await new Promise(r=>{ const cr=st.clear(); cr.onsuccess=r; cr.onerror=r; });
        toSave.forEach(m=>st.put(m));
        return new Promise(r=>{ tx.oncomplete=r; tx.onerror=r; });
      }catch(e){ /* Fallback to localStorage handled by S.persist */ }
    },
    async loadMessages(){
      try{
        const d=await open(); const tx=d.transaction(STORE,'readonly');
        const st=tx.objectStore(STORE);
        return new Promise((res,rej)=>{ const req=st.getAll(); req.onsuccess=()=>res(req.result||[]); req.onerror=()=>res([]); });
      }catch(e){ return []; }
    },
    async clearMessages(){
      try{ const d=await open(); const tx=d.transaction(STORE,'readwrite'); tx.objectStore(STORE).clear(); }catch(e){}
    }
  };
})();
let _socketAttempts = 0;
const Socket = {
  connect(){
    const s = G();
    if(!s.token || _socketAttempts>=MAX_RETRIES) return;
    if(s.socket){ try{s.socket.removeAllListeners();s.socket.disconnect();}catch(e){} S.update('socket',null); }
    if(!navigator.onLine) return;
    try{
      const sock = io(API,{auth:{token:s.token},transports:['websocket','polling'],reconnection:true,reconnectionAttempts:MAX_RETRIES,reconnectionDelay:2000});
      sock.on('connect',()=>{
        _socketAttempts=0;
        sock.emit('join_channel',s.channel.id);
        updateConnUI(true);
        this._flushQueue();
      });
      sock.on('new_message',msg=>{
        const s2=G();
        if(s2.messageDb.find(m=>m._id===msg._id && m.senderId===msg.senderId)) return;
        s2.messageDb.push(msg);
        if(s2.messageDb.length>MAX_DB) s2.messageDb.splice(0,s2.messageDb.length-MAX_DB);
        S.persist();
        if(msg.channelId===s2.channel.id) addMsgToDOM(msg);
        else { s2.unreadCounts[msg.channelId]=(s2.unreadCounts[msg.channelId]||0)+1; renderChannels(); }
        if(msg.senderId!==s2.user?._id){
          s2.notifications.push({text:`${esc(msg.senderName)}: ${msg.content.substring(0,40)}`,time:new Date().toISOString()});
          S.persist();
          try{ new Notification(msg.senderName,{body:msg.content.substring(0,50)}); }catch(e){}
        }
        playSound();
      });
      sock.on('user_typing',({username,channelId})=>{
        const s2=G();
        if(channelId===s2.channel.id && username!==s2.user?.username) showTyping(username);
      });
      sock.on('message_edited',({id,content})=>{
        const s2=G(); const m=s2.messageDb.find(x=>x._id===id);
        if(m){ m.content=content; m.edited=true; S.persist(); loadMessages(); }
      });
      sock.on('message_deleted',({id})=>{
        const s2=G(); s2.messageDb=s2.messageDb.filter(m=>m._id!==id);
        S.persist(); loadMessages();
      });
      sock.on('voice_offer',async({sdp,from,channel})=>{
        const s2=G(); const pc=s2.peerConnections.get(channel||'__default');
        if(pc){ try{ await pc.setRemoteDescription(sdp); const ans=await pc.createAnswer(); await pc.setLocalDescription(ans); if(s2.socket) s2.socket.emit('voice_answer',{sdp:ans,channel}); }catch(e){} }
      });
      sock.on('voice_answer',async({sdp,channel})=>{
        const s2=G(); const pc=s2.peerConnections.get(channel||'__default');
        if(pc){ try{ await pc.setRemoteDescription(sdp); }catch(e){} }
      });
      sock.on('voice_candidate',async({candidate,channel})=>{
        const s2=G(); const pc=s2.peerConnections.get(channel||'__default');
        if(pc && candidate){ try{ await pc.addIceCandidate(candidate); }catch(e){} }
      });
      sock.on('voice_participants',({channel,count})=>{
        const el=document.getElementById('voiceParticipantCount');
        if(el) el.textContent=`${count} katılımcı`;
      });
      sock.on('disconnect',()=>{ _socketAttempts++; if(_socketAttempts>=MAX_RETRIES) updateConnUI(false); });
      sock.on('connect_error',()=>{ _socketAttempts++; if(_socketAttempts>=MAX_RETRIES) updateConnUI(false); });
      S.update('socket',sock);
    }catch(e){ _socketAttempts++; }
  },
  disconnect(){
    const s=G();
    if(s.socket){ try{s.socket.removeAllListeners();s.socket.disconnect();}catch(e){} S.update('socket',null); }
    _socketAttempts=0;
  },
  _flushQueue(){
    const s=G();
    if(!s.offlineQueue.length) return;
    s.offlineQueue.forEach(msg=>{ if(s.socket) s.socket.emit('send_message',msg); });
    s.offlineQueue=[];
    S.persist();
  }
};

function playSound(){
  try{
    const AC = window.AudioContext||window.webkitAudioContext;
    if(!AC) return;
    const ctx=new AC(); if(ctx.state==='suspended') ctx.resume();
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value=820; g.gain.value=.018;
    o.start(); o.stop(ctx.currentTime+.055);
    setTimeout(()=>ctx.close(),200);
  }catch(e){}

const Voice = {
  async join(channelId){
    const s=G(); const ch=s.channels.find(c=>c.id===channelId); if(!ch) return;
    S.update('voiceChannelId',channelId);
    try{
      const stream = await navigator.mediaDevices.getUserMedia({audio:true,video:false});
      S.update('localStream', stream);
      const vb=document.getElementById('voiceBar'); if(vb) vb.classList.add('show');
      const vn=document.getElementById('voiceChannelName'); if(vn) vn.textContent=ch.name;
      S.update('isInVoice',true);
      this._createPC(channelId);
      toast(`🔊 ${ch.name}`);
    }catch(e){ toast('Mikrofon izni gerekli','error'); }
  },
  _createPC(channelId){
    const s=G();
    if(s.peerConnections.has(channelId)){ s.peerConnections.get(channelId).close(); s.peerConnections.delete(channelId); }
    const pc = new RTCPeerConnection(rtcCfg);
    s.peerConnections.set(channelId, pc);
    if(s.localStream) s.localStream.getTracks().forEach(t=>pc.addTrack(t,s.localStream));
    pc.onicecandidate=e=>{ if(e.candidate && s.socket) s.socket.emit('voice_candidate',{candidate:e.candidate,channel:channelId}); };
    pc.ontrack=e=>{
      const a=document.createElement('audio'); a.srcObject=e.streams[0]; a.autoplay=true; a.volume=.8;
      document.body.appendChild(a); s.remoteAudioElements.push(a);
    };
    if(s.socket){ s.socket.emit('voice_join',{channel:channelId}); }
    pc.createOffer().then(o=>{ pc.setLocalDescription(o); if(s.socket) s.socket.emit('voice_offer',{sdp:o,channel:channelId}); }).catch(()=>{});
  },
  toggleMute(){
    const s=G(); if(!s.localStream) return;
    const muted=!s.isMuted; S.update('isMuted',muted);
    s.localStream.getAudioTracks().forEach(t=>t.enabled=!muted);
    const b=document.getElementById('muteBtn'); if(b){ b.innerHTML=muted?I.micOff:I.mic; b.classList.toggle('muted',muted); }
  },
  toggleDeafen(){
    const s=G(); const deaf=!s.isDeafened; S.update('isDeafened',deaf);
    s.remoteAudioElements.forEach(a=>a.muted=deaf);
    const b=document.getElementById('deafenBtn'); if(b) b.classList.toggle('muted',deaf);
  },
  leave(){
    const s=G();
    if(s.localStream){ s.localStream.getTracks().forEach(t=>t.stop()); S.update('localStream',null); }
    s.peerConnections.forEach(pc=>pc.close()); s.peerConnections.clear();
    s.remoteAudioElements.forEach(a=>{ a.srcObject=null; try{a.remove();}catch(e){} });
    s.remoteAudioElements.length=0;
    if(s.socket) s.socket.emit('voice_leave');
    const vb=document.getElementById('voiceBar'); if(vb) vb.classList.remove('show');
    S.update('isInVoice',false); S.update('isMuted',false); S.update('isDeafened',false); S.update('voiceChannelId',null);
    const mb=document.getElementById('muteBtn'); if(mb){ mb.innerHTML=I.mic; mb.classList.remove('muted'); }
    const db=document.getElementById('deafenBtn'); if(db) db.classList.remove('muted');
  }
};

      </div>
      <div id="authError" style="color:var(--re);margin-top:10px;font-size:11px;min-height:18px;" role="alert"></div>
    </div>
  </div>`;
  document.getElementById('loginTab').onclick=()=>{ document.getElementById('loginForm').style.display=''; document.getElementById('registerForm').style.display='none'; document.getElementById('loginTab').classList.add('active'); document.getElementById('registerTab').classList.remove('active'); };
  document.getElementById('registerTab').onclick=()=>{ document.getElementById('loginForm').style.display='none'; document.getElementById('registerForm').style.display=''; document.getElementById('registerTab').classList.add('active'); document.getElementById('loginTab').classList.remove('active'); };
  document.getElementById('doLoginBtn').onclick=()=>{ if(!G().captchaVerified){ showCaptcha(()=>doAuth('login')); return; } doAuth('login'); };
  document.getElementById('doRegBtn').onclick=()=>{ if(!G().captchaVerified){ showCaptcha(()=>doAuth('register')); return; } doAuth('register'); };
  [document.getElementById('loginPass'), document.getElementById('regPass')].forEach(el=>{ if(el) el.onkeypress=e=>{ if(e.key==='Enter') el.closest('#loginForm,#registerForm').querySelector('button').click(); }; });

async function doAuth(type){
  const isL = type==='login';
  const u = document.getElementById(isL?'loginUser':'regUser')?.value.trim();
  const p = document.getElementById(isL?'loginPass':'regPass')?.value;
  const err = document.getElementById('authError');
  if(!u||!p) return err.textContent='Tüm alanları doldurun.';
  if(!isL&&u.length<3) return err.textContent='Kullanıcı adı en az 3 karakter.';
  if(!isL&&p.length<6) return err.textContent='Şifre en az 6 karakter.';
  if(!checkRL('auth',5,10000)) return err.textContent='Çok fazla deneme, bekleyin.';
  const btn = document.getElementById(isL?'doLoginBtn':'doRegBtn');
  if(btn){ btn.disabled=true; btn.textContent='...'; }
  try{
    const res = await fetch(`${API}/api/auth/${type}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});
    const d = await res.json();
    if(!res.ok) throw new Error(d.error||'Başarısız');
    const s=G(); s.user=d.user; s.token=d.token;
    localStorage.setItem('gt_token',d.token);
    localStorage.setItem('gt_user',JSON.stringify(d.user));
    if(!s.userRoles[d.user._id]){ s.userRoles[d.user._id]=['r4']; }
    S.persist();
    renderApp();
  }catch(e){
    err.textContent = e.message;
    if(btn){ btn.disabled=false; btn.textContent=isL?t('login'):t('register'); }
  }
}

function bindUI(){

  if(inp){
    inp.addEventListener('keydown',e=>{ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendMessage(); } });
    inp.addEventListener('input',()=>{
      // Auto resize
      inp.style.height='auto'; inp.style.height=Math.min(inp.scrollHeight,120)+'px';
      const s2=G();
      if(s2.socket) s2.socket.emit('typing',{channelId:s2.channel.id,username:s2.user?.username});
    });
  }
  // Buttons
  document.getElementById('emojiBtn')?.addEventListener('click', toggleEmoji);
  document.getElementById('uploadBtn')?.addEventListener('click', handleFileUpload);
  document.getElementById('logoutBtn')?.addEventListener('click',()=>{
    localStorage.clear(); S.reset(); Socket.disconnect(); Voice.leave(); renderAuth();
  });
  document.getElementById('serverSettingsBtn')?.addEventListener('click',()=>openModal('serverSettingsModal'));
  document.getElementById('serverHeader')?.addEventListener('click',()=>openModal('serverSettingsModal'));
  document.getElementById('statusProfile')?.addEventListener('click',()=>openModal('profileModal'));
  document.getElementById('themeSettingsBtn')?.addEventListener('click',()=>openModal('themeSettingsModal'));
  document.getElementById('dmBtn')?.addEventListener('click',()=>{ openModal('dmModal'); loadDMList(); });
  document.getElementById('addFriendBtn')?.addEventListener('click',()=>openModal('addFriendModal'));
  document.getElementById('addServerBtn')?.addEventListener('click',()=>openModal('addServerModal'));
  document.getElementById('addCategoryBtn')?.addEventListener('click',()=>openModal('addCategoryModal'));
  document.getElementById('rolesBtn')?.addEventListener('click',()=>{ openModal('rolesModal'); renderRoles(); });
  document.getElementById('searchBtn')?.addEventListener('click',()=>{ openModal('searchModal'); setTimeout(()=>document.getElementById('searchInput')?.focus(),80); });
  document.getElementById('notifBtn')?.addEventListener('click',()=>{ openModal('notifModal'); renderNotifications(); });
  document.getElementById('pollBtn')?.addEventListener('click',()=>openModal('pollModal'));
  document.getElementById('themeToggleBtn')?.addEventListener('click', toggleLightMode);
  document.getElementById('langBtn')?.addEventListener('click',()=>{ const s2=G(); s2.lang=s2.lang==='tr'?'en':'tr'; localStorage.setItem('gt_lang',s2.lang); renderApp(); });
  document.getElementById('toggleSidebarBtn')?.addEventListener('click',()=>document.getElementById('channelSidebar')?.classList.toggle('open'));
  document.getElementById('toggleUserPanelBtn')?.addEventListener('click',()=>document.getElementById('userPanel')?.classList.toggle('open'));
  // Voice
  document.getElementById('muteBtn')?.addEventListener('click',()=>Voice.toggleMute());
  document.getElementById('deafenBtn')?.addEventListener('click',()=>Voice.toggleDeafen());
  document.getElementById('leaveVoiceBtn')?.addEventListener('click',()=>Voice.leave());
  // Volume
  document.getElementById('remoteVolume')?.addEventListener('click',e=>{
    const r=e.currentTarget.getBoundingClientRect();
    const pct=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));
    const fill=document.getElementById('remoteVolumeFill'); if(fill) fill.style.width=(pct*100)+'%';
    G().remoteAudioElements.forEach(a=>a.volume=pct);
  });
  // Search
  document.getElementById('searchInput')?.addEventListener('input', debounce(performSearch,200));
  // Messages scroll position save
  document.getElementById('messagesContainer')?.addEventListener('scroll',()=>{
    const c=document.getElementById('messagesContainer');
    if(c) G().channelScrollPositions[G().channel.id]=c.scrollTop;
  },{passive:true});
  // Global keyboard
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'){ closeAllModals(); document.getElementById('contextMenu')?.classList.remove('show'); }
    if(e.ctrlKey&&e.key==='k'){ e.preventDefault(); openModal('searchModal'); setTimeout(()=>document.getElementById('searchInput')?.focus(),80); }
  });
  // Modal backdrop close
  document.addEventListener('click',e=>{ if(e.target.classList?.contains('modal')) closeAllModals(); });
  // Context menu
  document.addEventListener('contextmenu', handleContextMenu);
  document.addEventListener('click',e=>{ if(!e.target.closest('.context-menu')) document.getElementById('contextMenu')?.classList.remove('show'); });
  // Touch swipe
  let _ts={};
  document.addEventListener('touchstart',e=>{ const t2=e.touches[0]; _ts={x:t2.clientX,y:t2.clientY,time:Date.now()}; },{passive:true});
  document.addEventListener('touchend',e=>{
    if(!_ts.x) return;
    const dx=(e.changedTouches[0]?.clientX||0)-_ts.x;
    const dy=Math.abs((e.changedTouches[0]?.clientY||0)-_ts.y);
    const dt=Date.now()-_ts.time;
    if(dt>400 && Math.abs(dx)<15 && dy<15) handleContextMenu(e);
    if(Math.abs(dx)>55 && dy<40 && dt<350){
      if(dx>0) document.getElementById('channelSidebar')?.classList.add('open');
      else document.getElementById('userPanel')?.classList.add('open');
    }
    _ts={};
  },{passive:true});
  // Network events
  window.addEventListener('online',()=>{ updateConnUI(true); Socket.connect(); });
  window.addEventListener('offline',()=>updateConnUI(false));
  // Notification permission request
  if(Notification.permission==='default') Notification.requestPermission().catch(()=>{});
}

/* ===== EMOJI TOGGLE ===== */
const EMOJIS=['😀','😂','❤️','🔥','🎉','👍','👎','🙏','🎮','💻','✨','✅','❌','😮','😢','😡','🥳','👋','🤔','😎','🫡','💯','🎯','🚀','⭐','💜','🧡','💙','💚','🤝','👀','💬','🎵','🎨','📌','🔔','⚡','🌟'];
function toggleEmoji(){
  const popup = document.getElementById('emojiPopup');
  if(!popup) return;
  if(popup.classList.contains('show')){ popup.classList.remove('show'); return; }
  popup.innerHTML=`<div class="emoji-grid">${EMOJIS.map(e=>`<span class="emoji-suggestion" role="button" tabindex="0">${e}</span>`).join('')}</div>`;
  popup.querySelectorAll('.emoji-suggestion').forEach(el=>{
    const add=()=>{ const i=document.getElementById('messageInput'); if(i){ i.value+=el.textContent; i.focus(); } popup.classList.remove('show'); };
    el.addEventListener('click',add);
    el.addEventListener('keypress',e=>{ if(e.key==='Enter') add(); });
  });
  // Fix 4: Position popup dynamically based on emoji button location
  const btn = document.getElementById('emojiBtn');
  if(btn){
    const rect = btn.getBoundingClientRect();
    const pw = Math.min(296, window.innerWidth - 16);
    let left = rect.left;
    if(left + pw > window.innerWidth - 8) left = window.innerWidth - pw - 8;
    if(left < 8) left = 8;
    popup.style.left = left + 'px';
    popup.style.bottom = (window.innerHeight - rect.top + 8) + 'px';
    popup.style.top = 'auto';
    popup.style.width = pw + 'px';
  }
  popup.classList.add('show');
  // Close on outside click
  setTimeout(()=>{
    const close=(e)=>{ if(!popup.contains(e.target) && e.target!==document.getElementById('emojiBtn')){ popup.classList.remove('show'); document.removeEventListener('click',close); } };
    document.addEventListener('click',close);
  },50);
}

/* ===== CONTEXT MENU ===== */
function handleContextMenu(e){
  e.preventDefault();
  const menu = document.getElementById('contextMenu');
  const msgEl = e.target.closest?.('.message');
  if(msgEl){
    const mid = msgEl.dataset.id;
    const s=G(); const msg=s.messageDb.find(m=>m._id===mid);
    const isOwn = msg?.senderId===s.user?._id;
    const canDelete = isOwn || hasPermission(s.user._id,'deleteMsg');
    menu.innerHTML=`
      <button onclick="copyMsg('${mid}')">${I.copy} ${t('copy')}</button>
      <button onclick="addReactionPrompt('${mid}')">${I.reaction} ${t('reaction')}</button>
      ${isOwn?`<button onclick="editMsgInline('${mid}')">${I.edit} ${t('edit')}</button>`:''}
      ${canDelete?`<div class="menu-sep"></div><button class="danger" onclick="deleteMsg('${mid}')">${I.trash} ${t('delete')}</button>`:''}
      <button onclick="pinMsg('${mid}')">${I.pin} ${t('pin')}</button>`;
  } else {
    menu.innerHTML=`
      <button onclick="openModal('addChannelModal')">${I.plus} Kanal Ekle</button>
      <button onclick="openModal('addCategoryModal')">📁 Kategori Ekle</button>`;
  }
  const x = Math.min(e.clientX||e.touches?.[0]?.clientX||0, innerWidth-175);
  const y = Math.min(e.clientY||e.touches?.[0]?.clientY||0, innerHeight-230);
  menu.style.left=x+'px'; menu.style.top=y+'px';
  menu.classList.add('show');
}

function copyMsg(mid){
  const msg=G().messageDb.find(m=>m._id===mid);
  if(!msg){ document.getElementById('contextMenu')?.classList.remove('show'); return; }
  if(navigator.clipboard) navigator.clipboard.writeText(msg.content).then(()=>toast('Kopyalandı')).catch(()=>fallbackCopy(msg.content));
  else fallbackCopy(msg.content);
  document.getElementById('contextMenu')?.classList.remove('show');
}
function fallbackCopy(text){ const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); toast('Kopyalandı'); }

function deleteMsg(mid){
  const s=G();
  const msg=s.messageDb.find(m=>m._id===mid);
  if(!msg) return;
  if(msg.senderId!==s.user?._id && !hasPermission(s.user._id,'deleteMsg')) return toast('Yetkiniz yok','error');

function addReactionPrompt(mid){
  document.getElementById('contextMenu')?.classList.remove('show');
  const reacts=['👍','👎','❤️','😂','😮','😢','🔥','🎉','✅'];
  const popup=document.createElement('div');
  popup.style.cssText='position:fixed;background:var(--bg2);border:1px solid var(--b2);border-radius:10px;padding:8px;z-index:2500;display:flex;flex-wrap:wrap;gap:4px;box-shadow:0 8px 28px rgba(0,0,0,.4);';
  popup.innerHTML=reacts.map(r=>`<span style="font-size:20px;cursor:pointer;padding:4px;border-radius:5px;" onmouseenter="this.style.background='var(--bg3)'" onmouseleave="this.style.background=''">${r}</span>`).join('');
  const msgEl=document.querySelector(`.message[data-id="${mid}"]`);
  if(msgEl){ const r=msgEl.getBoundingClientRect(); popup.style.left=r.left+'px'; popup.style.top=(r.top-60)+'px'; }
  else { popup.style.left='50%'; popup.style.top='50%'; popup.style.transform='translate(-50%,-50%)'; }
  document.body.appendChild(popup);
  popup.querySelectorAll('span').forEach(el=>el.addEventListener('click',()=>{ addReaction(mid,el.textContent.trim()); popup.remove(); }));
  setTimeout(()=>document.addEventListener('click',function rem(){ popup.remove(); document.removeEventListener('click',rem); },{once:true}),100);
}

function addReaction(mid, emoji){
  const s=G(); const msg=s.messageDb.find(m=>m._id===mid);
  if(!msg) return;
  if(!msg.reactions) msg.reactions={};
  if(!msg.reactions[emoji]) msg.reactions[emoji]=[];
  const uid=s.user._id;
  const idx=msg.reactions[emoji].indexOf(uid);
  if(idx===-1) msg.reactions[emoji].push(uid);
  else msg.reactions[emoji].splice(idx,1);
  if(!msg.reactions[emoji].length) delete msg.reactions[emoji];
  S.persist(); loadMessages();
}

/* ===== CHANNELS ===== */
function renderChannels(){
  const c=document.getElementById('channelCategories'); if(!c) return;
  const s=G(); let h='';
  s.categories.forEach(cat=>{
    const catChannels=s.channels.filter(ch=>ch.category===cat);
    h+=`<div class="channel-category">${esc(cat)}<button data-cat="${esc(cat)}" title="Kanal ekle">+</button></div>`;
    catChannels.forEach(ch=>{
      const icon=ch.type==='voice'?I.volume:I.hash;
      const cls=ch.id===s.channel.id?' active':'';
      const ur=s.unreadCounts[ch.id]||0;
      h+=`<div class="channel-item${cls}" data-id="${esc(ch.id)}" data-type="${ch.type}" tabindex="0" role="button" aria-label="${esc(ch.name)}">
        <span>${icon}</span><span class="ch-name">${esc(ch.name)}</span>
        ${ur>0?`<span class="unread-badge">${ur>99?'99+':ur}</span>`:''}
        <span class="ch-actions">
          <button data-action="edit" title="Düzenle" aria-label="Düzenle">${I.edit}</button>
          <button data-action="delete" title="Sil" aria-label="Sil">${I.trash}</button>
        </span>
      </div>`;
    });
    if(!catChannels.length) h+=`<div style="padding:4px 18px;font-size:10px;color:var(--t3);">Kanal yok</div>`;
  });
  c.innerHTML = h||`<div class="empty-state"><svg viewBox="0 0 24 24">${I.hash}</svg>${t('noChannels')}</div>`;
  c.querySelectorAll('.channel-item').forEach(el=>{
    el.addEventListener('click',e=>{
      if(e.target.closest('.ch-actions')) return;
      if(el.dataset.type==='voice') Voice.join(el.dataset.id);
      else switchChannel(el.dataset.id);
    });
    el.addEventListener('keypress',e=>{ if(e.key==='Enter') el.click(); });
  });
  c.querySelectorAll('[data-action="edit"]').forEach(b=>b.addEventListener('click',e=>{ e.stopPropagation(); openEditChannel(e.target.closest('.channel-item').dataset.id); }));
  c.querySelectorAll('[data-action="delete"]').forEach(b=>b.addEventListener('click',e=>{ e.stopPropagation(); deleteChannelById(e.target.closest('.channel-item').dataset.id); }));
  c.querySelectorAll('.channel-category button[data-cat]').forEach(b=>b.addEventListener('click',e=>{ e.stopPropagation(); setupChannelCatSelect(b.dataset.cat); openModal('addChannelModal'); }));
}

window.createChannel=function(){
  const s=G();
  const n=document.getElementById('newChannelName')?.value.trim();

  const cat=document.getElementById('channelCategory')?.value||s.categories[0]||'METİN';

  // Fix 5: Full Turkish character support in slug generation
  const trMap={'ğ':'g','ü':'u','ş':'s','ı':'i','ö':'o','ç':'c','Ğ':'g','Ü':'u','Ş':'s','İ':'i','Ö':'o','Ç':'c'};
  const slug=n.split('').map(c=>trMap[c]||c).join('').toLowerCase().replace(/\s+/g,'-').replace(/[^a-z0-9\-]/g,'').replace(/-+/g,'-').replace(/^-|-$/g,'').substring(0,32)||genId();
  if(s.channels.find(c=>c.id===slug)) return toast('Bu kanal zaten var','error');
  s.channels.push({id:slug,name:n,type,category:cat});

/* ===== MESSAGES ===== */
async function sendMessage(){
  const s=G(); const inp=document.getElementById('messageInput'); if(!inp) return;
  const content=inp.value.trim(); if(!content) return;
  if(!checkRL('send_'+s.user._id,8,5000)) return toast('Yavaş gönder','error');
  if(!hasPermission(s.user._id,'sendMsg')) return toast('Yetkiniz yok','error');
  inp.value=''; inp.style.height='auto';
  const msg={_id:genId(),content,senderName:s.user.username,senderId:s.user._id,channelId:s.channel.id,createdAt:new Date().toISOString(),reactions:{}};
  s.messageDb.push(msg);
  if(s.messageDb.length>MAX_DB) s.messageDb.splice(0,s.messageDb.length-MAX_DB);
  S.persist(); addMsgToDOM(msg);
  if(s.socket && s.socket.connected){
    s.socket.emit('send_message',msg);
    try{
      const res=await fetch(`${API}/api/channels/${s.channel.id}/messages`,{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${s.token}`},body:JSON.stringify({content})});
      if(res.status===401){ toast('Oturum süresi doldu, tekrar giriş yapın','error'); return; }
    }catch(e){
      s.offlineQueue.push(msg); S.persist();
      toast(t('savedOffline'),'error');
    }
  } else {
    s.offlineQueue.push(msg); S.persist(); toast(t('savedOffline'),'error');
  }
}

function loadMessages(){
  const s=G();
  const inner=document.getElementById('messagesInner');
  const cont=document.getElementById('messagesContainer');
  if(!inner) return;
  const pinned=s.pinnedMessages[s.channel.id];
  const msgs=s.messageDb.filter(m=>m.channelId===s.channel.id).slice(-MAX_MSGS);
  if(!msgs.length && !pinned){
    inner.innerHTML=`<div class="empty-channel">${I.hash}<h4># ${esc(s.channel.name)} ${t('birth')}</h4><p>${t('noMessages')}</p></div>`;
    return;
  }
  const parts=[];
  if(pinned) parts.push(renderMsg(pinned,true));
  msgs.forEach(m=>parts.push(renderMsg(m)));
  inner.innerHTML=parts.join('');
  // Restore scroll or go to bottom
  if(s.channelScrollPositions[s.channel.id]!==undefined && s.channelScrollPositions[s.channel.id]!==cont.scrollHeight){
    cont.scrollTop=s.channelScrollPositions[s.channel.id];
  } else {
    cont.scrollTop=cont.scrollHeight;
  }
}

function renderMsg(m, isPinned=false){
  const s=G();
  if(s.blockedUsers.includes(m.senderId)) return '';
  const role=getHighestRole(m.senderId||'');
  const badge=role&&role.id!=='r4'?`<span class="role-badge" style="background:${role.color}20;color:${role.color};">${esc(role.name)}</span>`:'';
  const reacts=m.reactions||{};
  const rHtml=Object.entries(reacts).filter(([,u])=>u.length>0).map(([e,u])=>`<span class="msg-reaction${u.includes(s.user?._id)?' me':''}" onclick="addReaction('${m._id}','${e}')">${e} <span>${u.length}</span></span>`).join('');
  const time=new Date(m.createdAt).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});
  const poll=s.polls[m._id];
  const editedBadge=m.edited?`<span class="message-edited">(düzenlendi)</span>`:'';
  const pinnedClass=isPinned?' pinned-msg':'';
  const formattedContent=esc(m.content)
    .replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')
    .replace(/\*(.+?)\*/g,'<i>$1</i>')
    .replace(/`{3}([\s\S]+?)`{3}/g,'<pre>$1</pre>')
    .replace(/`([^`\n]+?)`/g,'<code>$1</code>');
  return `<div class="message${pinnedClass}" data-id="${m._id}" role="listitem">
    <div class="message-avatar" onclick="showUserInfo('${esc(m.senderId)}','${esc(m.senderName||'')}')" title="${esc(m.senderName||'')}">${esc((m.senderName||'?').charAt(0).toUpperCase())}</div>
    <div class="message-content">
      <div class="message-header">
        <span class="message-username" onclick="showUserInfo('${esc(m.senderId)}','${esc(m.senderName||'')}')">${esc(m.senderName||'?')}</span>
        ${badge}
        <span class="message-time">${time}${editedBadge}</span>
        ${isPinned?`<span style="font-size:9px;color:var(--ye);font-weight:700;">📌 ${t('pinned')}</span>`:''}
      </div>
      <div class="message-text">${formattedContent}</div>
      ${poll?renderPollHTML(m._id,poll):''}
      ${rHtml?`<div class="msg-reactions">${rHtml}</div>`:''}
    </div>
    <div class="msg-actions">
      <button onclick="addReactionPrompt('${m._id}')" title="${t('reaction')}">${I.reaction}</button>
      ${m.senderId===G().user?._id?`<button onclick="editMsgInline('${m._id}')" title="${t('edit')}">${I.edit}</button>`:''}
      <button onclick="copyMsg('${m._id}')" title="${t('copy')}">${I.copy}</button>
      <button onclick="pinMsg('${m._id}')" title="${t('pin')}">${I.pin}</button>
      ${(m.senderId===G().user?._id||hasPermission(G().user?._id,'deleteMsg'))?`<button onclick="deleteMsg('${m._id}')" title="${t('delete')}" style="color:var(--re);">${I.trash}</button>`:''}
    </div>
  </div>`;
}

function renderPollHTML(mid, p){
  const s=G(); const total=p.votes.reduce((a,b)=>a+b,0)||1;
  return `<div class="poll-wrapper"><div class="poll-question">📊 ${esc(p.question)}</div><div class="poll-options">${p.options.map((o,i)=>{
    const pct=Math.round((p.votes[i]/total)*100);
    const voted=p.voters[s.user?._id]===i;
    return `<div class="poll-option${voted?' voted':''}" onclick="votePoll('${mid}',${i})"><div class="bar" style="width:${pct}%"></div><span>${esc(o)}</span><span class="poll-pct">${pct}%</span></div>`;
  }).join('')}</div></div>`;
}

function addMsgToDOM(msg){
  const inner=document.getElementById('messagesInner'); if(!inner) return;
  if(inner.querySelector('.empty-channel')) inner.innerHTML='';
  const cont=document.getElementById('messagesContainer');
  const atBottom=!cont||(cont.scrollHeight-cont.scrollTop-cont.clientHeight)<120;
  inner.insertAdjacentHTML('beforeend', renderMsg(msg));
  if(atBottom && cont) cont.scrollTop=cont.scrollHeight;
  while(inner.children.length>MAX_MSGS*1.5) inner.firstChild?.remove();
}

/* ===== ROLES ===== */
function renderRoles(){
  const c=document.getElementById('rolesList'); if(!c) return;
  const s=G();
  c.innerHTML=s.roles.sort((a,b)=>a.position-b.position).map(r=>`
    <div class="role-item">
      <div style="width:22px;height:22px;border-radius:6px;background:${r.color};flex-shrink:0;"></div>
      <div class="role-info"><div class="role-name">${esc(r.name)}</div><div class="role-sub">${r.permissions.all?'Tüm yetkiler':Object.keys(r.permissions).filter(k=>r.permissions[k]).join(', ')}</div></div>
      <button class="icon-btn" onclick="openEditRole('${r.id}')" title="Düzenle">${I.edit}</button>
    </div>`).join('');
}
window.openEditRole=function(id){
  const s=G(); const r=s.roles.find(x=>x.id===id); if(!r) return;
  const eid=document.getElementById('editRoleId'); if(eid) eid.value=r.id;
  const en=document.getElementById('editRoleName'); if(en) en.value=r.name;
  const ec=document.getElementById('editRoleColor'); if(ec) ec.value=r.color;
  const perms=['sendMsg','deleteMsg','kick','ban','manageChannels','manageRoles','manageServer'];
  const permLabels={sendMsg:'Mesaj Gönder',deleteMsg:'Mesaj Sil',kick:'Kullanıcı At',ban:'Kullanıcı Banla',manageChannels:'Kanalları Yönet',manageRoles:'Rolleri Yönet',manageServer:'Sunucuyu Yönet'};
  document.getElementById('rolePerms').innerHTML=perms.map(p=>`
    <div class="perm-row">
      <div><div class="perm-label">${permLabels[p]||p}</div></div>
      <div class="toggle-switch${(r.permissions[p]||r.permissions.all)?' on':''}" data-p="${p}" onclick="this.classList.toggle('on')" role="switch" aria-checked="${!!(r.permissions[p]||r.permissions.all)}"></div>
    </div>`).join('');
  openModal('editRoleModal');
};
window.saveRoleEdit=function(){
  const s=G(); const id=document.getElementById('editRoleId')?.value;
  const r=s.roles.find(x=>x.id===id); if(!r) return;
  r.name=document.getElementById('editRoleName')?.value.trim()||r.name;
  r.color=document.getElementById('editRoleColor')?.value||r.color;
  r.permissions={};
  document.querySelectorAll('#rolePerms .toggle-switch').forEach(ts=>r.permissions[ts.dataset.p]=ts.classList.contains('on'));
  S.persist(); closeModal('editRoleModal'); renderRoles(); toast('Rol güncellendi');
};
window.addRole=function(){
  const s=G(); const n=document.getElementById('newRoleName')?.value.trim(); if(!n) return;
  const c=document.getElementById('newRoleColor')?.value||'#9ca3af';
  s.roles.push({id:genId(),name:n,color:c,permissions:{sendMsg:true},position:s.roles.length});
  S.persist(); closeModal('addRoleModal'); renderRoles(); toast('Rol eklendi');
};

/* ===== USER INFO ===== */
function showUserInfo(uid, uname){
  const s=G();
  if(uid===s.user?._id){ openModal('profileModal'); return; }
  const isBlocked=s.blockedUsers.includes(uid);
  const role=getHighestRole(uid);
  document.getElementById('userInfoContent').innerHTML=`
    <div style="text-align:center;padding:14px 0;">
      <div style="width:56px;height:56px;border-radius:50%;background:var(--ac);display:inline-flex;align-items:center;justify-content:center;font-size:22px;color:#fff;font-weight:800;margin-bottom:10px;">${esc(uname.charAt(0).toUpperCase())}</div>
      <h3 style="margin-bottom:4px;font-size:16px;">${esc(uname)}</h3>
      <div style="display:inline-block;padding:2px 8px;border-radius:5px;font-size:10px;font-weight:700;background:${role.color}20;color:${role.color};margin-bottom:14px;">${esc(role.name)}</div>
      <div style="display:flex;gap:8px;flex-direction:column;">
        <button class="modal-btn secondary" onclick="openDMDirect('${uid}','${esc(uname)}')">${I.dm} Mesaj Gönder</button>
        <button class="modal-btn ${isBlocked?'':'danger'}" onclick="toggleBlockUser('${uid}')">${isBlocked?t('unblock'):t('block')}</button>
      </div>
    </div>`;
  openModal('userInfoModal');
}
window.showUserInfo=showUserInfo;
window.toggleBlockUser=function(uid){
  const s=G();
  if(s.blockedUsers.includes(uid)) s.blockedUsers=s.blockedUsers.filter(u=>u!==uid);
  else s.blockedUsers.push(uid);
  S.persist(); loadMessages(); closeModal('userInfoModal');
  toast(s.blockedUsers.includes(uid)?'Engellendi':'Engel kaldırıldı');
};
window.openDMDirect=function(uid,uname){
  closeModal('userInfoModal');
  const s=G();
  if(!s.dmFriends.find(f=>f.id===uid)) s.dmFriends.push({id:uid,username:uname,messages:[],time:'Şimdi'});
  S.persist(); openModal('dmModal'); loadDMList(); openDM(uid,uname);
};

/* ===== DM ===== */
function loadDMList(){
  const c=document.getElementById('dmList'); if(!c) return;
  const s=G();
  c.innerHTML=s.dmFriends.length?s.dmFriends.map(f=>`
    <div class="dm-item" onclick="openDM('${esc(f.id)}','${esc(f.username)}')">
      <div class="dm-avatar">${esc(f.username.charAt(0).toUpperCase())}</div>
      <div class="dm-info">
        <div class="dm-name">${esc(f.username)}</div>
        <div class="dm-last-msg">${esc(f.last||'DM başlat')}</div>
      </div>
      ${(s.dmUnread[f.id]||0)>0?`<span class="unread-badge">${s.dmUnread[f.id]}</span>`:''}
    </div>`).join(''):`<div class="empty-state">${I.dm}${t('noDM')}</div>`;
}
window.openDMNew=function(){ closeModal('dmModal'); openModal('dmNewModal'); };
window.startDM=function(){
  const s=G(); const u=document.getElementById('dmNewUsername')?.value.trim(); if(!u) return;
  if(!s.dmFriends.find(f=>f.username===u)) s.dmFriends.push({id:genId(),username:u,messages:[],time:'Şimdi'});
  S.persist(); closeModal('dmNewModal'); openModal('dmModal'); loadDMList();
};
window.openDM=function(id,uname){
  const s=G(); const f=s.dmFriends.find(x=>x.id===id); if(!f) return;
  s.dmUnread[id]=0; S.persist();
  const area=document.getElementById('dmChatArea'); if(area) area.style.display='block';
  const title=document.getElementById('dmChatTitle'); if(title) title.textContent=`💬 ${uname}`;
  const d=document.getElementById('dmMessages'); if(!d) return;
  d.innerHTML=(f.messages||[]).map(m=>`<div style="font-size:11px;padding:2px 0;"><b style="color:var(--t1);">${esc(m.sender||'?')}</b><span style="color:var(--t3);font-size:9px;margin:0 5px;">${new Date(m.time||0).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'})}</span>${esc(m.text)}</div>`).join('');
  d.scrollTop=d.scrollHeight;
  document.getElementById('sendDmBtn').onclick=()=>{
    const inp=document.getElementById('dmInput'); if(!inp?.value.trim()) return;
    const msg={sender:s.user?.username||'Sen',text:inp.value.trim(),time:new Date().toISOString()};
    f.messages.push(msg); f.last=msg.text; f.time='Şimdi';
    S.persist();
    d.insertAdjacentHTML('beforeend',`<div style="font-size:11px;padding:2px 0;"><b style="color:var(--t1);">${esc(msg.sender)}</b><span style="color:var(--t3);font-size:9px;margin:0 5px;">${new Date(msg.time).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'})}</span>${esc(msg.text)}</div>`);
    d.scrollTop=d.scrollHeight; inp.value='';
    if(s.socket) s.socket.emit('dm_message',{to:id,text:msg.text,sender:s.user.username});
  };
  document.getElementById('dmInput').onkeypress=e=>{ if(e.key==='Enter') document.getElementById('sendDmBtn').click(); };
};
window.addFriend=function(){
  const s=G(); const u=document.getElementById('friendUsername')?.value.trim(); if(!u) return;
  if(s.dmFriends.find(f=>f.username===u)) return toast('Zaten ekli','error');
  s.dmFriends.push({id:genId(),username:u,messages:[],time:'Şimdi'});
  S.persist(); closeModal('addFriendModal'); toast(`${u} eklendi`);
};

/* ===== SEARCH ===== */
function performSearch(){
  const q=document.getElementById('searchInput')?.value.toLowerCase().trim();
  const r=document.getElementById('searchResults'); if(!r) return;
  if(!q||q.length<2){ r.innerHTML=''; return; }
  const s=G();
  const msgs=s.messageDb.filter(m=>(m.content||'').toLowerCase().includes(q)||(m.senderName||'').toLowerCase().includes(q)).slice(-15).reverse();
  r.innerHTML=msgs.length?msgs.map(m=>`
    <div class="search-result-item" onclick="switchChannel('${m.channelId}');closeAllModals()">
      <div class="dm-avatar">${esc((m.senderName||'?').charAt(0).toUpperCase())}</div>
      <div class="dm-info">
        <div class="dm-name">${esc(m.senderName||'?')}</div>
        <div class="dm-last-msg">${esc(m.content.substring(0,60))}</div>
      </div>
    </div>`).join(''):`<div class="empty-state">Sonuç bulunamadı</div>`;
}
window.closeAllModals=closeAllModals;

/* ===== NOTIFICATIONS ===== */
function renderNotifications(){
  const c=document.getElementById('notifList'); if(!c) return;
  const s=G();
  c.innerHTML=s.notifications.length
    ?[...s.notifications].reverse().slice(0,30).map(n=>`<div class="notif-item">${esc(n.text)}<div class="notif-time">${new Date(n.time).toLocaleString('tr-TR')}</div></div>`).join('')
    :`<div class="empty-state">${I.bell}<br>Bildirim yok</div>`;
}

/* ===== POLLS ===== */
window.createPoll=function(){
  const s=G();
  const q=document.getElementById('pollQuestion')?.value.trim();
  const o1=document.getElementById('pollOption1')?.value.trim();
  const o2=document.getElementById('pollOption2')?.value.trim();
  const o3=document.getElementById('pollOption3')?.value.trim();
  if(!q||!o1||!o2) return toast('Soru ve en az 2 seçenek gerekli','error');
  const opts=[o1,o2,...(o3?[o3]:[])];
  const mid=genId();
  s.polls[mid]={question:q,options:opts,votes:new Array(opts.length).fill(0),voters:{}};
  const msg={_id:mid,content:`📊 **${q}**\n${opts.map((o,i)=>`${i+1}. ${o}`).join('\n')}`,senderName:s.user.username,senderId:s.user._id,channelId:s.channel.id,createdAt:new Date().toISOString(),reactions:{}};
  s.messageDb.push(msg); S.persist(); closeModal('pollModal'); addMsgToDOM(msg);
  [1,2,3].forEach(n=>{ const el=document.getElementById('pollOption'+n); if(el) el.value=''; });
  const qel=document.getElementById('pollQuestion'); if(qel) qel.value='';
};
window.votePoll=function(mid,opt){
  const s=G(); const p=s.polls[mid]; if(!p) return;
  if(p.voters[s.user._id]!==undefined){ toast('Zaten oy verdiniz','error'); return; }
  p.voters[s.user._id]=opt; p.votes[opt]++; S.persist(); loadMessages();
};

/* ===== THEME ===== */
window.toggleLightMode=function(){
  const isLight=document.body.classList.toggle('light');
  localStorage.setItem('gt_light',isLight?'1':'0');
  renderApp();
};
window.setTheme=function(primary, secondary){
  document.documentElement.style.setProperty('--ac',primary);
  document.documentElement.style.setProperty('--ac2',secondary);
  document.documentElement.style.setProperty('--acg',hexToRgba(primary,.25));
  document.documentElement.style.setProperty('--acd',hexToRgba(primary,.10));
  localStorage.setItem('gt_ac',primary); localStorage.setItem('gt_ac2',secondary);
  closeModal('themeSettingsModal'); toast('Tema değişti');
};
function hexToRgba(hex,a){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}
function loadTheme(){
  const p=localStorage.getItem('gt_ac'), s2=localStorage.getItem('gt_ac2');
  if(p && s2){
    document.documentElement.style.setProperty('--ac',p);
    document.documentElement.style.setProperty('--ac2',s2);
    document.documentElement.style.setProperty('--acg',hexToRgba(p,.25));
    document.documentElement.style.setProperty('--acd',hexToRgba(p,.10));
  }
  if(localStorage.getItem('gt_light')==='1') document.body.classList.add('light');
}

window.openModal=openModal; window.closeModal=closeModal; window.closeAllModals=closeAllModals;
window.addReaction=addReaction;

window.editMsgInline=editMsgInline; window.addReactionPrompt=addReactionPrompt;

window.retryConn=window.retryConn; window.switchChannel=switchChannel;

/* ===== INIT ===== */
async function init(){
  initThreeJS();
  loadTheme();
  // Restore state from localStorage
  try{
    const raw=localStorage.getItem('gt_state');
    if(raw){
      const saved=JSON.parse(raw); const s=G();
      ['channels','categories','dmFriends','roles','userRoles','serverSettings',
       'pinnedMessages','userStatuses','notifications','unreadCounts','blockedUsers',
       'polls','lang','dmUnread','offlineQueue','channelScrollPositions',
       'userStatus','captchaVerified'].forEach(k=>{ if(saved[k]!==undefined) s[k]=saved[k]; });
    }
  }catch(e){ console.warn('State restore failed:', e); }
  // Fix 6: Load messageDb from IndexedDB (fallback to localStorage)
  try{
    const msgs = await IDB.loadMessages();
    if(msgs && msgs.length){ G().messageDb=msgs; }
    else {
      const fallback=localStorage.getItem('gt_msgs');
      if(fallback) G().messageDb=JSON.parse(fallback);
    }
  }catch(e){
    try{ const fb=localStorage.getItem('gt_msgs'); if(fb) G().messageDb=JSON.parse(fb); }catch(e2){}
  }
  // Restore user/token
  try{
    const u=localStorage.getItem('gt_user'), tk=localStorage.getItem('gt_token');
    if(u && tk){ const s=G(); s.user=JSON.parse(u); s.token=tk; if(!s.userRoles[s.user._id]) s.userRoles[s.user._id]=['r4']; }
  }catch(e){}
  // Render (loading screen hidden inside renderApp)
  renderApp();
  // Fix 7: Service Worker — blob URL unreliable, use try/catch with proper fallback
  if('serviceWorker' in navigator){
    try{
      const swCode=[
        "const C='gettic-v3';",
        "self.addEventListener('install',e=>self.skipWaiting());",
        "self.addEventListener('activate',e=>{e.waitUntil(caches.keys().then(ks=>Promise.all(ks.filter(k=>k!==C).map(k=>caches.delete(k)))));clients.claim();});",
        "self.addEventListener('fetch',e=>{if(e.request.method!=='GET'||e.request.url.includes('socket.io'))return;",
        "e.respondWith(fetch(e.request).then(r=>{const cl=r.clone();if(r.ok)caches.open(C).then(ca=>ca.put(e.request,cl));return r;}).catch(()=>caches.match(e.request)));});"
      ].join('');
      const blob = new Blob([swCode],{type:'application/javascript'});
      const url = URL.createObjectURL(blob);
      navigator.serviceWorker.register(url).then(()=>{
        setTimeout(()=>URL.revokeObjectURL(url), 5000);
      }).catch(()=>{});
    }catch(e){}
  }
}

init();

})();
