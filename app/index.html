<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gettic </title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/chat.css">
    <link rel="stylesheet" href="css/modals.css">
    <link rel="stylesheet" href="css/responsive.css">
    <style>
        #ls { position:fixed;inset:0;background:#faf6f0;z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px; }
        .spin { width:34px;height:34px;border-radius:50%;border:3px solid rgba(0,0,0,.08);border-top-color:#c94d8c;animation:spin .75s linear infinite; }
        @keyframes spin { to{transform:rotate(360deg)} }
        .ls-logo { font-size:20px;font-weight:800;background:linear-gradient(135deg,#c94d8c,#d4689e);-webkit-background-clip:text;-webkit-text-fill-color:transparent; }
    </style>
</head>
<body>
    <div id="ls"><div class="spin"></div><div class="ls-logo">gettic</div></div>

    <div data-controller="app" id="root">
        <!-- GİRİŞ EKRANI -->
<div data-app-target="login" class="auth-wrap">
    <div class="auth-box">
        <img src="https://raw.githubusercontent.com/darking053official/gettic/main/1777062266055.png" class="auth-logo" alt="Gettic">
        <div class="auth-title">gettic</div>
        <div class="auth-sub">Türkçe sohbet platformu</div>
        <div class="auth-tabs">
            <button class="auth-tab act" onclick="window._app.setTab('login')">Giriş</button>
            <button class="auth-tab" onclick="window._app.setTab('register')">Kayıt</button>
        </div>
        <input class="mi" data-app-target="username" placeholder="Kullanıcı adı">
        <input class="mi" type="password" data-app-target="password" placeholder="Şifre">
        <button class="mb" onclick="window._app.submitAuth()">Giriş</button>
    </div>
</div>

        <!-- ANA ARAYÜZ -->
        <div data-app-target="main" class="app" style="display:none;--ac:#c94d8c">
            <nav class="rail">
                <div class="ri act">#</div>
                <div class="ri-sep"></div>
                <div class="ri" data-action="click->app#toggleSidebar">☰</div>
            </nav>
            <nav data-app-target="sidebar" class="sidebar">
                <div class="sidebar-header">Genel</div>
                <div class="sidebar-scroll">
                    <div class="ch-item act" data-action="click->app#switchChannel">genel-sohbet</div>
                </div>
                <div class="sidebar-user">
                    <div class="su-av" data-app-target="avatar">G</div>
                    <div class="su-name" data-app-target="displayName">Kullanıcı</div>
                </div>
            </nav>
            <main class="chat">
                <header class="chat-header"><div class="ch-hname"># genel-sohbet</div></header>
                <div class="msgs" data-app-target="messages">
                    <div class="empty-ch"><h4># genel-sohbet</h4><p>Henüz mesaj yok</p></div>
                </div>
                <div class="input-area">
                    <textarea class="msg-inp" data-app-target="input" placeholder="Mesaj yaz..." data-action="keydown.enter->app#sendMessage"></textarea>
                    <button class="ib" style="background:var(--gr)" data-action="click->app#sendMessage">➤</button>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@hotwired/stimulus@3/dist/stimulus.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/store.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app-stimulus.js"></script>
    <script>
setTimeout(function() {
    var ls = document.getElementById('ls');
    if (ls && ls.style.display !== 'none') {
        ls.style.display = 'none';
        console.log('Zorla kaldırıldı');
    }
}, 3000);
    </script>
    <script>
alert('Sayfa yüklendi! Stimulus: ' + (typeof Stimulus !== 'undefined' ? 'VAR' : 'YOK'));
    </script>
</body>
</html>
