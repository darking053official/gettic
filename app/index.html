<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover, maximum-scale=1.0">
    <title>Gettic — Sohbet Platformu</title>
    <link rel="icon" href="https://raw.githubusercontent.com/darking053official/gettic/main/1777062266055.png">
    <meta name="theme-color" content="#c94d8c">
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- CSS'i buraya ekleyeceksin -->
    <style>
/* =============================================
   GETTIC — "Parşömen" Teması - style.css
   Açık renkli, soft, modern, vintage esintili
   ============================================= */

/* ===== CSS VARIABLES ===== */
:root {
  /* Parşömen arka plan tonları */
  --bg:   #faf6f0;
  --bg1:  #f5efe5;
  --bg2:  #efe7da;
  --bg3:  #e8dfd0;
  --bg4:  #ddd3c0;

  /* Kenar çizgileri */
  --b:    rgba(0,0,0,.05);
  --b2:   rgba(0,0,0,.08);
  --b3:   rgba(0,0,0,.12);

  /* Vurgu renkleri - Pembe/Mor (Magenta) ikonlar için */
  --ac:   #c94d8c;
  --ac2:  #d4689e;
  --ac3:  #e08db5;
  --acg:  rgba(201,77,140,.18);
  --acd:  rgba(201,77,140,.08);
  --acdh: rgba(201,77,140,.14);

  /* Yeşil - Aksiyon butonu (gönder) */
  --gr:   #2ecc71;
  --gr2:  #27ae60;

  /* Kırmızı - Silme / Tehlike */
  --re:   #e74c3c;
  --re2:  #c0392b;

  /* Sarı - Uyarı */
  --ye:   #f39c12;

  /* Mavi - Bilgi */
  --bl:   #3498db;

  /* Metin renkleri */
  --t1:   #2c2416;      /* Ana metin - koyu kahve */
  --t2:   #6b5e4a;      /* İkincil metin - orta kahve */
  --t3:   #9e9078;      /* Üçüncül metin - açık kahve */

  /* Font */
  --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
  --mono: 'JetBrains Mono', 'Fira Code', monospace;

  /* Layout */
  --rail:  62px;
  --side:  240px;
  --panel: 252px;
  --userpanel-w: 252px;
   
  /* Safe Area */
  --st: env(safe-area-inset-top,    0px);
  --sb: env(safe-area-inset-bottom, 0px);
  --sl: env(safe-area-inset-left,   0px);
  --sr: env(safe-area-inset-right,  0px);

  /* Transition */
  --tr: .14s cubic-bezier(.3,.8,.4,1);
}

/* ===== RESET ===== */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--t1);
  height: 100dvh;
  overflow: hidden;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  padding: var(--st) var(--sr) var(--sb) var(--sl);
}

/* ===== SCROLLBAR ===== */
::-webkit-scrollbar       { width: 3px; height: 3px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--ac3); border-radius: 3px; }
* { scrollbar-width: thin; scrollbar-color: var(--ac3) transparent; }
:focus-visible { outline: 2px solid var(--ac); outline-offset: 2px; border-radius: 4px; }

/* ===== LOADING ===== */
#ls {
  position: fixed; inset: 0; background: var(--bg); z-index: 99999;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
  transition: opacity .45s, visibility .45s;
}
#ls.hide { opacity: 0; visibility: hidden; pointer-events: none; }

.spin {
  width: 34px; height: 34px; border-radius: 50%;
  border: 3px solid var(--b2); border-top-color: var(--ac);
  animation: spin .75s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.ls-logo {
  font-size: 20px; font-weight: 800; letter-spacing: .06em;
  background: linear-gradient(135deg, var(--ac), var(--ac2));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}

/* ===== APP SHELL ===== */
.app { display: flex; height: 100dvh; position: relative; z-index: 1; }

/* ===== SERVER RAIL ===== */
.rail {
  width: var(--rail); background: var(--bg1);
  display: flex; flex-direction: column; align-items: center;
  padding: 8px 0 10px; gap: 6px;
  border-right: 1px solid var(--b2);
  flex-shrink: 0; z-index: 20; overflow: hidden;
}

.ri {
  width: 44px; height: 44px; border-radius: 50%;
  background: var(--bg2);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; position: relative; flex-shrink: 0;
  transition: border-radius .2s, background .14s, transform .14s, box-shadow .14s;
}
.ri svg { width: 19px; height: 19px; stroke: var(--t2); fill: none; stroke-width: 1.5; transition: stroke .14s; }
.ri:hover, .ri.act {
  border-radius: 14px; background: var(--ac);
  transform: translateY(-1px); box-shadow: 0 4px 18px var(--acg);
}
.ri:hover svg, .ri.act svg { stroke: #fff; }
.ri.act::after {
  content: ''; position: absolute; right: -6px; top: 50%; transform: translateY(-50%);
  width: 4px; height: 18px; background: var(--ac); border-radius: 2px;
}
.ri.home-icon { background: linear-gradient(135deg, var(--ac), var(--ac2)); }
.ri.home-icon svg { stroke: #fff; }
.ri.home-icon:hover { filter: brightness(1.1); }
.ri-sep  { width: 28px; height: 1px; background: var(--b3); margin: 2px 0; }
.ri-push { margin-top: auto; }
.notif-dot {
  position: absolute; top: 4px; right: 4px;
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--re); border: 2px solid var(--bg1);
}

/* ===== CHANNEL SIDEBAR ===== */
.sidebar {
  width: var(--side); background: var(--bg);
  display: flex; flex-direction: column;
  border-right: 1px solid var(--b2);
  flex-shrink: 0; z-index: 10;
  transition: left .22s ease; overflow: hidden;
}

.sidebar-header {
  height: 46px; padding: 0 12px;
  display: flex; align-items: center; gap: 8px;
  border-bottom: 1px solid var(--b2);
  font-weight: 800; font-size: 13px;
  background: var(--bg1); cursor: pointer; flex-shrink: 0;
  transition: background .12s;
}
.sidebar-header:hover { background: var(--bg2); }
.sidebar-header svg { width: 15px; height: 15px; stroke: var(--ac); fill: none; stroke-width: 1.5; flex-shrink: 0; }

.sidebar-scroll { flex: 1; overflow-y: auto; padding-bottom: 8px; }

.ch-cat {
  padding: 14px 12px 4px;
  font-size: 9.5px; font-weight: 700; text-transform: uppercase;
  color: var(--t3); letter-spacing: .8px;
  display: flex; justify-content: space-between; align-items: center;
}
.ch-cat button {
  background: none; border: none; color: var(--t3);
  cursor: pointer; font-size: 16px; line-height: 1; padding: 0 2px;
  transition: color .12s;
}
.ch-cat button:hover { color: var(--ac); }

.ch-item {
  padding: 6px 12px; margin: 1px 6px; border-radius: 7px;
  display: flex; align-items: center; gap: 7px;
  cursor: pointer; font-size: 12px; color: var(--t2);
  transition: background .10s, color .10s;
}
.ch-item svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.5; flex-shrink: 0; }
.ch-item:hover,
.ch-item:focus-visible { background: var(--bg2); color: var(--t1); outline: none; }
.ch-item.act { background: var(--acd); color: var(--ac); font-weight: 600; }
.ch-item .ch-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ch-item .ch-acts { display: none; gap: 2px; }
.ch-item:hover .ch-acts,
.ch-item:focus-within .ch-acts { display: flex; }
.ch-acts button {
  background: none; border: none; color: var(--t3);
  cursor: pointer; padding: 2px; border-radius: 3px;
  display: flex; align-items: center; transition: color .1s;
}
.ch-acts button:hover { color: var(--re); }

.ub {
  background: var(--re); color: #fff;
  font-size: 9px; padding: 1px 5px; border-radius: 8px;
  font-weight: 700; min-width: 17px; text-align: center; flex-shrink: 0;
}

.add-cat-btn {
  padding: 7px 18px; font-size: 11px; color: var(--t3);
  cursor: pointer; background: none; border: none;
  text-align: left; width: 100%; font-weight: 600; transition: color .12s;
}
.add-cat-btn:hover { color: var(--ac); }

/* ===== SIDEBAR USER BAR ===== */
.sidebar-user {
  padding: 8px 10px; border-top: 1px solid var(--b2);
  background: var(--bg1); display: flex; align-items: center; gap: 8px;
  cursor: pointer; flex-shrink: 0; transition: background .12s;
}
.sidebar-user:hover { background: var(--bg2); }

.su-av {
  width: 32px; height: 32px; border-radius: 50%;
  background: linear-gradient(135deg, var(--ac), var(--ac2));
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 13px; color: #fff;
  flex-shrink: 0; position: relative;
}
.su-dot {
  position: absolute; bottom: 0; right: 0;
  width: 9px; height: 9px; border-radius: 50%; border: 2px solid var(--bg1);
}
.su-dot.online  { background: var(--gr); }
.su-dot.idle    { background: var(--ye); }
.su-dot.dnd     { background: var(--re); }
.su-dot.offline { background: var(--t3); }

.su-info { flex: 1; min-width: 0; }
.su-name { font-size: 12px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.su-tag  { font-size: 10px; color: var(--t3); }

/* ===== VOICE BAR ===== */
.vbar {
  background: var(--bg2); border-radius: 8px;
  display: flex; align-items: center; gap: 7px;
  font-size: 11px; font-weight: 600; border: 1px solid var(--b2);
  max-height: 0; opacity: 0; overflow: hidden; padding: 0 8px;
  transition: max-height .28s ease, opacity .22s ease, padding .22s ease, margin .22s ease;
}
.vbar.show { max-height: 52px; opacity: 1; padding: 7px 8px; margin: 4px 8px; }

.vbar-info { flex: 1; min-width: 0; }
.vbar-st   { display: flex; align-items: center; gap: 4px; color: var(--gr); font-size: 10px; }
.vbar-ch   { font-size: 10px; color: var(--t3); }

.vpulse { width: 6px; height: 6px; border-radius: 50%; background: var(--gr); animation: pulse 1.2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }

.vctrl { display: flex; gap: 3px; }
.vb {
  background: var(--bg3); border: none;
  width: 26px; height: 26px; border-radius: 6px;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: all .12s;
}
.vb svg { width: 13px; height: 13px; stroke: var(--t2); fill: none; stroke-width: 1.5; transition: stroke .12s; }
.vb:hover        { background: var(--ac); }
.vb:hover svg    { stroke: #fff; }
.vb.muted        { background: var(--re); }
.vb.muted svg    { stroke: #fff; }

/* ===== CHAT AREA ===== */
.chat { flex: 1; display: flex; flex-direction: column; background: var(--bg); min-width: 0; }

.chat-header {
  height: 46px; padding: 0 14px;
  display: flex; align-items: center; gap: 8px;
  border-bottom: 1px solid var(--b2); background: var(--bg1); flex-shrink: 0;
}
.chat-header svg { width: 15px; height: 15px; stroke: var(--ac); fill: none; stroke-width: 1.5; flex-shrink: 0; }
.ch-hname  { font-weight: 700; font-size: 13px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ch-htopic { font-size: 10px; color: var(--t3); flex-shrink: 0; max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hacts     { display: flex; gap: 4px; }

.ib {
  background: var(--bg2); border: none;
  width: 30px; height: 30px; border-radius: 7px;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: background var(--tr), transform var(--tr); flex-shrink: 0;
}
.ib svg { width: 14px; height: 14px; stroke: var(--t2); fill: none; stroke-width: 1.5; transition: stroke .12s; }
.ib:hover, .ib.act { background: var(--ac); transform: scale(1.05); }
.ib:hover svg, .ib.act svg { stroke: #fff; }

/* ===== CONNECTION BAR ===== */
#connbar {
  height: 0; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
  gap: 8px; font-size: 11px; font-weight: 600; color: #fff;
  background: var(--re); transition: height .22s; flex-shrink: 0;
}
#connbar.show { height: 28px; }
#connbar button {
  background: rgba(255,255,255,.2); border: none;
  padding: 2px 9px; border-radius: 4px;
  color: #fff; cursor: pointer; font-size: 11px; font-weight: 600;
}
#connbar svg { width: 13px; height: 13px; stroke: #fff; fill: none; stroke-width: 1.5; }

/* ===== MESSAGES ===== */
.msgs {
  flex: 1; overflow-y: auto; overflow-x: hidden;
  contain: layout style; scrollbar-gutter: stable;
}
.msgs-inner {
  display: flex; flex-direction: column;
  gap: 1px; padding: 10px 12px 18px;
}

/* Empty state */
.empty-ch { text-align: center; padding: 50px 20px; color: var(--t3); animation: fuA .3s ease; margin: auto; }
.empty-ch svg { width: 48px; height: 48px; stroke: var(--t3); fill: none; opacity: .28; margin-bottom: 12px; }
.empty-ch h4  { font-size: 15px; margin-bottom: 5px; color: var(--t2); font-weight: 700; }
.empty-ch p   { font-size: 12px; }
.create-first-btn {
  margin-top: 14px; padding: 8px 18px;
  background: var(--ac); border: none; border-radius: 9px;
  color: #fff; font-weight: 700; font-size: 12px; cursor: pointer;
  font-family: var(--font); transition: filter .12s, transform .1s;
}
.create-first-btn:hover { filter: brightness(1.08); transform: translateY(-1px); }

@keyframes fuA { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }

/* ===== MESSAGE ITEM ===== */
.msg {
  display: flex; align-items: flex-start; gap: 9px;
  padding: 4px 7px; border-radius: 7px;
  transition: background .08s; position: relative;
  word-break: break-word; overflow-wrap: break-word;
  animation: fuA .14s ease;
}
.msg:hover, .msg:focus-within { background: var(--bg2); }
.msg:hover .ma, .msg:focus-within .ma { display: flex; }
.msg.pinned { background: rgba(243,156,18,.06); border-left: 3px solid var(--ye); padding-left: 10px; }

.msg-av {
  width: 32px; height: 32px; border-radius: 50%;
  background: linear-gradient(135deg, var(--ac), var(--ac2));
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; flex-shrink: 0; font-size: 13px; color: #fff;
  cursor: pointer; transition: transform .12s, box-shadow .12s;
}
.msg-av:hover { transform: scale(1.08); box-shadow: 0 2px 10px var(--acg); }

.msg-body { flex: 1; min-width: 0; overflow: hidden; }
.msg-head {
  font-size: 11px; font-weight: 700; margin-bottom: 2px;
  display: flex; align-items: center; gap: 5px; flex-wrap: wrap;
}
.msg-un     { cursor: pointer; transition: color .12s; }
.msg-un:hover { color: var(--ac); }
.rbadge {
  font-size: 8px; padding: 1px 5px; border-radius: 3px;
  font-weight: 700; text-transform: uppercase; letter-spacing: .4px;
}
.msg-time   { font-weight: 400; font-size: 9px; color: var(--t3); }
.msg-edited { font-size: 9px; color: var(--t3); font-style: italic; }

.msg-text { font-size: 12.5px; line-height: 1.5; color: var(--t2); overflow-wrap: anywhere; }
.msg-text b    { color: var(--t1); font-weight: 700; }
.msg-text i    { font-style: italic; }
.msg-text code { background: var(--bg3); padding: 1px 5px; border-radius: 4px; font-family: var(--mono); font-size: 10.5px; color: var(--ac); }
.msg-text pre  { background: var(--bg3); padding: 10px; border-radius: 7px; font-family: var(--mono); font-size: 11px; overflow-x: auto; margin-top: 4px; border: 1px solid var(--b2); }

/* ===== MSG ACTIONS ===== */
.ma {
  display: none; position: absolute; right: 7px; top: -12px;
  background: var(--bg4); border-radius: 6px; padding: 2px; gap: 1px;
  box-shadow: 0 4px 14px rgba(0,0,0,.15); z-index: 5; border: 1px solid var(--b3);
}
.ma button {
  background: none; border: none; color: var(--t2);
  cursor: pointer; padding: 4px 6px; border-radius: 4px;
  display: flex; align-items: center; transition: background .08s, color .08s;
}
.ma button:hover { background: var(--bg3); color: var(--t1); }
.ma button svg  { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 1.5; }

/* ===== REACTIONS ===== */
.reacts { display: flex; gap: 3px; margin-top: 3px; flex-wrap: wrap; }
.react {
  background: var(--bg3); border-radius: 6px; padding: 2px 7px;
  font-size: 11px; cursor: pointer;
  transition: all .08s; border: 1px solid transparent;
  display: flex; align-items: center; gap: 3px;
}
.react:hover { border-color: var(--b3); background: var(--bg4); }
.react.me    { background: var(--acd); border-color: var(--ac); }

/* ===== POLL ===== */
.poll-box  { background: var(--bg2); border: 1px solid var(--b2); border-radius: 10px; padding: 10px 12px; margin-top: 6px; max-width: 340px; }
.poll-q    { font-size: 12px; font-weight: 700; margin-bottom: 8px; color: var(--t1); }
.poll-opts { display: flex; flex-direction: column; gap: 5px; }
.poll-opt  {
  background: var(--bg3); border-radius: 7px; padding: 7px 10px; cursor: pointer;
  font-size: 11px; display: flex; align-items: center; gap: 8px;
  border: 1px solid transparent; position: relative; overflow: hidden;
  transition: border-color .12s;
}
.poll-opt:hover  { border-color: var(--b3); }
.poll-opt.voted  { background: var(--acd); border-color: var(--ac); }
.poll-bar { position: absolute; left: 0; top: 0; bottom: 0; background: var(--acg); border-radius: 7px; transition: width .4s ease; z-index: 0; }
.poll-opt span { position: relative; z-index: 1; }
.poll-pct  { margin-left: auto; font-size: 10px; color: var(--t3); position: relative; z-index: 1; }

/* ===== TYPING INDICATOR ===== */
.typing { padding: 2px 14px; font-size: 10px; color: var(--t3); font-style: italic; height: 20px; flex-shrink: 0; }
.tdots { display: inline-flex; gap: 2px; vertical-align: middle; }
.tdots span { width: 3px; height: 3px; background: var(--t3); border-radius: 50%; animation: blink 1.2s infinite; }
.tdots span:nth-child(2) { animation-delay: .2s; }
.tdots span:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%,80%,100%{opacity:.2} 40%{opacity:1} }

/* ===== INPUT AREA ===== */
.input-area {
  padding: 7px 12px calc(10px + var(--sb));
  background: var(--bg1); border-top: 1px solid var(--b2);
  display: flex; gap: 5px; align-items: flex-end; flex-shrink: 0;
}
.msg-inp {
  flex: 1; background: var(--bg); border: 1px solid var(--b2); border-radius: 20px;
  padding: 9px 14px; color: var(--t1); font-size: 13px; outline: none;
  transition: border-color var(--tr), box-shadow var(--tr);
  font-family: var(--font); resize: none; max-height: 120px; line-height: 1.4;
  scrollbar-width: none;
}
.msg-inp:focus           { border-color: var(--ac); box-shadow: 0 0 0 3px var(--acg); }
.msg-inp::placeholder    { color: var(--t3); }
.msg-inp::-webkit-scrollbar { display: none; }

/* ===== EMOJI POPUP ===== */
.epop {
  position: fixed; background: var(--bg2); border-radius: 12px;
  display: none; z-index: 300; border: 1px solid var(--b2);
  box-shadow: 0 8px 26px rgba(0,0,0,.12);
  max-height: 230px; overflow-y: auto; padding: 8px;
}
.epop.show { display: block; animation: fuA .12s ease; }
.egrid { display: flex; flex-wrap: wrap; gap: 2px; }
.es { font-size: 18px; cursor: pointer; padding: 5px; border-radius: 6px; transition: background .08s; line-height: 1; }
.es:hover { background: var(--bg3); }

/* ===== HOME PANEL ===== */
.home-panel  { flex: 1; display: flex; flex-direction: column; background: var(--bg); min-width: 0; overflow: hidden; }
.home-header {
  height: 46px; padding: 0 16px;
  display: flex; align-items: center; gap: 8px;
  border-bottom: 1px solid var(--b2); background: var(--bg1);
  font-weight: 800; font-size: 14px; flex-shrink: 0;
}
.home-header svg { width: 16px; height: 16px; stroke: var(--ac); fill: none; stroke-width: 1.5; }
.home-body { flex: 1; overflow-y: auto; padding: 16px; }
.home-section { margin-bottom: 20px; }
.home-sec-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .8px; color: var(--t3); margin-bottom: 8px; padding: 0 2px; }

.friend-item {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 10px; border-radius: 9px; cursor: pointer; transition: background .1s;
}
.friend-item:hover { background: var(--bg2); }
.friend-av {
  width: 38px; height: 38px; border-radius: 50%;
  background: linear-gradient(135deg, var(--ac), var(--ac2));
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 15px; color: #fff; flex-shrink: 0; position: relative;
}
.friend-info   { flex: 1; min-width: 0; }
.friend-name   { font-size: 13px; font-weight: 600; }
.friend-status { font-size: 11px; color: var(--t3); }
.friend-acts   { display: flex; gap: 5px; }
.friend-acts button {
  background: var(--bg3); border: none;
  width: 30px; height: 30px; border-radius: 7px; cursor: pointer;

        function drawCap(cvs) { const ctx=cvs.getContext('2d'),w=cvs.width,h=cvs.height; ctx.fillStyle='#faf6f0';ctx.fillRect(0,0,w,h); for(let i=0;i<5;i++){ctx.beginPath();ctx.moveTo(Math.random()*w,Math.random()*h);ctx.lineTo(Math.random()*w,Math.random()*h);ctx.strokeStyle='rgba(201,77,140,'+(Math.random()*.3+.08)+')';ctx.lineWidth=Math.random()*2+.5;ctx.stroke();} for(let i=0;i<25;i++){ctx.beginPath();ctx.arc(Math.random()*w,Math.random()*h,Math.random()*2,0,Math.PI*2);ctx.fillStyle='rgba(0,0,0,'+(Math.random()*.15+.03)+')';ctx.fill();} ctx.textBaseline='middle'; _cc.split('').forEach((c,i)=>{const x=w/5*(i+.7),y=h/2+Math.random()*8-4;ctx.save();ctx.translate(x,y);ctx.rotate(Math.random()*.4-.2);ctx.font='bold '+(28+Math.random()*4)+'px "Courier New",monospace';ctx.fillStyle='hsl('+(330+Math.random()*30)+',60%,'+(40+Math.random()*20)+'%)';ctx.fillText(c,0,0);ctx.restore();}); }

searchInput" class="mi" placeholder="'+t('search')+'..." autocomplete="off"><div id="searchResults"></div></div></div><div id="notifModal" class="modal"><div class="mbox"><button class="mclose" onclick="closeModal(\'notifModal\')">×</button><h2>'+I.bell+' Bildirimler</h2><div id="notifList"></div></div></div><div id="pollModal" class="modal"><div class="mbox"><button class="mclose" onclick="closeModal(\'pollModal\')">×</button><h2>'+I.poll+' Anket Oluştur</h2><label class="ml">Soru</label><input id="pollQuestion" class="mi" placeholder="Soru..."><label class="ml">Seçenek 1</label><input id="pollOption1" class="mi" placeholder="Seçenek 1"><label class="ml">Seçenek 2</label><input id="pollOption2" class="mi" placeholder="Seçenek 2"><input id="pollOption3" class="mi" placeholder="Seçenek 3 (isteğe bağlı)"><button class="mb" onclick="createPoll()">Başlat</button></div></div>'; }

        function bindUI() {
            document.getElementById('sendBtn')?.addEventListener('click',sendMsg);
            const inp=document.getElementById('messageInput');if(inp){inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg();}});inp.addEventListener('input',()=>{inp.style.height='auto';inp.style.height=Math.min(inp.scrollHeight,120)+'px';const s2=G();if(s2.socket)s2.socket.emit('typing',{channelId:s2.channel.id,username:s2.user?.username});});}
            document.getElementById('emojiBtn')?.addEventListener('click',toggleEmoji);
            document.getElementById('uploadBtn')?.addEventListener('click',uploadFile);
            document.getElementById('serverHeader')?.addEventListener('click',()=>openModal('serverSettingsModal'));
            document.getElementById('statusProfile')?.addEventListener('click',()=>openModal('profileModal'));
            document.getElementById('addServerBtn')?.addEventListener('click',()=>openModal('addServerModal'));
            document.getElementById('addCategoryBtn')?.addEventListener('click',()=>openModal('addCategoryModal'));
            document.getElementById('toggleSidebarBtn')?.addEventListener('click',()=>document.getElementById('sidebar')?.classList.toggle('open'));
            document.getElementById('toggleSettingsBtn')?.addEventListener('click',()=>openModal('themeSettingsModal'));
            document.getElementById('themeToggleBtn')?.addEventListener('click',toggleLight);
            document.getElementById('muteBtn')?.addEventListener('click',()=>Voice.toggleMute());
            document.getElementById('deafenBtn')?.addEventListener('click',()=>Voice.toggleDeafen());
            document.getElementById('leaveVoiceBtn')?.addEventListener('click',()=>Voice.leave());
            document.getElementById('searchInput')?.addEventListener('input',debounce(doSearch,200));
            document.getElementById('messagesContainer')?.addEventListener('scroll',()=>{const c=document.getElementById('messagesContainer');if(c)G().channelScrollPositions[G().channel.id]=c.scrollTop;},{passive:true});
            document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeAllModals();document.getElementById('ctxmenu')?.classList.remove('show');}if(e.ctrlKey&&e.key==='k'){e.preventDefault();openModal('searchModal');setTimeout(()=>document.getElementById('searchInput')?.focus(),80);}});
            document.addEventListener('click',e=>{if(e.target.classList?.contains('modal'))closeAllModals();});
            document.addEventListener('contextmenu',ctxMenu);
            document.addEventListener('click',e=>{if(!e.target.closest('.ctxmenu'))document.getElementById('ctxmenu')?.classList.remove('show');});
            window.addEventListener('online',()=>{updateCUI(true);Socket.connect();});
            window.addEventListener('offline',()=>updateCUI(false));
            if(Notification.permission==='default')Notification.requestPermission().catch(()=>{});
        }

        const EMOJIS=['😀','😂','❤️','🔥','🎉','👍','👎','🙏','🎮','💻','✨','✅','❌','😮','😢','😡','🥳','👋','🤔','😎','💯','🎯','🚀','⭐','💜','🧡','💙','💚','🤝','👀','💬','🎵'];
        function toggleEmoji(){const popup=document.getElementById('epop');if(!popup)return;if(popup.classList.contains('show')){popup.classList.remove('show');return;}popup.innerHTML='<div class="egrid">'+EMOJIS.map(e=>'<span class="es" role="button" tabindex="0">'+e+'</span>').join('')+'</div>';popup.querySelectorAll('.es').forEach(el=>{const add=()=>{const i=document.getElementById('messageInput');if(i){i.value+=el.textContent;i.focus();}popup.classList.remove('show');};el.addEventListener('click',add);});popup.classList.add('show');}
        function uploadFile(){const fi=document.createElement('input');fi.type='file';fi.accept='image/*,video/*,.pdf,.txt,.zip';fi.onchange=()=>{if(!fi.files[0])return;const f=fi.files[0];if(f.size>10*1024*1024)return toast('Maks. 10MB','e');const inp=document.getElementById('messageInput');if(inp){inp.value+=' [📎 '+f.name+'] ';inp.focus();}};fi.click();}

        function ctxMenu(e){e.preventDefault();const menu=document.getElementById('ctxmenu');const msgEl=e.target.closest?.('.msg');if(msgEl){const mid=msgEl.dataset.id;const s=G();const msg=s.messageDb.find(m=>m._id===mid);const isOwn=msg?.senderId===s.user?._id;const canDelete=isOwn||hasPermission(s.user._id,'deleteMsg');menu.innerHTML='<button onclick="copyMsg(\''+mid+'\')">'+I.copy+' '+t('copy')+'</button><button onclick="addReactionPrompt(\''+mid+'\')">'+I.reaction+' '+t('reaction')+'</button>'+(isOwn?'<button onclick="editMsgInline(\''+mid+'\')">'+I.edit+' '+t('edit')+'</button>':'')+(canDelete?'<div class="ctx-sep"></div><button class="danger" onclick="deleteMsg(\''+mid+'\')">'+I.trash+' '+t('delete')+'</button>':'')+'<button onclick="pinMsg(\''+mid+'\')">'+I.pin+' '+t('pin')+'</button>';}else{menu.innerHTML='<button onclick="openModal(\'addChannelModal\')">'+I.plus+' Kanal Ekle</button><button onclick="openModal(\'addCategoryModal\')">📁 Kategori Ekle</button>';}menu.style.left=Math.min(e.clientX,innerWidth-175)+'px';menu.style.top=Math.min(e.clientY,innerHeight-230)+'px';menu.classList.add('show');}
        function copyMsg(mid){const msg=G().messageDb.find(m=>m._id===mid);if(!msg){document.getElementById('ctxmenu')?.classList.remove('show');return;}if(navigator.clipboard)navigator.clipboard.writeText(msg.content).then(()=>toast('Kopyalandı')).catch(()=>fallbackCopy(msg.content));else fallbackCopy(msg.content);document.getElementById('ctxmenu')?.classList.remove('show');}
        function fallbackCopy(text){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast('Kopyalandı');}
        function deleteMsg(mid){const s=G();const msg=s.messageDb.find(m=>m._id===mid);if(!msg)return;if(msg.senderId!==s.user?._id&&!hasPermission(s.user._id,'deleteMsg'))return toast('Yetkiniz yok','e');s.messageDb=s.messageDb.filter(m=>m._id!==mid);S.persist();loadMsgs();if(s.socket)s.socket.emit('delete_message',{id:mid,channelId:s.channel.id});toast('Silindi');document.getElementById('ctxmenu')?.classList.remove('show');}
        function pinMsg(mid){const s=G();const msg=s.messageDb.find(m=>m._id===mid);if(!msg)return;s.pinnedMessages[s.channel.id]=msg;S.persist();loadMsgs();toast('📌 Sabitlendi');document.getElementById('ctxmenu')?.classList.remove('show');}
        function editMsgInline(mid){document.getElementById('ctxmenu')?.classList.remove('show');const el=document.querySelector('.msg[data-id="'+mid+'"]');if(!el)return;const s=G();const msg=s.messageDb.find(m=>m._id===mid);if(!msg)return;const textEl=el.querySelector('.msg-text');if(!textEl)return;const origHTML=textEl.innerHTML;textEl.innerHTML='<input class="edit-inp" id="editInp_'+mid+'" value="'+esc(msg.content)+'"><div class="edit-acts"><button class="edit-btn save" onclick="saveEditInline(\''+mid+'\')">Kaydet</button><button class="edit-btn cancel" onclick="cancelEdit(\''+mid+'\',\''+encodeURIComponent(origHTML)+'\')">İptal</button></div>';document.getElementById('editInp_'+mid)?.focus();}
        window.saveEditInline=function(mid){const inp=document.getElementById('editInp_'+mid);if(!inp)return;const s=G();const msg=s.messageDb.find(m=>m._id===mid);if(!msg)return;const newContent=inp.value.trim();if(!newContent)return;msg.content=newContent;msg.edited=true;S.persist();if(s.socket)s.socket.emit('edit_message',{id:mid,content:newContent,channelId:s.channel.id});loadMsgs();};
        window.cancelEdit=function(mid,origEncoded){const el=document.querySelector('.msg[data-id="'+mid+'"] .msg-text');if(el)el.innerHTML=decodeURIComponent(origEncoded);};
        function addReactionPrompt(mid){document.getElementById('ctxmenu')?.classList.remove('show');const reacts=['👍','👎','❤️','😂','😮','😢','🔥','🎉','✅'];const popup=document.createElement('div');popup.style.cssText='position:fixed;background:var(--bg);border:1px solid var(--b2);border-radius:10px;padding:8px;z-index:2500;display:flex;flex-wrap:wrap;gap:4px;box-shadow:0 8px 28px rgba(0,0,0,.12);';popup.innerHTML=reacts.map(r=>'<span style="font-size:20px;cursor:pointer;padding:4px;border-radius:5px;">'+r+'</span>').join('');document.body.appendChild(popup);popup.querySelectorAll('span').forEach(el=>el.addEventListener('click',()=>{addReaction(mid,el.textContent.trim());popup.remove();}));setTimeout(()=>document.addEventListener('click',function rem(){popup.remove();document.removeEventListener('click',rem);},{once:true}),100);}
        function addReaction(mid,emoji){const s=G();const msg=s.messageDb.find(m=>m._id===mid);if(!msg)return;if(!msg.reactions)msg.reactions={};if(!msg.reactions[emoji])msg.reactions[emoji]=[];const uid=s.user._id;const idx=msg.reactions[emoji].indexOf(uid);if(idx===-1)msg.reactions[emoji].push(uid);else msg.reactions[emoji].splice(idx,1);if(!msg.reactions[emoji].length)delete msg.reactions[emoji];S.persist();loadMsgs();}

        // CHANNELS
        function renderCh(){const c=document.getElementById('channelCategories');if(!c)return;const s=G();let h='';s.categories.forEach(cat=>{h+='<div class="ch-cat">'+esc(cat)+'<button data-cat="'+esc(cat)+'" title="Kanal ekle">+</button></div>';s.channels.filter(ch=>ch.category===cat).forEach(ch=>{const icon=ch.type==='voice'?I.volume:I.hash;const cls=ch.id===s.channel.id?' act':'';const ur=s.unreadCounts[ch.id]||0;h+='<div class="ch-item'+cls+'" data-id="'+esc(ch.id)+'" data-type="'+ch.type+'" tabindex="0"><span>'+icon+'</span><span class="ch-name">'+esc(ch.name)+'</span>'+(ur>0?'<span class="ub">'+(ur>99?'99+':ur)+'</span>':'')+'<span class="ch-acts"><button data-action="edit" title="Düzenle">'+I.edit+'</button><button data-action="delete" title="Sil">'+I.trash+'</button></span></div>';});});c.innerHTML=h||'<div class="empty-ch"><svg viewBox="0 0 24 24">'+I.hash+'</svg>'+t('noChannels')+'</div>';c.querySelectorAll('.ch-item').forEach(el=>{el.addEventListener('click',e=>{if(e.target.closest('.ch-acts'))return;if(el.dataset.type==='voice')Voice.join(el.dataset.id);else switchCh(el.dataset.id);});});c.querySelectorAll('[data-action="edit"]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();openEditCh(e.target.closest('.ch-item').dataset.id);}));c.querySelectorAll('[data-action="delete"]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();delCh(e.target.closest('.ch-item').dataset.id);}));c.querySelectorAll('.ch-cat button[data-cat]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();setupCC(b.dataset.cat);openModal('addChannelModal');}));}
        function setupCC(cat){const sel=document.getElementById('channelCategory');if(!sel)return;sel.innerHTML='<option value="">Kategori</option>'+G().categories.map(c=>'<option value="'+esc(c)+'" '+(c===cat?'selected':'')+'>'+esc(c)+'</option>').join('');}
        function switchCh(id){const s=G();const ch=s.channels.find(c=>c.id===id);if(!ch)return;const cont=document.getElementById('messagesContainer');if(cont)s.channelScrollPositions[s.channel.id]=cont.scrollTop;s.channel={id:ch.id,name:ch.name,topic:ch.topic||'Sohbet odası'};s.unreadCounts[ch.id]=0;S.persist();const nameEl=document.getElementById('chatChannelName');if(nameEl)nameEl.textContent='# '+ch.name;document.getElementById('chatChannelTopic')&&(document.getElementById('chatChannelTopic').textContent=ch.topic||'');renderCh();loadMsgs();if(s.socket)s.socket.emit('join_channel',ch.id);document.getElementById('sidebar')?.classList.remove('open');}
        function openEditCh(id){const s=G();const ch=s.channels.find(c=>c.id===id);if(!ch)return;document.getElementById('editChannelId').value=ch.id;document.getElementById('editChannelName').value=ch.name;openModal('editChannelModal');}
        window.saveChannelEdit=function(){const s=G();const id=document.getElementById('editChannelId')?.value;const n=document.getElementById('editChannelName')?.value.trim();if(!n||!id)return;const ch=s.channels.find(c=>c.id===id);if(!ch)return;ch.name=n;S.persist();renderCh();closeModal('editChannelModal');toast('Kanal güncellendi');};
        function delCh(id){const s=G();if(!hasPermission(s.user._id,'manageChannels')&&!hasPermission(s.user._id,'all'))return toast('Yetkiniz yok','e');s.channels=s.channels.filter(c=>c.id!==id);if(s.channel.id===id){const f=s.channels.find(c=>c.type==='text');if(f)switchCh(f.id);}S.persist();renderCh();toast('Kanal silindi');}
        window.createChannel=function(){const s=G();const n=document.getElementById('newChannelName')?.value.trim();const type=document.getElementById('channelType')?.value||'text';const cat=document.getElementById('channelCategory')?.value||s.categories[0]||'METİN';if(!n)return toast('Kanal adı gerekli','e');const id=n.toLowerCase().replace(/[ıİ]/g,'i').replace(/[ğĞ]/g,'g').replace(/[üÜ]/g,'u').replace(/[şŞ]/g,'s').replace(/[öÖ]/g,'o').replace(/[çÇ]/g,'c').replace(/\s+/g,'-').replace(/[^a-z0-9\-]/g,'').substring(0,32)||genId();if(s.channels.find(c=>c.id===id))return toast('Bu kanal zaten var','e');s.channels.push({id,name:n,type,category:cat});if(!s.categories.includes(cat))s.categories.push(cat);S.persist();renderCh();closeModal('addChannelModal');toast('# '+n+' oluşturuldu');};
        window.createServer=function(){const s=G();const n=document.getElementById('newServerName')?.value.trim();if(!n)return;s.serverSettings.name=n;s.channels=[{id:'genel-sohbet',name:'genel-sohbet',type:'text',category:'METİN'},{id:'genel-ses',name:'Genel Ses',type:'voice',category:'SES'}];s.categories=['METİN','SES'];s.channel={id:'genel-sohbet',name:'genel-sohbet',topic:'Sohbet odası'};s.messageDb=[];S.persist();renderCh();loadMsgs();document.getElementById('serverNameLabel')&&(document.getElementById('serverNameLabel').textContent=n);closeModal('addServerModal');toast(n+' oluşturuldu');};
        window.addCategoryConfirm=function(){const s=G();const n=document.getElementById('newCategoryName')?.value.trim().toUpperCase();if(!n)return;if(s.categories.includes(n))return toast('Kategori zaten var','e');s.categories.push(n);S.persist();renderCh();closeModal('addCategoryModal');};
        window.saveServerSettings=function(){const s=G();const n=document.getElementById('serverName')?.value.trim()||'Gettic';s.serverSettings.name=n;document.getElementById('serverNameLabel')&&(document.getElementById('serverNameLabel').textContent=n);S.persist();closeModal('serverSettingsModal');toast('Ayarlar kaydedildi');};
        window.saveProfile=function(){const s=G();const n=document.getElementById('profileDisplayName')?.value.trim();const st=document.getElementById('profileStatus')?.value||'online';if(n&&s.user)s.user.username=n;S.update('userStatus',st);document.getElementById('userStatusDot')?.setAttribute('class','su-dot '+st);document.getElementById('userStatusText')&&(document.getElementById('userStatusText').textContent={online:'🟢 Çevrimiçi',idle:'🟡 Boşta',dnd:'🔴 Rahatsız Etme',offline:'⚫ Görünmez'}[st]||'🟢 Çevrimiçi');S.persist();closeModal('profileModal');toast('Profil güncellendi');};

        // MESSAGES
        async function sendMsg(){const s=G();const inp=document.getElementById('messageInput');if(!inp)return;const content=inp.value.trim();if(!content)return;if(!checkRL('send_'+s.user._id,8,5000))return toast('Yavaş gönder','e');if(!hasPermission(s.user._id,'sendMsg'))return toast('Yetkiniz yok','e');inp.value='';inp.style.height='auto';const msg={_id:genId(),content,senderName:s.user.username,senderId:s.user._id,channelId:s.channel.id,createdAt:new Date().toISOString(),reactions:{}};s.messageDb.push(msg);if(s.messageDb.length>MAX_DB)s.messageDb.splice(0,s.messageDb.length-MAX_DB);S.persist();addMsg(msg);if(s.socket&&s.socket.connected){s.socket.emit('send_message',msg);try{const res=await fetch(API+'/api/channels/'+s.channel.id+'/messages',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+s.token},body:JSON.stringify({content})});if(res.status===401){toast('Oturum süresi doldu','e');return;}}catch(e){s.offlineQueue.push(msg);S.persist();toast(t('savedOffline'),'w');}}else{s.offlineQueue.push(msg);S.persist();toast(t('savedOffline'),'w');}}
        function loadMsgs(){const s=G();const inner=document.getElementById('messagesInner');const cont=document.getElementById('messagesContainer');if(!inner)return;const pinned=s.pinnedMessages[s.channel.id];const msgs=s.messageDb.filter(m=>m.channelId===s.channel.id).slice(-MAX_MSGS);if(!msgs.length&&!pinned){inner.innerHTML='<div class="empty-ch">'+I.hash+'<h4># '+esc(s.channel.name)+' '+t('birth')+'</h4><p>'+t('noMessages')+'</p></div>';return;}const parts=[];if(pinned)parts.push(renderMsg(pinned,true));msgs.forEach(m=>parts.push(renderMsg(m)));inner.innerHTML=parts.join('');if(s.channelScrollPositions[s.channel.id]!==undefined&&s.channelScrollPositions[s.channel.id]!==cont.scrollHeight){cont.scrollTop=s.channelScrollPositions[s.channel.id];}else{cont.scrollTop=cont.scrollHeight;}}
        function renderMsg(m,isPinned=false){const s=G();if(s.blockedUsers.includes(m.senderId))return'';const role=getHighestRole(m.senderId||'');const badge=role&&role.id!=='r4'?'<span class="rbadge" style="background:'+role.color+'20;color:'+role.color+';">'+esc(role.name)+'</span>':'';const reacts=m.reactions||{};const rHtml=Object.entries(reacts).filter(([,u])=>u.length>0).map(([e,u])=>'<span class="react'+(u.includes(s.user?._id)?' me':'')+'" onclick="addReaction(\''+m._id+'\',\''+e+'\')">'+e+' <span>'+u.length+'</span></span>').join('');const time=new Date(m.createdAt).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});const poll=s.polls[m._id];const editedBadge=m.edited?'<span class="msg-edited">(düzenlendi)</span>':'';const pinnedClass=isPinned?' pinned':'';const formattedContent=esc(m.content).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>').replace(/`{3}([\s\S]+?)`{3}/g,'<pre>$1</pre>').replace(/`([^`\n]+?)`/g,'<code>$1</code>');return'<div class="msg'+pinnedClass+'" data-id="'+m._id+'"><div class="msg-av" onclick="showUserInfo(\''+esc(m.senderId)+'\',\''+esc(m.senderName||'')+'\')" title="'+esc(m.senderName||'')+'">'+esc((m.senderName||'?').charAt(0).toUpperCase())+'</div><div class="msg-body"><div class="msg-head"><span class="msg-un" onclick="showUserInfo(\''+esc(m.senderId)+'\',\''+esc(m.senderName||'')+'\')">'+esc(m.senderName||'?')+'</span>'+badge+'<span class="msg-time">'+time+editedBadge+'</span>'+(isPinned?'<span style="font-size:9px;color:var(--ye);font-weight:700;">📌 '+t('pinned')+'</span>':'')+'</div><div class="msg-text">'+formattedContent+'</div>'+(poll?renderPollHTML(m._id,poll):'')+(rHtml?'<div class="reacts">'+rHtml+'</div>':'')+'</div><div class="ma"><button onclick="addReactionPrompt(\''+m._id+'\')" title="'+t('reaction')+'">'+I.reaction+'</button>'+(m.senderId===G().user?._id?'<button onclick="editMsgInline(\''+m._id+'\')" title="'+t('edit')+'">'+I.edit+'</button>':'')+'<button onclick="copyMsg(\''+m._id+'\')" title="'+t('copy')+'">'+I.copy+'</button><button onclick="pinMsg(\''+m._id+'\')" title="'+t('pin')+'">'+I.pin+'</button>'+((m.senderId===G().user?._id||hasPermission(G().user?._id,'deleteMsg'))?'<button onclick="deleteMsg(\''+m._id+'\')" title="'+t('delete')+'" style="color:var(--re);">'+I.trash+'</button>':'')+'</div></div>';}
        function renderPollHTML(mid,p){const s=G();const total=p.votes.reduce((a,b)=>a+b,0)||1;return'<div class="poll-box"><div class="poll-q">📊 '+esc(p.question)+'</div><div class="poll-opts">'+p.options.map((o,i)=>{const pct=Math.round((p.votes[i]/total)*100);const voted=p.voters[s.user?._id]===i;return'<div class="poll-opt'+(voted?' voted':'')+'" onclick="votePoll(\''+mid+'\','+i+')"><div class="poll-bar" style="width:'+pct+'%"></div><span>'+esc(o)+'</span><span class="poll-pct">'+pct+'%</span></div>';}).join('')+'</div></div>';}
        function addMsg(msg){const inner=document.getElementById('messagesInner');if(!inner)return;if(inner.querySelector('.empty-ch'))inner.innerHTML='';const cont=document.getElementById('messagesContainer');const atBottom=!cont||(cont.scrollHeight-cont.scrollTop-cont.clientHeight)<120;inner.insertAdjacentHTML('beforeend',renderMsg(msg));if(atBottom&&cont)cont.scrollTop=cont.scrollHeight;while(inner.children.length>MAX_MSGS*1.5)inner.firstChild?.remove();}

        // ROLES
        function renderRoles(){const c=document.getElementById('rolesList');if(!c)return;const s=G();c.innerHTML=s.roles.sort((a,b)=>a.position-b.position).map(r=>'<div class="mitem"><div style="width:22px;height:22px;border-radius:6px;background:'+r.color+';flex-shrink:0;"></div><div class="minfo"><div class="mname">'+esc(r.name)+'</div><div class="msub">'+(r.permissions.all?'Tüm yetkiler':Object.keys(r.permissions).filter(k=>r.permissions[k]).join(', '))+'</div></div><button class="ib" onclick="openEditRole(\''+r.id+'\')" title="Düzenle">'+I.edit+'</button></div>').join('');}
        window.openEditRole=function(id){const s=G();const r=s.roles.find(x=>x.id===id);if(!r)return;document.getElementById('editRoleId').value=r.id;document.getElementById('editRoleName').value=r.name;document.getElementById('editRoleColor').value=r.color;const perms=['sendMsg','deleteMsg','kick','ban','manageChannels','manageRoles','manageServer'];const permLabels={sendMsg:'Mesaj Gönder',deleteMsg:'Mesaj Sil',kick:'Kullanıcı At',ban:'Kullanıcı Banla',manageChannels:'Kanalları Yönet',manageRoles:'Rolleri Yönet',manageServer:'Sunucuyu Yönet'};document.getElementById('rolePerms').innerHTML=perms.map(p=>'<div class="prow"><div class="prow-l">'+(permLabels[p]||p)+'</div><div class="toggle'+((r.permissions[p]||r.permissions.all)?' on':'')+'" data-p="'+p+'" onclick="this.classList.toggle(\'on\')" role="switch"></div></div>').join('');openModal('editRoleModal');};
        window.saveRoleEdit=function(){const s=G();const id=document.getElementById('editRoleId')?.value;const r=s.roles.find(x=>x.id===id);if(!r)return;r.name=document.getElementById('editRoleName')?.value.trim()||r.name;r.color=document.getElementById('editRoleColor')?.value||r.color;r.permissions={};document.querySelectorAll('#rolePerms .toggle').forEach(ts=>r.permissions[ts.dataset.p]=ts.classList.contains('on'));S.persist();closeModal('editRoleModal');renderRoles();toast('Rol güncellendi');};
        window.addRole=function(){const s=G();const n=document.getElementById('newRoleName')?.value.trim();if(!n)return;const c=document.getElementById('newRoleColor')?.value||'#9ca3af';s.roles.push({id:genId(),name:n,color:c,permissions:{sendMsg:true},position:s.roles.length});S.persist();closeModal('addRoleModal');renderRoles();toast('Rol eklendi');};

        // USER INFO
        function showUserInfo(uid,uname){const s=G();if(uid===s.user?._id){openModal('profileModal');return;}const isBlocked=s.blockedUsers.includes(uid);const role=getHighestRole(uid);document.getElementById('userInfoContent').innerHTML='<div style="text-align:center;padding:14px 0;"><div style="width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--ac2));display:inline-flex;align-items:center;justify-content:center;font-size:22px;color:#fff;font-weight:800;margin-bottom:10px;">'+esc(uname.charAt(0).toUpperCase())+'</div><h3 style="margin-bottom:4px;font-size:16px;">'+esc(uname)+'</h3><div style="display:inline-block;padding:2px 8px;border-radius:5px;font-size:10px;font-weight:700;background:'+role.color+'20;color:'+role.color+';margin-bottom:14px;">'+esc(role.name)+'</div><div style="display:flex;gap:8px;flex-direction:column;"><button class="mb sec" onclick="openDMDirect(\''+uid+'\',\''+esc(uname)+'\')">'+I.dm+' Mesaj Gönder</button><button class="mb '+(isBlocked?'':'danger')+'" onclick="toggleBlockUser(\''+uid+'\')">'+(isBlocked?t('unblock'):t('block'))+'</button></div></div>';openModal('userInfoModal');}
        window.showUserInfo=showUserInfo;
        window.toggleBlockUser=function(uid){const s=G();if(s.blockedUsers.includes(uid))s.blockedUsers=s.blockedUsers.filter(u=>u!==uid);else s.blockedUsers.push(uid);S.persist();loadMsgs();closeModal('userInfoModal');toast(s.blockedUsers.includes(uid)?'Engellendi':'Engel kaldırıldı');};
        window.openDMDirect=function(uid,uname){closeModal('userInfoModal');const s=G();if(!s.dmFriends.find(f=>f.id===uid))s.dmFriends.push({id:uid,username:uname,messages:[],time:'Şimdi'});S.persist();openModal('dmModal');loadDMList();openDM(uid,uname);};

        // DM
        function loadDMList(){const c=document.getElementById('dmList');if(!c)return;const s=G();c.innerHTML=s.dmFriends.length?s.dmFriends.map(f=>'<div class="mitem" onclick="openDM(\''+esc(f.id)+'\',\''+esc(f.username)+'\')"><div class="mav">'+esc(f.username.charAt(0).toUpperCase())+'</div><div class="minfo"><div class="mname">'+esc(f.username)+'</div><div class="msub">'+esc(f.last||'DM başlat')+'</div></div>'+((s.dmUnread[f.id]||0)>0?'<span class="ub">'+s.dmUnread[f.id]+'</span>':'')+'</div>').join(''):'<div class="empty-ch">'+I.dm+t('noDM')+'</div>';}
        window.openDMNew=function(){closeModal('dmModal');openModal('dmNewModal');};
        window.startDM=function(){const s=G();const u=document.getElementById('dmNewUsername')?.value.trim();if(!u)return;if(!s.dmFriends.find(f=>f.username===u))s.dmFriends.push({id:genId(),username:u,messages:[],time:'Şimdi'});S.persist();closeModal('dmNewModal');openModal('dmModal');loadDMList();};
        window.openDM=function(id,uname){const s=G();const f=s.dmFriends.find(x=>x.id===id);if(!f)return;s.dmUnread[id]=0;S.persist();document.getElementById('dmChatArea').style.display='block';document.getElementById('dmChatTitle').textContent='💬 '+uname;const d=document.getElementById('dmMessages');if(!d)return;d.innerHTML=(f.messages||[]).map(m=>'<div style="font-size:11px;padding:2px 0;"><b style="color:var(--t1);">'+esc(m.sender||'?')+'</b><span style="color:var(--t3);font-size:9px;margin:0 5px;">'+new Date(m.time||0).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'})+'</span>'+esc(m.text)+'</div>').join('');d.scrollTop=d.scrollHeight;document.getElementById('sendDmBtn').onclick=()=>{const inp=document.getElementById('dmInput');if(!inp?.value.trim())return;const msg={sender:s.user?.username||'Sen',text:inp.value.trim(),time:new Date().toISOString()};f.messages.push(msg);f.last=msg.text;f.time='Şimdi';S.persist();d.insertAdjacentHTML('beforeend','<div style="font-size:11px;padding:2px 0;"><b style="color:var(--t1);">'+esc(msg.sender)+'</b><span style="color:var(--t3);font-size:9px;margin:0 5px;">'+new Date(msg.time).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'})+'</span>'+esc(msg.text)+'</div>');d.scrollTop=d.scrollHeight;inp.value='';if(s.socket)s.socket.emit('dm_message',{to:id,text:msg.text,sender:s.user.username});};document.getElementById('dmInput').onkeypress=e=>{if(e.key==='Enter')document.getElementById('sendDmBtn').click();};};
        window.addFriend=function(){const s=G();const u=document.getElementById('friendUsername')?.value.trim();if(!u)return;if(s.dmFriends.find(f=>f.username===u))return toast('Zaten ekli','e');s.dmFriends.push({id:genId(),username:u,messages:[],time:'Şimdi'});S.persist();closeModal('addFriendModal');toast(u+' eklendi');};

        // SEARCH & NOTIFICATIONS & POLLS
        function doSearch(){const q=document.getElementById('searchInput')?.value.toLowerCase().trim();const r=document.getElementById('searchResults');if(!r)return;if(!q||q.length<2){r.innerHTML='';return;}const s=G();const msgs=s.messageDb.filter(m=>(m.content||'').toLowerCase().includes(q)||(m.senderName||'').toLowerCase().includes(q)).slice(-15).reverse();r.innerHTML=msgs.length?msgs.map(m=>'<div class="mitem" onclick="switchCh(\''+m.channelId+'\');closeAllModals()"><div class="mav">'+esc((m.senderName||'?').charAt(0).toUpperCase())+'</div><div class="minfo"><div class="mname">'+esc(m.senderName||'?')+'</div><div class="msub">'+esc(m.content.substring(0,60))+'</div></div></div>').join(''):'<div class="empty-ch">Sonuç bulunamadı</div>';}
        function renderNotif(){const c=document.getElementById('notifList');if(!c)return;const s=G();c.innerHTML=s.notifications.length?[...s.notifications].reverse().slice(0,30).map(n=>'<div style="padding:6px 0;border-bottom:1px solid var(--b);font-size:11px;">'+esc(n.text)+'<div style="font-size:9px;color:var(--t3);">'+new Date(n.time).toLocaleString('tr-TR')+'</div></div>').join(''):'<div class="empty-ch">'+I.bell+'<br>Bildirim yok</div>';}
        window.createPoll=function(){const s=G();const q=document.getElementById('pollQuestion')?.value.trim();const o1=document.getElementById('pollOption1')?.value.trim();const o2=document.getElementById('pollOption2')?.value.trim();const o3=document.getElementById('pollOption3')?.value.trim();if(!q||!o1||!o2)return toast('Soru ve en az 2 seçenek gerekli','e');const opts=[o1,o2,...(o3?[o3]:[])];const mid=genId();s.polls[mid]={question:q,options:opts,votes:new Array(opts.length).fill(0),voters:{}};const msg={_id:mid,content:'📊 **'+q+'**\n'+opts.map((o,i)=>(i+1)+'. '+o).join('\n'),senderName:s.user.username,senderId:s.user._id,channelId:s.channel.id,createdAt:new Date().toISOString(),reactions:{}};s.messageDb.push(msg);S.persist();closeModal('pollModal');addMsg(msg);[1,2,3].forEach(n=>{const el=document.getElementById('pollOption'+n);if(el)el.value='';});document.getElementById('pollQuestion')&&(document.getElementById('pollQuestion').value='');};
        window.votePoll=function(mid,opt){const s=G();const p=s.polls[mid];if(!p)return;if(p.voters[s.user._id]!==undefined){toast('Zaten oy verdiniz','e');return;}p.voters[s.user._id]=opt;p.votes[opt]++;S.persist();loadMsgs();};

        // THEME
        window.toggleLight=function(){const isLight=document.body.classList.toggle('light');localStorage.setItem('gt_light',isLight?'1':'0');renderApp();};
        window.setTheme=function(primary,secondary){document.documentElement.style.setProperty('--ac',primary);document.documentElement.style.setProperty('--ac2',secondary||primary);localStorage.setItem('gt_ac',primary);localStorage.setItem('gt_ac2',secondary||primary);closeModal('themeSettingsModal');toast('Tema değişti');};
        function loadTheme(){const p=localStorage.getItem('gt_ac'),s=localStorage.getItem('gt_ac2');if(p&&s){document.documentElement.style.setProperty('--ac',p);document.documentElement.style.setProperty('--ac2',s);}if(localStorage.getItem('gt_light')==='1')document.body.classList.add('light');}

        // EXPOSE
        window.openModal=openModal;window.closeModal=closeModal;window.closeAllModals=closeAllModals;
        window.addReaction=addReaction;window.votePoll=window.votePoll;
        window.copyMsg=copyMsg;window.deleteMsg=deleteMsg;window.pinMsg=pinMsg;
        window.editMsgInline=editMsgInline;window.addReactionPrompt=addReactionPrompt;
        window.openDM=window.openDM;window.retryConn=window.retryConn;
        window.createChannel=window.createChannel;window.createServer=window.createServer;
        window.addCategoryConfirm=window.addCategoryConfirm;window.saveServerSettings=window.saveServerSettings;
        window.saveProfile=window.saveProfile;window.openDMNew=window.openDMNew;window.startDM=window.startDM;
        window.addFriend=window.addFriend;window.openEditRole=window.openEditRole;
        window.saveRoleEdit=window.saveRoleEdit;window.addRole=window.addRole;
        window.saveChannelEdit=window.saveChannelEdit;window.switchChannel=switchCh;
        window.createPoll=window.createPoll;window.toggleLightMode=window.toggleLight;window.setTheme=window.setTheme;

        // INIT
        function init(){document.documentElement.style.setProperty('--scrollbar-w',(window.innerWidth-document.documentElement.clientWidth)+'px');try{init3D();}catch(e){}loadTheme();try{const raw=localStorage.getItem('gt_state');if(raw){const saved=JSON.parse(raw);const s=G();['channels','categories','dmFriends','roles','userRoles','serverSettings','pinnedMessages','userStatuses','notifications','unreadCounts','blockedUsers','messageDb','polls','lang','dmUnread','offlineQueue','channelScrollPositions','userStatus','captchaVerified'].forEach(k=>{if(saved[k]!==undefined)s[k]=saved[k];});}}catch(e){}try{const u=localStorage.getItem('gt_user'),tk=localStorage.getItem('gt_token');if(u&&tk){const s=G();s.user=JSON.parse(u);s.token=tk;if(!s.userRoles[s.user._id])s.userRoles[s.user._id]=['r4'];}}catch(e){}setTimeout(()=>document.getElementById('ls')?.classList.add('hide'),600);renderApp();}
        init();
    </script>
</body>
</html>
