<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover, maximum-scale=1.0">
  <title>Gettic — Sohbet Platformu</title>
  <link rel="icon" href="https://raw.githubusercontent.com/darking053official/gettic/main/1777062266055.png">
  <link rel="manifest" href="data:application/json,{'name':'Gettic','short_name':'Gettic','start_url':'/','display':'standalone','background_color':'#0a0a14','theme_color':'#c084fc','icons':[{'src':'https://raw.githubusercontent.com/darking053official/gettic/main/1777062266055.png','sizes':'192x192','type':'image/png'}]}">
  <meta name="theme-color" content="#c084fc">
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <style>
    :root {
      --bg:#0a0a14;--bg1:#0f0f1a;--bg2:#151520;--bg3:#1c1c2a;--b:rgba(255,255,255,.05);--b2:rgba(255,255,255,.08);
      --ac:#c084fc;--ac2:#e879f9;--ac3:#f0abfc;--acg:rgba(192,132,252,.3);--acd:rgba(192,132,252,.1);
      --t1:#f0f0ff;--t2:#a0a0c0;--t3:#606080;--gr:#22c55e;--re:#ef4444;--ye:#f59e0b;
      --radius:12px;--transition:.2s cubic-bezier(.2,.9,.4,1);--font:'Segoe UI',system-ui,sans-serif;--mono:'JetBrains Mono',monospace;
      --sidebar-w:250px;--userpanel-w:260px;--serverrail-w:68px;--msg-density:1;--safe-bottom:0px;
    }
    body.light {--bg:#f0f0f5;--bg1:#ffffff;--bg2:#e8e8ee;--bg3:#dddde4;--b:rgba(0,0,0,.05);--b2:rgba(0,0,0,.08);--t1:#1a1a2e;--t2:#4a4a6a;--t3:#808090;}
    body.light .message-avatar{color:#fff;}
    body.light .server-icon:hover,body.light .server-icon.active{background:var(--ac);}
    body.light .server-icon:hover svg,body.light .server-icon.active svg{stroke:#fff;}
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:var(--font);background:var(--bg);color:var(--t1);height:100vh;height:100dvh;overflow:hidden;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:pan-y;}
    body.ios-safe{padding-bottom:env(safe-area-inset-bottom,0px);}
    @supports(padding-bottom:env(safe-area-inset-bottom)){body{padding-bottom:env(safe-area-inset-bottom);}}
    ::-webkit-scrollbar{width:4px;}::-webkit-scrollbar-thumb{background:var(--ac);border-radius:4px;}
    :focus-visible{outline:2px solid var(--ac);outline-offset:2px;border-radius:4px;}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0;}
    .loading-screen{position:fixed;inset:0;background:var(--bg);z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .4s,visibility .4s;}
    .loading-screen.hide{opacity:0;visibility:hidden;pointer-events:none;}
    .loader{width:44px;height:44px;border:3px solid var(--b2);border-top-color:var(--ac);border-radius:50%;animation:spin .7s linear infinite;}
    @keyframes spin{to{transform:rotate(360deg);}}
    .loading-logo{margin-top:16px;font-size:18px;font-weight:700;background:linear-gradient(135deg,var(--ac),var(--ac2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
    .app{display:flex;height:100vh;height:100dvh;background:var(--bg1);position:relative;}
    .connection-bar{position:fixed;top:0;left:0;right:0;height:4px;background:var(--re);z-index:10000;transition:height .3s,opacity .3s;opacity:0;}
    .connection-bar.offline{height:22px;opacity:1;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;gap:8px;}
    .connection-bar.offline button{background:rgba(255,255,255,.2);border:none;color:#fff;padding:2px 8px;border-radius:4px;cursor:pointer;font-size:10px;}
    .server-rail{width:var(--serverrail-w);background:var(--bg);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:10px;overflow-y:auto;border-right:1px solid var(--b);flex-shrink:0;z-index:10;}
    .server-icon{width:46px;height:46px;background:var(--bg2);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all var(--transition);position:relative;}
    .server-icon svg{width:22px;height:22px;stroke:var(--t2);stroke-width:1.5;fill:none;}
    .server-icon:hover,.server-icon.active{border-radius:14px;background:var(--ac);transform:translateY(-2px);}.server-icon:hover svg,.server-icon.active svg{stroke:#fff;}
    .server-icon.active::after{content:'';position:absolute;right:-7px;top:50%;transform:translateY(-50%);width:3px;height:18px;background:var(--ac);border-radius:2px;}
    .channel-sidebar{width:var(--sidebar-w);background:var(--bg1);display:flex;flex-direction:column;border-right:1px solid var(--b);flex-shrink:0;z-index:10;overflow-y:auto;transition:transform .25s ease;}
    .channel-header{height:48px;padding:0 14px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--b);font-weight:700;background:var(--bg);font-size:15px;flex-shrink:0;}
    .channel-header svg{width:18px;height:18px;stroke:var(--ac);}
    .channel-category{padding:14px 14px 4px;font-size:11px;font-weight:700;text-transform:uppercase;color:var(--t3);letter-spacing:.8px;display:flex;justify-content:space-between;align-items:center;}
    .channel-category button{background:none;border:none;color:var(--t3);cursor:pointer;font-size:15px;padding:2px 4px;border-radius:4px;}.channel-category button:hover{color:var(--ac);}
    .channel-item{padding:7px 14px;margin:1px 6px;border-radius:7px;display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;color:var(--t2);transition:all .15s;position:relative;}
    .channel-item svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.5;flex-shrink:0;}
    .channel-item:hover,.channel-item:focus-visible{background:var(--bg2);color:var(--t1);outline:none;}
    .channel-item.active{background:var(--acd);color:var(--ac3);font-weight:600;}
    .channel-item .ch-actions{display:none;margin-left:auto;gap:4px;}.channel-item:hover .ch-actions,.channel-item:focus-within .ch-actions{display:flex;}
    .ch-actions button{background:none;border:none;color:var(--t3);cursor:pointer;padding:2px;font-size:12px;}.ch-actions button:hover{color:var(--re);}
    .channel-item .unread-badge{background:var(--re);color:#fff;font-size:10px;padding:1px 6px;border-radius:10px;margin-left:auto;font-weight:700;min-width:18px;text-align:center;}
    .empty-channels{text-align:center;padding:30px;color:var(--t3);font-size:13px;}
    .chat-area{flex:1;display:flex;flex-direction:column;background:var(--bg1);min-width:0;}
    .chat-header{height:48px;padding:0 18px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--b);background:var(--bg);flex-shrink:0;}
    .chat-header svg{width:18px;height:18px;stroke:var(--ac);flex-shrink:0;}
    .channel-name{font-weight:700;font-size:15px;}.channel-topic{font-size:11px;color:var(--t3);margin-left:6px;}
    .header-badge{margin-left:auto;display:flex;gap:6px;}
    .icon-btn{background:var(--bg2);border:none;width:30px;height:30px;border-radius:7px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all var(--transition);}
    .icon-btn svg{width:15px;height:15px;stroke:var(--t2);fill:none;stroke-width:1.5;}.icon-btn:hover,.icon-btn:focus-visible{background:var(--ac);transform:scale(1.05);}.icon-btn:hover svg,.icon-btn:focus-visible svg{stroke:#fff;}
    .messages-container{flex:1;overflow-y:auto;padding:14px 18px;scroll-behavior:smooth;contain:content;}
    .messages-inner{display:flex;flex-direction:column;gap:calc(4px * var(--msg-density));}
    .empty-channel{text-align:center;padding:50px 20px;color:var(--t3);animation:fadeIn .4s ease;margin:auto;}
    @keyframes fadeIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
    .empty-channel svg{width:56px;height:56px;stroke:var(--t3);margin-bottom:14px;opacity:.5;}.empty-channel h4{font-size:16px;margin-bottom:6px;color:var(--t2);font-weight:700;}.empty-channel p{font-size:13px;}
    .message{display:flex;align-items:flex-start;gap:10px;padding:calc(5px * var(--msg-density)) 8px;border-radius:7px;transition:background .1s;position:relative;}
    .message:hover,.message:focus-within{background:var(--bg2);}.message:hover .msg-actions,.message:focus-within .msg-actions{display:flex;}
    @media(hover:none){.message:active .msg-actions{display:flex;}}
    .message-avatar{width:34px;height:34px;background:linear-gradient(135deg,var(--ac),var(--ac2));border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;font-size:13px;color:#fff;cursor:pointer;}
    .message-content{flex:1;min-width:0;}.message-header{font-size:12px;font-weight:700;margin-bottom:1px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
    .message-header .role-badge{font-size:9px;padding:1px 5px;border-radius:4px;font-weight:600;}
    .message-header span{font-weight:400;font-size:10px;margin-left:4px;color:var(--t3);}
    .message-text{font-size:13px;line-height:1.45;word-wrap:break-word;color:var(--t2);}
    .message-text b{color:var(--t1);}.message-text i{font-style:italic;}.message-text code{background:var(--bg3);padding:1px 4px;border-radius:3px;font-family:var(--mono);font-size:11px;}.message-text pre{background:var(--bg);border:1px solid var(--b);border-radius:6px;padding:8px;overflow-x:auto;font-family:var(--mono);font-size:11px;margin:4px 0;}
    .msg-actions{display:none;position:absolute;right:8px;top:-8px;background:var(--bg3);border-radius:6px;padding:2px;gap:2px;box-shadow:0 4px 12px rgba(0,0,0,.3);z-index:5;}
    .msg-actions button{background:none;border:none;color:var(--t2);cursor:pointer;padding:4px 6px;border-radius:4px;font-size:13px;}.msg-actions button:hover{background:var(--bg2);color:var(--t1);}
    .msg-reactions{display:flex;gap:4px;margin-top:3px;flex-wrap:wrap;}.msg-reaction{background:var(--bg3);border-radius:6px;padding:1px 6px;font-size:12px;cursor:pointer;transition:all .1s;border:1px solid transparent;}.msg-reaction:hover{border-color:var(--b2);}.msg-reaction.me{background:var(--acd);border-color:var(--ac);}
    .poll-options{display:flex;flex-direction:column;gap:4px;margin-top:4px;}.poll-option{background:var(--bg3);border-radius:6px;padding:4px 8px;cursor:pointer;font-size:12px;transition:all .1s;display:flex;align-items:center;gap:8px;}.poll-option:hover{background:var(--acd);}.poll-option .bar{height:6px;background:var(--ac);border-radius:3px;transition:width .3s;}.poll-option.voted{background:var(--acd);}
    .typing-indicator{padding:4px 18px;font-size:11px;color:var(--t3);font-style:italic;height:24px;flex-shrink:0;}
    .input-area{padding:10px 18px 14px;background:var(--bg);border-top:1px solid var(--b);display:flex;gap:10px;align-items:center;flex-shrink:0;}
    .message-input{flex:1;background:var(--bg2);border:1px solid var(--b2);border-radius:22px;padding:10px 16px;color:var(--t1);font-size:13px;outline:none;transition:all var(--transition);font-family:var(--font);}
    .message-input:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--acg);}.message-input::placeholder{color:var(--t3);}
    .emoji-popup{position:absolute;bottom:70px;left:310px;background:var(--bg2);border-radius:14px;display:none;z-index:100;border:1px solid var(--b2);box-shadow:0 8px 32px rgba(0,0,0,.4);max-height:250px;overflow-y:auto;width:300px;padding:8px;}
    .emoji-popup.show{display:block;animation:fadeIn .15s ease;}
    .emoji-suggestions{display:flex;flex-wrap:wrap;gap:4px;}.emoji-suggestion{font-size:18px;cursor:pointer;padding:4px;border-radius:6px;}.emoji-suggestion:hover{background:var(--bg3);}
    .user-panel{width:var(--userpanel-w);background:var(--bg);border-left:1px solid var(--b);padding:14px;display:flex;flex-direction:column;gap:8px;flex-shrink:0;z-index:10;overflow-y:auto;}
    .user-profile{display:flex;gap:10px;align-items:center;padding-bottom:12px;border-bottom:1px solid var(--b);cursor:pointer;}
    .user-avatar{width:44px;height:44px;background:linear-gradient(135deg,var(--ac),var(--ac2));border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;color:#fff;position:relative;}
    .user-avatar .status-dot{position:absolute;bottom:0;right:0;width:12px;height:12px;border-radius:50%;border:3px solid var(--bg);}.status-dot.online{background:var(--gr);}.status-dot.idle{background:var(--ye);}.status-dot.dnd{background:var(--re);}.status-dot.offline{background:var(--t3);}
    .user-info{flex:1;}.user-name{font-weight:700;font-size:14px;}.user-status{font-size:10px;color:var(--t3);margin-top:1px;}
    .panel-btn{background:var(--bg2);border:none;padding:9px 10px;border-radius:9px;color:var(--t2);cursor:pointer;font-weight:500;display:flex;align-items:center;gap:10px;width:100%;transition:all .15s;font-size:13px;font-family:var(--font);}
    .panel-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;flex-shrink:0;}.panel-btn:hover,.panel-btn:focus-visible{background:var(--bg3);color:var(--t1);}
    .voice-bar{background:var(--bg2);border-radius:10px;padding:7px 10px;display:none;align-items:center;gap:8px;font-size:12px;font-weight:600;}.voice-bar svg{width:18px;height:18px;stroke:var(--ac);}
    .voice-controls{display:flex;gap:5px;margin-left:auto;}.voice-btn{background:var(--bg3);border:none;width:28px;height:28px;border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;}.voice-btn svg{width:14px;height:14px;stroke:var(--t2);}.voice-btn:hover,.voice-btn:focus-visible{background:var(--ac);}.voice-btn:hover svg,.voice-btn:focus-visible svg{stroke:#fff;}.voice-btn.muted{background:var(--re);}
    .remote-volume{width:80px;height:4px;background:var(--bg3);border-radius:2px;cursor:pointer;}.remote-volume-fill{height:100%;background:var(--gr);border-radius:2px;width:80%;}
    .modal{position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;z-index:1000;display:none;animation:fadeIn .2s ease;}
    @supports not (backdrop-filter:blur(8px)){.modal{background:rgba(0,0,0,.92);}}
    .modal.show{display:flex;}
    .modal-box{background:var(--bg2);border-radius:20px;padding:24px;width:520px;max-width:94%;max-height:85vh;overflow-y:auto;}.modal-box h2{margin-bottom:16px;display:flex;align-items:center;gap:8px;font-size:18px;}
    .modal-input,.modal-select,.modal-textarea{width:100%;padding:10px 14px;background:var(--bg1);border:1px solid var(--b2);border-radius:10px;color:var(--t1);margin-bottom:12px;font-size:13px;font-family:var(--font);outline:none;}.modal-textarea{resize:vertical;min-height:60px;}.modal-input:focus,.modal-select:focus,.modal-textarea:focus{border-color:var(--ac);}
    .modal-btn{width:100%;padding:10px;background:var(--ac);border:none;border-radius:10px;color:#fff;font-weight:700;cursor:pointer;font-size:14px;font-family:var(--font);transition:all .15s;}.modal-btn:hover,.modal-btn:focus-visible{filter:brightness(1.1);}
    .modal-btn.secondary{background:var(--bg3);color:var(--t2);}.modal-btn.secondary:hover,.modal-btn.secondary:focus-visible{background:var(--acd);color:var(--t1);}.modal-btn.danger{background:var(--re);}
    .dm-item,.role-item,.user-item{display:flex;align-items:center;gap:10px;padding:10px;border-radius:9px;cursor:pointer;transition:all .15s;}.dm-item:hover,.role-item:hover,.user-item:hover{background:var(--bg3);}
    .dm-avatar{width:38px;height:38px;background:var(--acd);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:var(--ac3);flex-shrink:0;}
    .dm-info,.role-info,.user-item-info{flex:1;min-width:0;}.dm-name,.role-name{font-weight:600;font-size:13px;}.dm-last-msg,.role-desc{font-size:11px;color:var(--t3);}
    .theme-option{padding:10px;cursor:pointer;border-radius:8px;margin-bottom:6px;display:flex;align-items:center;gap:10px;font-weight:500;transition:all .15s;font-size:13px;}.theme-option:hover{background:var(--bg3);}
    .context-menu{position:fixed;background:var(--bg2);border:1px solid var(--b2);border-radius:10px;padding:6px;z-index:2000;display:none;min-width:180px;box-shadow:0 8px 32px rgba(0,0,0,.5);}.context-menu.show{display:block;animation:fadeIn .1s ease;}
    .context-menu button{display:flex;align-items:center;gap:8px;width:100%;padding:8px 12px;background:none;border:none;color:var(--t2);cursor:pointer;border-radius:6px;font-size:12px;font-family:var(--font);}.context-menu button:hover{background:var(--bg3);color:var(--t1);}.context-menu button.danger{color:var(--re);}
    .badge{display:inline-block;padding:2px 7px;border-radius:5px;font-size:10px;font-weight:700;}.badge.admin{background:rgba(239,68,68,.2);color:#ef4444;}.badge.mod{background:rgba(99,102,241,.2);color:#6366f1;}.badge.vip{background:rgba(168,85,247,.2);color:#a855f7;}
    .toggle-switch{position:relative;width:44px;height:24px;background:var(--bg3);border-radius:12px;cursor:pointer;transition:all .2s;display:inline-block;}.toggle-switch.on{background:var(--ac);}.toggle-switch::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;background:#fff;border-radius:50%;transition:all .2s;}.toggle-switch.on::after{left:22px;}
    .toast{position:fixed;bottom:60px;right:16px;background:var(--bg2);padding:10px 16px;border-radius:10px;z-index:2000;border:1px solid var(--b2);font-size:13px;font-weight:600;animation:fadeIn .2s ease;transition:opacity .3s;}
    .toast.hiding{opacity:0;}
    .empty-state{text-align:center;padding:30px;color:var(--t3);font-size:13px;}
    .empty-state svg{width:40px;height:40px;margin-bottom:10px;opacity:.5;stroke:var(--t3);}
    @media (max-width:768px){
      :root{--sidebar-w:260px;--userpanel-w:280px;}
      .server-rail{width:52px;}.server-icon{width:40px;height:40px;}.server-icon svg{width:18px;height:18px;}
      .channel-sidebar{position:absolute;left:-270px;top:0;bottom:0;height:100%;z-index:50;}.channel-sidebar.open{left:52px;box-shadow:4px 0 20px rgba(0,0,0,.5);}
      .user-panel{position:absolute;right:-290px;top:0;bottom:0;height:100%;z-index:50;}.user-panel.open{right:0;box-shadow:-4px 0 20px rgba(0,0,0,.5);}
      .emoji-popup{left:10px;right:10px;bottom:65px;width:auto;max-width:calc(100vw - 20px);}
      .modal-box{width:96%;max-height:90vh;border-radius:16px;padding:16px;}
      .input-area{padding:8px 12px calc(12px + env(safe-area-inset-bottom, 0px));gap:6px;}
      .message-input{padding:8px 12px;font-size:16px;}
      .messages-container{padding:8px 12px;}
      .remote-volume{width:60px;}
      #dmModal .modal-box{width:98%;max-height:95vh;}
      .msg-actions{right:2px;top:-6px;}
      .msg-actions button{padding:6px 8px;font-size:16px;}
    }
  </style>
</head>
<body>
<div class="connection-bar" id="connectionBar"></div>
<div id="loadingScreen" class="loading-screen"><div class="loader"></div><div class="loading-logo">gettic</div></div>
<div id="app"></div>
<div id="contextMenu" class="context-menu" role="menu"></div>

<script>
(function(){
const API_URL = 'https://gettic-j49l.onrender.com';
const RATE_LIMIT = new Map();
const MAX_VISIBLE_MSGS = 80;
const MAX_DB_SIZE = 500;
const IDLE_TIMEOUT = 5 * 60 * 1000;
let idleTimer = null;
let currentDMId = null;
let isOnline = navigator.onLine;
let retryCount = 0;
const MAX_RETRIES = 5;

const LS_KEYS = ['gt_channels','gt_categories','gt_dmFriends','gt_roles','gt_userRoles','gt_serverSettings','gt_pinnedMessages','gt_userStatuses','gt_notifications','gt_unread','gt_blocked','gt_msgDb','gt_polls','gt_dmUnread'];
function safeLSGet(key,fallback){try{const v=localStorage.getItem(key);return v?JSON.parse(v):fallback;}catch(e){return fallback;}}
function safeLSSet(key,val){try{const s=JSON.stringify(val);if(s.length>500000){console.warn(key+' çok büyük, kırpılıyor');const arr=JSON.parse(s);if(Array.isArray(arr))val=arr.slice(-200);}localStorage.setItem(key,JSON.stringify(val));return true;}catch(e){console.warn('localStorage dolu:',key);try{localStorage.removeItem('gt_msgDb');localStorage.setItem(key,JSON.stringify(val));}catch(e2){return false;}}}

const State = {
  user: null,
  token: localStorage.getItem('gt_token'),
  socket: null,
  channel: safeLSGet('gt_lastChannel',{id:'genel-sohbet',name:'genel-sohbet',topic:'Sohbet odası'}),
  localStream: null,
  peerConnections: new Map(),
  remoteAudioElements: [],
  isInVoice: false,
  isMuted: false,
  isDeafened: false,
  channels: safeLSGet('gt_channels',[{id:'genel-sohbet',name:'genel-sohbet',type:'text',category:'METİN ODALARI'},{id:'kurallar',name:'kurallar',type:'forum',category:'METİN ODALARI'},{id:'genel-ses',name:'Genel Ses',type:'voice',category:'SESLİ ODALAR'},{id:'forum',name:'forum',type:'forum',category:'FORUM'}]),

function getUserRoles(uid){return State.userRoles[uid]||['r5'];}
function getHighestRole(uid){const rids=getUserRoles(uid);let highest=State.roles[State.roles.length-1];rids.forEach(rid=>{const r=State.roles.find(x=>x.id===rid);if(r&&r.position<highest.position)highest=r;});return highest;}
function hasPermission(uid,perm){if(!uid)return false;const rids=getUserRoles(uid);for(const rid of rids){const r=State.roles.find(x=>x.id===rid);if(r&&(r.permissions.all||r.permissions[perm]))return true;}return false;}
function checkRateLimit(key,max=5,window=3000){const now=Date.now();if(RATE_LIMIT.size>200)RATE_LIMIT.clear();const timestamps=RATE_LIMIT.get(key)||[];const recent=timestamps.filter(t=>now-t<window);if(recent.length>=max)return false;recent.push(now);RATE_LIMIT.set(key,recent.slice(-10));return true;}
async function requestNotifPerm(){if('Notification' in window&&Notification.permission==='default'){await Notification.requestPermission();}}
function sendNotification(title,body){if('Notification' in window&&Notification.permission==='granted'){try{new Notification(title,{body,icon:'https://raw.githubusercontent.com/darking053official/gettic/main/1777062266055.png'});}catch(e){}}}
function playMsgSound(){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;const ctx=new AC();const o=ctx.createOscillator();const g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.value=800;g.gain.value=.03;o.start();o.stop(ctx.currentTime+.08);}catch(e){}}
function resetIdleTimer(){clearTimeout(idleTimer);if(State.userStatuses[State.user?._id]==='online'||!State.userStatuses[State.user?._id]){idleTimer=setTimeout(()=>{State.userStatuses[State.user?._id]='idle';saveState();updateStatusUI('idle');},IDLE_TIMEOUT);}}
function handleUserActivity(){if(State.userStatuses[State.user?._id]==='idle'){State.userStatuses[State.user?._id]='online';saveState();updateStatusUI('online');}resetIdleTimer();}
function updateConnectionUI(online){const bar=document.getElementById('connectionBar');const icon=document.getElementById('connectionIcon');isOnline=online;if(online){bar.classList.remove('offline');bar.innerHTML='';if(State.offlineQueue.length){toast(`${State.offlineQueue.length} mesaj gönderiliyor...`);processOfflineQueue();}}else{bar.classList.add('offline');bar.innerHTML=`${Icons.wifiOff} ${t('offline')} <button onclick="retryConnection()">${t('retry')}</button>`;if(icon)icon.innerHTML=Icons.wifiOff;}}
function retryConnection(){retryCount=0;connectSocket();updateConnectionUI(navigator.onLine);}
async function processOfflineQueue(){while(State.offlineQueue.length&&navigator.onLine){const msg=State.offlineQueue.shift();try{await fetch(`${API_URL}/api/channels/${msg.channelId}/messages`,{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${State.token}`},body:JSON.stringify({content:msg.content})});}catch(e){State.offlineQueue.unshift(msg);saveState();break;}}saveState();}

function bindAuth(){
  document.getElementById('loginTab')?.addEventListener('click',()=>{document.getElementById('loginForm').style.display='block';document.getElementById('registerForm').style.display='none';});
  document.getElementById('registerTab')?.addEventListener('click',()=>{document.getElementById('loginForm').style.display='none';document.getElementById('registerForm').style.display='block';});
  document.getElementById('doLoginBtn')?.addEventListener('click',doAuth.bind(null,'login'));
  document.getElementById('doRegBtn')?.addEventListener('click',doAuth.bind(null,'register'));
}
async function doAuth(type){
  const isLogin=type==='login';const uId=isLogin?'loginUser':'regUser';const pId=isLogin?'loginPass':'regPass';
  const u=document.getElementById(uId)?.value.trim(),p=document.getElementById(pId)?.value;
  const errEl=document.getElementById('authError');
  if(!u||!p)return errEl.textContent='Tüm alanları doldurun';
  if(!isLogin&&u.length<3)return errEl.textContent='Kullanıcı adı en az 3 karakter';
  if(!isLogin&&p.length<6)return errEl.textContent='Şifre en az 6 karakter';
  if(!navigator.onLine)return errEl.textContent='İnternet bağlantısı yok';
  try{
    const res=await fetch(`${API_URL}/api/auth/${type}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});
    if(res.status===401){errEl.textContent='Oturum süresi doldu, tekrar giriş yapın';logout();return;}
    const data=await res.json();if(!res.ok)throw new Error(data.error||'Başarısız');
    State.token=data.token;State.user=data.user;
    if(!State.userRoles[State.user._id]){State.userRoles[State.user._id]=['r5'];saveState();}
    localStorage.setItem('gt_token',State.token);localStorage.setItem('gt_user',JSON.stringify(State.user));
    document.getElementById('loadingScreen')?.classList.add('hide');renderApp();
  }catch(e){errEl.textContent=e.message;}
}

let touchStartX=0;function handleTouchStart(e){touchStartX=e.touches[0].clientX;}
function handleTouchEnd(e){const dx=e.changedTouches[0].clientX-touchStartX;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(e.changedTouches[0].clientY-(e.touches[0]?.clientY||0))){if(dx>0)document.getElementById('channelSidebar')?.classList.add('open');else document.getElementById('userPanel')?.classList.add('open');}}
function handleScrollSave(){const c=document.getElementById('messagesContainer');if(c)State.channelScrollPositions[State.channel.id]=c.scrollTop;}

function handleInput(){const val=document.getElementById('messageInput')?.value||'';if(State.socket&&State.channel)State.socket.emit('typing',{channelId:State.channel.id,username:State.user?.username});const cm=val.match(/:(\w+)$/);const popup=document.getElementById('emojiPopup');const sug=document.getElementById('emojiSuggestions');if(cm&&sug){const q=cm[1].toLowerCase();const em={smile:'😀',laugh:'😂',heart:'❤️',fire:'🔥',ok:'👍',clap:'👏',cry:'😢',angry:'😡',star:'⭐',check:'✅',x:'❌',wave:'👋',think:'🤔',cool:'😎',wink:'😉',love:'🥰',party:'🥳',rock:'🤘',pray:'🙏',muscle:'💪'};const m=Object.entries(em).filter(([k])=>k.startsWith(q));if(m.length){sug.innerHTML=m.map(([,e])=>`<span class="emoji-suggestion" role="button" tabindex="0">${e}</span>`).join('');popup.classList.add('show');sug.onclick=e=>{const emoji=e.target.closest('.emoji-suggestion');if(emoji){const inp=document.getElementById('messageInput');inp.value=inp.value.replace(/:\w+$/,'')+emoji.textContent;popup.classList.remove('show');inp.focus();}};}else{popup.classList.remove('show');}}else{popup.classList.remove('show');}}
function handleContextMenu(e){e.preventDefault();const msgEl=e.target.closest('.message');const menu=document.getElementById('contextMenu');if(msgEl){const mid=msgEl.dataset.id;menu.innerHTML=`<button onclick="addReaction('${mid}','👍')">👍 Beğen</button><button onclick="addReaction('${mid}','❤️')">❤️ Kalp</button><button onclick="copyMsgContent('${mid}')">${Icons.copy} ${t('copy')}</button><button onclick="deleteMessage('${mid}')" class="danger">${Icons.trash} ${t('delete')}</button>`;}else{menu.innerHTML=`<button onclick="openModal('addChannelModal')">${Icons.plus} Kanal</button><button onclick="openModal('addCategoryModal')">📁 Kategori</button>`;}menu.style.left=Math.min(e.clientX,window.innerWidth-200)+'px';menu.style.top=Math.min(e.clientY,window.innerHeight-250)+'px';menu.classList.add('show');}
function copyMsgContent(mid){const msg=State.messageDb.find(m=>m._id===mid);if(msg){if(navigator.clipboard){navigator.clipboard.writeText(msg.content).then(()=>toast('Kopyalandı!')).catch(()=>toast('Kopyalanamadı',true));}else{const ta=document.createElement('textarea');ta.value=msg.content;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast('Kopyalandı!');}}document.getElementById('contextMenu')?.classList.remove('show');}
function debounce(fn,ms){let t;return(...args)=>{clearTimeout(t);t=setTimeout(()=>fn(...args),ms);};}
function toggleLightMode(){const isLight=document.body.classList.toggle('light');localStorage.setItem('gt_light',isLight?'true':'false');const btn=document.getElementById('themeToggleBtn');if(btn)btn.innerHTML=isLight?Icons.sun:Icons.moon;renderApp();}
function toggleDensity(){const root=document.documentElement.style;const cur=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--msg-density'))||1;const nxt=cur===1?.6:cur===.6?.4:1;root.setProperty('--msg-density',nxt);toast('Yoğunluk: '+({1:'Rahat',.6:'Normal',.4:'Kompakt'}[nxt]));}

function renderChannels(){
  const c=document.getElementById('channelCategories');if(!c)return;
  if(!State.categories.length&&!State.channels.length){c.innerHTML=`<div class="empty-channels">${t('noChannels')}</div>`;return;}
  let h='';State.categories.forEach(cat=>{
    h+=`<div class="channel-category">${cat}<button data-cat="${cat}" aria-label="${cat} kanal ekle">${Icons.plus}</button></div>`;
    State.channels.filter(ch=>ch.category===cat).forEach(ch=>{
      const icon=ch.type==='voice'?Icons.volume:ch.type==='forum'?Icons.forum:Icons.hash;
      const cls=ch.id===State.channel.id?' active':'';const ur=State.unreadCounts[ch.id]||0;
      h+=`<div class="channel-item${cls}" data-id="${ch.id}" data-type="${ch.type}" tabindex="0" role="button" aria-label="${ch.name}${ur?' '+ur+' okunmamış':''}">${icon}${sanitize(ch.name)}${ur>0?`<span class="unread-badge">${ur}</span>`:''}<div class="ch-actions"><button data-action="edit" aria-label="Düzenle">${Icons.edit}</button><button data-action="delete" aria-label="Sil">${Icons.trash}</button></div></div>`;});});c.innerHTML=h;
  c.querySelectorAll('.channel-item').forEach(el=>{el.addEventListener('click',e=>{if(e.target.closest('.ch-actions'))return;const id=el.dataset.id;if(el.dataset.type==='voice'){joinVoiceChannel(id);return;}switchChannel(id);});el.addEventListener('keydown',e=>{if(e.key==='Enter')el.click();});});
  c.querySelectorAll('.ch-actions button[data-action="edit"]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();openEditChannel(e.target.closest('.channel-item').dataset.id);}));
  c.querySelectorAll('.ch-actions button[data-action="delete"]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();deleteChannelById(e.target.closest('.channel-item').dataset.id);}));

}

async function sendMessage(){
  if(!checkRateLimit('msg_'+State.user?._id,5,3000))return toast('Yavaşlayın',true);
  const inp=document.getElementById('messageInput');if(!inp)return;
  const content=inp.value.trim();if(!content)return;
  if(!hasPermission(State.user._id,'sendMsg'))return toast('Yetkiniz yok',true);
  inp.value='';const msg={_id:genId(),content,senderName:State.user.username,senderId:State.user._id,channelId:State.channel.id,createdAt:new Date().toISOString(),reactions:{}};
  State.messageDb.push(msg);if(State.messageDb.length>MAX_DB_SIZE)State.messageDb=State.messageDb.slice(-MAX_DB_SIZE);saveState();addMsgToChat(msg);
  if(!navigator.onLine){State.offlineQueue.push(msg);saveState();toast(t('msgSentOffline'));return;}
  try{const res=await fetch(`${API_URL}/api/channels/${State.channel.id}/messages`,{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${State.token}`},body:JSON.stringify({content})});if(res.status===401){toast('Oturum süresi doldu',true);logout();return;}}catch(e){State.offlineQueue.push(msg);saveState();toast(t('msgSentOffline'));}
  if(State.socket)State.socket.emit('send_message',msg);
}
function loadMessages(){
  const inner=document.getElementById('messagesInner');const container=document.getElementById('messagesContainer');if(!inner)return;
  const msgs=State.messageDb.filter(m=>m.channelId===State.channel.id).slice(-MAX_VISIBLE_MSGS);
  if(!msgs.length){inner.innerHTML=`<div class="empty-channel">${Icons.hash}<h4># ${sanitize(State.channel.name)} ${t('birth')}</h4><p>${t('noMessages')}</p></div>`;return;}
  inner.innerHTML=(State.pinnedMessages[State.channel.id]?[renderMessage(State.pinnedMessages[State.channel.id],true)]:[]).concat(msgs.map(m=>renderMessage(m))).join('');
  if(State.channelScrollPositions[State.channel.id]){container.scrollTop=State.channelScrollPositions[State.channel.id];}else{container.scrollTop=container.scrollHeight;}
}
function renderMessage(m,isPinned=false){
  if(State.blockedUsers.includes(m.senderId))return'';
  const role=getHighestRole(m.senderId||'');const badge=role&&role.id!=='r5'?`<span class="role-badge" style="background:${role.color}20;color:${role.color};">${role.name}</span>`:'';
  const reacts=m.reactions||{};const rHtml=Object.entries(reacts).map(([e,u])=>`<span class="msg-reaction ${u.includes(State.user?._id)?'me':''}" data-emoji="${e}" data-msg="${m._id}" role="button" tabindex="0">${e} ${u.length}</span>`).join('');
  const time=new Date(m.createdAt).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  const isOwner=m.senderId===State.user?._id||hasPermission(State.user._id,'deleteMsg');
  const pollData=State.polls[m._id];
  return `<div class="message" data-id="${m._id}"${isPinned?' style="background:var(--acd);border-left:3px solid var(--ye);"':''}>
    <div class="message-avatar" onclick="showUserInfo('${m.senderId}','${sanitize(m.senderName||'')}')" role="button" tabindex="0" aria-label="${sanitize(m.senderName||'Kullanıcı')}">${sanitize(m.senderName?.charAt(0)?.toUpperCase()||'?')}</div>
    <div class="message-content">
      <div class="message-header"><span style="cursor:pointer;" onclick="showUserInfo('${m.senderId}','${sanitize(m.senderName||'')}')" role="button" tabindex="0">${sanitize(m.senderName||'?')}</span>${badge}<span>${time}</span></div>
      <div class="message-text">${formatMsg(sanitize(m.content))}</div>
      ${pollData?renderPoll(m._id,pollData):''}${rHtml?`<div class="msg-reactions">${rHtml}</div>`:''}
    </div>
    <div class="msg-actions">${isOwner?`<button onclick="editMessage('${m._id}')" aria-label="${t('edit')}">${Icons.edit}</button><button onclick="deleteMessage('${m._id}')" aria-label="${t('delete')}">${Icons.trash}</button>`:''}<button onclick="addReaction('${m._id}','👍')" aria-label="Beğen">👍</button><button onclick="pinMessage('${m._id}')" aria-label="${t('pin')}">${Icons.pin}</button></div>
  </div>`;
}
function renderPoll(mid,p){const total=p.votes.reduce((a,b)=>a+b,0)||1;return`<div class="poll-options">${p.options.map((o,i)=>`<div class="poll-option${p.voters[State.user?._id]===i?' voted':''}" onclick="votePoll('${mid}',${i})" role="button" tabindex="0"><span>${sanitize(o)}</span><div class="bar" style="width:${(p.votes[i]/total)*100}%"></div><span style="font-size:10px;">${p.votes[i]}</span></div>`).join('')}</div>`;}
function formatMsg(t){return t.replace(/\*\*(.*?)\*\*/g,'<b>$1</b>').replace(/\*(.*?)\*/g,'<i>$1</i>').replace(/`([^`]+)`/g,'<code>$1</code>');}
function updatePinnedBar(){const b=document.getElementById('pinnedBar');const p=State.pinnedMessages[State.channel.id];if(p){b.style.display='block';b.innerHTML=`${Icons.pin} ${t('pinned')}: <b>${sanitize(p.senderName)}</b> - ${sanitize(p.content).substring(0,50)}...`;}else{b.style.display='none';}}

function addMsgToChat(msg){
  const exists=State.messageDb.find(m=>m._id===msg._id);
  if(exists&&exists.senderId===msg.senderId)return;
  if(!exists){State.messageDb.push(msg);if(State.messageDb.length>MAX_DB_SIZE)State.messageDb=State.messageDb.slice(-MAX_DB_SIZE);saveState();}
  const inner=document.getElementById('messagesInner');if(!inner)return;
  if(inner.querySelector('.empty-channel'))inner.innerHTML='';
  const atBottom=(document.getElementById('messagesContainer').scrollHeight-document.getElementById('messagesContainer').scrollTop-document.getElementById('messagesContainer').clientHeight)<120;
  inner.insertAdjacentHTML('beforeend',renderMessage(msg));
  if(atBottom)document.getElementById('messagesContainer').scrollTop=document.getElementById('messagesContainer').scrollHeight;
  while(inner.children.length>MAX_VISIBLE_MSGS*1.5){inner.firstChild.remove();}
}
function addReaction(mid,emoji){if(!checkRateLimit('react_'+State.user?._id,8,2000))return;const msg=State.messageDb.find(m=>m._id===mid);if(!msg)return;msg.reactions=msg.reactions||{};if(!msg.reactions[emoji])msg.reactions[emoji]=[];if(msg.reactions[emoji].includes(State.user._id))msg.reactions[emoji]=msg.reactions[emoji].filter(u=>u!==State.user._id);else msg.reactions[emoji].push(State.user._id);if(!msg.reactions[emoji].length)delete msg.reactions[emoji];saveState();loadMessages();}
function deleteMessage(mid){if(!hasPermission(State.user._id,'deleteMsg')&&State.messageDb.find(m=>m._id===mid)?.senderId!==State.user?._id)return toast('Yetkiniz yok',true);State.messageDb=State.messageDb.filter(m=>m._id!==mid);saveState();loadMessages();}
function editMessage(mid){const msg=State.messageDb.find(m=>m._id===mid);if(!msg||msg.senderId!==State.user?._id)return toast('Sadece kendi mesajınız',true);const n=prompt(t('edit'),msg.content);if(n&&n!==msg.content){msg.content=n;saveState();loadMessages();}}
function pinMessage(mid){const msg=State.messageDb.find(m=>m._id===mid);if(!msg)return;State.pinnedMessages[State.channel.id]=msg;saveState();updatePinnedBar();loadMessages();}

let typingTimer;function showTyping(u){const el=document.getElementById('typingIndicator');if(el){el.textContent=`${u} ${t('typing')}`;clearTimeout(typingTimer);typingTimer=setTimeout(()=>{if(el)el.textContent='';},1500);}}

function connectSocket(){
  if(!State.token||retryCount>=MAX_RETRIES)return;
  if(State.socket){try{State.socket.removeAllListeners();State.socket.disconnect();}catch(e){}State.socket=null;}
  if(!navigator.onLine)return;
  try{
    State.socket=io(API_URL,{auth:{token:State.token},transports:['websocket','polling'],reconnection:true,reconnectionAttempts:MAX_RETRIES,reconnectionDelay:2000});
    State.socket.on('connect',()=>{retryCount=0;State.socket.emit('join_channel',State.channel.id);updateConnectionUI(true);});
    State.socket.on('new_message',msg=>{if(msg.channelId===State.channel.id)addMsgToChat(msg);else{State.unreadCounts[msg.channelId]=(State.unreadCounts[msg.channelId]||0)+1;saveState();renderChannels();}if(msg.senderId!==State.user?._id){State.notifications.push({text:`${msg.senderName}: ${msg.content.substring(0,30)}`,time:new Date().toISOString()});saveState();sendNotification(msg.senderName,msg.content.substring(0,40));}playMsgSound();});
    State.socket.on('user_typing',({username,channelId})=>{if(channelId===State.channel.id&&username!==State.user?.username)showTyping(username);});
    State.socket.on('voice_answer',async d=>{const pc=State.peerConnections.get(State.channel.id);if(pc&&d.sdp)await pc.setRemoteDescription(new RTCSessionDescription(d.sdp));});
    State.socket.on('voice_candidate',d=>{const pc=State.peerConnections.get(State.channel.id);if(pc&&d.candidate)pc.addIceCandidate(new RTCIceCandidate(d.candidate));});
    State.socket.on('connect_error',()=>{retryCount++;if(retryCount>=MAX_RETRIES)updateConnectionUI(false);});
    State.socket.on('disconnect',()=>{if(navigator.onLine)retryCount=0;});
  }catch(e){retryCount++;}
}

async function joinVoiceChannel(id){
  const ch=State.channels.find(c=>c.id===id);if(!ch)return;
  try{State.localStream=await navigator.mediaDevices.getUserMedia({audio:true});document.getElementById('voiceBar').style.display='flex';document.getElementById('voiceChannelName').textContent=ch.name;State.isInVoice=true;setupVoice(id);toast(`✅ ${ch.name}`);}catch(e){toast('Mikrofon erişimi reddedildi. Ayarlardan izin verin.',true);}
}
function setupVoice(id){
  if(State.peerConnections.has(id)){const old=State.peerConnections.get(id);old.close();State.peerConnections.delete(id);}
  const pc=new RTCPeerConnection(rtcConfig);State.peerConnections.set(id,pc);
  if(State.localStream)State.localStream.getTracks().forEach(t=>pc.addTrack(t,State.localStream));
  pc.onicecandidate=e=>{if(e.candidate&&State.socket)State.socket.emit('voice_candidate',{candidate:e.candidate,channel:id});};
  pc.ontrack=e=>{const a=document.createElement('audio');a.srcObject=e.streams[0];a.autoplay=true;a.volume=parseFloat(document.getElementById('remoteVolumeFill')?.style.width||'80')/100;document.body.appendChild(a);State.remoteAudioElements.push(a);document.getElementById('voiceParticipantCount').textContent=`(${State.remoteAudioElements.length})`;};
  if(State.socket)State.socket.emit('voice_join',{channel:id});
  pc.createOffer().then(o=>{pc.setLocalDescription(o);if(State.socket)State.socket.emit('voice_offer',{sdp:o,channel:id});}).catch(e=>console.warn('Ses bağlantısı hatası:',e));
}
function toggleMute(){if(!State.localStream)return;State.isMuted=!State.isMuted;State.localStream.getAudioTracks().forEach(t=>t.enabled=!State.isMuted);const b=document.getElementById('muteBtn');b.innerHTML=State.isMuted?Icons.micOff:Icons.mic;b.classList.toggle('muted',State.isMuted);}
function toggleDeafen(){State.isDeafened=!State.isDeafened;State.remoteAudioElements.forEach(a=>a.muted=State.isDeafened);document.getElementById('deafenBtn').classList.toggle('muted',State.isDeafened);}
async function startScreenShare(){try{const s=await navigator.mediaDevices.getDisplayMedia({video:true});State.peerConnections.forEach(pc=>s.getTracks().forEach(t=>pc.addTrack(t,s)));}catch(e){toast('Ekran paylaşımı iptal edildi',true);}}
async function startVideo(){try{const s=await navigator.mediaDevices.getUserMedia({video:true});State.peerConnections.forEach(pc=>s.getTracks().forEach(t=>pc.addTrack(t,s)));}catch(e){toast('Kamera reddedildi',true);}}
function leaveVoiceChannel(){
  if(State.localStream){State.localStream.getTracks().forEach(t=>t.stop());State.localStream=null;}
  State.peerConnections.forEach(pc=>pc.close());State.peerConnections.clear();
  State.remoteAudioElements.forEach(a=>{a.srcObject=null;a.remove();});State.remoteAudioElements=[];
  if(State.socket)State.socket.emit('voice_leave',{channel:State.channel.id});
  document.getElementById('voiceBar').style.display='none';State.isInVoice=State.isMuted=State.isDeafened=false;
  document.getElementById('muteBtn').innerHTML=Icons.mic;document.getElementById('muteBtn').classList.remove('muted');
  document.getElementById('deafenBtn').classList.remove('muted');document.getElementById('voiceParticipantCount').textContent='';
}

function renderRoles(){const c=document.getElementById('rolesList');if(!c)return;c.innerHTML=State.roles.sort((a,b)=>a.position-b.position).map(r=>`<div class="role-item"><div style="width:24px;height:24px;border-radius:50%;background:${r.color};"></div><div class="role-info"><div class="role-name">${sanitize(r.name)}</div></div><button onclick="openEditRole('${r.id}')" aria-label="Düzenle">${Icons.edit}</button></div>`).join('');}

function saveRoleEdit(){const id=document.getElementById('editRoleId').value;const r=State.roles.find(x=>x.id===id);if(!r)return;r.name=document.getElementById('editRoleName').value;r.color=document.getElementById('editRoleColor').value;r.permissions={};document.querySelectorAll('#rolePerms .toggle-switch').forEach(t=>r.permissions[t.dataset.p]=t.classList.contains('on'));saveState();closeModal('editRoleModal');renderRoles();}
function addRole(){const n=document.getElementById('newRoleName')?.value.trim(),c=document.getElementById('newRoleColor')?.value||'#9ca3af';if(!n)return;State.roles.push({id:genId(),name:n,color:c,permissions:{sendMsg:true},position:State.roles.length});saveState();closeModal('addRoleModal');renderRoles();}
function showUserInfo(uid,uname){

  c.innerHTML=`<div class="profile-avatar-large">${sanitize(uname.charAt(0).toUpperCase())}</div><h3 style="text-align:center;">${sanitize(uname)}</h3>
