<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Gettic - Sohbet Uygulaması</title>
    <link rel="icon" href="https://github.com/darking053official/gettic/blob/main/1777062266055.png">
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Outfit', Roboto, sans-serif;
            background: #0a0a12;
            color: #f0f0ff;
            height: 100vh;
            overflow: hidden;
        }

        /* Ana Uygulama Layout */
        .app {
            display: flex;
            height: 100vh;
            background: #0f0f1a;
        }

        /* SOL TARAF - SUNUCU LİSTESİ */
        .server-rail {
            width: 72px;
            background: #080812;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px 0;
            gap: 12px;
            overflow-y: auto;
            border-right: 1px solid #1a1a2e;
            flex-shrink: 0;
        }

        .server-icon {
            width: 48px;
            height: 48px;
            background: #1a1a2e;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: bold;
            font-size: 18px;
            color: #a0a0c0;
        }

        .server-icon:hover, .server-icon.active {
            border-radius: 16px;
            background: #5865f2;
            color: white;
        }

        .server-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: inherit;
        }

        /* SOL TARAF - KANAL LİSTESİ */
        .channel-sidebar {
            width: 240px;
            background: #0d0d18;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #1a1a2e;
            flex-shrink: 0;
        }

        .channel-header {
            height: 48px;
            padding: 0 16px;
            display: flex;
            align-items: center;
            font-weight: bold;
            border-bottom: 1px solid #1a1a2e;
            background: #0a0a14;
            font-size: 14px;
        }

        .channel-category {
            padding: 16px 16px 4px 16px;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            color: #6a6a8a;
            letter-spacing: 1px;
        }

        .channel-item {
            padding: 6px 16px;
            margin: 1px 8px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 14px;
            color: #b0b0d0;
            transition: all 0.1s ease;
        }

        .channel-item:hover {
            background: #1a1a2a;
            color: white;
        }

        .channel-item.active {
            background: #2a2a3e;
            color: white;
        }

        .channel-icon {
            font-size: 16px;
        }

        /* ANA SOHBET ALANI */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #0f0f1a;
            min-width: 0;
        }

        .chat-header {
            height: 48px;
            padding: 0 20px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #1a1a2e;
            background: #0d0d18;
            font-weight: bold;
            font-size: 14px;
            gap: 12px;
        }

        .chat-header .topic {
            font-size: 12px;
            color: #6a6a8a;
            font-weight: normal;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .message-avatar {
            width: 36px;
            height: 36px;
            background: #5865f2;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            flex-shrink: 0;
            font-size: 14px;
        }

        .message-content {
            flex: 1;
        }

        .message-header {
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 2px;
        }

        .message-header span {
            font-weight: normal;
            font-size: 11px;
            margin-left: 8px;
            color: #6a6a8a;
        }

        .message-text {
            font-size: 14px;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .typing-indicator {
            padding: 8px 20px;
            font-size: 12px;
            color: #6a6a8a;
            font-style: italic;
            height: 36px;
        }

        /* MESAJ GÖNDERME ALANI */
        .input-area {
            padding: 16px 20px;
            background: #0d0d18;
            border-top: 1px solid #1a1a2e;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .message-input {
            flex: 1;
            background: #1a1a2a;
            border: none;
            border-radius: 24px;
            padding: 10px 16px;
            color: white;
            font-size: 14px;
            outline: none;
            transition: all 0.2s;
        }

        .message-input:focus {
            background: #222236;
        }

        .emoji-btn, .send-btn {
            background: #2a2a3e;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .send-btn {
            background: #5865f2;
            color: white;
        }

        .emoji-btn:hover, .send-btn:hover {
            filter: brightness(1.1);
            transform: scale(1.02);
        }

        /* EMOJI PICKER */
        .emoji-picker {
            position: fixed;
            bottom: 90px;
            left: 340px;
            background: #1a1a2e;
            border-radius: 12px;
            padding: 12px;
            display: none;
            grid-template-columns: repeat(8, 1fr);
            gap: 8px;
            z-index: 100;
            border: 1px solid #2a2a3e;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .emoji-picker.show {
            display: grid;
        }

        .emoji-option {
            font-size: 22px;
            cursor: pointer;
            padding: 4px;
            text-align: center;
            border-radius: 8px;
            transition: all 0.1s;
        }

        .emoji-option:hover {
            background: #2a2a3e;
            transform: scale(1.1);
        }

        /* SAĞ TARAF - KULLANICI PANELİ */
        .user-panel {
            width: 240px;
            background: #0a0a14;
            border-left: 1px solid #1a1a2e;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            flex-shrink: 0;
        }

        .user-profile {
            display: flex;
            gap: 12px;
            align-items: center;
            padding-bottom: 12px;
            border-bottom: 1px solid #1a1a2e;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            background: #5865f2;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 16px;
        }

        .user-info {
            flex: 1;
        }

        .user-name {
            font-weight: bold;
            font-size: 14px;
        }

        .user-status {
            font-size: 11px;
            color: #22c55e;
        }

        .logout-btn {
            background: #1a1a2e;
            border: none;
            padding: 8px;
            border-radius: 8px;
            color: #ef4444;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
            width: 100%;
        }

        .logout-btn:hover {
            background: #ef4444;
            color: white;
        }

        /* MODAL (GİRİŞ/KAYIT) */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            display: none;
        }

        .modal.show {
            display: flex;
            animation: fadeIn 0.2s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-box {
            background: #151528;
            border-radius: 24px;
            padding: 32px;
            width: 400px;
            max-width: 90%;
        }

        .modal-box h2 {
            margin-bottom: 20px;
            text-align: center;
        }

        .modal-input {
            width: 100%;
            padding: 12px 16px;
            background: #0a0a14;
            border: 1px solid #2a2a3a;
            border-radius: 12px;
            color: white;
            margin-bottom: 16px;
            font-size: 14px;
        }

        .modal-input:focus {
            outline: none;
            border-color: #5865f2;
        }

        .modal-btn {
            width: 100%;
            padding: 12px;
            background: #5865f2;
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }

        .modal-switch {
            text-align: center;
            margin-top: 16px;
            font-size: 12px;
            color: #6a6a8a;
        }

        .modal-switch span {
            color: #5865f2;
            cursor: pointer;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #1a1a2e;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 13px;
            z-index: 2000;
            animation: slideIn 0.2s ease;
        }

        @keyframes slideIn {
            from { transform: translateX(100px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* SCROLLBAR */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #0a0a14;
        }

        ::-webkit-scrollbar-thumb {
            background: #2a2a3e;
            border-radius: 3px;
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .server-rail { width: 56px; }
            .server-icon { width: 40px; height: 40px; font-size: 14px; }
            .channel-sidebar { width: 200px; }
            .user-panel { width: 200px; }
            .emoji-picker { left: 280px; }
        }
    </style>
</head>
<body>
<div id="appRoot"></div>

<script>
    // ==================== KONFIGURASYON ====================
    const API_URL = 'https://gettic-j49l.onrender.com';
    let currentUser = null;
    let currentToken = localStorage.getItem('gt_token');
    let socket = null;
    let currentChannel = { id: 'genel-sohbet', name: 'genel-sohbet' };
    let messages = [];
    let typingTimeout = null;

    // ==================== YARDIMCI FONKSİYONLAR ====================
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    function showToast(msg, isError = false) {
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.textContent = msg;
        toast.style.color = isError ? '#ef4444' : '#22c55e';
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2500);
    }

    // ==================== SOCKET.IO (GERÇEK ZAMANLI) ====================
    function initSocket() {
        if (!currentToken) return;
        if (socket) socket.disconnect();
        
        socket = io(API_URL, {
            auth: { token: currentToken },
            transports: ['websocket'],
            reconnection: true
        });

        socket.on('connect', () => {
            console.log('✅ Socket bağlandı');
            socket.emit('join_channel', currentChannel.id);
        });

        socket.on('disconnect', () => {
            console.log('❌ Socket bağlantısı kesildi');
        });

        socket.on('new_message', (msg) => {
            if (msg.channelId === currentChannel.id) {
                addMessageToChat(msg);
            }
        });

        socket.on('user_typing', ({ username, channelId }) => {
            if (channelId === currentChannel.id && username !== currentUser?.username) {
                showTyping(username);
            }
        });
    }

    // ==================== MESAJ FONKSİYONLARI ====================
    async function loadMessages() {
        if (!currentToken) return;
        try {
            const res = await fetch(`${API_URL}/api/channels/${currentChannel.id}/messages`, {
                headers: { 'Authorization': `Bearer ${currentToken}` }
            });
            messages = await res.json();
            renderMessages();
        } catch (err) {
            console.error('Mesajlar yüklenemedi:', err);
        }
    }

    function renderMessages() {
        const container = document.getElementById('messagesContainer');
        if (!container) return;
        
        container.innerHTML = messages.map(msg => `
            <div class="message">
                <div class="message-avatar">${msg.senderName?.charAt(0).toUpperCase() || '?'}</div>
                <div class="message-content">
                    <div class="message-header">${escapeHtml(msg.senderName)} <span>${new Date(msg.createdAt).toLocaleTimeString()}</span></div>
                    <div class="message-text">${escapeHtml(msg.content)}</div>
                </div>
            </div>
        `).join('');
        
        container.scrollTop = container.scrollHeight;
    }

    function addMessageToChat(msg) {
        const container = document.getElementById('messagesContainer');
        if (!container) return;
        
        const messageDiv = document.createElement('div');
        messageDiv.className = 'message';
        messageDiv.innerHTML = `
            <div class="message-avatar">${msg.senderName?.charAt(0).toUpperCase() || '?'}</div>
            <div class="message-content">
                <div class="message-header">${escapeHtml(msg.senderName)} <span>${new Date(msg.createdAt).toLocaleTimeString()}</span></div>
                <div class="message-text">${escapeHtml(msg.content)}</div>
            </div>
        `;
        container.appendChild(messageDiv);
        container.scrollTop = container.scrollHeight;
    }

    async function sendMessage(content) {
        if (!content || !currentChannel) return;
        try {
            await fetch(`${API_URL}/api/channels/${currentChannel.id}/messages`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${currentToken}`
                },
                body: JSON.stringify({ content })
            });
        } catch (err) {
            showToast(err.message, true);
        }
    }

    function sendTyping() {
        if (socket && currentChannel) {
            socket.emit('typing', {
                channelId: currentChannel.id,
                username: currentUser?.username
            });
        }
    }

    function showTyping(username) {
        const indicator = document.getElementById('typingIndicator');
        if (indicator) {
            indicator.textContent = `${username} yazıyor...`;
            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => {
                if (indicator) indicator.textContent = '';
            }, 2000);
        }
    }

    // ==================== KANAL DEĞİŞTİRME ====================
    function switchChannel(channelId, channelName) {
        currentChannel = { id: channelId, name: channelName };
        
        // Aktif kanalı vurgula
        document.querySelectorAll('.channel-item').forEach(el => {
            el.classList.remove('active');
            if (el.dataset.channel === channelId) {
                el.classList.add('active');
            }
        });
        
        // Header güncelle
        const header = document.getElementById('chatHeader');
        if (header) {
            header.innerHTML = `<span># ${channelName}</span> <span class="topic">Sohbet odası</span>`;
        }
        
        // Socket ile kanal değiştir
        if (socket) {
            socket.emit('leave_channel', currentChannel.id);
            socket.emit('join_channel', channelId);
        }
        
        // Mesajları yeniden yükle
        loadMessages();
    }

    // ==================== AUTH FONKSİYONLARI ====================
    async function doLogin(username, password) {
        try {
            const res = await fetch(`${API_URL}/api/auth/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'Giriş başarısız');
            
            currentToken = data.token;
            currentUser = data.user;
            localStorage.setItem('gt_token', currentToken);
            localStorage.setItem('gt_user', JSON.stringify(currentUser));
            
            showToast('Giriş başarılı!');
            renderApp();
            initSocket();
            loadMessages();
        } catch (err) {
            showToast(err.message, true);
            throw err;
        }
    }

    async function doRegister(username, password) {
        if (username.length < 3) throw new Error('Kullanıcı adı en az 3 karakter');
        if (password.length < 6) throw new Error('Şifre en az 6 karakter');
        
        try {
            const res = await fetch(`${API_URL}/api/auth/register`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'Kayıt başarısız');
            
            currentToken = data.token;
            currentUser = data.user;
            localStorage.setItem('gt_token', currentToken);
            localStorage.setItem('gt_user', JSON.stringify(currentUser));
            
            showToast('Kayıt başarılı!');
            renderApp();
            initSocket();
            loadMessages();
        } catch (err) {
            showToast(err.message, true);
            throw err;
        }
    }

    function logout() {
        localStorage.removeItem('gt_token');
        localStorage.removeItem('gt_user');
        currentUser = null;
        currentToken = null;
        if (socket) socket.disconnect();
        renderApp();
        showToast('Çıkış yapıldı');
    }

    // ==================== UI RENDER ====================
    function renderAuthModal() {
        return `
            <div class="modal show" id="authModal">
                <div class="modal-box">
                    <h2>Gettic</h2>
                    <div style="display: flex; gap: 12px; margin-bottom: 20px;">
                        <button id="loginTabBtn" style="flex:1; padding:8px; background:#5865f2; border:none; border-radius:8px; color:white; cursor:pointer;">Giriş</button>
                        <button id="registerTabBtn" style="flex:1; padding:8px; background:#1a1a2e; border:none; border-radius:8px; color:white; cursor:pointer;">Kayıt</button>
                    </div>
                    <div id="loginForm">
                        <input type="text" id="loginUsername" class="modal-input" placeholder="Kullanıcı Adı">
                        <input type="password" id="loginPassword" class="modal-input" placeholder="Şifre">
                        <button id="doLoginBtn" class="modal-btn">Giriş Yap</button>
                    </div>
                    <div id="registerForm" style="display: none;">
                        <input type="text" id="regUsername" class="modal-input" placeholder="Kullanıcı Adı">
                        <input type="password" id="regPassword" class="modal-input" placeholder="Şifre (en az 6 karakter)">
                        <button id="doRegisterBtn" class="modal-btn">Kayıt Ol</button>
                    </div>
                    <div class="modal-switch"><span id="switchAuthBtn">Hesabın yok mu? Kayıt ol</span></div>
                    <div id="authError" style="color:#ef4444; font-size:12px; text-align:center; margin-top:12px;"></div>
                </div>
            </div>
        `;
    }

    function renderMainApp() {
        return `
            <div class="app">
                <!-- Sol Sunucu Listesi -->
                <div class="server-rail">
                    <div class="server-icon active" data-server="main">🎧</div>
                    <div class="server-icon" data-server="games">🎮</div>
                    <div class="server-icon" data-server="dev">💻</div>
                </div>

                <!-- Kanal Listesi -->
                <div class="channel-sidebar">
                    <div class="channel-header">Gettic</div>
                    
                    <div class="channel-category">📁 METİN ODALARI</div>
                    <div class="channel-item active" data-channel="genel-sohbet">
                        <span class="channel-icon">#</span> genel-sohbet
                    </div>
                    <div class="channel-item" data-channel="gettic-art">
                        <span class="channel-icon">#</span> gettic-art
                    </div>
                    <div class="channel-item" data-channel="reklam">
                        <span class="channel-icon">#</span> reklam
                    </div>

                    <div class="channel-category">📢 GERİ BİLDİRİM</div>
                    <div class="channel-item" data-channel="oneri">
                        <span class="channel-icon">#</span> öneri
                    </div>
                    <div class="channel-item" data-channel="bug-bildirimi">
                        <span class="channel-icon">#</span> bug-bildirimi
                    </div>

                    <div class="channel-category">🛠️ GELİŞTİRİCİLER</div>
                    <div class="channel-item" data-channel="kod-destek">
                        <span class="channel-icon">#</span> kod-destek
                    </div>
                    <div class="channel-item" data-channel="yazilim-soru-cevap">
                        <span class="channel-icon">#</span> yazilim-soru-cevap
                    </div>
                </div>

                <!-- Sohbet Alanı -->
                <div class="chat-area">
                    <div class="chat-header" id="chatHeader">
                        <span># genel-sohbet</span>
                        <span class="topic">Sohbet odası</span>
                    </div>
                    <div class="messages-container" id="messagesContainer">
                        <div style="text-align:center; color:#6a6a8a; padding:40px;">Mesajlar burada görünecek</div>
                    </div>
                    <div class="typing-indicator" id="typingIndicator"></div>
                    <div class="input-area">
                        <button class="emoji-btn" id="emojiBtn">😀</button>
                        <div id="emojiPicker" class="emoji-picker"></div>
                        <input type="text" class="message-input" id="messageInput" placeholder="Mesajınızı yazın..." autocomplete="off">
                        <button class="send-btn" id="sendBtn">➤</button>
                    </div>
                </div>

                <!-- Kullanıcı Paneli -->
                <div class="user-panel">
                    <div class="user-profile">
                        <div class="user-avatar">${currentUser?.username?.charAt(0).toUpperCase() || 'U'}</div>
                        <div class="user-info">
                            <div class="user-name">${escapeHtml(currentUser?.username || 'Kullanıcı')}</div>
                            <div class="user-status">🟢 Çevrimiçi</div>
                        </div>
                    </div>
                    <button class="logout-btn" id="logoutBtn">Çıkış Yap</button>
                </div>
            </div>
        `;
    }

    function renderApp() {
        const root = document.getElementById('appRoot');
        if (!currentUser) {
            root.innerHTML = renderAuthModal();
            attachAuthEvents();
        } else {
            root.innerHTML = renderMainApp();
            attachAppEvents();
            loadMessages();
            initSocket();
        }
    }

    // ==================== EVENT BAĞLANTILARI ====================
    function attachAuthEvents() {
        const loginTab = document.getElementById('loginTabBtn');
        const registerTab = document.getElementById('registerTabBtn');
        const switchBtn = document.getElementById('switchAuthBtn');
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');

        if (loginTab) {
            loginTab.onclick = () => {
                loginForm.style.display = 'block';
                registerForm.style.display = 'none';
                loginTab.style.background = '#5865f2';
                registerTab.style.background = '#1a1a2e';
            };
        }
        
        if (registerTab) {
            registerTab.onclick = () => {
                loginForm.style.display = 'none';
                registerForm.style.display = 'block';
                loginTab.style.background = '#1a1a2e';
                registerTab.style.background = '#5865f2';
            };
        }
        
        if (switchBtn) {
            switchBtn.onclick = () => {
                if (loginForm.style.display !== 'none') {
                    loginForm.style.display = 'none';
                    registerForm.style.display = 'block';
                    loginTab.style.background = '#1a1a2e';
                    registerTab.style.background = '#5865f2';
                } else {
                    loginForm.style.display = 'block';
                    registerForm.style.display = 'none';
                    loginTab.style.background = '#5865f2';
                    registerTab.style.background = '#1a1a2e';
                }
            };
        }

        const doLoginBtn = document.getElementById('doLoginBtn');
        if (doLoginBtn) {
            doLoginBtn.onclick = async () => {
                const username = document.getElementById('loginUsername')?.value.trim();
                const password = document.getElementById('loginPassword')?.value;
                if (!username || !password) {
                    document.getElementById('authError').innerText = 'Tüm alanları doldurun';
                    return;
                }
                try {
                    await doLogin(username, password);
                } catch (err) {
                    document.getElementById('authError').innerText = err.message;
                }
            };
        }

        const doRegisterBtn = document.getElementById('doRegisterBtn');
        if (doRegisterBtn) {
            doRegisterBtn.onclick = async () => {
                const username = document.getElementById('regUsername')?.value.trim();
                const password = document.getElementById('regPassword')?.value;
                try {
                    await doRegister(username, password);
                } catch (err) {
                    document.getElementById('authError').innerText = err.message;
                }
            };
        }
    }

    function attachAppEvents() {
        // Kanal tıklamaları
        document.querySelectorAll('.channel-item').forEach(el => {
            el.onclick = () => {
                const channelId = el.dataset.channel;
                const channelName = channelId.replace(/-/g, ' ');
                switchChannel(channelId, channelName);
            };
        });

        // Mesaj gönderme
        const input = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        
        const handleSend = () => {
            const content = input?.value.trim();
            if (content) {
                sendMessage(content);
                if (input) input.value = '';
            }
        };
        
        if (sendBtn) sendBtn.onclick = handleSend;
        if (input) {
            input.onkeypress = (e) => {
                if (e.key === 'Enter') handleSend();
            };
            input.oninput = () => sendTyping();
        }

        // Emoji Picker
        const emojiBtn = document.getElementById('emojiBtn');
        const picker = document.getElementById('emojiPicker');
        const emojis = ['😀', '😂', '❤️', '🔥', '🎉', '👍', '👎', '🙏', '🎮', '💻', '🐛', '📢', '✨', '⭐', '✅', '❌', '💪', '🎯', '🔧', '📦', '🚀', '💬'];
        
        if (picker) {
            picker.innerHTML = emojis.map(e => `<div class="emoji-option" data-emoji="${e}">${e}</div>`).join('');
            picker.querySelectorAll('.emoji-option').forEach(opt => {
                opt.onclick = () => {
                    if (input) input.value += opt.dataset.emoji;
                    picker.classList.remove('show');
                    input?.focus();
                };
            });
        }
        
        if (emojiBtn) {
            emojiBtn.onclick = (e) => {
                e.stopPropagation();
                picker?.classList.toggle('show');
            };
        }
        
        document.addEventListener('click', (e) => {
            if (picker && !picker.contains(e.target) && e.target !== emojiBtn) {
                picker.classList.remove('show');
            }
        });

        // Çıkış
        const logoutBtn = document.getElementById('logoutBtn');
        if (logoutBtn) logoutBtn.onclick = () => logout();
    }

    // ==================== BAŞLATMA ====================
    function init() {
        const storedUser = localStorage.getItem('gt_user');
        if (storedUser && currentToken) {
            try {
                currentUser = JSON.parse(storedUser);
            } catch(e) {}
        }
        renderApp();
    }

    init();
</script>
</body>
