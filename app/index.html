<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#c94d8c">
    <link rel="icon" href="https://raw.githubusercontent.com/darking053official/gettic/main/1777062266055.png">
    <title>Gettic</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/chat.css">
    <link rel="stylesheet" href="css/modals.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <noscript>
        <div style="padding:20px;text-align:center;background:#c94d8c;color:#fff">JavaScript gerekli</div>
    </noscript>
    <div id="root">
        <div id="ls">
            <div class="spin"></div>
            <div class="ls-logo">gettic</div>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/icons.js"></script>
    <script src="js/roles.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/chat.js"></script>
    <script src="js/channels.js"></script>
    <script src="js/dm.js"></script>
    <script src="js/voice.js"></script>
    <script src="js/polls.js"></script>
    <script src="js/ui.js"></script>
    <script type="text/babel" src="js/app.js"></script>
    
    <script>
        window.onload = function() {
            if (typeof App === 'function') {
                const root = ReactDOM.createRoot(document.getElementById('root'));
                root.render(React.createElement(App));
                setTimeout(function() {
                    var ls = document.getElementById('ls');
                    if (ls) ls.classList.add('hide');
                }, 800);
            }
        };
    </script>
</body>
</html>
