<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Gettic — Modern Sohbet Platformu</title>
  <meta name="description" content="Gettic - Gerçek zamanlı sohbet ve bot platformu" />
  <link rel="icon" href="https://github.com/darking053official/gettic/blob/main/1777062266055.png?raw=true" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0b0b12; --bg2: #111119; --bg3: #16161f; --bg4: #1c1c28;
      --text: #eeeef5; --text2: #9494a8; --text3: #55556e;
      --pink: #e879f9; --purple: #a855f7; --accent: #c084fc; --accent2: #d8b4fe;
      --glow: rgba(192,132,252,0.25); --glow2: rgba(232,121,249,0.35);
      --green: #4ade80; --red: #f87171; --yellow: #facc15; --blue: #60a5fa;
      --border: rgba(255,255,255,0.05); --border2: rgba(255,255,255,0.1);
      --radius: 10px; --radius2: 14px;
      --sidebar: 260px; --serverbar: 60px; --topbar: 54px;
      --font: 'Inter', sans-serif; --mono: 'JetBrains Mono', monospace;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;overflow:hidden;font-family:var(--font);background:var(--bg);color:var(--text);-webkit-tap-highlight-color:transparent}
    
    /* Loading */
    #app-loading{position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 0.5s,visibility 0.5s}
    #app-loading.hidden{opacity:0;visibility:hidden;pointer-events:none}
    .load-ring{width:44px;height:44px;border:3px solid var(--border2);border-top-color:var(--pink);border-radius:50%;animation:spin 0.7s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .load-logo{font-size:26px;font-weight:800;background:linear-gradient(135deg,var(--pink),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-top:18px;letter-spacing:-1px}
    .load-sub{font-size:12px;color:var(--text3);margin-top:6px}

    /* Login Screen */
    #login-screen{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;align-items:center;justify-content:center;transition:transform 0.5s cubic-bezier(0.4,0,0.2,1),opacity 0.5s}
    #login-screen.hidden{transform:scale(1.1);opacity:0;pointer-events:none}
    .login-card{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius2);padding:36px 28px;width:90%;max-width:400px;text-align:center;animation:cardIn 0.6s cubic-bezier(0.4,0,0.2,1)}
    @keyframes cardIn{from{opacity:0;transform:translateY(30px) scale(0.96)}to{opacity:1;transform:translateY(0) scale(1)}}
    .login-card img{width:56px;height:56px;border-radius:14px;margin-bottom:16px}
    .login-card h1{font-size:22px;font-weight:800;margin-bottom:4px;background:linear-gradient(135deg,var(--pink),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-0.5px}
    .login-card p{font-size:13px;color:var(--text2);margin-bottom:24px}
    .login-input{width:100%;padding:11px 14px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:14px;font-family:var(--font);margin-bottom:10px;transition:all 0.2s}
    .login-input:focus{outline:none;border-color:var(--pink);box-shadow:0 0 0 3px var(--glow)}
    .login-btn{width:100%;padding:11px;background:linear-gradient(135deg,var(--pink),var(--purple));border:none;border-radius:var(--radius);color:#fff;font-weight:700;font-size:14px;cursor:pointer;font-family:var(--font);transition:all 0.25s;margin-top:4px}
    .login-btn:hover{transform:translateY(-1px);box-shadow:0 8px 30px var(--glow2)}
    .login-switch{font-size:12px;color:var(--text3);margin-top:14px;cursor:pointer;transition:color 0.2s}
    .login-switch:hover{color:var(--pink)}
    .login-switch span{color:var(--accent2);font-weight:600}

    /* App Layout */
    #app-layout{display:flex;height:100%;opacity:0;transition:opacity 0.5s}
    #app-layout.visible{opacity:1}
    
    /* Server Bar */
    #server-bar{width:var(--serverbar);background:var(--bg2);display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:6px;border-right:1px solid var(--border);overflow-y:auto;flex-shrink:0;z-index:10}
    .s-icon{width:42px;height:42px;border-radius:50%;background:var(--bg3);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.25s;border:2px solid transparent;position:relative;flex-shrink:0;overflow:hidden}
    .s-icon:hover{border-radius:12px;border-color:var(--accent);box-shadow:0 0 18px var(--glow)}
    .s-icon.active{border-radius:12px;border-color:var(--pink);background:var(--bg4);box-shadow:0 0 22px var(--glow2)}
    .s-icon.active::after{content:'';position:absolute;left:-10px;top:50%;transform:translateY(-50%);width:5px;height:20px;background:var(--pink);border-radius:0 3px 3px 0}
    .s-icon img{width:100%;height:100%;object-fit:cover;border-radius:inherit}
    .s-icon svg{width:22px;height:22px;stroke:var(--text2);fill:none;stroke-width:1.8;transition:stroke 0.2s}
    .s-icon:hover svg{stroke:var(--text)}
    .s-sep{width:28px;height:1.5px;background:var(--border2);border-radius:1px;margin:5px 0}
    .s-add{background:var(--bg3)!important;border:2px dashed var(--border2)!important}
    .s-add:hover{background:var(--pink)!important;border-color:var(--pink)!important}
    .s-add:hover svg{stroke:#fff}
    .s-discover{margin-top:auto}
    .s-discover svg{stroke:var(--green)}

    /* Channel Sidebar */
    #channel-bar{width:var(--sidebar);background:var(--bg2);display:flex;flex-direction:column;border-right:1px solid var(--border);flex-shrink:0;overflow:hidden;transition:all 0.3s}
    #server-header{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;cursor:pointer;min-height:50px;transition:background 0.2s}
    #server-header:hover{background:var(--bg3)}
    #server-header h2{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
    #server-header svg{width:16px;height:16px;stroke:var(--text2);flex-shrink:0;transition:transform 0.3s}
    #server-header.open svg{transform:rotate(180deg)}
    #server-actions{display:flex;gap:4px;padding:8px 12px;flex-wrap:wrap;border-bottom:1px solid var(--border)}
    .act-btn{padding:5px 10px;background:var(--bg3);border:1px solid var(--border);border-radius:6px;color:var(--text2);font-size:11px;font-weight:600;cursor:pointer;font-family:var(--font);transition:all 0.2s;display:flex;align-items:center;gap:5px;white-space:nowrap}
    .act-btn:hover{background:var(--bg4);color:var(--text);border-color:var(--border2)}
    .act-btn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2}
    #channel-list{flex:1;overflow-y:auto;padding:4px 8px}
    .cat-header{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text3);padding:14px 8px 6px;display:flex;align-items:center;gap:5px;cursor:pointer}
    .cat-header svg{width:11px;height:11px;stroke:var(--text3)}
    .cat-header.open svg{transform:rotate(90deg)}
    .ch-item{display:flex;align-items:center;gap:7px;padding:7px 10px;border-radius:6px;cursor:pointer;font-size:12.5px;font-weight:500;color:var(--text2);transition:all 0.2s;position:relative}
    .ch-item:hover{background:var(--bg3);color:var(--text)}
    .ch-item.active{background:rgba(192,132,252,0.1);color:var(--accent2)}
    .ch-item svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7;flex-shrink:0}
    .ch-item.voice svg{stroke:var(--green)}
    #user-panel{padding:10px 14px;border-top:1px solid var(--border);display:flex;align-items:center;gap:9px;background:var(--bg3);min-height:52px}
    #user-panel img,#user-avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--pink),var(--purple));object-fit:cover}
    #user-info{flex:1;min-width:0}
    #user-name{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    #user-tag{font-size:10.5px;color:var(--text3)}
    #user-btns{display:flex;gap:2px}
    #user-btns button{background:none;border:none;cursor:pointer;padding:5px;border-radius:4px;color:var(--text2);transition:all 0.2s}
    #user-btns button:hover{color:var(--text);background:var(--bg4)}
    #user-btns svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8}

    /* Main Area */
    #main-area{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg)}
    #top-bar{height:var(--topbar);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 18px;gap:10px;flex-shrink:0;background:var(--bg)}
    #channel-icon{width:20px;height:20px;stroke:var(--text2);fill:none;stroke-width:1.8;flex-shrink:0}
    #top-title{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    #top-desc{font-size:11px;color:var(--text3);margin-left:4px}
    #top-actions{margin-left:auto;display:flex;gap:6px}
    .top-btn{padding:6px 11px;border-radius:5px;border:1px solid var(--border2);background:transparent;color:var(--text2);font-size:11px;cursor:pointer;font-family:var(--font);transition:all 0.2s;display:flex;align-items:center;gap:5px}
    .top-btn:hover{background:var(--bg3);color:var(--text)}
    .top-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8}

    /* Messages */
    #msg-area{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px 20px;display:flex;flex-direction:column;gap:2px}
    #msg-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px}
    #msg-empty svg{width:70px;height:70px;stroke:var(--text3);fill:none;stroke-width:1.2;opacity:0.4;margin-bottom:14px}
    #msg-empty h3{font-size:18px;font-weight:700;margin-bottom:4px;background:linear-gradient(135deg,var(--pink),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    #msg-empty p{font-size:12.5px;color:var(--text3);max-width:300px;line-height:1.5}
    .msg-row{display:flex;gap:10px;padding:6px 4px;animation:msgIn 0.35s cubic-bezier(0.4,0,0.2,1);transition:background 0.2s;border-radius:6px}
    .msg-row:hover{background:rgba(255,255,255,0.015)}
    @keyframes msgIn{from{opacity:0;transform:translateX(-10px) scale(0.98)}to{opacity:1;transform:translateX(0) scale(1)}}
    .msg-av{width:36px;height:36px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff;background:linear-gradient(135deg,var(--pink),var(--purple))}
    .msg-body{flex:1;min-width:0}
    .msg-head{display:flex;align-items:baseline;gap:8px;margin-bottom:1px}
    .msg-auth{font-size:13px;font-weight:700;color:var(--accent2)}
    .msg-time{font-size:10.5px;color:var(--text3)}
    .msg-text{font-size:13.5px;line-height:1.55;color:var(--text);word-break:break-word;white-space:pre-wrap}

    /* Input */
    #input-zone{padding:10px 18px 16px;border-top:1px solid var(--border);flex-shrink:0;background:var(--bg)}
    #input-wrap{display:flex;align-items:flex-end;gap:8px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:8px 14px;transition:all 0.25s}
    #input-wrap:focus-within{border-color:var(--pink);box-shadow:0 0 0 3px var(--glow)}
    #msg-input{flex:1;background:none;border:none;outline:none;color:var(--text);font-family:var(--font);font-size:13.5px;resize:none;min-height:20px;max-height:100px;line-height:1.5;padding:2px 0}
    #msg-input::placeholder{color:var(--text3)}
    .input-icon{background:none;border:none;cursor:pointer;padding:3px;border-radius:4px;color:var(--text2);transition:all 0.2s;display:flex}
    .input-icon:hover{color:var(--accent2);background:rgba(192,132,252,0.08)}
    .input-icon svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8}
    #send-btn{background:linear-gradient(135deg,var(--pink),var(--purple));border:none;border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.25s;flex-shrink:0;box-shadow:0 4px 18px var(--glow2)}
    #send-btn:hover{transform:scale(1.08)}#send-btn:active{transform:scale(0.95)}
    #send-btn svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2.5}

    /* Modals */
    .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.65);z-index:200;display:flex;align-items:center;justify-content:center;animation:fadeIn 0.2s;backdrop-filter:blur(3px)}
    @keyframes fadeIn{from{opacity:0}}
    .modal{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius2);width:92%;max-width:520px;max-height:82vh;overflow-y:auto;padding:24px;animation:modIn 0.35s cubic-bezier(0.4,0,0.2,1);position:relative}
    @keyframes modIn{from{opacity:0;transform:scale(0.94) translateY(15px)}}
    .modal h3{font-size:17px;font-weight:700;margin-bottom:6px;background:linear-gradient(135deg,var(--pink),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .modal p{font-size:12.5px;color:var(--text2);margin-bottom:16px}
    .modal-inp{width:100%;padding:10px 13px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;font-family:var(--font);margin-bottom:10px;transition:all 0.2s}
    .modal-inp:focus{outline:none;border-color:var(--pink);box-shadow:0 0 0 3px var(--glow)}
    .modal-btn{width:100%;padding:10px;background:linear-gradient(135deg,var(--pink),var(--purple));border:none;border-radius:8px;color:#fff;font-weight:700;font-size:13px;cursor:pointer;font-family:var(--font);transition:all 0.25s}
    .modal-btn:hover{opacity:0.9;transform:translateY(-1px);box-shadow:0 6px 22px var(--glow2)}
    .modal-btn.sec{background:var(--bg3);border:1px solid var(--border2);color:var(--text);margin-top:6px}
    .modal-btn.danger{background:linear-gradient(135deg,var(--red),#dc2626)}
    .modal-close{position:absolute;top:12px;right:12px;background:none;border:none;cursor:pointer;color:var(--text2);padding:4px;border-radius:4px;transition:0.2s}
    .modal-close:hover{color:var(--text);background:var(--bg4)}
    .modal-close svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2}

    /* Settings */
    .set-grid{display:grid;grid-template-columns:170px 1fr;gap:0;min-height:350px}
    .set-nav{background:var(--bg3);border-radius:8px;overflow:hidden;display:flex;flex-direction:column}
    .set-nav-i{padding:10px 14px;font-size:12px;cursor:pointer;color:var(--text2);transition:0.2s;display:flex;align-items:center;gap:7px;border-left:2px solid transparent}
    .set-nav-i:hover{background:var(--bg4);color:var(--text)}
    .set-nav-i.on{background:rgba(192,132,252,0.08);color:var(--accent2);border-color:var(--pink)}
    .set-nav-i svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8}
    .set-cont{padding:0 16px;overflow-y:auto;max-height:400px}
    .set-cont h4{font-size:13px;color:var(--accent2);margin-bottom:10px}
    .set-cont p,.set-cont label{font-size:12px;color:var(--text2);margin-bottom:6px;display:block}
    .theme-dot{width:36px;height:36px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:0.2s;display:inline-block;margin:4px}
    .theme-dot:hover{transform:scale(1.1)}
    .theme-dot.active{border-color:var(--accent2);box-shadow:0 0 14px var(--glow2)}

    /* Toast */
    #toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--bg4);color:var(--green);padding:10px 22px;border-radius:99px;font-weight:600;font-size:12px;z-index:300;border:1px solid var(--border2);pointer-events:none;transition:all 0.3s;opacity:0}
    #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

    /* Scroll */
    ::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:99px}

    /* Tooltip */
    [data-tip]{position:relative}[data-tip]:hover::after{content:attr(data-tip);position:absolute;left:115%;top:50%;transform:translateY(-50%);background:var(--bg4);color:var(--text);font-size:10px;padding:5px 9px;border-radius:4px;white-space:nowrap;z-index:20;pointer-events:none;border:1px solid var(--border2)}

    /* Responsive */
    @media(max-width:768px){
      #server-bar{width:48px;padding:8px 0}
      .s-icon{width:36px;height:36px}.s-icon.active::after{left:-7px;width:4px;height:14px}
      #channel-bar{position:fixed;left:-100%;top:0;bottom:0;z-index:50;width:275px;transition:left 0.3s}
      #channel-bar.open{left:0}
      #main-area{width:100%}
      .set-grid{grid-template-columns:1fr}.set-nav{flex-direction:row;overflow-x:auto;margin-bottom:10px}.set-nav-i{white-space:nowrap}
    }
  </style>
</head>
<body>

<!-- Loading -->
<div id="app-loading">
  <div class="load-ring"></div>
  <div class="load-logo">gettic</div>
  <div class="load-sub">Bağlanıyor...</div>
</div>

<!-- Login Screen -->
<div id="login-screen">
  <div class="login-card">
    <img src="https://github.com/darking053official/gettic/blob/main/1777062266055.png?raw=true" alt="Gettic" onerror="this.style.display='none'" />
    <h1>Gettic'e Hoş Geldin</h1>
    <p>Gerçek zamanlı sohbet platformuna katıl</p>
    <input class="login-input" id="login-user" placeholder="Kullanıcı adı" />
    <input class="login-input" id="login-pass" type="password" placeholder="Şifre" />
    <button class="login-btn" id="login-btn" onclick="handleLogin()">Giriş Yap</button>
    <div class="login-switch">Hesabın yok mu? <span onclick="toggleLoginMode()" id="login-switch-text">Kayıt Ol</span></div>
  </div>
</div>

<!-- App Layout -->
<div id="app-layout">
  <!-- Server Bar -->
  <div id="server-bar">
    <div class="s-icon active" data-tip="Ana Sayfa" onclick="selectServer('home')">
      <img src="https://github.com/darking053official/gettic/blob/main/1777062266055.png?raw=true" alt="G" onerror="this.style.display='none'" style="display:none" />
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    </div>
    <div class="s-sep"></div>
    <div id="server-icons"></div>
    <div class="s-icon s-add" data-tip="Sunucu Oluştur" onclick="openModal('createServer')">
      <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </div>
    <div class="s-icon s-discover" data-tip="Sunucu Keşfet" onclick="openModal('discover')">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    </div>
  </div>

  <!-- Channel Bar -->
  <div id="channel-bar">
    <div id="server-header" onclick="toggleServerHeader()">
      <h2 id="server-name">Gettic Ana Sayfa</h2>
      <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div id="server-actions">
      <button class="act-btn" onclick="openModal('addChannel')"><svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Kanal</button>
      <button class="act-btn" onclick="openModal('addCategory')"><svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg> Kategori</button>
      <button class="act-btn" onclick="sortChannels()"><svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg> Sırala</button>
      <button class="act-btn" onclick="openModal('roleCreate')"><svg viewBox="0 0 24 24"><path d="M12 1a2 2 0 0 1 2 2v2a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V3a2 2 0 0 1 2-2h8z"/><circle cx="17" cy="12" r="3"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/></svg> Rol</button>
    </div>
    <div id="channel-list"></div>
    <div id="user-panel">
      <div id="user-avatar"></div>
      <div id="user-info">
        <div id="user-name">Kullanıcı</div>
        <div id="user-tag">#gettic</div>
      </div>
      <div id="user-btns">
        <button data-tip="Ayarlar" onclick="openModal('settings')"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg></button>
      </div>
    </div>
  </div>

  <!-- Main Area -->
  <div id="main-area">
    <div id="top-bar">
      <svg id="channel-icon" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <span id="top-title">Genel</span>
      <span id="top-desc"></span>
      <div id="top-actions">
        <button class="top-btn" onclick="openModal('webhookModal')"><svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg> Webhook</button>
        <button class="top-btn" onclick="openModal('friendsModal')"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg> Arkadaşlar</button>
      </div>
    </div>
    <div id="msg-area">
      <div id="msg-empty">
        <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <h3 id="empty-name">Genel</h3>
        <p id="empty-msg">Genel doğuşu. Bu kanala ilk mesajı sen yaz!</p>
      </div>
    </div>
    <div id="input-zone">
      <div id="input-wrap">
        <button class="input-icon" data-tip="Dosya"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg></button>
        <textarea id="msg-input" placeholder="Mesaj yaz..." rows="1" onkeydown="handleMsgKey(event)"></textarea>
        <button id="send-btn" onclick="sendMsg()"><svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></button>
      </div>
    </div>
  </div>
</div>

<!-- Modal Container -->
<div id="modal-box"></div>

<!-- Toast -->
<div id="toast"></div>

<script>
// ─── GLOBAL STATE ───────────────────────────────────
const S = {
  user: null, token: null, loginMode: 'login',
  servers: [], currentServer: 'home',
  currentChannel: { id: 'genel', name: 'Genel', type: 'text', serverId: 'home' },
  messages: {}, friends: [], theme: 'pink-purple', roles: []
};

const icons = {
  text: '<svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>',
  rules: '<svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>',
  voice: '<svg viewBox="0 0 24 24"><path d="M12 1a2 2 0 0 0-2 2v8a2 2 0 0 0 4 0V3a2 2 0 0 0-2-2z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>',
  forum: '<svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>'
};

// ─── INIT ────────────────────────────────────────────
function initApp() {
  S.token = localStorage.getItem('gt_tok');
  if (S.token) {
    S.user = { _id: 'u1', username: localStorage.getItem('gt_user') || 'GetticKullanici' };
    showApp();
  } else {
    document.getElementById('login-screen').classList.remove('hidden');
  }
  S.servers = JSON.parse(localStorage.getItem('gt_servers') || '[]');
  if (S.servers.length === 0) {
    S.servers = [{
      id: 'srv1', name: 'Gettic Topluluğu', icon: '', banner: '', description: 'Resmi Gettic sunucusu',
      roles: [{ id: 'r1', name: 'Admin', color: '#f87171' }, { id: 'r2', name: 'Moderatör', color: '#60a5fa' }],
      channels: [
        { id: 'kurallar', name: 'kurallar', type: 'rules', category: 'BİLGİ', position: 1 },
        { id: 'genel', name: 'genel', type: 'text', category: 'METİN KANALLARI', position: 2 },
        { id: 'bot-komut', name: 'bot-komutları', type: 'text', category: 'METİN KANALLARI', position: 3 },
        { id: 'forum', name: 'forum', type: 'forum', category: 'TOPLULUK', position: 4 },
        { id: 'sesli', name: 'Sesli Sohbet', type: 'voice', category: 'SES KANALLARI', position: 5 },
        { id: 'muzik', name: 'Müzik Odası', type: 'voice', category: 'SES KANALLARI', position: 6 }
      ]
    }];
    localStorage.setItem('gt_servers', JSON.stringify(S.servers));
  }
  S.friends = JSON.parse(localStorage.getItem('gt_friends') || '[]');
  if (S.friends.length === 0) {
    S.friends = [
      { id: 'f1', username: 'DarkingBot', online: true },
      { id: 'f2', username: 'ModeratorTR', online: true },
      { id: 'f3', username: 'TasarimciKiz', online: false }
    ];
    localStorage.setItem('gt_friends', JSON.stringify(S.friends));
  }
  S.messages = JSON.parse(localStorage.getItem('gt_msgs') || '{}');
  S.theme = localStorage.getItem('gt_theme') || 'pink-purple';
  applyTheme(S.theme);
  
  setTimeout(() => {
    document.getElementById('app-loading').classList.add('hidden');
  }, 800);
}

// ─── LOGIN ───────────────────────────────────────────
function toggleLoginMode() {
  S.loginMode = S.loginMode === 'login' ? 'register' : 'login';
  document.getElementById('login-btn').textContent = S.loginMode === 'login' ? 'Giriş Yap' : 'Kayıt Ol';
  document.getElementById('login-switch-text').textContent = S.loginMode === 'login' ? 'Kayıt Ol' : 'Giriş Yap';
}

function handleLogin() {
  const u = document.getElementById('login-user').value.trim();
  const p = document.getElementById('login-pass').value.trim();
  if (!u || !p) return toast('Lütfen tüm alanları doldurun', 'var(--red)');
  if (u.length < 3) return toast('Kullanıcı adı en az 3 karakter', 'var(--red)');
  if (p.length < 6) return toast('Şifre en az 6 karakter', 'var(--red)');
  
  S.user = { _id: 'u' + Date.now(), username: u };
  S.token = 'tok_' + Math.random().toString(36).substring(2, 20);
  localStorage.setItem('gt_tok', S.token);
  localStorage.setItem('gt_user', u);
  toast('Hoş geldin, ' + u + '! 🚀');
  showApp();
}

function showApp() {
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('app-layout').classList.add('visible');
  document.getElementById('user-name').textContent = S.user.username;
  document.getElementById('user-avatar').textContent = S.user.username.charAt(0).toUpperCase();
  renderServers();
  selectServer('home');
}

// ─── SERVERS ─────────────────────────────────────────
function renderServers() {
  const c = document.getElementById('server-icons');
  c.innerHTML = S.servers.map(s => `
    <div class="s-icon ${S.currentServer===s.id?'active':''}" data-tip="${s.name}" onclick="selectServer('${s.id}')">
      ${s.icon?`<img src="${s.icon}" alt="${s.name}"/>`:`<span style="font-weight:700;font-size:16px;color:var(--accent2)">${s.name.charAt(0).toUpperCase()}</span>`}
    </div>
  `).join('');
}

function selectServer(sid) {
  S.currentServer = sid;
  document.querySelectorAll('#server-icons .s-icon').forEach(el=>el.classList.remove('active'));
  document.querySelector('.s-icon:first-child').classList.toggle('active', sid==='home');
  const idx = S.servers.findIndex(s=>s.id===sid);
  if(idx>=0){ const ic = document.querySelectorAll('#server-icons .s-icon'); if(ic[idx]) ic[idx].classList.add('active'); }
  
  const srv = S.servers.find(s=>s.id===sid);
  document.getElementById('server-name').textContent = srv ? srv.name : 'Gettic Ana Sayfa';
  renderChannels(srv);
  if(window.innerWidth<768) document.getElementById('channel-bar').classList.add('open');
}

function renderChannels(srv) {
  const list = document.getElementById('channel-list');
  if (!srv || sid==='home') {
    list.innerHTML = `
      <div class="cat-header">METİN KANALLARI</div>
      <div class="ch-item active" onclick="selCh('genel','Genel','text','home')">${icons.text} genel</div>
      <div class="cat-header">SES KANALLARI</div>
      <div class="ch-item voice" onclick="selCh('sesli','Sesli Sohbet','voice','home')">${icons.voice} Sesli Sohbet</div>`;
    return;
  }
  
  const cats = [...new Set(srv.channels.map(c=>c.category||'DİĞER'))];
  list.innerHTML = cats.map(cat => {
    const chs = srv.channels.filter(c=>(c.category||'DİĞER')===cat).sort((a,b)=>(a.position||99)-(b.position||99));
    return `<div class="cat-header" onclick="this.classList.toggle('open')"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg> ${cat}</div>` +
      chs.map(ch => `
        <div class="ch-item ${ch.type==='voice'?'voice':''} ${S.currentChannel.id===ch.id?'active':''}" onclick="selCh('${ch.id}','${ch.name}','${ch.type}','${srv.id}')">
          ${icons[ch.type]||icons.text} ${ch.name}
          ${ch.type==='rules'?'<span style="font-size:9px;background:rgba(248,113,113,0.15);color:var(--red);padding:2px 7px;border-radius:99px;margin-left:auto;font-weight:700">KURALLAR</span>':''}
        </div>`).join('');
  }).join('');
}

function selCh(id, name, type, serverId) {
  S.currentChannel = { id, name, type, serverId };
  document.getElementById('top-title').textContent = name;
  document.getElementById('empty-name').textContent = name;
  document.getElementById('empty-msg').textContent = `${name} doğuşu. Bu kanala ilk mesajı sen yaz!`;
  document.getElementById('channel-icon').innerHTML = icons[type] || icons.text;
  renderMsgs();
  renderChannels(S.servers.find(s=>s.id===S.currentServer));
}

// ─── MESSAGES ────────────────────────────────────────
function renderMsgs() {
  const area = document.getElementById('msg-area');
  const empty = document.getElementById('msg-empty');
  const key = `${S.currentChannel.serverId}:${S.currentChannel.id}`;
  const msgs = S.messages[key] || [];
  
  if (msgs.length === 0) {
    empty.style.display = 'flex';
    area.querySelectorAll('.msg-row').forEach(el=>el.remove());
    return;
  }
  empty.style.display = 'none';
  area.innerHTML = msgs.map((m,i) => {
    const showAuthor = i===0 || msgs[i-1].author !== m.author;
    return `<div class="msg-row">
      <div class="msg-av">${m.author.charAt(0).toUpperCase()}</div>
      <div class="msg-body">
        ${showAuthor ? `<div class="msg-head"><span class="msg-auth">${m.author}</span><span class="msg-time">${m.time}</span></div>` : ''}
        <div class="msg-text">${escHtml(m.content)}</div>
      </div>
    </div>`;
  }).join('');
  area.scrollTop = area.scrollHeight;
}

function sendMsg() {
  const inp = document.getElementById('msg-input');
  const txt = inp.value.trim();
  if (!txt) return;
  
  const key = `${S.currentChannel.serverId}:${S.currentChannel.id}`;
  if (!S.messages[key]) S.messages[key] = [];
  S.messages[key].push({
    id: 'm'+Date.now(), author: S.user.username, content: txt,
    time: new Date().toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'}),
    channelId: S.currentChannel.id, serverId: S.currentChannel.serverId
  });
  localStorage.setItem('gt_msgs', JSON.stringify(S.messages));
  inp.value = ''; inp.style.height = 'auto';
  renderMsgs();
}

function handleMsgKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); }
}

function escHtml(s) { const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

// ─── MODALS ──────────────────────────────────────────
function openModal(type) {
  const box = document.getElementById('modal-box');
  let h = '';
  const srv = S.servers.find(s=>s.id===S.currentServer);
  
  switch(type) {
    case 'settings': h = settingsHTML(srv); break;
    case 'createServer': h = createServerHTML(); break;
    case 'discover': h = discoverHTML(); break;
    case 'addChannel': h = addChannelHTML(srv); break;
    case 'addCategory': h = addCategoryHTML(srv); break;
    case 'roleCreate': h = roleCreateHTML(srv); break;
    case 'webhookModal': h = webhookHTML(); break;
    case 'friendsModal': h = friendsHTML(); break;
  }
  box.innerHTML = h;
}

function closeModal() { document.getElementById('modal-box').innerHTML = ''; }

function settingsHTML(srv) {
  return `<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal" style="max-width:620px">
    <button class="modal-close" onclick="closeModal()"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    <h3>Ayarlar</h3>
    <div class="set-grid">
      <div class="set-nav">
        <div class="set-nav-i on" onclick="switchSetTab('account',this)"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg> Hesap</div>
        <div class="set-nav-i" onclick="switchSetTab('server',this)"><svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg> Sunucu</div>
        <div class="set-nav-i" onclick="switchSetTab('theme',this)"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2"/></svg> Tema</div>
        <div class="set-nav-i" onclick="switchSetTab('privacy',this)"><svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg> Gizlilik</div>
        <div class="set-nav-i" onclick="switchSetTab('danger',this)"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg> Tehlike</div>
      </div>
      <div class="set-cont" id="set-content">
        <h4>Hesap Ayarları</h4>
        <p>Kullanıcı Adı: <strong>${S.user.username}</strong></p>
        <p>ID: <code>${S.user._id}</code></p>
        <p>Sunucu ID: <code>${S.currentServer}</code></p>
        <p>Kanal ID: <code>${S.currentChannel.id}</code></p>
        <button class="modal-btn sec" style="width:auto;margin-top:8px" onclick="logout()">Çıkış Yap</button>
      </div>
    </div>
  </div></div>`;
}

function switchSetTab(tab, el) {
  document.querySelectorAll('.set-nav-i').forEach(e=>e.classList.remove('on'));
  el.classList.add('on');
  const c = document.getElementById('set-content');
  const srv = S.servers.find(s=>s.id===S.currentServer);
  switch(tab) {
    case 'account': c.innerHTML = `<h4>Hesap Ayarları</h4><p>Kullanıcı Adı: <strong>${S.user.username}</strong></p><p>ID: <code>${S.user._id}</code></p><p>Sunucu ID: <code>${S.currentServer}</code></p><p>Kanal ID: <code>${S.currentChannel.id}</code></p><button class="modal-btn sec" style="width:auto;margin-top:8px" onclick="logout()">Çıkış Yap</button>`; break;
    case 'server': c.innerHTML = `<h4>Sunucu Ayarları</h4><label>Logo URL</label><input class="modal-inp" id="srvLogo" placeholder="Logo URL" value="${srv?.icon||''}"/><label>Banner URL</label><input class="modal-inp" id="srvBanner" placeholder="Banner URL" value="${srv?.banner||''}"/><label>Açıklama</label><input class="modal-inp" id="srvDesc" placeholder="Açıklama" value="${srv?.description||''}"/><button class="modal-btn" style="width:auto" onclick="updateServer()">Kaydet</button>`; break;
    case 'theme': c.innerHTML = `<h4>Tema</h4><p>Aktif: <strong>${S.theme==='pink-purple'?'Pembe-Mor':S.theme==='dark'?'Koyu':S.theme==='ocean'?'Okyanus':'Varsayılan'}</strong></p><div><span class="theme-dot ${S.theme==='pink-purple'?'active':''}" style="background:linear-gradient(135deg,#e879f9,#a855f7)" onclick="setTheme('pink-purple')"></span><span class="theme-dot ${S.theme==='dark'?'active':''}" style="background:linear-gradient(135deg,#333,#555)" onclick="setTheme('dark')"></span><span class="theme-dot ${S.theme==='ocean'?'active':''}" style="background:linear-gradient(135deg,#0ea5e9,#38bdf8)" onclick="setTheme('ocean')"></span></div>`; break;
    case 'privacy': c.innerHTML = `<h4>Gizlilik & Güvenlik</h4><p>Şifre değiştirme, 2FA, oturum yönetimi.</p><input class="modal-inp" type="password" placeholder="Yeni şifre"/><button class="modal-btn" style="width:auto" onclick="toast('Şifre değiştirildi (demo)')">Şifreyi Güncelle</button><p style="margin-top:12px">Hesap Devretme</p><input class="modal-inp" placeholder="Devredilecek kullanıcı adı"/><button class="modal-btn sec" style="width:auto" onclick="toast('Hesap devredildi (demo)')">Hesabı Devret</button>`; break;
    case 'danger': c.innerHTML = `<h4>Tehlike Bölgesi</h4><p style="color:var(--red)">Bu işlemler geri alınamaz!</p><button class="modal-btn danger" style="width:auto" onclick="deleteServer()">Sunucuyu Sil</button><button class="modal-btn danger" style="width:auto;margin-top:8px" onclick="deleteAccount()">Hesabı Sil</button>`; break;
  }
}

function createServerHTML() {
  return `<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">
    <button class="modal-close" onclick="closeModal()"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    <h3>Sunucu Oluştur</h3><p>Yeni bir sunucu oluştur ve topluluğunu başlat.</p>
    <input class="modal-inp" id="newSrvName" placeholder="Sunucu Adı"/>
    <input class="modal-inp" id="newSrvDesc" placeholder="Açıklama (opsiyonel)"/>
    <button class="modal-btn" onclick="createServer()">Sunucu Oluştur</button>
    <button class="modal-btn sec" onclick="closeModal()">İptal</button>
  </div></div>`;
}

function discoverHTML() {
  return `<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">
    <button class="modal-close" onclick="closeModal()"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    <h3>Sunucu Keşfet</h3><p>Popüler sunucuları keşfedin.</p>
    ${S.servers.map(s=>`<div style="display:flex;align-items:center;gap:10px;padding:12px;background:var(--bg3);border-radius:8px;margin-bottom:6px;cursor:pointer;transition:all 0.2s" onclick="selectServer('${s.id}');closeModal()"><div style="width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--pink),var(--purple));display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff">${s.name.charAt(0)}</div><div><strong>${s.name}</strong><br><span style="font-size:11px;color:var(--text3)">${s.channels.length} kanal</span></div></div>`).join('')}
    <button class="modal-btn sec" onclick="closeModal()">Kapat</button>
  </div></div>`;
}

function addChannelHTML(srv) {
  return `<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">
    <button class="modal-close" onclick="closeModal()"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    <h3>Kanal Oluştur</h3>
    <input class="modal-inp" id="chName" placeholder="Kanal adı"/>
    <select class="modal-inp" id="chType"><option value="text">Metin</option><option value="voice">Ses</option><option value="rules">Kurallar</option><option value="forum">Forum</option></select>
    <input class="modal-inp" id="chCat" placeholder="Kategori (opsiyonel)"/>
    <button class="modal-btn" onclick="addChannel()">Oluştur</button>
    <button class="modal-btn sec" onclick="closeModal()">İptal</button>
  </div></div>`;
}

function addCategoryHTML(srv) {
  return `<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">
    <button class="modal-close" onclick="closeModal()"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    <h3>Kategori Oluştur</h3>
    <input class="modal-inp" id="catName" placeholder="Kategori adı"/>
    <button class="modal-btn" onclick="addCategory()">Oluştur</button>
    <button class="modal-btn sec" onclick="closeModal()">İptal</button>
  </div></div>`;
}

function roleCreateHTML(srv) {
  return `<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">
    <button class="modal-close" onclick="closeModal()"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    <h3>Rol Oluştur</h3>
    <input class="modal-inp" id="roleName" placeholder="Rol adı"/>
    <input class="modal-inp" id="roleColor" type="color" value="#c084fc"/>
    <button class="modal-btn" onclick="addRole()">Oluştur</button>
    <button class="modal-btn sec" onclick="closeModal()">İptal</button>
  </div></div>`;
}

function webhookHTML() {
  return `<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">
    <button class="modal-close" onclick="closeModal()"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    <h3>Webhook Oluştur</h3><p>Kanal ID: <code>${S.currentChannel.id}</code> | Sunucu ID: <code>${S.currentServer}</code></p>
    <input class="modal-inp" id="whName" placeholder="Webhook adı"/>
    <button class="modal-btn" onclick="createWebhook()">Oluştur</button>
    <div id="whResult" style="margin-top:10px;display:none"><p style="color:var(--green);font-size:12px">URL:</p><code id="whUrl" style="word-break:break-all;font-size:11px;background:var(--bg3);padding:8px;border-radius:6px;display:block;color:var(--accent2)"></code></div>
    <button class="modal-btn sec" onclick="closeModal()">Kapat</button>
  </div></div>`;
}

function friendsHTML() {
  return `<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">
    <button class="modal-close" onclick="closeModal()"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    <h3>Arkadaşlar</h3>
    ${S.friends.map(f=>`<div style="display:flex;align-items:center;gap:8px;padding:10px;background:var(--bg3);border-radius:6px;margin-bottom:4px"><div style="width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--pink),var(--purple));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:#fff">${f.username.charAt(0)}</div><div style="flex:1"><strong>${f.username}</strong><br><span style="font-size:10px;color:${f.online?'var(--green)':'var(--text3)'}">${f.online?'Çevrimiçi':'Çevrimdışı'}</span></div><button class="top-btn" onclick="startDM('${f.id}','${f.username}')">DM</button></div>`).join('')}
    <input class="modal-inp" id="friendAdd" placeholder="Kullanıcı adı ile ekle" style="margin-top:10px"/>
    <button class="modal-btn" onclick="addFriend()">Ekle</button>
    <button class="modal-btn sec" onclick="closeModal()">Kapat</button>
  </div></div>`;
}

// ─── ACTIONS ─────────────────────────────────────────
function createServer() {
  const n = document.getElementById('newSrvName').value.trim();
  if(!n) return toast('Sunucu adı gerekli','var(--red)');
  const d = document.getElementById('newSrvDesc')?.value.trim()||'';
  S.servers.push({
    id:'srv'+Date.now(), name:n, description:d, icon:'', banner:'', roles:[],
    channels:[
      {id:'genel-'+Date.now(),name:'genel',type:'text',category:'METİN KANALLARI',position:1},
      {id:'kurallar-'+Date.now(),name:'kurallar',type:'rules',category:'BİLGİ',position:0},
      {id:'sesli-'+Date.now(),name:'Sesli Sohbet',type:'voice',category:'SES KANALLARI',position:2}
    ]
  });
  localStorage.setItem('gt_servers',JSON.stringify(S.servers));
  renderServers(); selectServer(S.servers[S.servers.length-1].id); closeModal();
  toast('Sunucu oluşturuldu! 🎉');
}

function addChannel() {
  const srv = S.servers.find(s=>s.id===S.currentServer);
  if(!srv) return toast('Önce sunucu seçin','var(--red)');
  const n = document.getElementById('chName').value.trim();
  if(!n) return toast('Kanal adı gerekli','var(--red)');
  const t = document.getElementById('chType').value;
  const c = document.getElementById('chCat').value.trim()||'DİĞER';
  srv.channels.push({id:n.toLowerCase().replace(/\s/g,'-')+'-'+Date.now(), name:n, type:t, category:c, position:srv.channels.length+1});
  localStorage.setItem('gt_servers',JSON.stringify(S.servers));
  renderChannels(srv); closeModal();
  toast('Kanal oluşturuldu!');
}

function addCategory() {
  const srv = S.servers.find(s=>s.id===S.currentServer);
  if(!srv) return toast('Önce sunucu seçin','var(--red)');
  const n = document.getElementById('catName').value.trim();
  if(!n) return toast('Kategori adı gerekli','var(--red)');
  srv.channels.push({id:'cat-'+Date.now(), name:n, type:'text', category:n, position:999});
  localStorage.setItem('gt_servers',JSON.stringify(S.servers));
  renderChannels(srv); closeModal();
  toast('Kategori eklendi!');
}

function sortChannels() {
  const srv = S.servers.find(s=>s.id===S.currentServer);
  if(!srv) return;
  srv.channels.sort((a,b)=>(a.category||'').localeCompare(b.category||'')||(a.position||99)-(b.position||99));
  localStorage.setItem('gt_servers',JSON.stringify(S.servers));
  renderChannels(srv);
  toast('Kanallar sıralandı');
}

function addRole() {
  const srv = S.servers.find(s=>s.id===S.currentServer);
  if(!srv) return toast('Önce sunucu seçin','var(--red)');
  const n = document.getElementById('roleName').value.trim();
  const c = document.getElementById('roleColor').value;
  if(!n) return toast('Rol adı gerekli','var(--red)');
  if(!srv.roles) srv.roles = [];
  srv.roles.push({id:'r'+Date.now(), name:n, color:c});
  localStorage.setItem('gt_servers',JSON.stringify(S.servers));
  closeModal();
  toast('Rol oluşturuldu!');
}

function updateServer() {
  const srv = S.servers.find(s=>s.id===S.currentServer);
  if(!srv) return;
  srv.icon = document.getElementById('srvLogo')?.value||'';
  srv.banner = document.getElementById('srvBanner')?.value||'';
  srv.description = document.getElementById('srvDesc')?.value||'';
  localStorage.setItem('gt_servers',JSON.stringify(S.servers));
  renderServers(); closeModal();
  toast('Sunucu güncellendi!');
}

function createWebhook() {
  const n = document.getElementById('whName').value.trim();
  if(!n) return toast('Webhook adı gerekli','var(--red)');
  const tok = 'wh_'+Math.random().toString(36).substring(2,18);
  document.getElementById('whResult').style.display='block';
  document.getElementById('whUrl').textContent = `https://gettic.js.org/api/webhook/${tok}`;
  toast('Webhook oluşturuldu!');
}

function addFriend() {
  const n = document.getElementById('friendAdd').value.trim();
  if(!n) return;
  S.friends.push({id:'f'+Date.now(),username:n,online:false});
  localStorage.setItem('gt_friends',JSON.stringify(S.friends));
  closeModal();
  toast('Arkadaş eklendi!');
}

function startDM(fid, fname) { closeModal(); selCh('dm-'+fid, fname, 'text', 'dm'); toast('DM başlatıldı'); }

function deleteServer() {
  if(!confirm('Sunucuyu silmek istediğine emin misin? Bu işlem geri alınamaz!')) return;
  S.servers = S.servers.filter(s=>s.id!==S.currentServer);
  localStorage.setItem('gt_servers',JSON.stringify(S.servers));
  S.currentServer = 'home';
  renderServers(); selectServer('home'); closeModal();
  toast('Sunucu silindi');
}

function deleteAccount() {
  if(!confirm('Hesabını silmek istediğine emin misin? TÜM VERİLERİN SİLİNECEK!')) return;
  localStorage.clear();
  setTimeout(()=>location.reload(),500);
}

function setTheme(t) {
  S.theme = t; localStorage.setItem('gt_theme',t);
  applyTheme(t);
  document.querySelectorAll('.theme-dot').forEach(d=>d.classList.remove('active'));
  const dots = document.querySelectorAll('.theme-dot');
  const themes = ['pink-purple','dark','ocean'];
  const idx = themes.indexOf(t);
  if(idx>=0 && dots[idx]) dots[idx].classList.add('active');
  toast('Tema değiştirildi!');
}

function applyTheme(t) {
  const r = document.documentElement;
  if(t==='dark'){ r.style.setProperty('--pink','#888'); r.style.setProperty('--purple','#666'); r.style.setProperty('--accent','#999'); r.style.setProperty('--accent2','#bbb'); }
  else if(t==='ocean'){ r.style.setProperty('--pink','#0ea5e9'); r.style.setProperty('--purple','#38bdf8'); r.style.setProperty('--accent','#7dd3fc'); r.style.setProperty('--accent2','#bae6fd'); }
  else{ r.style.setProperty('--pink','#e879f9'); r.style.setProperty('--purple','#a855f7'); r.style.setProperty('--accent','#c084fc'); r.style.setProperty('--accent2','#d8b4fe'); }
}

function deleteChannel(chId) {
  const srv = S.servers.find(s=>s.id===S.currentServer);
  if(!srv) return;
  srv.channels = srv.channels.filter(c=>c.id!==chId);
  localStorage.setItem('gt_servers',JSON.stringify(S.servers));
  if(S.currentChannel.id===chId) selCh('genel','Genel','text','home');
  renderChannels(srv);
  toast('Kanal silindi');
}

// ─── HELPERS ─────────────────────────────────────────
function toggleServerHeader() { document.getElementById('server-header').classList.toggle('open'); }
function logout() { localStorage.removeItem('gt_tok'); localStorage.removeItem('gt_user'); location.reload(); }
function toast(msg, color='var(--green)') {
  const t=document.getElementById('toast'); t.textContent=msg; t.style.color=color;
  t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2000);
}

document.addEventListener('input',e=>{if(e.target.id==='msg-input'){e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,100)+'px';}});
document.getElementById('modal-box').addEventListener('click',e=>{if(e.target.classList.contains('modal-bg'))closeModal();});
window.addEventListener('resize',()=>{if(window.innerWidth>=768)document.getElementById('channel-bar').classList.remove('open');});

document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

// Init
initApp();
console.log('✅ Gettic App v2 - Tüm özellikler aktif');
</script>
