<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Gettic — Modern Sohbet Platformu</title>
  <meta name="description" content="Gettic - Modern sohbet ve bot platformu. Kendi sunucunu kur, arkadaşlarınla sohbet et." />
  <link rel="icon" href="https://github.com/darking053official/gettic/blob/main/1777062266055.png?raw=true" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#0a0a0f; --bg2:#12121a; --bg3:#1a1a26; --bg4:#222230;
      --text:#f0f0f5; --text2:#9898b0; --text3:#5a5a72;
      --accent:#c084fc; --accent2:#e879f9; --accent3:#f0abfc; --accent4:#d8b4fe;
      --accent-glow:rgba(192,132,252,0.25); --accent-glow2:rgba(232,121,249,0.4);
      --green:#4ade80; --red:#f87171; --yellow:#fbbf24; --blue:#60a5fa;
      --border:rgba(255,255,255,0.06); --border2:rgba(255,255,255,0.12);
      --radius:12px; --radius2:16px; --radius3:8px;
      --sidebar-w:260px; --server-w:64px; --topbar-h:56px;
      --font:'Inter',sans-serif; --mono:'JetBrains Mono',monospace;
      --transition:0.2s cubic-bezier(0.4,0,0.2,1);
    }
    html{height:100%;overflow:hidden}
    body{font-family:var(--font);background:var(--bg);color:var(--text);height:100%;display:flex;overflow:hidden;-webkit-tap-highlight-color:transparent}
    
    /* Loading Screen */
    #loading-screen{position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 0.5s ease,visibility 0.5s ease}
    #loading-screen.hidden{opacity:0;visibility:hidden;pointer-events:none}
    .loader-spinner{width:48px;height:48px;border:3px solid var(--border2);border-top-color:var(--accent2);border-radius:50%;animation:spin 0.8s linear infinite;margin-bottom:20px}
    @keyframes spin{to{transform:rotate(360deg)}}
    .loader-logo{font-size:24px;font-weight:800;background:linear-gradient(135deg,var(--accent2),var(--accent3));-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-1px}
    .loader-sub{font-size:12px;color:var(--text3);margin-top:6px}

    /* Sidebar - Servers */
    .server-sidebar{width:var(--server-w);background:var(--bg2);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:8px;border-right:1px solid var(--border);overflow-y:auto;z-index:10;flex-shrink:0}
    .server-icon{width:46px;height:46px;border-radius:50%;background:var(--bg3);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all var(--transition);border:2px solid transparent;position:relative;flex-shrink:0;overflow:hidden}
    .server-icon:hover{border-radius:14px;border-color:var(--accent2);box-shadow:0 0 20px var(--accent-glow)}
    .server-icon.active{border-radius:14px;border-color:var(--accent2);background:var(--bg4);box-shadow:0 0 20px var(--accent-glow2)}
    .server-icon.active::before{content:'';position:absolute;left:-12px;top:50%;transform:translateY(-50%);width:6px;height:24px;background:var(--accent2);border-radius:0 4px 4px 0}
    .server-icon img{width:100%;height:100%;object-fit:cover;border-radius:inherit}
    .server-icon svg{width:24px;height:24px;fill:none;stroke:var(--text2);stroke-width:2;transition:all var(--transition)}
    .server-icon:hover svg{stroke:var(--text)}
    .server-sep{width:32px;height:2px;background:var(--border2);border-radius:1px;margin:4px 0}
    .server-add{background:var(--bg3) !important;border:2px dashed var(--border2) !important}
    .server-add:hover{background:var(--accent2) !important;border-color:var(--accent2) !important}
    .server-add:hover svg{stroke:#fff}

    /* Sidebar - Channels */
    .channel-sidebar{width:var(--sidebar-w);background:var(--bg2);display:flex;flex-direction:column;border-right:1px solid var(--border);flex-shrink:0;overflow:hidden;transition:all var(--transition)}
    .server-header{padding:16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;cursor:pointer;min-height:56px}
    .server-header h2{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .server-header svg{width:18px;height:18px;stroke:var(--text2);flex-shrink:0;transition:transform var(--transition)}
    .server-header.open svg{transform:rotate(180deg)}
    .channel-list{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:2px}
    .channel-cat{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text3);padding:12px 8px 6px;display:flex;align-items:center;gap:4px;cursor:pointer}
    .channel-cat svg{width:12px;height:12px;stroke:var(--text3);transition:transform var(--transition)}
    .channel-cat.open svg{transform:rotate(90deg)}
    .channel-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--radius3);cursor:pointer;font-size:13px;font-weight:500;color:var(--text2);transition:all var(--transition);position:relative}
    .channel-item:hover{background:var(--bg3);color:var(--text)}
    .channel-item.active{background:rgba(192,132,252,0.12);color:var(--accent3)}
    .channel-item svg{width:18px;height:18px;stroke:currentColor;flex-shrink:0;fill:none;stroke-width:1.8}
    .channel-item.voice svg{fill:var(--accent2);stroke:var(--accent2);opacity:0.7}
    .user-panel{padding:12px;border-top:1px solid var(--border);display:flex;align-items:center;gap:10px;background:var(--bg3);min-height:56px}
    .user-panel img{width:34px;height:34px;border-radius:50%;object-fit:cover;background:var(--bg4)}
    .user-info{flex:1;min-width:0}
    .user-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .user-tag{font-size:11px;color:var(--text3)}
    .user-actions{display:flex;gap:4px}
    .user-actions button{background:none;border:none;cursor:pointer;padding:4px;border-radius:4px;color:var(--text2);transition:all var(--transition)}
    .user-actions button:hover{color:var(--text);background:var(--bg4)}
    .user-actions svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8}

    /* Main */
    .main-content{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg);position:relative}
    .topbar{height:var(--topbar-h);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:12px;flex-shrink:0;background:var(--bg)}
    .topbar svg{width:20px;height:20px;stroke:var(--text2);fill:none;stroke-width:1.8;flex-shrink:0}
    .topbar-title{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .topbar-desc{font-size:12px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-left:4px}
    .topbar-actions{margin-left:auto;display:flex;gap:6px;align-items:center}
    .topbar-btn{padding:6px 12px;border-radius:var(--radius3);border:1px solid var(--border2);background:transparent;color:var(--text2);font-size:12px;cursor:pointer;font-family:var(--font);transition:all var(--transition);display:flex;align-items:center;gap:6px}
    .topbar-btn:hover{background:var(--bg3);color:var(--text);border-color:var(--border2)}
    .topbar-btn svg{width:15px;height:15px;stroke:currentColor}

    .chat-area{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:4px}
    .chat-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px}
    .chat-empty svg{width:80px;height:80px;stroke:var(--text3);fill:none;stroke-width:1;opacity:0.5;margin-bottom:16px}
    .chat-empty h3{font-size:20px;font-weight:700;margin-bottom:6px;background:linear-gradient(135deg,var(--accent2),var(--accent3));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .chat-empty p{font-size:13px;color:var(--text3);max-width:320px;line-height:1.6}
    .msg-group{display:flex;gap:12px;padding:4px 0;animation:msgIn 0.3s ease}
    @keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    .msg-avatar{width:38px;height:38px;border-radius:50%;object-fit:cover;background:var(--bg4);flex-shrink:0;background:linear-gradient(135deg,var(--accent2),#a78bfa)}
    .msg-body{flex:1;min-width:0}
    .msg-header{display:flex;align-items:baseline;gap:8px;margin-bottom:2px}
    .msg-author{font-size:14px;font-weight:600;color:var(--accent3)}
    .msg-time{font-size:11px;color:var(--text3)}
    .msg-content{font-size:14px;line-height:1.55;color:var(--text);word-break:break-word}

    .chat-input-area{padding:12px 20px 20px;border-top:1px solid var(--border);flex-shrink:0;background:var(--bg)}
    .chat-input-wrap{display:flex;align-items:flex-end;gap:10px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:8px 16px;transition:all var(--transition)}
    .chat-input-wrap:focus-within{border-color:var(--accent2);box-shadow:0 0 0 3px var(--accent-glow)}
    .chat-input{flex:1;background:none;border:none;outline:none;color:var(--text);font-family:var(--font);font-size:14px;resize:none;min-height:22px;max-height:120px;line-height:1.5;padding:4px 0}
    .chat-input::placeholder{color:var(--text3)}
    .chat-input-btn{background:none;border:none;cursor:pointer;padding:4px;border-radius:6px;color:var(--text2);transition:all var(--transition);display:flex;align-items:center}
    .chat-input-btn:hover{color:var(--accent3);background:rgba(192,132,252,0.1)}
    .chat-input-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
    .send-btn{background:linear-gradient(135deg,var(--accent2),#a78bfa);border:none;border-radius:50%;width:38px;height:38px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all var(--transition);flex-shrink:0;box-shadow:0 4px 20px var(--accent-glow2)}
    .send-btn:hover{transform:scale(1.05);box-shadow:0 6px 28px var(--accent-glow2)}
    .send-btn svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2.5}

    /* Modals */
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:100;display:flex;align-items:center;justify-content:center;animation:fadeIn 0.2s ease;backdrop-filter:blur(4px)}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    .modal{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius2);width:90%;max-width:480px;max-height:85vh;overflow-y:auto;padding:24px;animation:modalIn 0.3s cubic-bezier(0.4,0,0.2,1)}
    @keyframes modalIn{from{opacity:0;transform:scale(0.95) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}
    .modal h3{font-size:18px;font-weight:700;margin-bottom:6px;background:linear-gradient(135deg,var(--accent2),var(--accent3));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .modal p{font-size:13px;color:var(--text2);margin-bottom:20px}
    .modal-input{width:100%;padding:10px 14px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius3);color:var(--text);font-family:var(--font);font-size:14px;margin-bottom:12px;transition:all var(--transition)}
    .modal-input:focus{outline:none;border-color:var(--accent2);box-shadow:0 0 0 3px var(--accent-glow)}
    .modal-btn{width:100%;padding:10px;background:linear-gradient(135deg,var(--accent2),#a78bfa);border:none;border-radius:var(--radius3);color:#fff;font-weight:600;font-size:14px;cursor:pointer;font-family:var(--font);transition:all var(--transition)}
    .modal-btn:hover{opacity:0.9;transform:translateY(-1px);box-shadow:0 8px 25px var(--accent-glow2)}
    .modal-btn.secondary{background:var(--bg3);border:1px solid var(--border2);color:var(--text)}
    .modal-close{position:absolute;top:16px;right:16px;background:none;border:none;cursor:pointer;color:var(--text2);padding:4px;border-radius:4px;transition:all var(--transition)}
    .modal-close:hover{color:var(--text);background:var(--bg3)}

    /* Settings */
    .settings-grid{display:grid;grid-template-columns:180px 1fr;gap:0;min-height:400px}
    .settings-nav{background:var(--bg3);border-radius:var(--radius3);overflow:hidden;display:flex;flex-direction:column}
    .settings-nav-item{padding:10px 14px;font-size:13px;cursor:pointer;color:var(--text2);transition:all var(--transition);display:flex;align-items:center;gap:8px;border-left:2px solid transparent}
    .settings-nav-item:hover{background:var(--bg4);color:var(--text)}
    .settings-nav-item.active{background:rgba(192,132,252,0.1);color:var(--accent3);border-color:var(--accent2)}
    .settings-nav-item svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8}
    .settings-content{padding:0 20px;overflow-y:auto;max-height:450px}

    /* Responsive */
    @media(max-width:768px){
      .server-sidebar{width:52px;padding:8px 0}
      .server-icon{width:38px;height:38px}
      .channel-sidebar{position:fixed;left:-100%;top:0;bottom:0;z-index:50;width:280px;transition:left var(--transition)}
      .channel-sidebar.open{left:0}
      .chat-input-area{padding:8px 12px 16px}
      .settings-grid{grid-template-columns:1fr}
      .settings-nav{flex-direction:row;overflow-x:auto;white-space:nowrap;margin-bottom:12px}
      .settings-content{padding:0}
    }

    /* Badge */
    .badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:10px;font-weight:700;margin-left:6px}
    .badge-bot{background:rgba(192,132,252,0.2);color:var(--accent3)}
    .badge-admin{background:rgba(250,204,21,0.2);color:var(--yellow)}

    /* Scrollbar */
    ::-webkit-scrollbar{width:4px}
    ::-webkit-scrollbar-thumb{background:var(--border2);border-radius:99px}
    ::-webkit-scrollbar-track{background:transparent}

    /* Tooltip */
    [data-tooltip]{position:relative}
    [data-tooltip]:hover::after{content:attr(data-tooltip);position:absolute;left:110%;top:50%;transform:translateY(-50%);background:var(--bg4);color:var(--text);font-size:12px;padding:6px 10px;border-radius:4px;white-space:nowrap;z-index:20;pointer-events:none;border:1px solid var(--border2)}
  </style>
</head>
<body>

<!-- Loading -->
<div id="loading-screen">
  <div class="loader-spinner"></div>
  <div class="loader-logo">gettic</div>
  <div class="loader-sub">Bağlanıyor...</div>
</div>

<!-- Server Sidebar -->
<div class="server-sidebar" id="serverSidebar">
  <div class="server-icon active" data-tooltip="Ana Sayfa" onclick="selectServer('home')">
    <img src="https://github.com/darking053official/gettic/blob/main/1777062266055.png?raw=true" alt="Gettic" onerror="this.style.display='none'" />
    <svg style="display:none" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
  </div>
  <div class="server-sep"></div>
  <div id="serverList"></div>
  <div class="server-icon server-add" data-tooltip="Sunucu Ekle" onclick="openModal('createServerModal')">
    <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
  </div>
  <div class="server-icon" data-tooltip="Sunucu Keşfet" onclick="openModal('discoverModal')" style="margin-top:auto">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
  </div>
</div>

<!-- Channel Sidebar -->
<div class="channel-sidebar" id="channelSidebar">
  <div class="server-header" id="serverHeader" onclick="toggleServerMenu()">
    <h2 id="serverNameDisplay">Gettic Ana Sayfa</h2>
    <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
  </div>
  <div class="channel-list" id="channelList">
    <div class="channel-cat" onclick="toggleCat(this)">
      <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg> METİN KANALLARI
    </div>
    <div id="textChannels"></div>
    <div class="channel-cat" onclick="toggleCat(this)">
      <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg> SES KANALLARI
    </div>
    <div id="voiceChannels"></div>
  </div>
  <div class="user-panel" id="userPanel">
    <img src="https://github.com/darking053official/gettic/blob/main/1777062266055.png?raw=true" alt="Avatar" onerror="this.style.background='linear-gradient(135deg,var(--accent2),#a78bfa)'" />
    <div class="user-info">
      <div class="user-name" id="currentUsername">Kullanıcı</div>
      <div class="user-tag">#gettic</div>
    </div>
    <div class="user-actions">
      <button data-tooltip="Ayarlar" onclick="openModal('settingsModal')"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg></button>
    </div>
  </div>
</div>

<!-- Main Content -->
<div class="main-content" id="mainContent">
  <div class="topbar">
    <svg viewBox="0 0 24 24" id="channelIcon"><path d="M5.52 19c.64-2.2 1.84-3.35 3.12-4.75a6 6 0 0 1 4.36-1.97h.08a6 6 0 0 1 6 6v1.72"/><circle cx="12" cy="7" r="4"/></svg>
    <span class="topbar-title" id="channelTitle">Genel</span>
    <span class="topbar-desc" id="channelDesc"></span>
    <div class="topbar-actions">
      <button class="topbar-btn" onclick="openModal('webhookModal')"><svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg> Webhook</button>
      <button class="topbar-btn" onclick="openModal('friendsModal')"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg> Arkadaşlar</button>
    </div>
  </div>
  <div class="chat-area" id="chatMessages">
    <div class="chat-empty" id="chatEmpty">
      <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <h3 id="emptyChannelName">Genel</h3>
      <p id="emptyChannelMsg">Genel doğuşu. Bu kanala gönderilen ilk mesajı sen yaz!</p>
    </div>
  </div>
  <div class="chat-input-area">
    <div class="chat-input-wrap">
      <button class="chat-input-btn" data-tooltip="Dosya Ekle"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg></button>
      <textarea class="chat-input" id="chatInput" placeholder="Mesaj yaz..." rows="1" onkeydown="handleInputKey(event)"></textarea>
      <button class="send-btn" onclick="sendMessage()"><svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></button>
    </div>
  </div>
</div>

<!-- Modals -->
<div id="modalContainer"></div>

<script>
// ─── STATE ───────────────────────────────────────────
const state = {
  user: null,
  token: localStorage.getItem('gt_tok') || null,
  servers: [],
  currentServer: 'home',
  currentChannel: { id: 'general', name: 'Genel', type: 'text', serverId: 'home' },
  messages: {},
  friends: [],
  theme: 'pink-purple',
  voiceConnections: {}
};

// Sample Data
const sampleServers = [
  {
    id: 'srv1', name: 'Gettic Topluluğu', icon: null,
    channels: [
      { id: 'rules', name: 'kurallar', type: 'rules', topic: 'Sunucu kurallarını okuyun' },
      { id: 'general', name: 'genel', type: 'text', topic: 'Genel sohbet kanalı' },
      { id: 'bot-komut', name: 'bot-komutları', type: 'text', topic: 'Bot komutlarını burada kullanın' },
      { id: 'forum', name: 'forum', type: 'forum', topic: 'Tartışma ve yardımlaşma forumu' },
      { id: 'duyuru', name: 'duyurular', type: 'text', topic: 'Önemli duyurular' },
      { id: 'sesli-sohbet', name: 'Sesli Sohbet', type: 'voice', topic: 'Sesli sohbet odası' },
      { id: 'muzik-odasi', name: 'Müzik Odası', type: 'voice', topic: 'Birlikte müzik dinleyin' }
    ]
  }
];

const sampleFriends = [
  { id: 'f1', username: 'DarkingBot', avatar: null, online: true },
  { id: 'f2', username: 'ModeratorTR', avatar: null, online: true },
  { id: 'f3', username: 'TasarimciKiz', avatar: null, online: false }
];

// ─── INIT ────────────────────────────────────────────
function init() {
  state.token = localStorage.getItem('gt_tok');
  if (!state.token) {
    state.user = { _id: 'guest', username: 'Misafir' };
  } else {
    state.user = { _id: 'user1', username: 'GetticKullanici' };
  }
  state.servers = JSON.parse(localStorage.getItem('gt_servers') || JSON.stringify(sampleServers));
  state.friends = JSON.parse(localStorage.getItem('gt_friends') || JSON.stringify(sampleFriends));
  state.messages = JSON.parse(localStorage.getItem('gt_messages') || '{}');
  
  document.getElementById('currentUsername').textContent = state.user.username;
  renderServers();
  selectServer('home');
  
  setTimeout(() => {
    document.getElementById('loading-screen').classList.add('hidden');
  }, 1200);
}

// ─── RENDER SERVERS ──────────────────────────────────
function renderServers() {
  const list = document.getElementById('serverList');
  list.innerHTML = state.servers.map(s => `
    <div class="server-icon ${state.currentServer === s.id ? 'active' : ''}" data-tooltip="${s.name}" onclick="selectServer('${s.id}')">
      ${s.icon ? `<img src="${s.icon}" alt="${s.name}" />` : `<span style="font-weight:700;font-size:18px;color:var(--accent3)">${s.name.charAt(0).toUpperCase()}</span>`}
    </div>
  `).join('');
}

// ─── SELECT SERVER ───────────────────────────────────
function selectServer(serverId) {
  state.currentServer = serverId;
  document.querySelectorAll('.server-icon').forEach(el => el.classList.remove('active'));
  const icons = document.querySelectorAll('#serverList .server-icon');
  const idx = state.servers.findIndex(s => s.id === serverId);
  if (idx >= 0 && icons[idx]) icons[idx].classList.add('active');
  if (serverId === 'home') document.querySelector('.server-sidebar .server-icon:first-child').classList.add('active');
  
  const server = state.servers.find(s => s.id === serverId);
  if (server) {
    document.getElementById('serverNameDisplay').textContent = server.name;
    renderChannels(server);
  } else {
    document.getElementById('serverNameDisplay').textContent = 'Gettic Ana Sayfa';
    renderChannels(null);
  }
  
  if (window.innerWidth < 768) {
    document.getElementById('channelSidebar').classList.add('open');
  }
}

// ─── RENDER CHANNELS ─────────────────────────────────
function renderChannels(server) {
  const textCh = document.getElementById('textChannels');
  const voiceCh = document.getElementById('voiceChannels');
  
  if (!server || server.id === 'home') {
    textCh.innerHTML = `
      <div class="channel-item active" onclick="selectChannel('general','Genel','text','home')">
        <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg> genel
      </div>`;
    voiceCh.innerHTML = '';
    return;
  }
  
  const textChannels = server.channels.filter(c => c.type === 'text' || c.type === 'rules' || c.type === 'forum');
  const voiceChannels = server.channels.filter(c => c.type === 'voice');
  
  textCh.innerHTML = textChannels.map(c => `
    <div class="channel-item ${state.currentChannel.id === c.id ? 'active' : ''}" onclick="selectChannel('${c.id}','${c.name}','${c.type}','${server.id}')">
      ${c.type === 'rules' ? '<svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>' 
        : c.type === 'forum' ? '<svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>'
        : '<svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>'}
      ${c.name}
      ${c.type === 'rules' ? '<span class="badge badge-admin">KURALLAR</span>' : ''}
    </div>
  `).join('');
  
  voiceCh.innerHTML = voiceChannels.map(c => `
    <div class="channel-item voice ${state.currentChannel.id === c.id ? 'active' : ''}" onclick="selectChannel('${c.id}','${c.name}','voice','${server.id}')">
      <svg viewBox="0 0 24 24"><path d="M12 1a2 2 0 0 0-2 2v8a2 2 0 0 0 4 0V3a2 2 0 0 0-2-2z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
      ${c.name}
    </div>
  `).join('');
}

// ─── SELECT CHANNEL ───────────────────────────────────
function selectChannel(id, name, type, serverId) {
  state.currentChannel = { id, name, type, serverId };
  document.getElementById('channelTitle').textContent = name;
  document.getElementById('channelDesc').textContent = '';
  document.getElementById('emptyChannelName').textContent = name;
  document.getElementById('emptyChannelMsg').textContent = `${name} doğuşu. Bu kanala gönderilen ilk mesajı sen yaz!`;
  
  const iconEl = document.getElementById('channelIcon');
  if (type === 'voice') {
    iconEl.innerHTML = '<path d="M12 1a2 2 0 0 0-2 2v8a2 2 0 0 0 4 0V3a2 2 0 0 0-2-2z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/>';
  } else if (type === 'rules') {
    iconEl.innerHTML = '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>';
  } else {
    iconEl.innerHTML = '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>';
  }
  
  renderMessages();
  renderChannels(state.servers.find(s => s.id === serverId));
  document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
  
  if (window.innerWidth < 768) {
    document.getElementById('channelSidebar').classList.remove('open');
  }
}

// ─── MESSAGES ─────────────────────────────────────────
function renderMessages() {
  const container = document.getElementById('chatMessages');
  const empty = document.getElementById('chatEmpty');
  const key = `${state.currentChannel.serverId}:${state.currentChannel.id}`;
  const msgs = state.messages[key] || [];
  
  if (msgs.length === 0) {
    empty.style.display = 'flex';
    container.querySelectorAll('.msg-group').forEach(el => el.remove());
    return;
  }
  
  empty.style.display = 'none';
  container.innerHTML = msgs.map(m => `
    <div class="msg-group">
      <div class="msg-avatar">${m.author.charAt(0).toUpperCase()}</div>
      <div class="msg-body">
        <div class="msg-header">
          <span class="msg-author">${m.author}</span>
          <span class="msg-time">${m.time}</span>
        </div>
        <div class="msg-content">${escapeHtml(m.content)}</div>
      </div>
    </div>
  `).join('');
  
  container.scrollTop = container.scrollHeight;
}

function sendMessage() {
  const input = document.getElementById('chatInput');
  const content = input.value.trim();
  if (!content) return;
  
  const key = `${state.currentChannel.serverId}:${state.currentChannel.id}`;
  if (!state.messages[key]) state.messages[key] = [];
  
  state.messages[key].push({
    id: Date.now().toString(),
    author: state.user.username,
    content,
    time: new Date().toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' }),
    channelId: state.currentChannel.id,
    serverId: state.currentChannel.serverId
  });
  
  localStorage.setItem('gt_messages', JSON.stringify(state.messages));
  input.value = '';
  input.style.height = 'auto';
  renderMessages();
}

function handleInputKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

              ${state.friends.map(f => `
                <div style="display:flex;align-items:center;gap:10px;padding:10px;border-radius:8px;background:var(--bg3);margin-bottom:6px">

function closeModal() {
  document.getElementById('modalContainer').innerHTML = '';
}

function createServer() {
  const name = document.getElementById('serverNameInput').value.trim();
  if (!name) return alert('Sunucu adı gerekli!');
  const desc = document.getElementById('serverDescInput')?.value.trim() || '';
  const newServer = {
    id: 'srv' + Date.now(),
    name,
    description: desc,
    channels: [
      { id: 'general-' + Date.now(), name: 'genel', type: 'text', topic: 'Genel sohbet kanalı' },
      { id: 'kurallar-' + Date.now(), name: 'kurallar', type: 'rules', topic: 'Sunucu kuralları' },
      { id: 'sesli-' + Date.now(), name: 'Sesli Sohbet', type: 'voice', topic: 'Sesli sohbet odası' }
    ]
  };
  state.servers.push(newServer);
  localStorage.setItem('gt_servers', JSON.stringify(state.servers));
  renderServers();
  selectServer(newServer.id);
  closeModal();
}

function createWebhook() {
  const name = document.getElementById('webhookNameInput').value.trim();
  const channel = document.getElementById('webhookChannelInput').value.trim();
  if (!name || !channel) return alert('Ad ve kanal gerekli!');
  const token = 'wh_' + Math.random().toString(36).substring(2, 18);
  const url = `https://gettic.js.org/api/webhook/${token}`;
  document.getElementById('webhookResult').style.display = 'block';
  document.getElementById('webhookUrlDisplay').textContent = url;
  showToast('Webhook oluşturuldu!');
}

function switchSettingsTab(tab, el) {
  document.querySelectorAll('.settings-nav-item').forEach(e => e.classList.remove('active'));
  el.classList.add('active');
  const content = document.getElementById('settingsContent');
  switch(tab) {
    case 'account':
      content.innerHTML = `<h4 style="margin-bottom:12px;color:var(--accent3)">Hesap Ayarları</h4>
        <p style="font-size:13px;color:var(--text2)">Kullanıcı Adı: <strong>${state.user.username}</strong></p>
        <p style="font-size:13px;color:var(--text2)">ID: <code style="font-size:11px">${state.user._id}</code></p>
        <p style="font-size:13px;color:var(--text2)">Sunucu ID: <code style="font-size:11px">${state.currentServer}</code></p>
        <p style="font-size:13px;color:var(--text2)">Kanal ID: <code style="font-size:11px">${state.currentChannel.id}</code></p>
        <button class="modal-btn secondary" style="margin-top:12px;width:auto" onclick="logout()">Çıkış Yap</button>`;
      break;
    case 'server':
      content.innerHTML = `<h4 style="margin-bottom:12px;color:var(--accent3)">Sunucu Ayarları</h4>
        <p style="font-size:13px;color:var(--text2)">Sunucu logosu, banner ve açıklama ayarları.</p>
        <input class="modal-input" id="serverLogoInput" placeholder="Logo URL" />
        <input class="modal-input" id="serverBannerInput" placeholder="Banner URL" />
        <input class="modal-input" id="serverDescEditInput" placeholder="Açıklama" />
        <button class="modal-btn" onclick="updateServer()" style="width:auto">Kaydet</button>`;
      break;
    case 'theme':
      content.innerHTML = `<h4 style="margin-bottom:12px;color:var(--accent3)">Tema Ayarları</h4>
        <p style="font-size:13px;color:var(--text2)">Aktif Tema: <strong>Pembe-Mor</strong></p>
        <div style="display:flex;gap:8px;margin-top:8px">
          <div onclick="setTheme('pink-purple')" style="width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#c084fc,#e879f9);cursor:pointer;border:3px solid var(--accent3)"></div>
          <div onclick="setTheme('dark')" style="width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#333,#555);cursor:pointer;border:3px solid transparent"></div>
          <div onclick="setTheme('ocean')" style="width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#0ea5e9,#38bdf8);cursor:pointer;border:3px solid transparent"></div>
        </div>`;
      break;

}

function setTheme(t) {
  state.theme = t;
  showToast('Tema güncellendi (demo)');
}

function updateServer() {
  showToast('Sunucu ayarları kaydedildi (demo)');
}

function addFriend() {
  const input = document.getElementById('friendAddInput');
  const name = input.value.trim();
  if (!name) return;
  state.friends.push({ id: 'f' + Date.now(), username: name, avatar: null, online: false });
  localStorage.setItem('gt_friends', JSON.stringify(state.friends));
  closeModal();
  showToast('Arkadaş eklendi!');
}

function startDM(friendId, friendName) {
  closeModal();
  selectChannel('dm-' + friendId, friendName, 'text', 'dm');
  showToast('DM başlatıldı');
}

function logout() {
  localStorage.removeItem('gt_tok');
  state.token = null;
  state.user = { _id: 'guest', username: 'Misafir' };
  window.location.href = '/';
}

// ─── HELPERS ──────────────────────────────────────────
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function toggleServerMenu() {
  document.getElementById('serverHeader').classList.toggle('open');
}

function toggleCat(el) {
  el.classList.toggle('open');
}

function showToast(msg) {
  let toast = document.getElementById('toast');
  if (!toast) {
    toast = document.createElement('div');
    toast.id = 'toast';
    toast.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--bg4);color:var(--green);padding:10px 24px;border-radius:99px;font-weight:600;font-size:13px;z-index:200;border:1px solid var(--border2);pointer-events:none;transition:all 0.3s ease;opacity:0';
    document.body.appendChild(toast);
  }
  toast.textContent = msg;
  toast.style.opacity = '1';
  toast.style.transform = 'translateX(-50%) translateY(0)';
  clearTimeout(toast._timeout);
  toast._timeout = setTimeout(() => {
    toast.style.opacity = '0';
    toast.style.transform = 'translateX(-50%) translateY(10px)';
  }, 2000);
}

// Responsive handler
function handleResize() {
  if (window.innerWidth >= 768) {
    document.getElementById('channelSidebar').classList.remove('open');
  }
}
window.addEventListener('resize', handleResize);

// Auto-resize textarea
document.addEventListener('input', function(e) {
  if (e.target.id === 'chatInput') {
    e.target.style.height = 'auto';
    e.target.style.height = Math.min(e.target.scrollHeight, 120) + 'px';
  }
});

// Init
init();
console.log('✅ Gettic App - Tüm özellikler yüklendi');
</script>
