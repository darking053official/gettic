<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Gettic — Sohbet Platformu</title>
  <link rel="icon" href="https://github.com/darking053official/gettic/blob/main/1777062266055.png?raw=true">
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0a0a14; --bg1: #0f0f1a; --bg2: #151520; --bg3: #1c1c2a;
      --b: rgba(255,255,255,.05); --b2: rgba(255,255,255,.08);
      --ac: #c084fc; --ac2: #e879f9; --ac3: #f0abfc;
      --acg: rgba(192,132,252,.3); --acd: rgba(192,132,252,.1);
      --t1: #f0f0ff; --t2: #a0a0c0; --t3: #606080;
      --gr: #22c55e; --re: #ef4444; --ye: #f59e0b;
      --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --transition: 0.25s cubic-bezier(0.2, 0.9, 0.4, 1);
    }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--t1);
      height: 100vh; height: 100dvh;
      overflow: hidden;
      user-select: none;
    }
    /* LOADING SCREEN */
    .loading-screen {
      position: fixed; inset: 0; background: var(--bg); z-index: 10000;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: opacity 0.5s, visibility 0.5s;
    }
    .loading-screen.hide { opacity: 0; visibility: hidden; }
    .loader {
      width: 48px; height: 48px; border: 3px solid var(--b2);
      border-top-color: var(--ac); border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-logo {
      margin-top: 20px; font-size: 18px; font-weight: bold;
      background: linear-gradient(135deg, var(--ac), var(--ac2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    /* LAYOUT */
    .app { display: flex; height: 100vh; height: 100dvh; background: var(--bg1); position: relative; }
    /* SERVER RAIL */
    .server-rail {
      width: 72px; background: var(--bg); display: flex; flex-direction: column;
      align-items: center; padding: 12px 0; gap: 12px; overflow-y: auto;
      border-right: 1px solid var(--b); flex-shrink: 0; z-index: 10;
    }
    .server-icon {
      width: 48px; height: 48px; background: var(--bg2); border-radius: 50%;
      display: flex; align-items: center; justify-content: center; cursor: pointer;
      transition: all var(--transition); position: relative;
    }
    .server-icon svg { width: 24px; height: 24px; stroke: var(--t2); stroke-width: 1.5; fill: none; }
    .server-icon:hover, .server-icon.active { border-radius: 16px; background: var(--ac); transform: translateY(-2px); }
    .server-icon:hover svg, .server-icon.active svg { stroke: white; }
    .server-icon.active::after {
      content: ''; position: absolute; right: -8px; top: 50%; transform: translateY(-50%);
      width: 4px; height: 20px; background: var(--ac); border-radius: 2px;
    }
    /* CHANNEL SIDEBAR */
    .channel-sidebar {
      width: 260px; background: var(--bg1); display: flex; flex-direction: column;
      border-right: 1px solid var(--b); flex-shrink: 0; transition: transform 0.3s ease;
      z-index: 10; overflow-y: auto;
    }
    .channel-header {
      height: 48px; padding: 0 16px; display: flex; align-items: center; gap: 8px;
      border-bottom: 1px solid var(--b); font-weight: bold; background: var(--bg);
    }
    .channel-header svg { width: 20px; height: 20px; stroke: var(--ac); }
    .channel-category {
      padding: 16px 16px 4px; font-size: 11px; font-weight: bold; text-transform: uppercase;
      color: var(--t3); letter-spacing: 1px; display: flex; justify-content: space-between;
    }
    .channel-category button { background: none; border: none; color: var(--t3); cursor: pointer; }
    .channel-category button:hover { color: var(--ac); }
    .channel-item {
      padding: 6px 16px; margin: 2px 8px; border-radius: 8px; display: flex;
      align-items: center; gap: 10px; cursor: pointer; font-size: 14px; color: var(--t2);
      transition: all var(--transition);
    }
    .channel-item svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.5; }
    .channel-item:hover { background: var(--bg2); color: var(--t1); transform: translateX(4px); }
    .channel-item.active { background: var(--acd); color: var(--ac3); }
    /* CHAT AREA */
    .chat-area {
      flex: 1; display: flex; flex-direction: column; background: var(--bg1); min-width: 0;
    }
    .chat-header {
      height: 48px; padding: 0 20px; display: flex; align-items: center; gap: 12px;
      border-bottom: 1px solid var(--b); background: var(--bg); flex-shrink: 0;
    }
    .chat-header svg { width: 20px; height: 20px; stroke: var(--ac); }
    .chat-header .channel-name { font-weight: bold; }
    .chat-header .channel-topic { font-size: 12px; color: var(--t3); margin-left: 8px; }
    .chat-header .header-badge { margin-left: auto; display: flex; gap: 8px; }
    .icon-btn {
      background: var(--bg2); border: none; width: 32px; height: 32px; border-radius: 8px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: all var(--transition);
    }
    .icon-btn svg { width: 16px; height: 16px; stroke: var(--t2); fill: none; stroke-width: 1.5; }
    .icon-btn:hover { background: var(--ac); transform: scale(1.05); }
    .icon-btn:hover svg { stroke: white; }
    .messages-container {
      flex: 1; overflow-y: auto; padding: 16px 20px; display: flex;
      flex-direction: column; gap: 8px; scroll-behavior: smooth;
    }
    .empty-channel {
      text-align: center; padding: 60px 20px; color: var(--t3);
      animation: fadeIn 0.5s ease; margin: auto;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .empty-channel svg { width: 64px; height: 64px; stroke: var(--t3); margin-bottom: 16px; opacity: 0.6; }
    .empty-channel h4 { font-size: 18px; margin-bottom: 8px; color: var(--t2); }
    .message {
      display: flex; align-items: flex-start; gap: 12px; padding: 6px 0;
      transition: background 0.1s; border-radius: 8px;
    }
    .message:hover { background: var(--bg2); }
    .message-avatar {
      width: 36px; height: 36px; background: linear-gradient(135deg, var(--ac), var(--ac2));
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-weight: bold; flex-shrink: 0; font-size: 14px;
    }
    .message-content { flex: 1; }
    .message-header { font-size: 13px; font-weight: bold; margin-bottom: 2px; }
    .message-header span { font-weight: normal; font-size: 11px; margin-left: 8px; color: var(--t3); }
    .message-text { font-size: 14px; line-height: 1.4; word-wrap: break-word; }
    .typing-indicator {
      padding: 8px 20px; font-size: 12px; color: var(--t3); font-style: italic;
      height: 36px; transition: all 0.2s;
    }
    /* INPUT AREA */
    .input-area {
      padding: 12px 20px 16px; background: var(--bg); border-top: 1px solid var(--b);
      display: flex; gap: 12px; align-items: center; flex-shrink: 0; z-index: 10;
    }
    .message-input {
      flex: 1; background: var(--bg2); border: 1px solid var(--b2); border-radius: 24px;
      padding: 12px 18px; color: var(--t1); font-size: 14px; outline: none;
      transition: all var(--transition);
    }
    .message-input:focus { border-color: var(--ac); box-shadow: 0 0 0 3px var(--acg); }
    .emoji-picker {
      position: absolute; bottom: 80px; left: 320px; background: var(--bg2);
      border-radius: 16px; padding: 12px; display: none; grid-template-columns: repeat(6, 1fr);
      gap: 8px; z-index: 100; border: 1px solid var(--b2); animation: fadeIn 0.2s ease;
    }
    .emoji-picker.show { display: grid; }
    .emoji-option { font-size: 22px; cursor: pointer; padding: 4px; text-align: center; border-radius: 8px; }
    .emoji-option:hover { background: var(--bg3); transform: scale(1.2); }
    /* USER PANEL */
    .user-panel {
      width: 280px; background: var(--bg); border-left: 1px solid var(--b);
      padding: 16px; display: flex; flex-direction: column; gap: 12px; flex-shrink: 0;
      z-index: 10; overflow-y: auto;
    }
    .user-profile { display: flex; gap: 12px; align-items: center; padding-bottom: 12px; border-bottom: 1px solid var(--b); }
    .user-avatar {
      width: 48px; height: 48px; background: linear-gradient(135deg, var(--ac), var(--ac2));
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-weight: bold; font-size: 18px;
    }
    .user-info { flex: 1; }
    .user-name { font-weight: bold; font-size: 15px; }
    .user-status { font-size: 11px; color: var(--gr); display: flex; align-items: center; gap: 4px; }
    .panel-btn {
      background: var(--bg2); border: none; padding: 10px 12px; border-radius: 10px;
      color: var(--t2); cursor: pointer; font-weight: 500; display: flex; align-items: center;
      gap: 12px; width: 100%; transition: all var(--transition); font-size: 14px;
    }
    .panel-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; }
    .panel-btn:hover { background: var(--bg3); color: var(--t1); transform: translateX(4px); }
    .voice-bar {
      background: var(--bg2); border-radius: 12px; padding: 8px 12px;
      display: flex; align-items: center; gap: 12px; margin-top: 8px;
    }
    .voice-bar svg { width: 20px; height: 20px; stroke: var(--ac); }
    .voice-controls { display: flex; gap: 8px; margin-left: auto; }
    .voice-btn {
      background: var(--bg3); border: none; width: 32px; height: 32px; border-radius: 8px;
      cursor: pointer; transition: all var(--transition); display: flex; align-items: center; justify-content: center;
    }
    .voice-btn svg { width: 16px; height: 16px; stroke: var(--t2); }
    .voice-btn:hover { background: var(--ac); } .voice-btn:hover svg { stroke: white; }
    .voice-btn.muted { background: var(--re); }
    /* DISCOVER */
    .discover-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
    .discover-card {
      background: var(--bg2); border-radius: 16px; padding: 16px; transition: all var(--transition);
      cursor: pointer; border: 1px solid var(--b);
    }
    .discover-card:hover { transform: translateY(-4px); border-color: var(--ac); box-shadow: 0 8px 24px rgba(0,0,0,0.2); }
    .discover-card-header { display: flex; gap: 12px; margin-bottom: 12px; }
    .discover-card-icon { width: 48px; height: 48px; background: var(--acd); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; }
    .discover-card-info h3 { font-size: 16px; margin-bottom: 4px; }
    .discover-card-info p { font-size: 12px; color: var(--t3); }
    .discover-card-stats { display: flex; gap: 16px; margin: 12px 0; font-size: 12px; color: var(--t2); }
    .discover-card button { background: var(--ac); border: none; padding: 8px 16px; border-radius: 8px; color: white; cursor: pointer; width: 100%; }
    /* DM */
    .dm-list { display: flex; flex-direction: column; gap: 8px; }
    .dm-item {
      display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 12px;
      cursor: pointer; transition: all var(--transition);
    }
    .dm-item:hover { background: var(--bg2); }
    .dm-avatar { width: 40px; height: 40px; background: var(--acd); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; }
    .dm-info { flex: 1; } .dm-name { font-weight: bold; margin-bottom: 2px; } .dm-last-msg { font-size: 12px; color: var(--t3); }
    /* MODAL */
    .modal {
      position: fixed; inset: 0; background: rgba(0,0,0,0.95); backdrop-filter: blur(12px);
      display: flex; align-items: center; justify-content: center; z-index: 1000;
      display: none; animation: fadeIn 0.2s ease;
    }
    .modal.show { display: flex; }
    .modal-box {
      background: var(--bg2); border-radius: 28px; padding: 28px; width: 500px;
      max-width: 90%; max-height: 85vh; overflow-y: auto;
    }
    .modal-box h2 { margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
    .modal-input, .modal-select {
      width: 100%; padding: 12px 16px; background: var(--bg1); border: 1px solid var(--b2);
      border-radius: 12px; color: var(--t1); margin-bottom: 16px; font-size: 14px;
    }
    .modal-input:focus, .modal-select:focus { outline: none; border-color: var(--ac); }
    .modal-btn {
      width: 100%; padding: 12px; background: var(--ac); border: none; border-radius: 12px;
      color: white; font-weight: bold; cursor: pointer; transition: all var(--transition);
    }
    .modal-btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
    .id-row {
      background: var(--bg1); padding: 8px 12px; border-radius: 8px; margin-bottom: 16px;
      font-size: 12px; font-family: monospace; cursor: pointer; transition: all var(--transition);
      display: flex; justify-content: space-between; align-items: center;
    }
    .id-row:hover { background: var(--acd); color: var(--ac); }
    .profile-banner { height: 120px; background: linear-gradient(135deg, var(--ac), var(--ac2)); border-radius: 16px; margin-bottom: -40px; }
    .profile-avatar-large { width: 80px; height: 80px; border-radius: 50%; background: var(--ac); margin: 0 auto 16px; display: flex; align-items: center; justify-content: center; font-size: 32px; }
    /* RESPONSIVE */
    @media (max-width: 768px) {
      .server-rail { width: 56px; }
      .channel-sidebar { position: absolute; left: -260px; height: 100%; background: var(--bg1); transition: left 0.3s ease; }
      .channel-sidebar.open { left: 56px; box-shadow: 4px 0 20px rgba(0,0,0,0.3); }
      .user-panel { position: absolute; right: -280px; height: 100%; background: var(--bg); transition: right 0.3s ease; }
      .user-panel.open { right: 0; box-shadow: -4px 0 20px rgba(0,0,0,0.3); }
      .emoji-picker { left: 20px; right: 20px; grid-template-columns: repeat(8, 1fr); }
    }
  </style>
</head>

  // ==================== AUTH ====================
  function attachAuthEvents() {
    document.getElementById('loginTab')?.addEventListener('click', () => { document.getElementById('loginForm').style.display='block'; document.getElementById('registerForm').style.display='none'; });
    document.getElementById('registerTab')?.addEventListener('click', () => { document.getElementById('loginForm').style.display='none'; document.getElementById('registerForm').style.display='block'; });
    document.getElementById('doLoginBtn')?.addEventListener('click', doLogin);
    document.getElementById('doRegBtn')?.addEventListener('click', doRegister);
  }
  async function doLogin() {
    const u = document.getElementById('loginUser').value.trim(), p = document.getElementById('loginPass').value;
    try {
      const r = await fetch(`${API_URL}/api/auth/login`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({username:u,password:p}) });
      const d = await r.json(); if(!r.ok) throw new Error(d.error);
      currentToken=d.token; currentUser=d.user; localStorage.setItem('gt_token',currentToken); localStorage.setItem('gt_user',JSON.stringify(currentUser));
      renderApp(); initSocket(); document.getElementById('loadingScreen')?.classList.add('hide');
    } catch(e) { document.getElementById('authError').innerText=e.message; }
  }
  async function doRegister() {
    const u = document.getElementById('regUser').value.trim(), p = document.getElementById('regPass').value;
    if(p.length<6) return document.getElementById('authError').innerText='Şifre en az 6 karakter';
    try {
      const r = await fetch(`${API_URL}/api/auth/register`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({username:u,password:p}) });
      const d = await r.json(); if(!r.ok) throw new Error(d.error);
      currentToken=d.token; currentUser=d.user; localStorage.setItem('gt_token',currentToken); localStorage.setItem('gt_user',JSON.stringify(currentUser));
      renderApp(); initSocket(); document.getElementById('loadingScreen')?.classList.add('hide');
    } catch(e) { document.getElementById('authError').innerText=e.message; }
  }

  async function sendMessage() {
    const inp = document.getElementById('messageInput'), content = inp.value.trim();
    if(!content) return;
    try {
      const r = await fetch(`${API_URL}/api/channels/${currentChannel.id}/messages`, {method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${currentToken}`},body:JSON.stringify({content})});
      const d = await r.json(); document.getElementById('messageIdVal').innerText = d._id; inp.value = '';
    } catch(e) { showToast(e.message, true); }
  }
  async function loadMessages() {
    try {
      const r = await fetch(`${API_URL}/api/channels/${currentChannel.id}/messages`, {headers:{'Authorization':`Bearer ${currentToken}`}});
      messages = await r.json(); const c = document.getElementById('messagesContainer');
      if(!messages.length) { c.innerHTML = `<div class="empty-channel">${Icons.hash}<h4># ${currentChannel.name} doğuşu</h4><p>Bu kanalda henüz mesaj yok. İlk mesajı sen gönder!</p></div>`; return; }
      c.innerHTML = messages.map(m=>`<div class="message"><div class="message-avatar">${m.senderName?.charAt(0)?.toUpperCase()||'?'}</div><div class="message-content"><div class="message-header">${escapeHtml(m.senderName)}<span>${new Date(m.createdAt).toLocaleTimeString()}</span></div><div class="message-text">${escapeHtml(m.content)}</div></div></div>`).join('');
      c.scrollTop = c.scrollHeight;
    } catch(e) {}
  }
  function initSocket() {
    if(!currentToken) return; if(socket) socket.disconnect();
    socket = io(API_URL, {auth:{token:currentToken}, transports:['websocket']});
    socket.on('new_message', m => { if(m.channelId===currentChannel.id) addMsg(m); });
    socket.on('user_typing', ({username,channelId}) => { if(channelId===currentChannel.id && username!==currentUser?.username) showTyping(username); });
  }
  function addMsg(m) {
    const c = document.getElementById('messagesContainer'); if(c.querySelector('.empty-channel')) c.innerHTML='';
    c.insertAdjacentHTML('beforeend', `<div class="message"><div class="message-avatar">${m.senderName?.charAt(0)?.toUpperCase()||'?'}</div><div class="message-content"><div class="message-header">${escapeHtml(m.senderName)}<span>${new Date(m.createdAt).toLocaleTimeString()}</span></div><div class="message-text">${escapeHtml(m.content)}</div></div></div>`);
    c.scrollTop = c.scrollHeight;
  }

  // ==================== WEBRTC ====================
  async function joinVoiceChannel(name) {
    showToast(`🎙️ ${name} kanalına bağlanılıyor...`);
    try {
      localStream = await navigator.mediaDevices.getUserMedia({audio:true});
      document.getElementById('voiceBar').style.display='flex'; isInVoice=true;
      setupVoice(name); showToast(`✅ ${name} kanalına katıldınız!`);
    } catch(e) { showToast('Mikrofon erişimi reddedildi!', true); }
  }
  function setupVoice(ch) {
    socket.emit('voice_join',{channel:ch});
    peerConnection = new RTCPeerConnection(rtcConfig);
    localStream.getTracks().forEach(t=>peerConnection.addTrack(t,localStream));
    peerConnection.onicecandidate = e => { if(e.candidate) socket.emit('voice_candidate',{candidate:e.candidate,channel:ch}); };
    socket.on('voice_answer', async d=>{ if(d.sdp) await peerConnection.setRemoteDescription(new RTCSessionDescription(d.sdp)); });
    socket.on('voice_candidate', d=>{ if(d.candidate) peerConnection.addIceCandidate(new RTCIceCandidate(d.candidate)); });
    peerConnection.createOffer().then(o=>{peerConnection.setLocalDescription(o);socket.emit('voice_offer',{sdp:o,channel:ch});});
    document.getElementById('muteBtn').onclick = () => {
      isMuted=!isMuted; localStream.getAudioTracks().forEach(t=>t.enabled=!isMuted);
      document.getElementById('muteBtn').innerHTML = isMuted ? Icons.micOff : Icons.mic;
      document.getElementById('muteBtn').classList.toggle('muted', isMuted);
    };
    document.getElementById('leaveVoiceBtn').onclick = () => {
      localStream.getTracks().forEach(t=>t.stop()); peerConnection.close();
      socket.emit('voice_leave',{channel:ch}); document.getElementById('voiceBar').style.display='none'; isInVoice=false;
      showToast('Sesli kanaldan ayrıldınız');
    };
  }

  function logout() { localStorage.removeItem('gt_token'); localStorage.removeItem('gt_user'); currentUser=null; if(socket) socket.disconnect(); renderApp(); showToast('Çıkış yapıldı'); }
  function openModal(id) { document.getElementById(id)?.classList.add('show'); }
  function closeModal(id) { document.getElementById(id)?.classList.remove('show'); }

  // ==================== INIT ====================
  function init() {
    setTimeout(() => document.getElementById('loadingScreen')?.classList.add('hide'), 800);
    const stored = localStorage.getItem('gt_user');
    if (stored && currentToken) { try { currentUser = JSON.parse(stored); } catch(e) {} }
    renderApp();
    document.addEventListener('click', e => { if (e.target.classList?.contains('modal')) e.target.classList.remove('show'); });
    window.openModal = openModal; window.closeModal = closeModal;
    window.createServer = createServer; window.createChannel = createChannel;
    window.addFriend = addFriend; window.saveServerSettings = saveServerSettings;
    window.saveProfile = saveProfile; window.loadDiscover = loadDiscover;
    window.joinDiscover = joinDiscover; window.setTheme = setTheme; window.copyId = copyId;
    window.joinVoiceChannel = joinVoiceChannel; window.openDM = () => {};
  }
  init();
</script>
</body>
</html>
