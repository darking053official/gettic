<!DOCTYPE html>
<html lang="tr">

    <meta charset="UTF-8">

    <style>
:root{--bg:#faf6f0;--bg1:#f5efe5;--bg2:#efe7da;--bg3:#e8dfd0;--bg4:#ddd3c0;--ac:#c94d8c;--ac2:#d4689e;--ac3:#e08db5;--acg:rgba(201,77,140,.18);--acd:rgba(201,77,140,.08);--gr:#2ecc71;--gr2:#27ae60;--re:#e74c3c;--re2:#c0392b;--ye:#f39c12;--bl:#3498db;--t1:#2c2416;--t2:#6b5e4a;--t3:#9e9078;--font:'Segoe UI',system-ui,sans-serif;--mono:'JetBrains Mono',monospace;--rail:62px;--side:240px;--panel:252px;--b:rgba(0,0,0,.05);--b2:rgba(0,0,0,.08);--b3:rgba(0,0,0,.12);--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--tr:.14s cubic-bezier(.3,.8,.4,1)}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--bg);color:var(--t1);height:100dvh;overflow:hidden;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;padding:var(--st) var(--sr,0px) var(--sb) var(--sl,0px)}
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--ac3);border-radius:3px}
*{scrollbar-width:thin;scrollbar-color:var(--ac3) transparent}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
#ls{position:fixed;inset:0;background:var(--bg);z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .45s,visibility .45s}
#ls.hide{opacity:0;visibility:hidden;pointer-events:none}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--b2);border-top-color:var(--ac);animation:spin .75s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ls-logo{font-size:20px;font-weight:800;letter-spacing:.06em;background:linear-gradient(135deg,var(--ac),var(--ac2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.app{display:flex;height:100dvh;position:relative;z-index:1}
.rail{width:var(--rail);background:var(--bg1);display:flex;flex-direction:column;align-items:center;padding:8px 0 10px;gap:6px;border-right:1px solid var(--b2);flex-shrink:0;z-index:20;overflow:hidden}
.ri{width:44px;height:44px;border-radius:50%;background:var(--bg2);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;flex-shrink:0;transition:border-radius .2s,background .14s,transform .14s,box-shadow .14s}
.ri svg{width:19px;height:19px;stroke:var(--t2);fill:none;stroke-width:1.5;transition:stroke .14s}
.ri:hover,.ri.act{border-radius:14px;background:var(--ac);transform:translateY(-1px);box-shadow:0 4px 18px var(--acg)}
.ri:hover svg,.ri.act svg{stroke:#fff}
.ri.act::after{content:'';position:absolute;right:-6px;top:50%;transform:translateY(-50%);width:4px;height:18px;background:var(--ac);border-radius:2px}
.ri.home-icon{background:linear-gradient(135deg,var(--ac),var(--ac2))}
.ri.home-icon svg{stroke:#fff}
.ri-sep{width:28px;height:1px;background:var(--b3);margin:2px 0}
.ri-push{margin-top:auto}
.notif-dot{position:absolute;top:4px;right:4px;width:8px;height:8px;border-radius:50%;background:var(--re);border:2px solid var(--bg1)}
.sidebar{width:var(--side);background:var(--bg);display:flex;flex-direction:column;border-right:1px solid var(--b2);flex-shrink:0;z-index:10;transition:left .22s ease;overflow:hidden}
.sidebar-header{height:46px;padding:0 12px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--b2);font-weight:800;font-size:13px;background:var(--bg1);cursor:pointer;flex-shrink:0;transition:background .12s}
.sidebar-header:hover{background:var(--bg2)}
.sidebar-header svg{width:15px;height:15px;stroke:var(--ac);fill:none;stroke-width:1.5;flex-shrink:0}
.sidebar-scroll{flex:1;overflow-y:auto;padding-bottom:8px}
.ch-cat{padding:14px 12px 4px;font-size:9.5px;font-weight:700;text-transform:uppercase;color:var(--t3);letter-spacing:.8px;display:flex;justify-content:space-between;align-items:center}
.ch-cat button{background:none;border:none;color:var(--t3);cursor:pointer;font-size:16px;line-height:1;padding:0 2px;transition:color .12s}
.ch-cat button:hover{color:var(--ac)}
.ch-item{padding:6px 12px;margin:1px 6px;border-radius:7px;display:flex;align-items:center;gap:7px;cursor:pointer;font-size:12px;color:var(--t2);transition:background .1s,color .1s}
.ch-item svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.5;flex-shrink:0}
.ch-item:hover,.ch-item:focus-visible{background:var(--bg2);color:var(--t1);outline:none}
.ch-item.act{background:var(--acd);color:var(--ac);font-weight:600}
.ch-item .ch-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch-item .ch-acts{display:none;gap:2px}
.ch-item:hover .ch-acts,.ch-item:focus-within .ch-acts{display:flex}
.ch-acts button{background:none;border:none;color:var(--t3);cursor:pointer;padding:2px;border-radius:3px;display:flex;align-items:center;transition:color .1s}
.ch-acts button:hover{color:var(--re)}
.ub{background:var(--re);color:#fff;font-size:9px;padding:1px 5px;border-radius:8px;font-weight:700;min-width:17px;text-align:center;flex-shrink:0}
.add-cat-btn{padding:7px 18px;font-size:11px;color:var(--t3);cursor:pointer;background:none;border:none;text-align:left;width:100%;font-weight:600;transition:color .12s}
.add-cat-btn:hover{color:var(--ac)}
.sidebar-user{padding:8px 10px;border-top:1px solid var(--b2);background:var(--bg1);display:flex;align-items:center;gap:8px;cursor:pointer;flex-shrink:0;transition:background .12s}
.sidebar-user:hover{background:var(--bg2)}
.su-av{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--ac2));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff;flex-shrink:0;position:relative}
.su-dot{position:absolute;bottom:0;right:0;width:9px;height:9px;border-radius:50%;border:2px solid var(--bg1)}
.su-dot.online{background:var(--gr)}
.su-dot.idle{background:var(--ye)}
.su-dot.dnd{background:var(--re)}
.su-dot.offline{background:var(--t3)}
.su-info{flex:1;min-width:0}
.su-name{font-size:12px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.su-tag{font-size:10px;color:var(--t3)}
.vbar{background:var(--bg2);border-radius:8px;display:flex;align-items:center;gap:7px;font-size:11px;font-weight:600;border:1px solid var(--b2);max-height:0;opacity:0;overflow:hidden;padding:0 8px;transition:max-height .28s ease,opacity .22s ease,padding .22s ease,margin .22s ease}
.vbar.show{max-height:52px;opacity:1;padding:7px 8px;margin:4px 8px}
.vbar-info{flex:1;min-width:0}
.vbar-st{display:flex;align-items:center;gap:4px;color:var(--gr);font-size:10px}
.vbar-ch{font-size:10px;color:var(--t3)}
.vpulse{width:6px;height:6px;border-radius:50%;background:var(--gr);animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.vctrl{display:flex;gap:3px}
.vb{background:var(--bg3);border:none;width:26px;height:26px;border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .12s}
.vb svg{width:13px;height:13px;stroke:var(--t2);fill:none;stroke-width:1.5;transition:stroke .12s}
.vb:hover{background:var(--ac)}
.vb:hover svg{stroke:#fff}
.vb.muted{background:var(--re)}
.vb.muted svg{stroke:#fff}
.chat{flex:1;display:flex;flex-direction:column;background:var(--bg);min-width:0}
.chat-header{height:46px;padding:0 14px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--b2);background:var(--bg1);flex-shrink:0}
.chat-header svg{width:15px;height:15px;stroke:var(--ac);fill:none;stroke-width:1.5;flex-shrink:0}
.ch-hname{font-weight:700;font-size:13px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hacts{display:flex;gap:4px}
.ib{background:var(--bg2);border:none;width:30px;height:30px;border-radius:7px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background var(--tr),transform var(--tr);flex-shrink:0}
.ib svg{width:14px;height:14px;stroke:var(--t2);fill:none;stroke-width:1.5;transition:stroke .12s}
.ib:hover,.ib.act{background:var(--ac);transform:scale(1.05)}
.ib:hover svg,.ib.act svg{stroke:#fff}
#connbar{height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:8px;font-size:11px;font-weight:600;color:#fff;background:var(--re);transition:height .22s;flex-shrink:0}
#connbar.show{height:28px}
#connbar button{background:rgba(255,255,255,.2);border:none;padding:2px 9px;border-radius:4px;color:#fff;cursor:pointer;font-size:11px;font-weight:600}
.msgs{flex:1;overflow-y:auto;overflow-x:hidden;contain:layout style;scrollbar-gutter:stable}
.msgs-inner{display:flex;flex-direction:column;gap:1px;padding:10px 12px 18px}
.empty-ch{text-align:center;padding:50px 20px;color:var(--t3);animation:fuA .3s ease;margin:auto}
.empty-ch svg{width:48px;height:48px;stroke:var(--t3);fill:none;opacity:.28;margin-bottom:12px}
.empty-ch h4{font-size:15px;margin-bottom:5px;color:var(--t2);font-weight:700}
.empty-ch p{font-size:12px}
@keyframes fuA{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.msg{display:flex;align-items:flex-start;gap:9px;padding:4px 7px;border-radius:7px;transition:background .08s;position:relative;word-break:break-word;overflow-wrap:break-word;animation:fuA .14s ease}
.msg:hover,.msg:focus-within{background:var(--bg2)}
.msg:hover .ma,.msg:focus-within .ma{display:flex}
.msg.pinned{background:rgba(243,156,18,.06);border-left:3px solid var(--ye);padding-left:10px}
.msg-av{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--ac2));display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;font-size:13px;color:#fff;cursor:pointer;transition:transform .12s,box-shadow .12s}
.msg-av:hover{transform:scale(1.08);box-shadow:0 2px 10px var(--acg)}
.msg-body{flex:1;min-width:0;overflow:hidden}
.msg-head{font-size:11px;font-weight:700;margin-bottom:2px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.msg-un{cursor:pointer;transition:color .12s}
.msg-un:hover{color:var(--ac)}
.rbadge{font-size:8px;padding:1px 5px;border-radius:3px;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.msg-time{font-weight:400;font-size:9px;color:var(--t3)}
.msg-edited{font-size:9px;color:var(--t3);font-style:italic}
.msg-text{font-size:12.5px;line-height:1.5;color:var(--t2);overflow-wrap:anywhere}
.msg-text b{color:var(--t1);font-weight:700}
.msg-text i{font-style:italic}
.msg-text code{background:var(--bg3);padding:1px 5px;border-radius:4px;font-family:var(--mono);font-size:10.5px;color:var(--ac)}
.ma{display:none;position:absolute;right:7px;top:-12px;background:var(--bg4);border-radius:6px;padding:2px;gap:1px;box-shadow:0 4px 14px rgba(0,0,0,.15);z-index:5;border:1px solid var(--b3)}
.ma button{background:none;border:none;color:var(--t2);cursor:pointer;padding:4px 6px;border-radius:4px;display:flex;align-items:center;transition:background .08s,color .08s}
.ma button:hover{background:var(--bg3);color:var(--t1)}
.ma button svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.5}
.reacts{display:flex;gap:3px;margin-top:3px;flex-wrap:wrap}
.react{background:var(--bg3);border-radius:6px;padding:2px 7px;font-size:11px;cursor:pointer;transition:all .08s;border:1px solid transparent;display:flex;align-items:center;gap:3px}
.react:hover{border-color:var(--b3);background:var(--bg4)}
.react.me{background:var(--acd);border-color:var(--ac)}
.poll-box{background:var(--bg2);border:1px solid var(--b2);border-radius:10px;padding:10px 12px;margin-top:6px;max-width:340px}
.poll-q{font-size:12px;font-weight:700;margin-bottom:8px;color:var(--t1)}
.poll-opts{display:flex;flex-direction:column;gap:5px}
.poll-opt{background:var(--bg3);border-radius:7px;padding:7px 10px;cursor:pointer;font-size:11px;display:flex;align-items:center;gap:8px;border:1px solid transparent;position:relative;overflow:hidden;transition:border-color .12s}
.poll-opt:hover{border-color:var(--b3)}
.poll-opt.voted{background:var(--acd);border-color:var(--ac)}
.poll-bar{position:absolute;left:0;top:0;bottom:0;background:var(--acg);border-radius:7px;transition:width .4s ease;z-index:0}
.poll-opt span{position:relative;z-index:1}
.poll-pct{margin-left:auto;font-size:10px;color:var(--t3);position:relative;z-index:1}
.typing{padding:2px 14px;font-size:10px;color:var(--t3);font-style:italic;height:20px;flex-shrink:0}
.tdots{display:inline-flex;gap:2px;vertical-align:middle}
.tdots span{width:3px;height:3px;background:var(--t3);border-radius:50%;animation:blink 1.2s infinite}
.tdots span:nth-child(2){animation-delay:.2s}
.tdots span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
.input-area{padding:7px 12px calc(10px + var(--sb));background:var(--bg1);border-top:1px solid var(--b2);display:flex;gap:5px;align-items:flex-end;flex-shrink:0}
.msg-inp{flex:1;background:var(--bg);border:1px solid var(--b2);border-radius:20px;padding:9px 14px;color:var(--t1);font-size:13px;outline:none;transition:border-color var(--tr),box-shadow var(--tr);font-family:var(--font);resize:none;max-height:120px;line-height:1.4;scrollbar-width:none}
.msg-inp:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--acg)}
.msg-inp::placeholder{color:var(--t3)}
.epop{position:fixed;background:var(--bg2);border-radius:12px;display:none;z-index:300;border:1px solid var(--b2);box-shadow:0 8px 26px rgba(0,0,0,.12);max-height:230px;overflow-y:auto;padding:8px}
.epop.show{display:block;animation:fuA .12s ease}
.egrid{display:flex;flex-wrap:wrap;gap:2px}
.es{font-size:18px;cursor:pointer;padding:5px;border-radius:6px;transition:background .08s;line-height:1}
.es:hover{background:var(--bg3)}
.home-panel{flex:1;display:flex;flex-direction:column;background:var(--bg);min-width:0;overflow:hidden}
.home-header{height:46px;padding:0 16px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--b2);background:var(--bg1);font-weight:800;font-size:14px;flex-shrink:0}
.home-header svg{width:16px;height:16px;stroke:var(--ac);fill:none;stroke-width:1.5}
.home-body{flex:1;overflow-y:auto;padding:16px}
.home-section{margin-bottom:20px}
.home-sec-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--t3);margin-bottom:8px}
.friend-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;cursor:pointer;transition:background .1s}
.friend-item:hover{background:var(--bg2)}
.friend-av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--ac2));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;color:#fff;flex-shrink:0;position:relative}
.friend-info{flex:1;min-width:0}
.friend-name{font-size:13px;font-weight:600}
.friend-status{font-size:11px;color:var(--t3)}
.dm-preview{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;cursor:pointer;transition:background .1s}
.dm-preview:hover{background:var(--bg2)}
.dm-av{width:38px;height:38px;border-radius:50%;background:var(--acd);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;color:var(--ac);flex-shrink:0}
.dm-info{flex:1;min-width:0}
.dm-name{font-size:13px;font-weight:600}
.dm-last{font-size:11px;color:var(--t3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:1000}
.modal.show{display:flex;animation:fuA .14s ease}
.mbox{background:var(--bg);border-radius:18px;padding:22px;width:490px;max-width:95vw;max-height:88dvh;overflow-y:auto;overscroll-behavior:contain;position:relative;border:1px solid var(--b2);box-shadow:0 20px 60px rgba(0,0,0,.12)}
.mbox h2{margin-bottom:16px;display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700}
.mclose{position:absolute;top:12px;right:12px;background:var(--bg3);border:none;width:30px;height:30px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--t2);transition:all .12s;z-index:5}
.mclose:hover{background:var(--re);color:#fff}
.mi,.ms,.mta{width:100%;padding:10px 13px;background:var(--bg);border:1px solid var(--b2);border-radius:9px;color:var(--t1);margin-bottom:10px;font-size:12px;font-family:var(--font);outline:none;transition:border-color var(--tr),box-shadow var(--tr)}
.mta{resize:vertical;min-height:60px}
.mi:focus,.ms:focus,.mta:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--acg)}
.mb{width:100%;padding:10px;background:var(--ac);border:none;border-radius:9px;color:#fff;font-weight:700;cursor:pointer;font-size:13px;font-family:var(--font);transition:filter .12s,transform .08s}
.mb:hover{filter:brightness(1.08);transform:translateY(-1px)}
.mb.sec{background:var(--bg3);color:var(--t2)}
.mb.danger{background:var(--re)}
.msep{height:1px;background:var(--b2);margin:14px 0}
.mitem{display:flex;align-items:center;gap:9px;padding:9px;border-radius:8px;cursor:pointer;transition:background .1s}
.mitem:hover{background:var(--bg2)}
.mav{width:36px;height:36px;border-radius:50%;background:var(--acd);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:var(--ac);flex-shrink:0}
.minfo{flex:1;min-width:0}
.mname{font-weight:600;font-size:12px}
.msub{font-size:10px;color:var(--t3)}
.settings-layout{display:flex;height:520px;max-height:72dvh}
.settings-nav{width:168px;flex-shrink:0;border-right:1px solid var(--b2);padding:10px 8px;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.settings-nav-item{padding:8px 10px;border-radius:7px;font-size:12px;font-weight:600;color:var(--t2);cursor:pointer;transition:background .1s,color .1s;display:flex;align-items:center;gap:8px}
.settings-nav-item svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.5;flex-shrink:0}
.settings-nav-item:hover{background:var(--bg2);color:var(--t1)}
.settings-nav-item.act{background:var(--acd);color:var(--ac)}
.settings-nav-item.danger{color:var(--re)}
.settings-content{flex:1;overflow-y:auto;padding:18px}
.settings-section{display:none}
.settings-section.show{display:block}
.settings-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--b)}
.settings-row:last-child{border-bottom:none}
.settings-row-label{font-size:12px;font-weight:600}
.settings-row-sub{font-size:10px;color:var(--t3);margin-top:2px}
.toggle{position:relative;width:40px;height:22px;background:var(--bg3);border-radius:11px;cursor:pointer;transition:background .15s;flex-shrink:0}
.toggle.on{background:var(--ac)}
.toggle::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;background:#fff;border-radius:50%;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.toggle.on::after{left:21px}
.color-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}

function App(){

  const [unreadCounts,setUnreadCounts]=useState({});

  const t=(key)=>(L[lang]||L.tr)[key]||key;

  const hasPermission=(uid,perm)=>{if(!uid)return false;const rids=userRoles[uid]||['r4'];for(const rid of rids){const r=roles.find(x=>x.id===rid);if(r&&(r.permissions.all||r.permissions[perm]))return true}return false};

  const doAuth=async(type,username,password)=>{if(!checkRL('auth',5,10000))return toast('Çok fazla deneme','e');try{const res=await fetch(`${API}/api/auth/${type}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})});const data=await res.json();if(!res.ok)throw new Error(data.error||'Başarısız');setUser(data.user);setToken(data.token);localStorage.setItem('gt_token',data.token);localStorage.setItem('gt_user',JSON.stringify(data.user));if(!userRoles[data.user._id]){setUserRoles(prev=>({...prev,[data.user._id]:['r4']}))}}catch(e){toast(e.message,'e')}};

  const deleteChannel=(id)=>{if(!hasPermission(user._id,'manageChannels')&&!hasPermission(user._id,'all'))return toast('Yetkiniz yok','e');setChannels(prev=>prev.filter(c=>c.id!==id));if(activeChannel.id===id){const first=channels.find(c=>c.type==='text');if(first)setActiveChannel({id:first.id,name:first.name,topic:'Sohbet odası'})}toast('Kanal silindi')};
  const startDM=(username)=>{if(!dmFriends.find(f=>f.username===username)){setDmFriends(prev=>[...prev,{id:genId(),username,messages:[],time:'Şimdi'}])}setActiveDM({username,messages:dmFriends.find(f=>f.username===username)?.messages||[]})};

  const joinVoice=async(channelId)=>{try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});setLocalStream(stream);setVoiceChannelId(channelId);setIsInVoice(true);const pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});stream.getTracks().forEach(t=>pc.addTrack(t,stream));pc.onicecandidate=(e)=>{if(e.candidate)socketRef.current?.emit('voice_candidate',{candidate:e.candidate,channel:channelId})};pc.ontrack=(e)=>{const audio=document.createElement('audio');audio.srcObject=e.streams[0];audio.autoplay=true;document.body.appendChild(audio);setRemoteAudioElements(prev=>[...prev,audio])};setPeerConnections(prev=>new Map(prev).set(channelId,pc));socketRef.current?.emit('voice_join',{channel:channelId});const offer=await pc.createOffer();await pc.setLocalDescription(offer);socketRef.current?.emit('voice_offer',{sdp:offer,channel:channelId})}catch(e){toast('Mikrofon izni gerekli','e')}};

  if(!user){return(<div className="auth-wrap"><div className="auth-box"><img src="https://raw.githubusercontent.com/darking053official/gettic/main/1777062266055.png" className="auth-logo" alt="Gettic"/><div className="auth-title">gettic</div><div className="auth-sub">Türkçe sohbet platformu</div>{!captchaVerified?(<div className="cap-box"><div className="cap-title">Güvenlik Doğrulaması</div><canvas className="cap-cvs" width="240" height="72" ref={el=>{if(el){const ctx=el.getContext('2d'),w=el.width,h=el.height;ctx.fillStyle='#faf6f0';ctx.fillRect(0,0,w,h);for(let i=0;i<5;i++){ctx.beginPath();ctx.moveTo(Math.random()*w,Math.random()*h);ctx.lineTo(Math.random()*w,Math.random()*h);ctx.strokeStyle='rgba(201,77,140,'+(Math.random()*.3+.08)+')';ctx.lineWidth=Math.random()*2+.5;ctx.stroke()}ctx.textBaseline='middle';captchaCode.split('').forEach((c,i)=>{ctx.save();ctx.translate(w/5*(i+.7),h/2);ctx.rotate(Math.random()*.4-.2);ctx.font='bold 28px "Courier New"';ctx.fillStyle='#c94d8c';ctx.fillText(c,0,0);ctx.restore()})}}}/><input className="cap-inp" maxLength="4" autoFocus onKeyDown={e=>{if(e.key==='Enter'){if(e.target.value.toUpperCase()===captchaCode){setCaptchaVerified(true);setCaptchaCode('')}else{setCaptchaCode(Math.random().toString(36).substring(2,6).toUpperCase());e.target.value=''}}}}/><button className="cap-btn" onClick={()=>{const inp=document.querySelector('.cap-inp');if(inp.value.toUpperCase()===captchaCode){setCaptchaVerified(true);setCaptchaCode('')}else{setCaptchaCode(Math.random().toString(36).substring(2,6).toUpperCase());inp.value=''}}}>Doğrula</button><span className="cap-ref" onClick={()=>setCaptchaCode(Math.random().toString(36).substring(2,6).toUpperCase())}>Yenile</span></div>):(<div><div className="auth-tabs"><button className="auth-tab act" onClick={()=>{}}>Giriş</button><button className="auth-tab" onClick={()=>{}}>Kayıt</button></div><input className="mi" placeholder="Kullanıcı adı" id="authUser"/><input className="mi" type="password" placeholder="Şifre" id="authPass" onKeyDown={e=>{if(e.key==='Enter')doAuth('login',document.getElementById('authUser').value,document.getElementById('authPass').value)}}/><button className="mb" onClick={()=>doAuth('login',document.getElementById('authUser').value,document.getElementById('authPass').value)}>Giriş</button></div>)}</div></div>)}

  const typingNames=Object.keys(typingUsers).filter(u=>typingUsers[u]>Date.now()-3000);

        {messages.length===0?(<div className="empty-ch">{I.hash}<h4># {activeChannel.name} {t('birth')}</h4><p>{t('noMessages')}</p></div>):messages.map(msg=>(<div key={msg._id} className="msg" onContextMenu={e=>{e.preventDefault();setCtxMenu({type:'message',mid:msg._id,x:e.clientX,y:e.clientY})}}><div className="msg-av">{msg.senderName?.charAt(0).toUpperCase()}</div><div className="msg-body"><div className="msg-head"><span className="msg-un">{esc(msg.senderName)}</span>{getHighestRole(msg.senderId)&&getHighestRole(msg.senderId).id!=='r4'&&<span className="rbadge" style={{background:getHighestRole(msg.senderId).color+'20',color:getHighestRole(msg.senderId).color}}>{getHighestRole(msg.senderId).name}</span>}<span className="msg-time"> {new Date(msg.createdAt).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'})}{msg.edited&&<span className="msg-edited"> (düzenlendi)</span>}</span></div>{editingMsg===msg._id?(<div><input className="edit-inp" defaultValue={msg.content} onKeyDown={e=>{if(e.key==='Enter')editMessage(msg._id,e.target.value);if(e.key==='Escape')setEditingMsg(null)}}/><div className="edit-acts"><button className="edit-btn save" onClick={()=>editMessage(msg._id,document.querySelector('.edit-inp')?.value||msg.content)}>Kaydet</button><button className="edit-btn cancel" onClick={()=>setEditingMsg(null)}>İptal</button></div></div>):msg.image?(<div className="msg-text"><img src={msg.image} alt={msg.content} style={{maxWidth:'100%',borderRadius:'12px',marginBottom:'8px'}}/><div style={{fontSize:'0.8rem',color:'var(--t3)'}}>{msg.content}</div></div>):(<div className="msg-text" dangerouslySetInnerHTML={{__html:formatMsg(msg.content)}}/>)}{polls[msg._id]&&(<div className="poll-box"><div className="poll-q">📊 {polls[msg._id].question}</div><div className="poll-opts">{polls[msg._id].options.map((o,i)=>{const total=polls[msg._id].votes.reduce((a,b)=>a+b,0)||1;const pct=Math.round((polls[msg._id].votes[i]/total)*100);return(<div key={i} className={`poll-opt ${polls[msg._id].voters[user._id]===i?'voted':''}`} onClick={()=>votePoll(msg._id,i)}><div className="poll-bar" style={{width:pct+'%'}}/><span>{o}</span><span className="poll-pct">{pct}%</span></div>)})}</div></div>)}{msg.reactions&&Object.keys(msg.reactions).length>0&&(<div className="reacts">{Object.entries(msg.reactions).map(([emoji,users])=>(<span key={emoji} className={`react ${users.includes(user._id)?'me':''}`} onClick={()=>addReaction(msg._id,emoji)}>{emoji} <span>{users.length}</span></span>))}</div>)}</div><div className="ma"><button onClick={()=>addReaction(msg._id,'👍')}>👍</button>{msg.senderId===user._id&&<button onClick={()=>setEditingMsg(msg._id)}>{I.edit}</button>}<button onClick={()=>{navigator.clipboard.writeText(msg.content);toast('Kopyalandı')}}>{I.copy}</button><button onClick={()=>pinMessage(msg._id)}>{I.pin}</button>{(msg.senderId===user._id||hasPermission(user._id,'deleteMsg'))&&<button onClick={()=>deleteMessage(msg._id)} style={{color:'var(--re)'}}>{I.trash}</button>}</div></div>))}

      {activeModal==='addFriend'&&(<><h2>{I.plus} Arkadaş Ekle</h2><input className="mi" id="frName" placeholder="Kullanıcı adı"/><button className="mb" onClick={()=>{const n=document.getElementById('frName').value.trim();if(n){setDmFriends(prev=>[...prev,{id:genId(),username:n,messages:[],time:'Şimdi'}]);setActiveModal(null);toast(`${n} eklendi`)}}}>Ekle</button></>)}
      {activeModal==='search'&&(<><h2>{I.search} Arama</h2><input className="mi" placeholder="Ara..." onChange={e=>setSearchQuery(e.target.value)} autoFocus/>{messages.filter(m=>(m.content||'').toLowerCase().includes(searchQuery.toLowerCase())).slice(-10).map(m=>(<div key={m._id} className="mitem" onClick={()=>{switchChannel(channels.find(c=>c.id===m.channelId)||activeChannel);setActiveModal(null)}}><div className="mav">{m.senderName?.charAt(0)}</div><div className="minfo"><div className="mname">{m.senderName}</div><div className="msub">{m.content.substring(0,60)}</div></div></div>))}</>)}
      {activeModal==='theme'&&(<><h2>Tema</h2><div className="color-row">{['#c94d8c','#6366f1','#22c55e','#f59e0b','#ec4899','#3b82f6'].map(c=>(<div key={c} className="color-swatch" style={{background:c}} onClick={()=>{setAppTheme(c);setActiveModal(null)}}/>))}</div><div className="msep"/><button className="mb sec" onClick={()=>{toggleLight();setActiveModal(null)}}>{lightMode?I.moon:I.sun} Aydınlık/Karanlık</button></>)}
      {activeModal==='poll'&&(<><h2>{I.poll} Anket</h2><input className="mi" id="pollQ" placeholder="Soru"/><input className="mi" id="pollO1" placeholder="Seçenek 1"/><input className="mi" id="pollO2" placeholder="Seçenek 2"/><button className="mb" onClick={()=>{const q=document.getElementById('pollQ').value.trim();const o1=document.getElementById('pollO1').value.trim();const o2=document.getElementById('pollO2').value.trim();if(q&&o1&&o2){createPoll(q,[o1,o2]);setActiveModal(null)}}}>Başlat</button></>)}
    </div></div>)}
    {ctxMenu&&(<div className="ctxmenu show" style={{left:ctxMenu.x,top:ctxMenu.y}}><button onClick={()=>{deleteMessage(ctxMenu.mid);setCtxMenu(null)}} className="danger">{I.trash} Sil</button><button onClick={()=>{pinMessage(ctxMenu.mid);setCtxMenu(null)}}>{I.pin} Sabitle</button><button onClick={()=>{navigator.clipboard.writeText(messages.find(m=>m._id===ctxMenu.mid)?.content||'');setCtxMenu(null);toast('Kopyalandı')}}>{I.copy} Kopyala</button></div>)}
    {toastMsg&&(<div className={`toast ${toastMsg.type}`}>{toastMsg.msg}</div>)}
  </div>)
}
window.App=App;
    </script>
    <script>
window.onload=function(){if(typeof App==='function'){const root=ReactDOM.createRoot(document.getElementById('root'));root.render(React.createElement(App));setTimeout(function(){var ls=document.getElementById('ls');if(ls)ls.classList.add('hide')},800)}else{document.getElementById('ls').innerHTML='<div style="color:red;padding:20px">App yüklenemedi!</div>'}};
    </script>
</body>
</html>
