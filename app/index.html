<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Gettic — Sohbet Platformu</title>
    <link rel="icon" href="https://github.com/darking053official/gettic/blob/main/1777062266055.png?raw=true">
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #0a0a14;
            --bg1: #0f0f1a;
            --bg2: #151520;
            --bg3: #1c1c2a;
            --b: rgba(255,255,255,.05);
            --b2: rgba(255,255,255,.08);
            --ac: #c084fc;
            --ac2: #e879f9;
            --ac3: #f0abfc;
            --acg: rgba(192,132,252,.3);
            --acd: rgba(192,132,252,.1);
            --t1: #f0f0ff;
            --t2: #a0a0c0;
            --t3: #606080;
            --gr: #22c55e;
            --re: #ef4444;
            --ye: #f59e0b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--t1);
            height: 100vh;
            overflow: hidden;
        }

        /* APP LAYOUT */
        .app { display: flex; height: 100vh; background: var(--bg1); position: relative; }

        /* SERVER RAIL */
        .server-rail {
            width: 72px;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px 0;
            gap: 12px;
            overflow-y: auto;
            border-right: 1px solid var(--b);
            flex-shrink: 0;
        }
        .server-icon {
            width: 48px;
            height: 48px;
            background: var(--bg2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            position: relative;
        }
        .server-icon svg { width: 24px; height: 24px; stroke: var(--t2); stroke-width: 1.5; fill: none; }
        .server-icon:hover, .server-icon.active { border-radius: 16px; background: var(--ac); transform: translateY(-2px); }
        .server-icon:hover svg, .server-icon.active svg { stroke: white; }
        .server-icon::after { content: ''; position: absolute; right: -8px; top: 50%; transform: translateY(-50%); width: 4px; height: 0; background: var(--ac); border-radius: 2px; transition: height 0.2s; }
        .server-icon.active::after { height: 20px; }

        /* CHANNEL SIDEBAR */
        .channel-sidebar {
            width: 260px;
            background: var(--bg1);
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--b);
            flex-shrink: 0;
            transition: transform 0.3s ease;
        }
        .channel-header {
            height: 48px;
            padding: 0 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--b);
            font-weight: bold;
            background: var(--bg);
        }
        .channel-header svg { width: 20px; height: 20px; stroke: var(--ac); }
        .channel-category {
            padding: 16px 16px 4px 16px;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            color: var(--t3);
            letter-spacing: 1px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .channel-category button {
            background: none;
            border: none;
            color: var(--t3);
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        .channel-category button:hover { color: var(--ac); transform: scale(1.1); }
        .channel-item {
            padding: 6px 16px;
            margin: 2px 8px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            font-size: 14px;
            color: var(--t2);
            transition: all 0.15s ease;
        }
        .channel-item svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.5; }
        .channel-item:hover { background: var(--bg2); color: var(--t1); transform: translateX(4px); }
        .channel-item.active { background: var(--acd); color: var(--ac3); }

        /* CHAT AREA */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg1);
            min-width: 0;
        }
        .chat-header {
            height: 48px;
            padding: 0 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--b);
            background: var(--bg);
            flex-shrink: 0;
        }
        .chat-header svg { width: 20px; height: 20px; stroke: var(--ac); }
        .chat-header .channel-name { font-weight: bold; }
        .chat-header .channel-topic { font-size: 12px; color: var(--t3); margin-left: 8px; }
        .chat-header .header-badge { margin-left: auto; display: flex; gap: 8px; align-items: center; }
        .icon-btn {
            background: var(--bg2);
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .icon-btn svg { width: 16px; height: 16px; stroke: var(--t2); }
        .icon-btn:hover { background: var(--ac); transform: scale(1.05); }
        .icon-btn:hover svg { stroke: white; }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .empty-channel {
            text-align: center;
            padding: 60px 20px;
            color: var(--t3);
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .empty-channel svg { width: 80px; height: 80px; stroke: var(--t3); margin-bottom: 20px; opacity: 0.5; }
        .empty-channel h3 { font-size: 20px; margin-bottom: 8px; color: var(--t2); }
        .message {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 6px 0;
            transition: background 0.1s;
            border-radius: 8px;
        }
        .message:hover { background: var(--bg2); }
        .message-avatar {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--ac), var(--ac2));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            flex-shrink: 0;
        }
        .message-content { flex: 1; }
        .message-header { font-size: 13px; font-weight: bold; margin-bottom: 2px; }
        .message-header span { font-weight: normal; font-size: 11px; margin-left: 8px; color: var(--t3); }
        .message-text { font-size: 14px; line-height: 1.4; word-wrap: break-word; }
        .typing-indicator { padding: 8px 20px; font-size: 12px; color: var(--t3); font-style: italic; height: 36px; transition: all 0.2s; }

        /* INPUT AREA */
        .input-area {
            padding: 16px 20px;
            background: var(--bg);
            border-top: 1px solid var(--b);
            display: flex;
            gap: 12px;
            align-items: center;
            flex-shrink: 0;
        }
        .message-input {
            flex: 1;
            background: var(--bg2);
            border: 1px solid var(--b2);
            border-radius: 24px;
            padding: 10px 16px;
            color: var(--t1);
            font-size: 14px;
            outline: none;
            transition: all 0.2s;
        }
        .message-input:focus { border-color: var(--ac); box-shadow: 0 0 0 3px var(--acg); }
        .send-btn { background: var(--ac); }
        .send-btn svg { stroke: white; }

        /* EMOJI PICKER */
        .emoji-picker {
            position: absolute;
            bottom: 80px;
            left: 320px;
            background: var(--bg2);
            border-radius: 16px;
            padding: 12px;
            display: none;
            grid-template-columns: repeat(8, 1fr);
            gap: 8px;
            z-index: 100;
            border: 1px solid var(--b2);
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            animation: fadeInUp 0.2s ease;
        }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .emoji-picker.show { display: grid; }
        .emoji-option { font-size: 22px; cursor: pointer; padding: 4px; text-align: center; border-radius: 8px; transition: all 0.1s; }
        .emoji-option:hover { background: var(--bg3); transform: scale(1.2); }

        /* USER PANEL */
        .user-panel {
            width: 280px;
            background: var(--bg);
            border-left: 1px solid var(--b);
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex-shrink: 0;
            transition: transform 0.3s ease;
        }
        .user-profile {
            display: flex;
            gap: 12px;
            align-items: center;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--b);
        }
        .user-avatar {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--ac), var(--ac2));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
        }
        .user-info { flex: 1; }
        .user-name { font-weight: bold; font-size: 15px; }
        .user-status { font-size: 11px; color: var(--gr); display: flex; align-items: center; gap: 4px; }
        .server-settings-btn, .logout-btn {
            background: var(--bg2);
            border: none;
            padding: 10px 12px;
            border-radius: 10px;
            color: var(--t2);
            cursor: pointer;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            transition: all 0.2s;
        }
        .server-settings-btn svg, .logout-btn svg { width: 18px; height: 18px; stroke: currentColor; }
        .server-settings-btn:hover, .logout-btn:hover { background: var(--bg3); color: var(--t1); transform: translateX(4px); }

        /* VOICE BAR */
        .voice-bar {
            background: var(--bg2);
            border-radius: 12px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 8px;
        }
        .voice-bar svg { width: 20px; height: 20px; stroke: var(--ac); }
        .voice-controls { display: flex; gap: 8px; margin-left: auto; }
        .voice-btn {
            background: var(--bg3);
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .voice-btn svg { width: 16px; height: 16px; stroke: var(--t2); }
        .voice-btn:hover { background: var(--ac); }
        .voice-btn:hover svg { stroke: white; }
        .voice-btn.muted { background: var(--re); }

        /* MODAL */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            display: none;
            animation: fadeIn 0.2s ease;
        }
        .modal.show { display: flex; }
        .modal-box {
            background: var(--bg2);
            border-radius: 28px;
            padding: 32px;
            width: 520px;
            max-width: 90%;
            max-height: 85vh;
            overflow-y: auto;
            animation: scaleIn 0.2s ease;
        }
        @keyframes scaleIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .modal-box h2 { margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
        .modal-input, .modal-select {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg1);
            border: 1px solid var(--b2);
            border-radius: 12px;
            color: var(--t1);
            margin-bottom: 16px;
            font-size: 14px;
        }
        .modal-input:focus, .modal-select:focus { outline: none; border-color: var(--ac); }
        .modal-btn {
            width: 100%;
            padding: 12px;
            background: var(--ac);
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        .modal-btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
        .id-row { background: var(--bg1); padding: 8px 12px; border-radius: 8px; margin-bottom: 16px; font-size: 12px; font-family: monospace; cursor: pointer; transition: all 0.2s; }
        .id-row:hover { background: var(--acd); color: var(--ac); }
        .color-preview { width: 40px; height: 40px; border-radius: 10px; background: var(--ac); margin-right: 12px; cursor: pointer; border: 2px solid var(--b2); }
        .theme-option { display: flex; align-items: center; padding: 8px; border-radius: 12px; cursor: pointer; transition: all 0.2s; }
        .theme-option:hover { background: var(--bg3); }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .server-rail { width: 60px; }
            .channel-sidebar { position: absolute; left: -260px; z-index: 50; height: 100%; background: var(--bg1); }
            .channel-sidebar.open { left: 60px; box-shadow: 4px 0 20px rgba(0,0,0,0.3); }
            .user-panel { position: absolute; right: -280px; z-index: 50; height: 100%; background: var(--bg); }
            .user-panel.open { right: 0; box-shadow: -4px 0 20px rgba(0,0,0,0.3); }
            .emoji-picker { left: 20px; right: 20px; grid-template-columns: repeat(7, 1fr); }
        }

        /* ANIMATIONS */
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
        .voice-active { animation: pulse 1.5s infinite; }
    </style>
</head>
<body>
<div id="app"></div>

<script>
    // ==================== KONFIG ====================
    const API_URL = 'https://gettic-j49l.onrender.com';
    let currentUser = null;
    let currentToken = localStorage.getItem('gt_token');
    let socket = null;
    let currentChannel = { id: 'genel-sohbet', name: 'genel-sohbet', topic: 'Sohbet odası' };
    let messages = [];
    let servers = [];
    let friends = [];

    // WebRTC (Sesli Görüşme)
    let localStream = null;
    let peerConnection = null;
    let isInVoice = false;
    let isMuted = false;
    const configuration = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

    // ==================== SVG ICONS ====================
    const Icons = {
        hash: '<svg viewBox="0 0 24 24"><line x1="4" y1="9" x2="20" y2="9"/><line x1="4" y1="15" x2="20" y2="15"/><line x1="10" y1="3" x2="8" y2="21"/><line x1="16" y1="3" x2="14" y2="21"/></svg>',
        volume: '<svg viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>',
        forum: '<svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>',
        dm: '<svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>',
        discover: '<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>',
        settings: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93A10 10 0 0 1 21 12a10 10 0 0 1-1.93 7.07M4.93 4.93A10 10 0 0 0 3 12a10 10 0 0 0 1.93 7.07M12 2v2M12 20v2M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41"/></svg>',
        plus: '<svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>',
        send: '<svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>',
        emoji: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>',
        add: '<svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>',
        logout: '<svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>',
        mic: '<svg viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>',
        micOff: '<svg viewBox="0 0 24 24"><line x1="23" y1="1" x2="1" y2="23"/><path d="M9 9v3a3 3 0 0 0 5.12 2.12"/><path d="M15 9.34V5a3 3 0 0 0-5.94-.6"/><path d="M17 16.95A7 7 0 0 1 5 12v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>',
        deafen: '<svg viewBox="0 0 24 24"><path d="M2 2L22 22"/><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>'
    };

    // ==================== UTILS ====================
    function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;'); }
    function showToast(msg, isError = false) {
        const toast = document.createElement('div');
        toast.style.cssText = `position:fixed;bottom:24px;right:24px;background:var(--bg2);padding:12px 24px;border-radius:12px;color:${isError ? '#ef4444' : '#22c55e'};z-index:2000;backdrop-filter:blur(10px);border:1px solid var(--b2);animation:fadeIn 0.2s ease`;
        toast.textContent = msg;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }

    // ==================== RENDER APP ====================
    function renderApp() {
        const appDiv = document.getElementById('app');
        if (!currentUser) {
            appDiv.innerHTML = renderAuth();
            attachAuthEvents();
            return;
        }
        appDiv.innerHTML = renderMainUI();
        attachMainEvents();
        loadMessages();
        initSocket();
        initTheme();
    }

    function renderAuth() {
        return `
            <div class="modal show" id="authModal">
                <div class="modal-box">
                    <div style="text-align:center;margin-bottom:20px;"><img src="https://github.com/darking053official/gettic/blob/main/1777062266055.png?raw=true" style="width:60px;border-radius:16px;"></div>
                    <h2 style="text-align:center;">gettic</h2>
                    <div style="display:flex;gap:12px;margin:20px 0;">
                        <button id="loginTab" class="modal-btn" style="background:var(--ac);flex:1">Giriş</button>
                        <button id="registerTab" class="modal-btn" style="background:var(--bg2);flex:1">Kayıt</button>
                    </div>
                    <div id="loginForm">
                        <input type="text" id="loginUser" class="modal-input" placeholder="Kullanıcı Adı">
                        <input type="password" id="loginPass" class="modal-input" placeholder="Şifre">
                        <button id="doLoginBtn" class="modal-btn">Giriş Yap</button>
                    </div>
                    <div id="registerForm" style="display:none">
                        <input type="text" id="regUser" class="modal-input" placeholder="Kullanıcı Adı">
                        <input type="password" id="regPass" class="modal-input" placeholder="Şifre (min 6)">
                        <button id="doRegBtn" class="modal-btn">Kayıt Ol</button>
                    </div>
                    <div id="authError" style="color:var(--re);margin-top:12px;text-align:center;"></div>
                </div>
            </div>
        `;
    }

    function renderMainUI() {
        return `
            <div class="app">
                <div class="server-rail">
                    <div class="server-icon active" data-server="main">${Icons.hash}</div>
                    <div class="server-icon" data-server="games">🎮</div>
                    <div class="server-icon" onclick="openModal('addServerModal')">${Icons.plus}</div>
                </div>

                <div class="channel-sidebar" id="channelSidebar">
                    <div class="channel-header">${Icons.hash} <span>Gettic</span></div>
                    <div class="channel-category">📁 METİN ODALARI <button onclick="openModal('addChannelModal')">${Icons.plus}</button></div>
                    <div class="channel-item active" data-channel="genel-sohbet">${Icons.hash} genel-sohbet</div>
                    <div class="channel-item" data-channel="kurallar">${Icons.forum} kurallar</div>
                    <div class="channel-category">🔊 SESLİ ODALAR</div>
                    <div class="channel-item voice-channel" data-channel="Sesli Sohbet">${Icons.volume} Sesli Sohbet</div>
                    <div class="channel-item voice-channel" data-channel="Müzik Odası">🎵 Müzik Odası</div>
                    <div class="channel-category">📋 FORUM</div>
                    <div class="channel-item" data-channel="forum">${Icons.forum} forum</div>
                    <div class="channel-category">📢 GERİ BİLDİRİM</div>
                    <div class="channel-item" data-channel="oneri">${Icons.forum} öneri</div>
                    <div class="channel-item" data-channel="bug-bildirimi">🐛 bug-bildirimi</div>
                </div>

                <div class="chat-area">
                    <div class="chat-header">
                        ${Icons.hash}
                        <div class="channel-name"># ${currentChannel.name}</div>
                        <div class="channel-topic">${currentChannel.topic}</div>
                        <div class="header-badge">
                            <button class="icon-btn" id="copyChannelIdBtn" title="Kanal ID">🆔</button>
                            <button class="icon-btn" id="toggleSidebarBtn" title="Kanal Listesi">☰</button>
                            <button class="icon-btn" id="toggleUserPanelBtn" title="Kullanıcı Paneli">👤</button>
                        </div>
                    </div>
                    <div class="messages-container" id="messagesContainer"></div>
                    <div class="typing-indicator" id="typingIndicator"></div>
                    <div class="input-area">
                        <button class="icon-btn" id="emojiBtn">${Icons.emoji}</button>
                        <div id="emojiPicker" class="emoji-picker"></div>
                        <input type="text" class="message-input" id="messageInput" placeholder="Mesajınızı yazın...">
                        <button class="icon-btn send-btn" id="sendBtn">${Icons.send}</button>
                    </div>
                </div>

                <div class="user-panel" id="userPanel">
                    <div class="user-profile">
                        <div class="user-avatar" id="userAvatarDisplay">${currentUser?.username?.charAt(0)?.toUpperCase() || 'U'}</div>
                        <div class="user-info">
                            <div class="user-name">${escapeHtml(currentUser?.username || 'Kullanıcı')}</div>
                            <div class="user-status">🟢 Çevrimiçi</div>
                        </div>
                    </div>
                    <div class="voice-bar" id="voiceBar" style="display:none;">
                        ${Icons.volume}
                        <span>Sesli Kanal</span>
                        <div class="voice-controls">
                            <button class="voice-btn" id="muteBtn" title="Mikrofon">${Icons.mic}</button>
                            <button class="voice-btn" id="deafenBtn" title="Hoparlör">${Icons.deafen}</button>
                            <button class="voice-btn" id="leaveVoiceBtn" style="background:var(--re);">🚪</button>
                        </div>
                    </div>
                    <button class="server-settings-btn" id="serverSettingsBtn">${Icons.settings} Sunucu Ayarları</button>
                    <button class="server-settings-btn" id="userSettingsBtn">👤 Hesap Ayarları</button>
                    <button class="server-settings-btn" id="themeSettingsBtn">🎨 Tema Ayarları</button>
                    <button class="server-settings-btn" id="discoverBtn">🔍 Sunucuları Keşfet</button>
                    <button class="server-settings-btn" id="dmBtn">💬 Direkt Mesajlar</button>
                    <button class="server-settings-btn" id="addFriendBtn">👥 Arkadaş Ekle</button>
                    <button class="logout-btn" id="logoutBtn">${Icons.logout} Çıkış Yap</button>
                </div>
            </div>

            <!-- MODALLAR -->
            <div id="serverSettingsModal" class="modal"><div class="modal-box"><h2>${Icons.settings} Sunucu Ayarları</h2><input id="serverName" class="modal-input" placeholder="Sunucu Adı"><input id="serverDesc" class="modal-input" placeholder="Açıklama"><input id="serverIcon" class="modal-input" placeholder="Icon URL"><input id="serverBanner" class="modal-input" placeholder="Banner URL"><div class="id-row" onclick="copyText('serverIdVal')">Sunucu ID: <span id="serverIdVal">-</span></div><button class="modal-btn" onclick="saveServerSettings()">Kaydet</button></div></div>
            <div id="userSettingsModal" class="modal"><div class="modal-box"><h2>👤 Hesap Ayarları</h2><input id="userAvatarUrl" class="modal-input" placeholder="Avatar URL"><textarea id="userBio" class="modal-input" rows="3" placeholder="Biyografi"></textarea><select id="userStatusSelect" class="modal-select"><option value="online">🟢 Çevrimiçi</option><option value="idle">🟡 Boşta</option><option value="dnd">🔴 Rahatsız Etme</option></select><button class="modal-btn" onclick="saveUserSettings()">Kaydet</button></div></div>
            <div id="themeSettingsModal" class="modal"><div class="modal-box"><h2>🎨 Tema Ayarları</h2><div class="theme-option" onclick="setTheme('#c084fc','#e879f9')"><div class="color-preview" style="background:#c084fc"></div><span>Pembe Mor (Varsayılan)</span></div><div class="theme-option" onclick="setTheme('#6366f1','#818cf8')"><div class="color-preview" style="background:#6366f1"></div><span>Mavi</span></div><div class="theme-option" onclick="setTheme('#22c55e','#4ade80')"><div class="color-preview" style="background:#22c55e"></div><span>Yeşil</span></div><button class="modal-btn" onclick="closeModal('themeSettingsModal')">Kapat</button></div></div>
            <div id="addServerModal" class="modal"><div class="modal-box"><h2>${Icons.plus} Sunucu Oluştur</h2><input id="newServerName" class="modal-input" placeholder="Sunucu Adı"><input id="newServerDesc" class="modal-input" placeholder="Açıklama"><button class="modal-btn" onclick="createServer()">Oluştur</button></div></div>
            <div id="addChannelModal" class="modal"><div class="modal-box"><h2>${Icons.plus} Kanal Oluştur</h2><input id="newChannelName" class="modal-input" placeholder="Kanal Adı"><select id="channelType" class="modal-select"><option value="text">Metin</option><option value="voice">Sesli</option><option value="forum">Forum</option></select><button class="modal-btn" onclick="createChannel()">Oluştur</button></div></div>
            <div id="discoverModal" class="modal"><div class="modal-box"><h2>🔍 Sunucuları Keşfet</h2><div id="discoverList" class="discover-list"></div></div></div>
            <div id="dmModal" class="modal"><div class="modal-box"><h2>💬 Direkt Mesajlar</h2><div id="dmList"></div></div></div>
            <div id="addFriendModal" class="modal"><div class="modal-box"><h2>👥 Arkadaş Ekle</h2><input id="friendUsername" class="modal-input" placeholder="Kullanıcı Adı"><button class="modal-btn" onclick="addFriend()">Ekle</button></div></div>
            <div id="webhookModal" class="modal"><div class="modal-box"><h2>🔗 Webhook Bilgileri</h2><div class="id-row" onclick="copyText('channelIdVal')">Kanal ID: <span id="channelIdVal">-</span></div><div class="id-row" onclick="copyText('messageIdVal')">Mesaj ID: <span id="messageIdVal">-</span></div><div class="id-row" onclick="copyText('serverIdVal2')">Sunucu ID: <span id="serverIdVal2">-</span></div><button class="modal-btn" onclick="closeModal('webhookModal')">Kapat</button></div></div>
        `;
    }

    // ==================== AUTH ====================
    function attachAuthEvents() {
        document.getElementById('loginTab')?.addEventListener('click', () => toggleAuthForms(true));
        document.getElementById('registerTab')?.addEventListener('click', () => toggleAuthForms(false));
        document.getElementById('doLoginBtn')?.addEventListener('click', doLogin);
        document.getElementById('doRegBtn')?.addEventListener('click', doRegister);
    }
    function toggleAuthForms(isLogin) {
        document.getElementById('loginForm').style.display = isLogin ? 'block' : 'none';
        document.getElementById('registerForm').style.display = isLogin ? 'none' : 'block';
        document.getElementById('loginTab').style.background = isLogin ? 'var(--ac)' : 'var(--bg2)';
        document.getElementById('registerTab').style.background = isLogin ? 'var(--bg2)' : 'var(--ac)';
    }
    async function doLogin() {
        const username = document.getElementById('loginUser').value.trim();
        const password = document.getElementById('loginPass').value;
        try {
            const res = await fetch(`${API_URL}/api/auth/login`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username, password }) });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error);
            currentToken = data.token;
            currentUser = data.user;
            localStorage.setItem('gt_token', currentToken);
            localStorage.setItem('gt_user', JSON.stringify(currentUser));
            renderApp();
            initSocket();
        } catch (err) { document.getElementById('authError').innerText = err.message; }
    }
    async function doRegister() {
        const username = document.getElementById('regUser').value.trim();
        const password = document.getElementById('regPass').value;
        try {
            const res = await fetch(`${API_URL}/api/auth/register`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username, password }) });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error);
            currentToken = data.token;
            currentUser = data.user;
            localStorage.setItem('gt_token', currentToken);
            localStorage.setItem('gt_user', JSON.stringify(currentUser));
            renderApp();
            initSocket();
        } catch (err) { document.getElementById('authError').innerText = err.message; }
    }

    // ==================== MAIN EVENTS ====================
    function attachMainEvents() {
        document.querySelectorAll('.channel-item').forEach(el => {
            el.addEventListener('click', () => {
                if (el.classList.contains('voice-channel')) {
                    const channelName = el.dataset.channel;
                    joinVoiceChannel(channelName);
                    return;
                }
                const channelId = el.dataset.channel;
                currentChannel = { id: channelId, name: channelId.replace(/-/g, ' '), topic: 'Sohbet odası' };
                document.querySelectorAll('.channel-item').forEach(c => c.classList.remove('active'));
                el.classList.add('active');
                document.querySelector('.channel-name').innerHTML = `# ${currentChannel.name}`;
                loadMessages();
                socket?.emit('join_channel', channelId);
            });
        });
        document.getElementById('sendBtn')?.addEventListener('click', sendMessage);
        document.getElementById('messageInput')?.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });
        document.getElementById('messageInput')?.addEventListener('input', () => { socket?.emit('typing', { channelId: currentChannel.id, username: currentUser?.username }); });
        document.getElementById('emojiBtn')?.addEventListener('click', () => document.getElementById('emojiPicker').classList.toggle('show'));
        document.getElementById('logoutBtn')?.addEventListener('click', logout);
        document.getElementById('copyChannelIdBtn')?.addEventListener('click', () => { document.getElementById('channelIdVal').innerText = currentChannel.id; openModal('webhookModal'); showToast('Kanal ID hazır!'); });
        document.getElementById('serverSettingsBtn')?.addEventListener('click', () => openModal('serverSettingsModal'));
        document.getElementById('userSettingsBtn')?.addEventListener('click', () => openModal('userSettingsModal'));
        document.getElementById('themeSettingsBtn')?.addEventListener('click', () => openModal('themeSettingsModal'));
        document.getElementById('discoverBtn')?.addEventListener('click', () => { openModal('discoverModal'); loadDiscoverServers(); });
        document.getElementById('dmBtn')?.addEventListener('click', () => { openModal('dmModal'); loadDMList(); });
        document.getElementById('addFriendBtn')?.addEventListener('click', () => openModal('addFriendModal'));
        document.getElementById('toggleSidebarBtn')?.addEventListener('click', () => document.getElementById('channelSidebar').classList.toggle('open'));
        document.getElementById('toggleUserPanelBtn')?.addEventListener('click', () => document.getElementById('userPanel').classList.toggle('open'));
        initEmojiPicker();
    }

    async function sendMessage() {
        const input = document.getElementById('messageInput');
        const content = input.value.trim();
        if (!content) return;
        try {
            const res = await fetch(`${API_URL}/api/channels/${currentChannel.id}/messages`, {
                method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${currentToken}` },
                body: JSON.stringify({ content })
            });
            const data = await res.json();
            document.getElementById('messageIdVal').innerText = data._id;
            input.value = '';
        } catch (err) { showToast(err.message, true); }
    }

    async function loadMessages() {
        try {
            const res = await fetch(`${API_URL}/api/channels/${currentChannel.id}/messages`, { headers: { 'Authorization': `Bearer ${currentToken}` } });
            messages = await res.json();
            const container = document.getElementById('messagesContainer');
            if (!messages.length) {
                container.innerHTML = `<div class="empty-channel">${Icons.hash}<h3># ${currentChannel.name} doğuşu</h3><p>Bu kanalda henüz mesaj yok. İlk mesajı sen gönder!</p></div>`;
                return;
            }
            container.innerHTML = messages.map(msg => `
                <div class="message"><div class="message-avatar">${msg.senderName?.charAt(0)?.toUpperCase() || '?'}</div>
                <div class="message-content"><div class="message-header">${escapeHtml(msg.senderName)} <span>${new Date(msg.createdAt).toLocaleTimeString()}</span></div>
                <div class="message-text">${escapeHtml(msg.content)}</div></div></div>
            `).join('');
            container.scrollTop = container.scrollHeight;
        } catch (err) { console.error(err); }
    }

    function initSocket() {
        if (!currentToken) return;
        if (socket) socket.disconnect();
        socket = io(API_URL, { auth: { token: currentToken }, transports: ['websocket'] });
        socket.on('new_message', (msg) => { if (msg.channelId === currentChannel.id) addMessageToChat(msg); });
        socket.on('user_typing', ({ username, channelId }) => { if (channelId === currentChannel.id && username !== currentUser?.username) showTyping(username); });
    }
    function addMessageToChat(msg) {
        const container = document.getElementById('messagesContainer');
        if (container.querySelector('.empty-channel')) container.innerHTML = '';
        container.insertAdjacentHTML('beforeend', `<div class="message"><div class="message-avatar">${msg.senderName?.charAt(0)?.toUpperCase() || '?'}</div><div class="message-content"><div class="message-header">${escapeHtml(msg.senderName)} <span>${new Date(msg.createdAt).toLocaleTimeString()}</span></div><div class="message-text">${escapeHtml(msg.content)}</div></div></div>`);
        container.scrollTop = container.scrollHeight;
    }
    let typingTimeout;
    function showTyping(username) {
        const indicator = document.getElementById('typingIndicator');
        indicator.textContent = `${username} yazıyor...`;
        clearTimeout(typingTimeout);
        typingTimeout = setTimeout(() => indicator.textContent = '', 1500);
    }
    function initEmojiPicker() {
        const emojis = ['😀', '😂', '❤️', '🔥', '🎉', '👍', '👎', '🙏', '🎮', '💻', '🐛', '📢', '✨', '⭐', '✅', '❌', '💪', '🎯', '🔧', '📦', '🚀', '💬'];
        const picker = document.getElementById('emojiPicker');
        picker.innerHTML = emojis.map(e => `<div class="emoji-option" data-emoji="${e}">${e}</div>`).join('');
        picker.querySelectorAll('.emoji-option').forEach(opt => {
            opt.addEventListener('click', () => {
                document.getElementById('messageInput').value += opt.dataset.emoji;
                picker.classList.remove('show');
                document.getElementById('messageInput').focus();
            });
        });
    }

    // ==================== WEBRTC (Sesli Görüşme) ====================
    async function joinVoiceChannel(channelName) {
        showToast(`🎙️ ${channelName} kanalına bağlanılıyor...`);
        try {
            localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            document.getElementById('voiceBar').style.display = 'flex';
            document.getElementById('userPanel').style.display = 'flex';
            isInVoice = true;
            setupVoiceSocket(channelName);
            showToast(`✅ ${channelName} kanalına katıldınız!`, false);
        } catch (err) {
            showToast('Mikrofon erişimi reddedildi!', true);
        }
    }
    function setupVoiceSocket(channelName) {
        if (!socket) return;
        socket.emit('voice_join', { channel: channelName });
        peerConnection = new RTCPeerConnection(configuration);
        localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
        peerConnection.ontrack = (event) => { console.log('Uzaktan ses alınıyor'); };
        peerConnection.onicecandidate = (event) => {
            if (event.candidate) socket.emit('voice_candidate', { candidate: event.candidate, channel: channelName });
        };
        socket.on('voice_answer', async (data) => {
            if (data.sdp) await peerConnection.setRemoteDescription(new RTCSessionDescription(data.sdp));
        });
        socket.on('voice_candidate', (data) => {
            if (data.candidate) peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
        });
        peerConnection.createOffer().then(offer => {
            peerConnection.setLocalDescription(offer);
            socket.emit('voice_offer', { sdp: offer, channel: channelName });
        });
        document.getElementById('muteBtn')?.addEventListener('click', toggleMute);
        document.getElementById('leaveVoiceBtn')?.addEventListener('click', leaveVoiceChannel);
    }
    function toggleMute() {
        if (localStream) {
            isMuted = !isMuted;
            localStream.getAudioTracks().forEach(track => track.enabled = !isMuted);
            const muteBtn = document.getElementById('muteBtn');
            muteBtn.innerHTML = isMuted ? Icons.micOff : Icons.mic;
            muteBtn.classList.toggle('muted', isMuted);
            showToast(isMuted ? '🔇 Mikrofon susturuldu' : '🎤 Mikrofon açıldı');
        }
    }
    function leaveVoiceChannel() {
        if (localStream) localStream.getTracks().forEach(track => track.stop());
        if (peerConnection) peerConnection.close();
        if (socket) socket.emit('voice_leave', { channel: 'Sesli Sohbet' });
        document.getElementById('voiceBar').style.display = 'none';
        isInVoice = false;
        showToast('Sesli kanaldan ayrıldınız');
    }

    // ==================== CRUD & HELPERS ====================
    async function createServer() {
        const name = document.getElementById('newServerName').value.trim();
        if (!name) return showToast('Sunucu adı gerekli', true);
        try {
            await fetch(`${API_URL}/api/servers`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${currentToken}` }, body: JSON.stringify({ name, description: document.getElementById('newServerDesc').value }) });
            showToast('Sunucu oluşturuldu');
            closeModal('addServerModal');
        } catch (err) { showToast(err.message, true); }
    }
    async function createChannel() {
        const name = document.getElementById('newChannelName').value.trim();
        if (!name) return showToast('Kanal adı gerekli', true);
        showToast(`${name} kanalı oluşturuldu (demo)`);
        closeModal('addChannelModal');
    }
    async function addFriend() {
        const username = document.getElementById('friendUsername').value.trim();
        if (!username) return;
        showToast(`${username} arkadaşlık isteği gönderildi`);
        closeModal('addFriendModal');
    }
    async function saveServerSettings() { showToast('Sunucu ayarları kaydedildi'); closeModal('serverSettingsModal'); }
    async function saveUserSettings() { showToast('Hesap ayarları kaydedildi'); closeModal('userSettingsModal'); }
    async function loadDiscoverServers() {
        const container = document.getElementById('discoverList');
        container.innerHTML = '<div style="text-align:center;padding:20px;">Demo sunucular yükleniyor...</div>';
        setTimeout(() => {
            container.innerHTML = '<div class="channel-item" onclick="joinDemoServer()">🎮 Oyun Sunucusu</div><div class="channel-item" onclick="joinDemoServer()">💻 Yazılım Topluluğu</div><div class="channel-item" onclick="joinDemoServer()">🎨 Sanat ve Tasarım</div>';
        }, 500);
    }
    async function loadDMList() {
        const container = document.getElementById('dmList');
        container.innerHTML = '<div style="text-align:center;padding:20px;">Arkadaşlarınızla özel sohbetler burada görünecek.</div>';
    }
    function joinDemoServer() { showToast('Demo sunucuya katılıyorsunuz...'); closeModal('discoverModal'); }
    function setTheme(primary, secondary) {
        document.documentElement.style.setProperty('--ac', primary);
        document.documentElement.style.setProperty('--ac2', secondary);
        document.documentElement.style.setProperty('--acg', `${primary}30`);
        document.documentElement.style.setProperty('--acd', `${primary}1A`);
        localStorage.setItem('gt_theme_primary', primary);
        localStorage.setItem('gt_theme_secondary', secondary);
        showToast('Tema değiştirildi!');
    }
    function initTheme() {
        const savedPrimary = localStorage.getItem('gt_theme_primary');
        const savedSecondary = localStorage.getItem('gt_theme_secondary');
        if (savedPrimary && savedSecondary) setTheme(savedPrimary, savedSecondary);
    }
    function copyText(id) {
        const text = document.getElementById(id)?.innerText;
        if (text) { navigator.clipboard.writeText(text); showToast('Kopyalandı!'); }
    }
    function logout() {
        localStorage.removeItem('gt_token');
        localStorage.removeItem('gt_user');
        currentUser = null;
        if (socket) socket.disconnect();
        renderApp();
        showToast('Çıkış yapıldı');
    }
    function openModal(id) { document.getElementById(id)?.classList.add('show'); }
    function closeModal(id) { document.getElementById(id)?.classList.remove('show'); }

    // ==================== INIT ====================
    function init() {
        const stored = localStorage.getItem('gt_user');
        if (stored && currentToken) {
            try { currentUser = JSON.parse(stored); } catch(e) {}
        }
        renderApp();
        document.addEventListener('click', (e) => { if (e.target.classList?.contains('modal')) e.target.classList.remove('show'); });
        window.openModal = openModal;
        window.closeModal = closeModal;
        window.createServer = createServer;
        window.createChannel = createChannel;
        window.addFriend = addFriend;
        window.saveServerSettings = saveServerSettings;
        window.saveUserSettings = saveUserSettings;
        window.loadDiscoverServers = loadDiscoverServers;
        window.loadDMList = loadDMList;
        window.joinDemoServer = joinDemoServer;
        window.setTheme = setTheme;
        window.copyText = copyText;
        window.joinVoiceChannel = joinVoiceChannel;
    }
    init();
</script>
