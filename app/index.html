<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover, maximum-scale=1.0">
  <title>Gettic — Sohbet Platformu</title>
  <link rel="icon" href="https://raw.githubusercontent.com/darking053official/gettic/main/1777062266055.png">
  <link rel="manifest" href="data:application/json,{'name':'Gettic','short_name':'Gettic','start_url':'/app/','display':'standalone','background_color':'#0a0a14','theme_color':'#b57bee','icons':[{'src':'https://raw.githubusercontent.com/darking053official/gettic/main/1777062266055.png','sizes':'192x192','type':'image/png'}]}">
  <meta name="theme-color" content="#b57bee">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <style>
    :root {
      --bg:#0a0a14;--bg1:#0c0c1a;--bg2:#111122;--bg3:#181830;--b:rgba(255,255,255,.04);--b2:rgba(255,255,255,.06);
      --ac:#b57bee;--ac2:#c99df2;--ac3:#dbbff9;--acg:rgba(181,123,238,.25);--acd:rgba(181,123,238,.1);
      --t1:#e8e8f8;--t2:#9898b8;--t3:#585878;--gr:#22c55e;--re:#ef4444;--ye:#f59e0b;
      --radius:10px;--transition:.15s cubic-bezier(.3,.8,.4,1);--font:'Segoe UI',system-ui,sans-serif;--mono:'JetBrains Mono',monospace;
      --sidebar-w:240px;--userpanel-w:250px;--serverrail-w:60px;
    }
    body.light {
      --bg:#eeeef4;--bg1:#f8f8fc;--bg2:#e6e6ee;--bg3:#dddde6;--b:rgba(0,0,0,.04);--b2:rgba(0,0,0,.06);
      --t1:#1a1a2e;--t2:#4a4a6a;--t3:#787890;--acg:rgba(181,123,238,.35);--acd:rgba(181,123,238,.12);
    }
    body.light .message-avatar{color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.2);}
    body.light .server-icon:hover,body.light .server-icon.active{background:var(--ac);}
    body.light .server-icon:hover svg,body.light .server-icon.active svg{stroke:#fff;}
    body.light .voice-btn{background:var(--bg2);}
    body.light .toggle-switch::after{background:var(--bg1);}
    body.light .toggle-switch.on::after{background:#fff;}
    *{margin:0;padding:0;box-sizing:border-box;}
    body{
      font-family:var(--font);background:var(--bg);color:var(--t1);
      height:100vh;height:100dvh;overflow:hidden;user-select:none;
      -webkit-tap-highlight-color:transparent;touch-action:pan-y;
      scrollbar-gutter:stable;
    }
    body.modal-open{overflow:hidden;padding-right:var(--scrollbar-w,0px);}
    @supports(padding-bottom:env(safe-area-inset-bottom)){body{padding-bottom:env(safe-area-inset-bottom);}}
    ::-webkit-scrollbar{width:3px;}::-webkit-scrollbar-thumb{background:var(--ac);border-radius:3px;}
    :focus-visible{outline:2px solid var(--ac);outline-offset:1px;border-radius:4px;}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0;}
    .loading-screen{position:fixed;inset:0;background:var(--bg);z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .3s,visibility .3s;}
    .loading-screen.hide{opacity:0;visibility:hidden;pointer-events:none;}
    .loader{width:40px;height:40px;border:3px solid var(--b2);border-top-color:var(--ac);border-radius:50%;animation:spin .6s linear infinite;}
    @keyframes spin{to{transform:rotate(360deg);}}
    .loading-logo{margin-top:14px;font-size:17px;font-weight:700;background:linear-gradient(135deg,var(--ac),var(--ac2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
    .app{display:flex;height:100vh;height:100dvh;background:var(--bg1);position:relative;}
    .connection-bar{position:fixed;top:0;left:0;right:0;height:3px;background:var(--re);z-index:10000;transition:height .25s,opacity .25s;opacity:0;}
    .connection-bar.offline{height:22px;opacity:1;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;gap:6px;}
    .connection-bar.offline button{background:rgba(255,255,255,.2);border:none;color:#fff;padding:2px 8px;border-radius:3px;cursor:pointer;font-size:9px;font-weight:600;}
    .offline-queue-indicator{display:none;align-items:center;gap:5px;padding:3px 16px;font-size:10px;color:var(--ye);background:var(--bg);border-bottom:1px solid var(--b);}
    .offline-queue-indicator.show{display:flex;}
    .server-rail{width:var(--serverrail-w);background:var(--bg);display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:8px;overflow-y:auto;border-right:1px solid var(--b);flex-shrink:0;z-index:10;}
    .server-icon{width:42px;height:42px;background:var(--bg2);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all var(--transition);position:relative;}
    .server-icon svg{width:20px;height:20px;stroke:var(--t2);stroke-width:1.5;fill:none;}
    .server-icon:hover,.server-icon.active{border-radius:13px;background:var(--ac);transform:translateY(-2px);}
    .server-icon:hover svg,.server-icon.active svg{stroke:#fff;}
    .server-icon.active::after{content:'';position:absolute;right:-6px;top:50%;transform:translateY(-50%);width:3px;height:16px;background:var(--ac);border-radius:2px;}
    .channel-sidebar{width:var(--sidebar-w);background:var(--bg1);display:flex;flex-direction:column;border-right:1px solid var(--b);flex-shrink:0;z-index:10;overflow-y:auto;transition:transform .25s ease;}
    .channel-header{height:44px;padding:0 12px;display:flex;align-items:center;gap:7px;border-bottom:1px solid var(--b);font-weight:700;background:var(--bg);font-size:14px;flex-shrink:0;}
    .channel-header svg{width:17px;height:17px;stroke:var(--ac);}
    .channel-category{padding:12px 12px 3px;font-size:10px;font-weight:700;text-transform:uppercase;color:var(--t3);letter-spacing:.7px;display:flex;justify-content:space-between;align-items:center;}
    .channel-category button{background:none;border:none;color:var(--t3);cursor:pointer;font-size:14px;padding:1px 3px;border-radius:3px;}
    .channel-category button:hover{color:var(--ac);}
    .channel-item{padding:6px 12px;margin:1px 5px;border-radius:6px;display:flex;align-items:center;gap:7px;cursor:pointer;font-size:12px;color:var(--t2);transition:all .12s;position:relative;}
    .channel-item svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.5;flex-shrink:0;}
    .channel-item:hover,.channel-item:focus-visible{background:var(--bg2);color:var(--t1);outline:none;}
    .channel-item.active{background:var(--acd);color:var(--ac3);font-weight:600;}
    .channel-item .ch-actions{display:none;margin-left:auto;gap:3px;}
    .channel-item:hover .ch-actions,.channel-item:focus-within .ch-actions{display:flex;}
    .ch-actions button{background:none;border:none;color:var(--t3);cursor:pointer;padding:1px;font-size:11px;}
    .ch-actions button:hover{color:var(--re);}
    .channel-item .unread-badge{background:var(--re);color:#fff;font-size:9px;padding:1px 5px;border-radius:8px;margin-left:auto;font-weight:700;min-width:16px;text-align:center;}
    .empty-channels{text-align:center;padding:24px;color:var(--t3);font-size:12px;}
    .chat-area{flex:1;display:flex;flex-direction:column;background:var(--bg1);min-width:0;}
    .chat-header{height:44px;padding:0 16px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--b);background:var(--bg);flex-shrink:0;}
    .chat-header svg{width:17px;height:17px;stroke:var(--ac);flex-shrink:0;}
    .channel-name{font-weight:700;font-size:14px;}
    .channel-topic{font-size:10px;color:var(--t3);margin-left:4px;}
    .header-badge{margin-left:auto;display:flex;gap:5px;}
    .icon-btn{background:var(--bg2);border:none;width:28px;height:28px;border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all var(--transition);}
    .icon-btn svg{width:14px;height:14px;stroke:var(--t2);fill:none;stroke-width:1.5;}
    .icon-btn:hover,.icon-btn:focus-visible{background:var(--ac);transform:scale(1.04);}
    .icon-btn:hover svg,.icon-btn:focus-visible svg{stroke:#fff;}
    .messages-container{flex:1;overflow-y:auto;padding:12px 16px;scroll-behavior:smooth;contain:strict;will-change:scroll-position;}
    .messages-inner{display:flex;flex-direction:column;gap:2px;padding-bottom:20px;}
    .message-spacer{height:1px;}
    .empty-channel{text-align:center;padding:40px 20px;color:var(--t3);animation:fadeIn .35s ease;margin:auto;}
    @keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    .empty-channel svg{width:48px;height:48px;stroke:var(--t3);margin-bottom:12px;opacity:.4;}
    .empty-channel h4{font-size:15px;margin-bottom:4px;color:var(--t2);font-weight:700;}
    .empty-channel p{font-size:12px;}
    .message{display:flex;align-items:flex-start;gap:8px;padding:4px 6px;border-radius:6px;transition:background .08s;position:relative;word-break:break-word;overflow-wrap:break-word;min-height:30px;}
    .message:hover,.message:focus-within{background:var(--bg2);}
    .message:hover .msg-actions,.message:focus-within .msg-actions{display:flex;}
    @media(hover:none){.message:active .msg-actions{display:flex;}}
    .message-avatar{width:30px;height:30px;background:linear-gradient(135deg,var(--ac),var(--ac2));border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;font-size:12px;color:#fff;cursor:pointer;}
    .message-content{flex:1;min-width:0;overflow:hidden;}
    .message-header{font-size:11px;font-weight:700;margin-bottom:1px;display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
    .message-header .role-badge{font-size:8px;padding:1px 4px;border-radius:3px;font-weight:600;}
    .message-header span{font-weight:400;font-size:9px;margin-left:3px;color:var(--t3);}
    .message-text{font-size:12px;line-height:1.4;word-wrap:break-word;color:var(--t2);overflow-wrap:anywhere;}
    .message-text b{color:var(--t1);}.message-text i{font-style:italic;}
    .message-text code{background:var(--bg3);padding:1px 3px;border-radius:3px;font-family:var(--mono);font-size:10px;}
    .msg-actions{display:none;position:absolute;right:6px;top:-7px;background:var(--bg3);border-radius:5px;padding:1px;gap:1px;box-shadow:0 3px 10px rgba(0,0,0,.25);z-index:5;}
    .msg-actions button{background:none;border:none;color:var(--t2);cursor:pointer;padding:3px 5px;border-radius:4px;font-size:12px;}
    .msg-actions button:hover{background:var(--bg2);color:var(--t1);}
    .msg-reactions{display:flex;gap:3px;margin-top:2px;flex-wrap:wrap;}
    .msg-reaction{background:var(--bg3);border-radius:5px;padding:1px 5px;font-size:11px;cursor:pointer;transition:all .08s;border:1px solid transparent;}
    .msg-reaction:hover{border-color:var(--b2);}
    .msg-reaction.me{background:var(--acd);border-color:var(--ac);}
    .typing-indicator{padding:3px 16px;font-size:10px;color:var(--t3);font-style:italic;height:20px;flex-shrink:0;}
    .input-area{padding:8px 16px 12px;background:var(--bg);border-top:1px solid var(--b);display:flex;gap:8px;align-items:center;flex-shrink:0;}
    .message-input{flex:1;background:var(--bg2);border:1px solid var(--b2);border-radius:20px;padding:9px 14px;color:var(--t1);font-size:12px;outline:none;transition:all var(--transition);font-family:var(--font);}
    .message-input:focus{border-color:var(--ac);box-shadow:0 0 0 2px var(--acg);}
    .message-input::placeholder{color:var(--t3);}
    .emoji-popup{position:absolute;bottom:60px;left:280px;background:var(--bg2);border-radius:12px;display:none;z-index:100;border:1px solid var(--b2);box-shadow:0 6px 24px rgba(0,0,0,.35);max-height:220px;overflow-y:auto;width:280px;padding:6px;}
    .emoji-popup.show{display:block;animation:fadeIn .12s ease;}
    .emoji-suggestions{display:flex;flex-wrap:wrap;gap:3px;}.emoji-suggestion{font-size:17px;cursor:pointer;padding:3px;border-radius:5px;}.emoji-suggestion:hover{background:var(--bg3);}
    .user-panel{width:var(--userpanel-w);background:var(--bg);border-left:1px solid var(--b);padding:12px;display:flex;flex-direction:column;gap:6px;flex-shrink:0;z-index:10;overflow-y:auto;}
    .user-profile{display:flex;gap:8px;align-items:center;padding-bottom:10px;border-bottom:1px solid var(--b);cursor:pointer;}
    .user-avatar{width:40px;height:40px;background:linear-gradient(135deg,var(--ac),var(--ac2));border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;color:#fff;position:relative;}
    .user-avatar .status-dot{position:absolute;bottom:-1px;right:-1px;width:10px;height:10px;border-radius:50%;border:2px solid var(--bg);}
    .status-dot.online{background:var(--gr);}.status-dot.idle{background:var(--ye);}.status-dot.dnd{background:var(--re);}.status-dot.offline{background:var(--t3);}
    .user-info{flex:1;}.user-name{font-weight:700;font-size:13px;}.user-status{font-size:9px;color:var(--t3);margin-top:1px;}
    .panel-btn{background:var(--bg2);border:none;padding:7px 9px;border-radius:7px;color:var(--t2);cursor:pointer;font-weight:500;display:flex;align-items:center;gap:8px;width:100%;transition:all .12s;font-size:12px;font-family:var(--font);}
    .panel-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;flex-shrink:0;}
    .panel-btn:hover,.panel-btn:focus-visible{background:var(--bg3);color:var(--t1);}
    .voice-bar{background:var(--bg2);border-radius:8px;padding:6px 8px;display:none;align-items:center;gap:7px;font-size:11px;font-weight:600;transition:opacity .15s;}
    .voice-bar.show{display:flex;}
    .voice-bar svg{width:16px;height:16px;stroke:var(--ac);}
    .voice-controls{display:flex;gap:4px;margin-left:auto;}
    .voice-btn{background:var(--bg3);border:none;width:26px;height:26px;border-radius:5px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .12s;}
    .voice-btn svg{width:13px;height:13px;stroke:var(--t2);}.voice-btn:hover,.voice-btn:focus-visible{background:var(--ac);}.voice-btn:hover svg,.voice-btn:focus-visible svg{stroke:#fff;}
    .voice-btn.muted{background:var(--re);}
    .modal{position:fixed;inset:0;background:rgba(0,0,0,.82);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:1000;display:none;animation:fadeIn .15s ease;}
    @supports not (backdrop-filter:blur(6px)){.modal{background:rgba(0,0,0,.9);}}
    .modal.show{display:flex;}
    .modal-box{background:var(--bg2);border-radius:16px;padding:20px;width:480px;max-width:94%;max-height:82vh;overflow-y:auto;overscroll-behavior:contain;}
    .modal-box h2{margin-bottom:14px;display:flex;align-items:center;gap:7px;font-size:16px;}
    .modal-input,.modal-select,.modal-textarea{width:100%;padding:9px 12px;background:var(--bg1);border:1px solid var(--b2);border-radius:8px;color:var(--t1);margin-bottom:10px;font-size:12px;font-family:var(--font);outline:none;}
    .modal-textarea{resize:vertical;min-height:50px;}
    .modal-input:focus,.modal-select:focus,.modal-textarea:focus{border-color:var(--ac);}
    .modal-btn{width:100%;padding:8px;background:var(--ac);border:none;border-radius:8px;color:#fff;font-weight:700;cursor:pointer;font-size:13px;font-family:var(--font);transition:all .12s;}
    .modal-btn:hover,.modal-btn:focus-visible{filter:brightness(1.07);}
    .modal-btn.secondary{background:var(--bg3);color:var(--t2);}.modal-btn.secondary:hover,.modal-btn.secondary:focus-visible{background:var(--acd);color:var(--t1);}
    .modal-btn.danger{background:var(--re);}
    .dm-item,.role-item,.user-item{display:flex;align-items:center;gap:8px;padding:8px;border-radius:7px;cursor:pointer;transition:all .12s;}
    .dm-item:hover,.role-item:hover,.user-item:hover{background:var(--bg3);}
    .dm-avatar{width:34px;height:34px;background:var(--acd);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:var(--ac3);flex-shrink:0;}
    .dm-info,.role-info,.user-item-info{flex:1;min-width:0;}.dm-name,.role-name{font-weight:600;font-size:12px;}.dm-last-msg,.role-desc{font-size:10px;color:var(--t3);}
    .context-menu{position:fixed;background:var(--bg2);border:1px solid var(--b2);border-radius:8px;padding:4px;z-index:2000;display:none;min-width:160px;box-shadow:0 6px 24px rgba(0,0,0,.45);}
    .context-menu.show{display:block;animation:fadeIn .08s ease;}
    .context-menu button{display:flex;align-items:center;gap:7px;width:100%;padding:7px 10px;background:none;border:none;color:var(--t2);cursor:pointer;border-radius:5px;font-size:11px;font-family:var(--font);}
    .context-menu button:hover{background:var(--bg3);color:var(--t1);}.context-menu button.danger{color:var(--re);}
    .toggle-switch{position:relative;width:38px;height:20px;background:var(--bg3);border-radius:10px;cursor:pointer;transition:all .15s;display:inline-block;}
    .toggle-switch.on{background:var(--ac);}
    .toggle-switch::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;background:#fff;border-radius:50%;transition:all .15s;}
    .toggle-switch.on::after{left:20px;}
    .toast{position:fixed;bottom:50px;right:14px;background:var(--bg2);padding:8px 14px;border-radius:8px;z-index:2000;border:1px solid var(--b2);font-size:12px;font-weight:600;animation:fadeIn .15s ease;transition:opacity .25s,transform .25s;max-width:280px;}
    .toast.hiding{opacity:0;transform:translateY(8px);}
    .empty-state{text-align:center;padding:24px;color:var(--t3);font-size:12px;}
    .empty-state svg{width:36px;height:36px;margin-bottom:8px;opacity:.4;stroke:var(--t3);}
    @media (max-width:768px){
      :root{--sidebar-w:250px;--userpanel-w:270px;}
      .server-rail{width:48px;}.server-icon{width:36px;height:36px;}.server-icon svg{width:17px;height:17px;}
      .channel-sidebar{position:absolute;left:-260px;top:0;bottom:0;height:100%;z-index:50;}.channel-sidebar.open{left:48px;box-shadow:4px 0 20px rgba(0,0,0,.45);}
      .user-panel{position:absolute;right:-280px;top:0;bottom:0;height:100%;z-index:50;}.user-panel.open{right:0;box-shadow:-4px 0 20px rgba(0,0,0,.45);}
      .emoji-popup{left:8px;right:8px;bottom:55px;width:auto;max-width:calc(100vw - 16px);}
      .modal-box{width:96%;max-height:88vh;border-radius:14px;padding:14px;}
      .input-area{padding:6px 10px 10px;gap:6px;}
      .message-input{padding:8px 12px;font-size:16px;}
      .messages-container{padding:8px 10px;}
      #dmModal .modal-box{width:98%;max-height:92vh;}
    }
  </style>
</head>

const DB = (()=>{
  const DB_NAME='getticDB',DB_VER=1;let db=null;
  const stores={state:'state',messages:'messages',cache:'cache'};
  async function open(){return new Promise((resolve,reject)=>{const req=indexedDB.open(DB_NAME,DB_VER);req.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains(stores.state))d.createObjectStore(stores.state);if(!d.objectStoreNames.contains(stores.messages))d.createObjectStore(stores.messages,{keyPath:'_id'});if(!d.objectStoreNames.contains(stores.cache))d.createObjectStore(stores.cache);};req.onsuccess=e=>{db=e.target.result;resolve(db);};req.onerror=()=>reject(req.error);});}
  async function get(store,key){if(!db)await open();return new Promise((resolve,reject)=>{const tx=db.transaction(store,'readonly');const req=key?tx.objectStore(store).get(key):tx.objectStore(store).getAll();req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);});}
  async function set(store,key,val){if(!db)await open();return new Promise((resolve,reject)=>{const tx=db.transaction(store,'readwrite');const os=tx.objectStore(store);if(typeof key==='string'||typeof key==='number'){os.put(val,key);}else{os.put(key);}tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error);});}
  async function del(store,key){if(!db)await open();return new Promise((resolve,reject)=>{const tx=db.transaction(store,'readwrite');tx.objectStore(store).delete(key);tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error);});}
  async function clear(store){if(!db)await open();return new Promise((resolve,reject)=>{const tx=db.transaction(store,'readwrite');tx.objectStore(store).clear();tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error);});}
  return{open,get,set,del,clear,stores};
})();

const API = (()=>{
  async function fetchWithTimeout(url,options={},timeout=CONFIG.FETCH_TIMEOUT){const ctrl=new AbortController();const id=setTimeout(()=>ctrl.abort(),timeout);try{const res=await fetch(url,{...options,signal:ctrl.signal});clearTimeout(id);return res;}catch(e){clearTimeout(id);throw e;}}
  async function request(url,options={},retries=2){for(let i=0;i<=retries;i++){try{const res=await fetchWithTimeout(url,options);if(res.status===401){const s=State.get();if(s.token)State.update('token',null);throw new Error('Unauthorized');}if(!res.ok)throw new Error(`HTTP ${res.status}`);return await res.json();}catch(e){if(i===retries)throw e;await new Promise(r=>setTimeout(r,1000*(i+1)));}}}
  return{request,fetchWithTimeout};
})();

const Auth = (()=>{
  let refreshTimer=null;
  function getToken(){return State.get().token||localStorage.getItem('gt_token');}
  async function login(username,password){const data=await API.request(`${CONFIG.API_URL}/api/auth/login`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})});State.update('token',data.token);State.update('user',data.user);localStorage.setItem('gt_token',data.token);localStorage.setItem('gt_user',JSON.stringify(data.user));startTokenRefresh();return data;}
  async function register(username,password){const data=await API.request(`${CONFIG.API_URL}/api/auth/register`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})});State.update('token',data.token);State.update('user',data.user);localStorage.setItem('gt_token',data.token);localStorage.setItem('gt_user',JSON.stringify(data.user));startTokenRefresh();return data;}
  function startTokenRefresh(){clearInterval(refreshTimer);refreshTimer=setInterval(()=>{const s=State.get();if(s.token&&s.user){API.request(`${CONFIG.API_URL}/api/auth/refresh`,{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${s.token}`}}).then(data=>{if(data?.token){State.update('token',data.token);localStorage.setItem('gt_token',data.token);}}).catch(()=>{});}},CONFIG.TOKEN_REFRESH_INTERVAL);}
  function logout(){clearInterval(refreshTimer);localStorage.clear();Object.keys(State.get()).forEach(k=>{if(typeof State.get()[k]!=='function'&&!(State.get()[k]instanceof Map)){if(Array.isArray(State.get()[k]))State.update(k,[]);else if(typeof State.get()[k]==='object')State.update(k,{});else State.update(k,null);}});State.update('user',null);State.update('token',null);State.update('socket',null);}
  return{getToken,login,register,startTokenRefresh,logout};
})();

function esc(s){if(!s)return'';return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[m]);}
function sanitize(h){if(!h)return'';const d=document.createElement('div');d.textContent=h;return d.innerHTML;}
function toast(msg,err=false){const old=document.querySelector('.toast');if(old){old.classList.add('hiding');setTimeout(()=>old.remove(),250);}const el=document.createElement('div');el.className='toast';el.style.color=err?'var(--re)':'var(--gr)';el.textContent=msg;el.setAttribute('role','status');document.body.appendChild(el);setTimeout(()=>{el.classList.add('hiding');setTimeout(()=>el.remove(),250);},2200);}
function t(k,p){let str=(L[State.get().lang]||L.tr)[k]||k;if(p)Object.entries(p).forEach(([k,v])=>str=str.replace(`{${k}}`,v));return str;}

function getHighestRole(uid){const s=State.get();const rids=s.userRoles[uid]||['r5'];let h=s.roles[s.roles.length-1];rids.forEach(rid=>{const r=s.roles.find(x=>x.id===rid);if(r&&r.position<h.position)h=r;});return h;}
function hasPermission(uid,perm){if(!uid)return false;const s=State.get();const rids=s.userRoles[uid]||['r5'];for(const rid of rids){const r=s.roles.find(x=>x.id===rid);if(r&&(r.permissions.all||r.permissions[perm]))return true;}return false;}

const SocketManager = (()=>{
  let reconnectAttempts=0;
  function connect(){const s=State.get();if(!s.token||reconnectAttempts>=CONFIG.MAX_RETRIES)return;if(s.socket){try{s.socket.removeAllListeners();s.socket.disconnect();}catch(e){}State.update('socket',null);}if(!navigator.onLine)return;
    try{const socket=io(CONFIG.API_URL,{auth:{token:s.token},transports:['websocket','polling'],reconnection:true,reconnectionAttempts:CONFIG.MAX_RETRIES,reconnectionDelay:CONFIG.RECONNECT_DELAY});socket.on('connect',()=>{reconnectAttempts=0;socket.emit('join_channel',s.channel.id);updateConnectionUI(true);});socket.on('new_message',msg=>{handleIncomingMessage(msg);});socket.on('user_typing',({username,channelId})=>{if(channelId===s.channel.id&&username!==s.user?.username)showTyping(username);});socket.on('voice_answer',async d=>{const pc=s.peerConnections.get(s.voiceChannelId);if(pc&&d.sdp)await pc.setRemoteDescription(new RTCSessionDescription(d.sdp));});socket.on('voice_candidate',d=>{const pc=s.peerConnections.get(s.voiceChannelId);if(pc&&d.candidate)pc.addIceCandidate(new RTCIceCandidate(d.candidate));});socket.on('disconnect',()=>{reconnectAttempts++;if(reconnectAttempts>=CONFIG.MAX_RETRIES)updateConnectionUI(false);});socket.on('connect_error',()=>{reconnectAttempts++;if(reconnectAttempts>=CONFIG.MAX_RETRIES)updateConnectionUI(false);});State.update('socket',socket);}catch(e){reconnectAttempts++;}
  }
  function handleIncomingMessage(msg){const s=State.get();const exists=s.messageDb.find(m=>m._id===msg._id&&m.senderId===msg.senderId);if(exists)return;s.messageDb.push(msg);if(s.messageDb.length>CONFIG.MAX_DB_SIZE)s.messageDb.splice(0,s.messageDb.length-CONFIG.MAX_DB_SIZE);State.persist();if(msg.channelId===s.channel.id)addMsgToDOM(msg);else{s.unreadCounts[msg.channelId]=(s.unreadCounts[msg.channelId]||0)+1;renderChannels();}if(msg.senderId!==s.user?._id){s.notifications.push({text:`${msg.senderName}: ${msg.content.substring(0,30)}`,time:new Date().toISOString()});State.persist();try{new Notification(msg.senderName,{body:msg.content.substring(0,40)});}catch(e){}}}
  function disconnect(){const s=State.get();if(s.socket){try{s.socket.removeAllListeners();s.socket.disconnect();}catch(e){}State.update('socket',null);}reconnectAttempts=0;}
  return{connect,disconnect};
})();

const VoiceManager = (()=>{
  async function join(channelId){const s=State.get();const ch=s.channels.find(c=>c.id===channelId);if(!ch)return;State.update('voiceChannelId',channelId);try{s.localStream=await navigator.mediaDevices.getUserMedia({audio:true});document.getElementById('voiceBar').classList.add('show');document.getElementById('voiceChannelName').textContent=ch.name;State.update('isInVoice',true);createPC(channelId);toast(`✅ ${ch.name}`);}catch(e){toast('Mikrofon izni gerekli',true);}}
  function createPC(channelId){const s=State.get();if(s.peerConnections.has(channelId)){s.peerConnections.get(channelId).close();s.peerConnections.delete(channelId);}const pc=new RTCPeerConnection(CONFIG.rtcConfig);s.peerConnections.set(channelId,pc);if(s.localStream)s.localStream.getTracks().forEach(t=>pc.addTrack(t,s.localStream));pc.onicecandidate=e=>{if(e.candidate&&s.socket)s.socket.emit('voice_candidate',{candidate:e.candidate,channel:channelId});};pc.ontrack=e=>{const a=document.createElement('audio');a.srcObject=e.streams[0];a.autoplay=true;document.body.appendChild(a);s.remoteAudioElements.push(a);document.getElementById('voiceParticipantCount').textContent=`(${s.remoteAudioElements.length})`;};if(s.socket)s.socket.emit('voice_join',{channel:channelId});pc.createOffer().then(o=>{pc.setLocalDescription(o);if(s.socket)s.socket.emit('voice_offer',{sdp:o,channel:channelId});}).catch(()=>{});}
  function toggleMute(){const s=State.get();if(!s.localStream)return;State.update('isMuted',!s.isMuted);s.localStream.getAudioTracks().forEach(t=>t.enabled=!s.isMuted);const b=document.getElementById('muteBtn');b.innerHTML=s.isMuted?I.micOff:I.mic;b.classList.toggle('muted',s.isMuted);}
  function toggleDeafen(){const s=State.get();State.update('isDeafened',!s.isDeafened);s.remoteAudioElements.forEach(a=>a.muted=s.isDeafened);document.getElementById('deafenBtn').classList.toggle('muted',s.isDeafened);}
  function leave(){const s=State.get();if(s.localStream){s.localStream.getTracks().forEach(t=>t.stop());State.update('localStream',null);}s.peerConnections.forEach(pc=>pc.close());s.peerConnections.clear();s.remoteAudioElements.forEach(a=>{a.srcObject=null;a.remove();});s.remoteAudioElements.length=0;if(s.socket)s.socket.emit('voice_leave',{channel:s.voiceChannelId});document.getElementById('voiceBar').classList.remove('show');State.update('isInVoice',false);State.update('isMuted',false);State.update('isDeafened',false);State.update('voiceChannelId',null);document.getElementById('muteBtn').innerHTML=I.mic;document.getElementById('muteBtn').classList.remove('muted');document.getElementById('deafenBtn').classList.remove('muted');document.getElementById('voiceParticipantCount').textContent='';}
  return{join,toggleMute,toggleDeafen,leave};
})();

function renderModals(){const s=State.get();return `<div id="serverSettingsModal" class="modal" role="dialog"><div class="modal-box"><h2>${I.settings} Sunucu</h2><input id="serverName" class="modal-input" value="${sanitize(s.serverSettings.name)}"><button class="modal-btn" onclick="saveServerSettings()">Kaydet</button></div></div><div id="profileModal" class="modal" role="dialog"><div class="modal-box"><h2>${I.user} Profil</h2><input id="profileDisplayName" class="modal-input" value="${sanitize(s.user?.username||'')}"><button class="modal-btn" onclick="saveProfile()">Kaydet</button></div></div><div id="themeSettingsModal" class="modal" role="dialog"><div class="modal-box"><h2>Tema</h2><div class="theme-option" onclick="setTheme('#b57bee','#c99df2')"><div style="width:24px;height:24px;border-radius:6px;background:#b57bee;"></div>Mor</div><div class="theme-option" onclick="setTheme('#6366f1','#818cf8')"><div style="width:24px;height:24px;border-radius:6px;background:#6366f1;"></div>Mavi</div><div class="theme-option" onclick="setTheme('#22c55e','#4ade80')"><div style="width:24px;height:24px;border-radius:6px;background:#22c55e;"></div>Yeşil</div><div class="theme-option" onclick="toggleLightMode()">${document.body.classList.contains('light')?I.moon:I.sun} Aydınlık/Karanlık</div></div></div><div id="addServerModal" class="modal"><div class="modal-box"><h2>${I.plus} Sunucu</h2><input id="newServerName" class="modal-input" placeholder="Sunucu adı"><button class="modal-btn" onclick="createServer()">Oluştur</button></div></div><div id="addChannelModal" class="modal"><div class="modal-box"><h2>${I.plus} Kanal</h2><input id="newChannelName" class="modal-input" placeholder="Kanal adı"><button class="modal-btn" onclick="createChannel()">Oluştur</button></div></div><div id="dmModal" class="modal"><div class="modal-box"><h2>💬 ${t('dm')}</h2><button class="modal-btn" onclick="openDMNew()">${I.plus} Yeni DM</button><div id="dmList"></div><div id="dmChatArea" style="display:none;"> function bindAuth(){
  document.getElementById('loginTab')?.addEventListener('click',()=>{document.getElementById('loginForm').style.display='block';document.getElementById('registerForm').style.display='none';});
  document.getElementById('registerTab')?.addEventListener('click',()=>{document.getElementById('loginForm').style.display='none';document.getElementById('registerForm').style.display='block';});
  document.getElementById('doLoginBtn')?.addEventListener('click',async()=>{const u=document.getElementById('loginUser')?.value.trim(),p=document.getElementById('loginPass')?.value;const err=document.getElementById('authError');if(!u||!p)return err.textContent='Tüm alanları doldurun';try{await Auth.login(u,p);document.getElementById('loadingScreen')?.classList.add('hide');renderApp();}catch(e){err.textContent=e.message;}});
  document.getElementById('doRegBtn')?.addEventListener('click',async()=>{const u=document.getElementById('regUser')?.value.trim(),p=document.getElementById('regPass')?.value;const err=document.getElementById('authError');if(!u||!p||u.length<3||p.length<6)return err.textContent='Geçersiz bilgiler';try{await Auth.register(u,p);document.getElementById('loadingScreen')?.classList.add('hide');renderApp();}catch(e){err.textContent=e.message;}});
}
function bindUI(){
  document.getElementById('sendBtn')?.addEventListener('click',sendMessage);
  document.getElementById('messageInput')?.addEventListener('keypress',e=>{if(e.key==='Enter')sendMessage();});
  document.getElementById('emojiBtn')?.addEventListener('click',()=>document.getElementById('emojiPopup')?.classList.toggle('show'));
  document.getElementById('logoutBtn')?.addEventListener('click',()=>{Auth.logout();SocketManager.disconnect();renderApp();});
  document.getElementById('serverSettingsBtn')?.addEventListener('click',()=>openModal('serverSettingsModal'));
  document.getElementById('profileBtn')?.addEventListener('click',()=>openModal('profileModal'));
  document.getElementById('themeSettingsBtn')?.addEventListener('click',()=>openModal('themeSettingsModal'));
  document.getElementById('dmBtn')?.addEventListener('click',()=>{openModal('dmModal');loadDMList();});
  document.getElementById('addFriendBtn')?.addEventListener('click',()=>openModal('addFriendModal'));
  document.getElementById('addServerBtn')?.addEventListener('click',()=>openModal('addServerModal'));
  document.getElementById('addCategoryBtn')?.addEventListener('click',()=>openModal('addCategoryModal'));
  document.getElementById('toggleSidebarBtn')?.addEventListener('click',()=>document.getElementById('channelSidebar')?.classList.toggle('open'));
  document.getElementById('toggleUserPanelBtn')?.addEventListener('click',()=>document.getElementById('userPanel')?.classList.toggle('open'));
  document.getElementById('rolesBtn')?.addEventListener('click',()=>{openModal('rolesModal');renderRoles();});
  document.getElementById('searchBtn')?.addEventListener('click',()=>openModal('searchModal'));
  document.getElementById('themeToggleBtn')?.addEventListener('click',toggleLightMode);
  document.getElementById('langBtn')?.addEventListener('click',()=>{const s=State.get();const nl=s.lang==='tr'?'en':'tr';State.update('lang',nl);localStorage.setItem('gt_lang',nl);renderApp();});
  document.getElementById('muteBtn')?.addEventListener('click',VoiceManager.toggleMute);
  document.getElementById('deafenBtn')?.addEventListener('click',VoiceManager.toggleDeafen);
  document.getElementById('leaveVoiceBtn')?.addEventListener('click',VoiceManager.leave);
  document.addEventListener('click',e=>{if(e.target.classList?.contains('modal')){document.querySelectorAll('.modal.show').forEach(m=>closeModal(m.id));}});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.querySelectorAll('.modal.show').forEach(m=>closeModal(m.id));document.getElementById('emojiPopup')?.classList.remove('show');}});
  document.addEventListener('keydown',e=>{if(e.ctrlKey&&e.key==='k'){e.preventDefault();openModal('searchModal');document.getElementById('searchInput')?.focus();}});
  window.addEventListener('online',()=>{updateConnectionUI(true);SocketManager.connect();});
  window.addEventListener('offline',()=>updateConnectionUI(false));
}

function updateConnectionUI(online){const bar=document.getElementById('connectionBar');const icon=document.getElementById('connectionIcon');if(online){bar.classList.remove('offline');bar.innerHTML='';if(icon)icon.innerHTML=I.wifi;}else{bar.classList.add('offline');bar.innerHTML=`${I.wifiOff} ${t('offline')} <button onclick="Window.retryConnection()">${t('retry')}</button>`;if(icon)icon.innerHTML=I.wifiOff;}}
function toggleLightMode(){const isLight=document.body.classList.toggle('light');localStorage.setItem('gt_light',isLight?'true':'false');const btn=document.getElementById('themeToggleBtn');if(btn)btn.innerHTML=isLight?I.sun:I.moon;renderApp();}
function setTheme(p,s){document.documentElement.style.setProperty('--ac',p);document.documentElement.style.setProperty('--ac2',s);localStorage.setItem('gt_theme_primary',p);localStorage.setItem('gt_theme_secondary',s);toast('Tema değişti');}
function loadTheme(){const p=localStorage.getItem('gt_theme_primary'),s=localStorage.getItem('gt_theme_secondary');if(p&&s){document.documentElement.style.setProperty('--ac',p);document.documentElement.style.setProperty('--ac2',s);}if(localStorage.getItem('gt_light')==='true')document.body.classList.add('light');}

function renderChannels(){const c=document.getElementById('channelCategories');if(!c)return;const s=State.get();let h='';s.categories.forEach(cat=>{h+=`<div class="channel-category">${cat}<button data-cat="${cat}">${I.plus}</button></div>`;s.channels.filter(ch=>ch.category===cat).forEach(ch=>{const icon=ch.type==='voice'?I.volume:I.hash;const cls=ch.id===s.channel.id?' active':'';const ur=s.unreadCounts[ch.id]||0;h+=`<div class="channel-item${cls}" data-id="${ch.id}" data-type="${ch.type}" tabindex="0"><span>${icon}</span>${sanitize(ch.name)}${ur>0?`<span class="unread-badge">${ur}</span>`:''}<span class="ch-actions"><button data-action="edit">${I.edit}</button><button data-action="delete">${I.trash}</button></span></div>`;});});c.innerHTML=h||`<div class="empty-channels">${t('noChannels')}</div>`;c.querySelectorAll('.channel-item').forEach(el=>{el.addEventListener('click',e=>{if(e.target.closest('.ch-actions'))return;if(el.dataset.type==='voice'){VoiceManager.join(el.dataset.id);return;}switchChannel(el.dataset.id);});});}
function switchChannel(id){const s=State.get();const ch=s.channels.find(c=>c.id===id);if(!ch)return;const container=document.getElementById('messagesContainer');if(container)s.channelScrollPositions[s.channel.id]=container.scrollTop;s.channel={id:ch.id,name:ch.name,topic:'Sohbet odası'};s.unreadCounts[ch.id]=0;State.persist();renderChannels();loadMessages();if(s.socket)s.socket.emit('join_channel',ch.id);if(s.isInVoice)VoiceManager.leave();}
function createChannel(){const n=document.getElementById('newChannelName')?.value.trim();if(!n)return;const s=State.get();const id=n.toLowerCase().replace(/\s+/g,'-').replace(/[^a-z0-9-]/g,'');if(s.channels.find(c=>c.id===id))return toast('Kanal var',true);s.channels.push({id,name:n,type:'text',category:'METİN'});State.persist();renderChannels();closeModal('addChannelModal');}
function createServer(){const n=document.getElementById('newServerName')?.value.trim();if(!n)return;const s=State.get();s.serverSettings.name=n;s.channels=[{id:'genel-sohbet',name:'genel-sohbet',type:'text',category:'METİN'},{id:'genel-ses',name:'Genel Ses',type:'voice',category:'SES'}];s.categories=['METİN','SES'];s.channel={id:'genel-sohbet',name:'genel-sohbet',topic:'Sohbet odası'};State.persist();renderChannels();loadMessages();closeModal('addServerModal');}
function saveServerSettings(){const s=State.get();s.serverSettings.name=document.getElementById('serverName')?.value||'Gettic';State.persist();closeModal('serverSettingsModal');}
function saveProfile(){const s=State.get();const n=document.getElementById('profileDisplayName')?.value;if(n&&s.user)s.user.username=n;State.persist();closeModal('profileModal');}

async function sendMessage(){
  const s=State.get();const inp=document.getElementById('messageInput');if(!inp)return;const c=inp.value.trim();if(!c)return;if(!hasPermission(s.user._id,'sendMsg'))return toast('Yetkiniz yok',true);inp.value='';
  const msg={_id:genId(),content:c,senderName:s.user.username,senderId:s.user._id,channelId:s.channel.id,createdAt:new Date().toISOString(),reactions:{}};
  s.messageDb.push(msg);if(s.messageDb.length>CONFIG.MAX_DB_SIZE)s.messageDb.splice(0,s.messageDb.length-CONFIG.MAX_DB_SIZE);State.persist();addMsgToDOM(msg);
  try{await API.request(`${CONFIG.API_URL}/api/channels/${s.channel.id}/messages`,{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${s.token}`},body:JSON.stringify({content:c})});}catch(e){}
  if(s.socket)s.socket.emit('send_message',msg);
}
function loadMessages(){const s=State.get();const inner=document.getElementById('messagesInner');const container=document.getElementById('messagesContainer');if(!inner)return;const msgs=s.messageDb.filter(m=>m.channelId===s.channel.id).slice(-CONFIG.MAX_VISIBLE_MSGS);if(!msgs.length){inner.innerHTML=`<div class="empty-channel">${I.hash}<h4># ${sanitize(s.channel.name)} ${t('birth')}</h4><p>${t('noMessages')}</p></div>`;return;}inner.innerHTML=(s.pinnedMessages[s.channel.id]?[renderMsgHTML(s.pinnedMessages[s.channel.id],true)]:[]).concat(msgs.map(m=>renderMsgHTML(m))).join('');if(s.channelScrollPositions[s.channel.id]){container.scrollTop=s.channelScrollPositions[s.channel.id];}else{container.scrollTop=container.scrollHeight;}}
function renderMsgHTML(m,isPinned=false){const s=State.get();if(s.blockedUsers.includes(m.senderId))return'';const role=getHighestRole(m.senderId||'');const badge=role&&role.id!=='r5'?`<span class="role-badge" style="background:${role.color}20;color:${role.color};">${role.name}</span>`:'';const reacts=m.reactions||{};const rHtml=Object.entries(reacts).map(([e,u])=>`<span class="msg-reaction ${u.includes(s.user?._id)?'me':''}">${e} ${u.length}</span>`).join('');const time=new Date(m.createdAt).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});const isOwner=m.senderId===s.user?._id||hasPermission(s.user._id,'deleteMsg');return `<div class="message" data-id="${m._id}"${isPinned?' style="background:var(--acd);border-left:3px solid var(--ye);"':''}><div class="message-avatar">${sanitize(m.senderName?.charAt(0)?.toUpperCase()||'?')}</div><div class="message-content"><div class="message-header"><span>${sanitize(m.senderName||'?')}</span>${badge}<span>${time}</span></div><div class="message-text">${sanitize(m.content).replace(/\*\*(.*?)\*\*/g,'<b>$1</b>').replace(/\*(.*?)\*/g,'<i>$1</i>').replace(/`([^`]+)`/g,'<code>$1</code>')}</div>${rHtml?`<div class="msg-reactions">${rHtml}</div>`:''}</div>${isOwner?`<div class="msg-actions"><button onclick="deleteMessage('${m._id}')">${I.trash}</button><button onclick="pinMessage('${m._id}')">${I.pin}</button></div>`:''}</div>`;}
function addMsgToDOM(msg){const inner=document.getElementById('messagesInner');if(!inner)return;if(inner.querySelector('.empty-channel'))inner.innerHTML='';const atBottom=(document.getElementById('messagesContainer').scrollHeight-document.getElementById('messagesContainer').scrollTop-document.getElementById('messagesContainer').clientHeight)<100;inner.insertAdjacentHTML('beforeend',renderMsgHTML(msg));if(atBottom)document.getElementById('messagesContainer').scrollTop=document.getElementById('messagesContainer').scrollHeight;while(inner.children.length>CONFIG.MAX_VISIBLE_MSGS*1.5)inner.firstChild.remove();}
function deleteMessage(mid){const s=State.get();if(!hasPermission(s.user._id,'deleteMsg')&&s.messageDb.find(m=>m._id===mid)?.senderId!==s.user?._id)return toast('Yetkiniz yok',true);s.messageDb=s.messageDb.filter(m=>m._id!==mid);State.persist();loadMessages();}
function pinMessage(mid){const s=State.get();const msg=s.messageDb.find(m=>m._id===mid);if(!msg)return;s.pinnedMessages[s.channel.id]=msg;State.persist();loadMessages();}
let typingTimer;function showTyping(u){const el=document.getElementById('typingIndicator');if(el){el.textContent=`${u} ${t('typing')}`;clearTimeout(typingTimer);typingTimer=setTimeout(()=>{if(el)el.textContent='';},1500);}}

function renderRoles(){const c=document.getElementById('rolesList');if(!c)return;const s=State.get();c.innerHTML=s.roles.sort((a,b)=>a.position-b.position).map(r=>`<div class="role-item"><div style="width:20px;height:20px;border-radius:50%;background:${r.color};"></div><div class="role-info"><div class="role-name">${sanitize(r.name)}</div></div><button onclick="openEditRole('${r.id}')">${I.edit}</button></div>`).join('');}
function openEditRole(id){const s=State.get();const r=s.roles.find(x=>x.id===id);if(!r)return;document.getElementById('editRoleId').value=r.id;document.getElementById('editRoleName').value=r.name;document.getElementById('editRoleColor').value=r.color;const p=['sendMsg','deleteMsg','kick','ban','manageChannels','manageRoles'];document.getElementById('rolePerms').innerHTML=p.map(x=>`<div style="display:flex;justify-content:space-between;padding:4px 0;"><span>${x}</span><div class="toggle-switch ${r.permissions[x]||r.permissions.all?'on':''}" data-p="${x}" onclick="this.classList.toggle('on')"></div></div>`).join('');openModal('editRoleModal');}
function saveRoleEdit(){const s=State.get();const id=document.getElementById('editRoleId').value;const r=s.roles.find(x=>x.id===id);if(!r)return;r.name=document.getElementById('editRoleName').value;r.color=document.getElementById('editRoleColor').value;r.permissions={};document.querySelectorAll('#rolePerms .toggle-switch').forEach(t=>r.permissions[t.dataset.p]=t.classList.contains('on'));State.persist();closeModal('editRoleModal');renderRoles();}
function addRole(){const s=State.get();const n=document.getElementById('newRoleName')?.value.trim(),c=document.getElementById('newRoleColor')?.value||'#9ca3af';if(!n)return;s.roles.push({id:genId(),name:n,color:c,permissions:{sendMsg:true},position:s.roles.length});State.persist();closeModal('addRoleModal');renderRoles();}

function loadDMList(){const c=document.getElementById('dmList');if(!c)return;const s=State.get();c.innerHTML=s.dmFriends.length?s.dmFriends.map(f=>`<div class="dm-item" onclick="openDM('${f.id}','${sanitize(f.username)}')"><div class="dm-avatar">${sanitize(f.username.charAt(0).toUpperCase())}</div><div class="dm-info"><div class="dm-name">${sanitize(f.username)}</div></div></div>`).join(''):`<div class="empty-state">${t('noDM')}</div>`;}
function openDMNew(){closeModal('dmModal');openModal('dmNewModal');}
function startDM(){const u=document.getElementById('dmNewUsername')?.value.trim();if(!u)return;const s=State.get();s.dmFriends.push({id:genId(),username:u,messages:[],time:'Şimdi'});State.persist();loadDMList();closeModal('dmNewModal');openModal('dmModal');}
window.openDM=(id,uname)=>{const s=State.get();const f=s.dmFriends.find(x=>x.id===id);if(!f)return;s.dmUnread[id]=0;State.persist();document.getElementById('dmChatArea').style.display='block';const d=document.getElementById('dmMessages');d.innerHTML=(f.messages||[]).map(m=>`<div style="font-size:11px;"><b>${sanitize(m.sender||'?')}:</b> ${sanitize(m.text)}</div>`).join('');document.getElementById('sendDmBtn').onclick=()=>{const inp=document.getElementById('dmInput');if(!inp?.value.trim())return;const msg={sender:s.user?.username||'Sen',text:inp.value,time:new Date().toISOString()};f.messages.push(msg);f.last=msg.text;f.time='Şimdi';State.persist();d.innerHTML+=`<div style="font-size:11px;"><b>${sanitize(msg.sender)}:</b> ${sanitize(msg.text)}</div>`;d.scrollTop=d.scrollHeight;inp.value='';};};
function addFriend(){const u=document.getElementById('friendUsername')?.value.trim();if(!u)return;const s=State.get();s.dmFriends.push({id:genId(),username:u,messages:[],time:'Şimdi'});State.persist();closeModal('addFriendModal');}

function init(){
  const scrollbarW=window.innerWidth-document.documentElement.clientWidth;document.documentElement.style.setProperty('--scrollbar-w',scrollbarW+'px');
  setTimeout(()=>document.getElementById('loadingScreen')?.classList.add('hide'),500);
  const stored=localStorage.getItem('gt_user');const token=localStorage.getItem('gt_token');
  if(stored&&token){try{const u=JSON.parse(stored);const s=State.get();s.user=u;s.token=token;if(!s.userRoles[u._id]){s.userRoles[u._id]=['r5'];State.persist();}}catch(e){}}
  State.loadFromDB().then(()=>{renderApp();loadTheme();});

  if('serviceWorker' in navigator){navigator.serviceWorker.register("data:application/javascript,self.addEventListener('install',e=>{self.skipWaiting();});self.addEventListener('activate',e=>{e.waitUntil(clients.claim());});self.addEventListener('fetch',e=>{e.respondWith(fetch(e.request).then(r=>{const clone=r.clone();caches.open('gettic-v1').then(c=>c.put(e.request,clone));return r;}).catch(()=>caches.match(e.request)));});").catch(()=>{});}
