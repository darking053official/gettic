            function t(k) { return (L[G().lang] || L.tr)[k] || k; }

                    channels: [

                    ],
                    categories: ['METİN', 'SES'],

                        { id: 'r4', name: 'Üye', color: '#9ca3af', permissions: { sendMsg: true, addReactions: true }, position: 3 }

                    userRoles: {},

                    dmUnread: {},
                    offlineQueue: [],
                    channelScrollPositions: {},
                    captchaVerified: false,
                    userStatus: 'online',
                };
                let s = { ...defaults, peerConnections: new Map() };
                return {
                    get: () => s,
                    update: (k, v) => { s[k] = v; },
                    reset: () => { const token = s.token;
                        s = { ...defaults, peerConnections: new Map() };
                        s.token = token; },
                    persist: () => {
                        try {
                            const safe = {};
                            for (const k of Object.keys(s)) { if (s[k] instanceof Map || s[k] instanceof MediaStream || k === 'socket') continue;
                                safe[k] = s[k]; }
                            localStorage.setItem('gt_state', JSON.stringify(safe));
                        } catch (e) {}
                    }
                };
            })();

            function G() { return S.get(); }

            /* ===== HELPERS ===== */
            function esc(s) { if (!s) return ''; return String(s).replace(/[&<>"]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[m]); }

            function sanitize(h) { const d = document.createElement('div');
                d.textContent = h; return d.innerHTML; }

            function genId() { return Date.now().toString(36) + Math.random().toString(36).substr(2, 7); }

            function toast(msg, type = 's') {
                const old = document.querySelector('.toast');
                if (old) { old.classList.add('out');
                    setTimeout(() => old.remove(), 200); }
                const el = document.createElement('div');
                el.className = `toast ${type}`;
                el.textContent = msg;
                el.setAttribute('role', 'status');
                el.setAttribute('aria-live', 'polite');
                document.body.appendChild(el);
                setTimeout(() => { el.classList.add('out');
                    setTimeout(() => el.remove(), 200); }, 2500);
            }

            function openModal(id) {
                const el = document.getElementById(id);
                if (!el) return;
                el.classList.add('show');
                el.setAttribute('aria-modal', 'true');
                const inp = el.querySelector('input:not([type=hidden]),textarea');
                if (inp) setTimeout(() => inp.focus(), 80);
            }

            function closeModal(id) {
                const el = document.getElementById(id);
                if (el) { el.classList.remove('show');
                    el.removeAttribute('aria-modal'); }
            }

            function closeAllModals() { document.querySelectorAll('.modal.show').forEach(m => m.classList.remove('show')); }

            function getHighestRole(uid) {
                const s = G();
                const rids = s.userRoles[uid] || ['r4'];
                let h = s.roles[s.roles.length - 1];
                rids.forEach(rid => { const r = s.roles.find(x => x.id === rid); if (r && r.position < h.position) h = r; });
                return h;
            }

            function hasPermission(uid, perm) {
                if (!uid) return false;
                const s = G();
                const rids = s.userRoles[uid] || ['r4'];
                for (const rid of rids) { const r = s.roles.find(x => x.id === rid); if (r && (r.permissions.all || r.permissions[perm])) return true; }
                return false;
            }

            function debounce(fn, ms) { let t; return (...args) => { clearTimeout(t);
                    t = setTimeout(() => fn(...args), ms); }; }

            /* ===== CAPTCHA ===== */
            let _captchaCode = '';

            function generateCaptcha() { return Math.random().toString(36).substring(2, 6).toUpperCase(); }

            function drawCaptcha(canvas) {
                const ctx = canvas.getContext('2d'),
                    w = canvas.width,
                    h = canvas.height;
                ctx.fillStyle = '#faf6f0';
                ctx.fillRect(0, 0, w, h);
                for (let i = 0; i < 5; i++) { ctx.beginPath();
                    ctx.moveTo(Math.random() * w, Math.random() * h);
                    ctx.lineTo(Math.random() * w, Math.random() * h);
                    ctx.strokeStyle = `rgba(201,77,140,${Math.random()*.3+.08})`;
                    ctx.lineWidth = Math.random() * 2 + .5;
                    ctx.stroke(); }
                for (let i = 0; i < 25; i++) { ctx.beginPath();
                    ctx.arc(Math.random() * w, Math.random() * h, Math.random() * 2, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(0,0,0,${Math.random()*.15+.03})`;
                    ctx.fill(); }
                ctx.textBaseline = 'middle';
                _captchaCode.split('').forEach((c, i) => { const x = w / 5 * (i + .7),
                        y = h / 2 + Math.random() * 8 - 4;
                    ctx.save();
                    ctx.translate(x, y);
                    ctx.rotate(Math.random() * .4 - .2);
                    ctx.font = `bold ${28+Math.random()*4}px "Courier New",monospace`;
                    ctx.fillStyle = `hsl(${330+Math.random()*30},60%,${40+Math.random()*20}%)`;
                    ctx.fillText(c, 0, 0);
                    ctx.restore(); });
            }

            function showCaptcha(callback) {
                _captchaCode = generateCaptcha();
                const overlay = document.getElementById('captchaOverlay');
                overlay.innerHTML = `<div class="cap-box"><img src="https://raw.githubusercontent.com/darking053official/gettic/main/1777062266055.png" class="cap-logo" alt="Gettic"><div class="cap-title">${t('captchaTitle')}</div><div class="cap-sub">${t('captchaSub')}</div><canvas id="cCvs" class="cap-cvs" width="240" height="72"></canvas><input type="text" id="cInp" class="cap-inp" placeholder="${t('captchaPlaceholder')}" maxlength="4" autocomplete="off" spellcheck="false"><button id="cBtn" class="cap-btn">${t('captchaBtn')}</button><div id="cErr" class="cap-err"></div><span id="cRef" class="cap-ref">${t('captchaRefresh')}</span></div>`;
                overlay.style.display = 'flex';
                setTimeout(() => drawCaptcha(document.getElementById('cCvs')), 50);
                const verify = () => { const v = (document.getElementById('cInp')?.value || '').toUpperCase(); if (v === _captchaCode) { overlay.style.display = 'none';
                        S.update('captchaVerified', true); if (callback) callback(); } else { document.getElementById('cErr').textContent = t('captchaError');
                        _captchaCode = generateCaptcha();
                        drawCaptcha(document.getElementById('cCvs'));
                        document.getElementById('cInp').value = ''; } };
                document.getElementById('cBtn').onclick = verify;
                document.getElementById('cInp').onkeypress = e => { if (e.key === 'Enter') verify(); };
                document.getElementById('cRef').onclick = () => { _captchaCode = generateCaptcha();
                    drawCaptcha(document.getElementById('cCvs'));
                    document.getElementById('cInp').value = '';
                    document.getElementById('cErr').textContent = ''; };
            }

            /* ===== THREE.JS ===== */
            let _ts, _tc, _tr, _tp, _tl;

            function initThreeJS() {
                _ts = new THREE.Scene();
                _tc = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, .1, 1000);
                _tc.position.z = 30;
                _tr = new THREE.WebGLRenderer({ canvas: document.getElementById('bgc'), alpha: true, antialias: false });
                _tr.setSize(innerWidth, innerHeight);
                _tr.setPixelRatio(Math.min(devicePixelRatio, 1.5));
                const count = innerWidth < 600 ? 350 : 600;
                const geo = new THREE.BufferGeometry();
                const pos = new Float32Array(count * 3),
                    col = new Float32Array(count * 3);
                for (let i = 0; i < count * 3; i += 3) { pos[i] = (Math.random() - .5) * 60;
                    pos[i + 1] = (Math.random() - .5) * 40;
                    pos[i + 2] = (Math.random() - .5) * 30;
                    col[i] = .6 + Math.random() * .4;
                    col[i + 1] = .2 + Math.random() * .2;
                    col[i + 2] = .5 + Math.random() * .3; }
                geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
                geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
                const mat = new THREE.PointsMaterial({ size: .09, vertexColors: true, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, opacity: .5 });
                _tp = new THREE.Points(geo, mat);
                _ts.add(_tp);
                _ts.add(new THREE.AmbientLight(0x443355, .4));
                const p1 = new THREE.PointLight(0xc94d8c, .8, 50);
                p1.position.set(10, 5, 15);

                const p2 = new THREE.PointLight(0xd4689e, .6, 40);
                p2.position.set(-10, -5, 10);

                _tl = [p1, p2];

            function animateThreeJS() { requestAnimationFrame(animateThreeJS);
                _tp.rotation.y += .00015;
                _tp.rotation.x += .00008;
                const t = Date.now() * .001;

            /* ===== SOCKET ===== */
            let _socketAttempts = 0;
            const Socket = { connect() { const s = G(); if (!s.token || _socketAttempts >= MAX_RETRIES) return; if (s.socket) { try { s.socket.removeAllListeners();
                            s.socket.disconnect(); } catch (e) {} S.update('socket', null); } if (!navigator.onLine) return; try { const sock = io(API, { auth: { token: s.token }, transports: ['websocket', 'polling'], reconnection: true, reconnectionAttempts: MAX_RETRIES, reconnectionDelay: 2000 });
                        sock.on('connect', () => { _socketAttempts = 0;
                            sock.emit('join_channel', s.channel.id);
                            updateConnUI(true);
                            this._flushQueue(); });
                        sock.on('new_message', msg => { const s2 = G(); if (s2.messageDb.find(m => m._id === msg._id && m.senderId === msg.senderId)) return;
                            s2.messageDb.push(msg); if (s2.messageDb.length > MAX_DB) s2.messageDb.splice(0, s2.messageDb.length - MAX_DB);
                            S.persist(); if (msg.channelId === s2.channel.id) addMsgToDOM(msg); else { s2.unreadCounts[msg.channelId] = (s2.unreadCounts[msg.channelId] || 0) + 1;
                                renderChannels(); } if (msg.senderId !== s2.user?._id) { s2.notifications.push({ text: `${esc(msg.senderName)}: ${msg.content.substring(0,40)}`, time: new Date().toISOString() });
                                S.persist(); try { new Notification(msg.senderName, { body: msg.content.substring(0, 50) }); } catch (e) {} }
                            playSound(); });
                        sock.on('user_typing', ({ username, channelId }) => { const s2 = G(); if (channelId === s2.channel.id && username !== s2.user?.username) showTyping(username); });
                        sock.on('voice_answer', async d => { const pc = G().peerConnections.get(G().voiceChannelId); if (pc && d.sdp) await pc.setRemoteDescription(new RTCSessionDescription(d.sdp)); });
                        sock.on('voice_candidate', d => { const pc = G().peerConnections.get(G().voiceChannelId); if (pc && d.candidate) pc.addIceCandidate(new RTCIceCandidate(d.candidate)); });
                        sock.on('disconnect', () => { _socketAttempts++; if (_socketAttempts >= MAX_RETRIES) updateConnUI(false); });
                        sock.on('connect_error', () => { _socketAttempts++; if (_socketAttempts >= MAX_RETRIES) updateConnUI(false); });
                        S.update('socket', sock); } catch (e) { _socketAttempts++; } }, disconnect() { const s = G(); if (s.socket) { try { s.socket.removeAllListeners();
                        s.socket.disconnect(); } catch (e) {} S.update('socket', null); }
                    _socketAttempts = 0; }, _flushQueue() { const s = G(); if (!s.offlineQueue.length) return;
                    s.offlineQueue.forEach(msg => { if (s.socket) s.socket.emit('send_message', msg); });
                    s.offlineQueue = [];
                    S.persist(); } };

            function updateConnUI(online) { const bar = document.getElementById('connbar'); const icon = document.getElementById('connIcon'); if (!bar) return; if (online) { bar.classList.remove('show'); if (icon) { icon.innerHTML = I.wifi;
                        icon.title = 'Bağlı'; } } else { bar.classList.add('show');
                    bar.innerHTML = `${I.wifiOff} ${t('offline')} <button onclick="retryConn()">${t('retry')}</button>`; if (icon) { icon.innerHTML = I.wifiOff;
                        icon.title = 'Bağlantı yok'; } } }
            window.retryConn = function() { _socketAttempts = 0;
                Socket.connect();

            function playSound() { try { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return; const ctx = new AC(); if (ctx.state === 'suspended') ctx.resume(); const o = ctx.createOscillator(),
                        g = ctx.createGain();
                    o.connect(g);
                    g.connect(ctx.destination);
                    o.frequency.value = 820;
                    g.gain.value = .015;
                    o.start();
                    o.stop(ctx.currentTime + .05);
                    setTimeout(() => ctx.close(), 200); } catch (e) {} }

            function showTyping(u) { const el = document.getElementById('typing'); if (el) { el.innerHTML = `${esc(u)} ${t('typing')} <span class="tdots"><span></span><span></span><span></span></span>`;

            const Voice = { async join(channelId) { const s = G(); const ch = s.channels.find(c => c.id === channelId); if (!ch) return;
                    S.update('voiceChannelId', channelId); try { const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                        S.update('localStream', stream);
                        document.getElementById('vbar')?.classList.add('show');

                        S.update('isInVoice', true);
                        this._createPC(channelId);
                        toast(`🔊 ${ch.name}`); } catch (e) { toast('Mikrofon izni gerekli', 'e'); } }, _createPC(channelId) { const s = G(); if (s.peerConnections.has(channelId)) { s.peerConnections.get(channelId).close();
                        s.peerConnections.delete(channelId); } const pc = new RTCPeerConnection(rtcCfg);
                    s.peerConnections.set(channelId, pc); if (s.localStream) s.localStream.getTracks().forEach(t => pc.addTrack(t, s.localStream));
                    pc.onicecandidate = e => { if (e.candidate && s.socket) s.socket.emit('voice_candidate', { candidate: e.candidate, channel: channelId }); };
                    pc.ontrack = e => { const a = document.createElement('audio');
                        a.srcObject = e.streams[0];
                        a.autoplay = true;
                        a.volume = .8;

                        s.remoteAudioElements.push(a); }; if (s.socket) s.socket.emit('voice_join', { channel: channelId });
                    pc.createOffer().then(o => { pc.setLocalDescription(o); if (s.socket) s.socket.emit('voice_offer', { sdp: o, channel: channelId }); }).catch(() => {}); }, toggleMute() { const s = G(); if (!s.localStream) return; const muted = !s.isMuted;

                    const b = document.getElementById('muteBtn'); if (b) { b.innerHTML = muted ? I.micOff : I.mic;
                        b.classList.toggle('muted', muted); } }, toggleDeafen() { const s = G(); const deaf = !s.isDeafened;
                    S.update('isDeafened', deaf);

                    document.getElementById('deafenBtn')?.classList.toggle('muted', deaf); }, leave() { const s = G(); if (s.localStream) { s.localStream.getTracks().forEach(t => t.stop());
                        S.update('localStream', null); }
                    s.peerConnections.forEach(pc => pc.close());
                    s.peerConnections.clear();
                    s.remoteAudioElements.forEach(a => { a.srcObject = null; try { a.remove(); } catch (e) {} });
                    s.remoteAudioElements.length = 0; if (s.socket) s.socket.emit('voice_leave');
                    document.getElementById('vbar')?.classList.remove('show');

            async function doAuth(type) { const isL = type === 'login'; const u = document.getElementById(isL ? 'loginUser' : 'regUser')?.value.trim(); const p = document.getElementById(isL ? 'loginPass' :

            function renderMsg(m, isPinned = false) { const s = G(); if (s.blockedUsers.includes(m.senderId)) return ''; const role =

            function renderRoles() { const c = document.getElementById('rolesList'); if (!c) return; const s = G();
                c.innerHTML = s.roles.sort((a, b) => a.position - b.position).map(r => `
                  <div class="mitem"><div style="width:22px;height:22px;border-radius:6px;background:${r.color};flex-shrink:0;"></div><div class="minfo"><div class="mname">${esc(r.name)}</div><div class="msub">${r.permissions.all?'Tüm yetkiler':Object.keys(r.permissions).filter(k=>r.permissions[k]).join(', ')}</div></div><button class="ib" onclick="openEditRole('${r.id}')" title="Düzenle">${I.edit}</button></div>`)
                    .join(''); }
            window.openEditRole = function(id) { const s = G(); const r = s.roles.find(x => x.id === id); if (!r) return;
                document.getElementById('editRoleId').value = r.id;
                document.getElementById('editRoleName').value = r.name;
                document.getElementById('editRoleColor').value = r.color; const perms = ['sendMsg', 'deleteMsg', 'kick', 'ban',
                    'manageChannels', 'manageRoles', 'manageServer'
                ]; const permLabels = { sendMsg: 'Mesaj Gönder', deleteMsg: 'Mesaj Sil', kick: 'Kullanıcı At', ban: 'Kullanıcı Banla',
                    manageChannels: 'Kanalları Yönet', manageRoles: 'Rolleri Yönet', manageServer: 'Sunucuyu Yönet' };
                document.getElementById('rolePerms').innerHTML = perms.map(p => `
                  <div class="prow"><div class="prow-l">${permLabels[p]||p}</div><div class="toggle${(r.permissions[p]||r.permissions.all)?' on':''}" data-p="${p}" onclick="this.classList.toggle('on')" role="switch"></div></div>`)
                    .join('');
                openModal('editRoleModal'); };
            window.saveRoleEdit = function() { const s = G(); const id = document.getElementById('editRoleId')?.value; const r = s.roles
                    .find(x => x.id === id); if (!r) return;
                r.name = document.getElementById('editRoleName')?.value.trim() || r.name;
                r.color = document.getElementById('editRoleColor')?.value || r.color;
                r.permissions = {};
                document.querySelectorAll('#rolePerms .toggle').forEach(ts => r.permissions[ts.dataset.p] = ts.classList.contains(
                    'on'));
                S.persist();
                closeModal('editRoleModal');
                renderRoles();
                toast('Rol güncellendi'); };
            window.addRole = function() { const s = G(); const n = document.getElementById('newRoleName')?.value.trim(); if (!n)
                    return; const c = document.getElementById('newRoleColor')?.value || '#9ca3af';
                s.roles.push({ id: genId(), name: n, color: c, permissions: { sendMsg: true }, position: s.roles.length });
                S.persist();
                closeModal('addRoleModal');
                renderRoles();
                toast('Rol eklendi'); };

            /* ===== USER INFO ===== */
            function showUserInfo(uid, uname) { const s = G(); if (uid === s.user?._id) { openModal('profileModal'); return; } const
                    isBlocked = s.blockedUsers.includes(uid); const role = getHighestRole(uid);
                document.getElementById('userInfoContent').innerHTML = `
                  <div style="text-align:center;padding:14px 0;">
                    <div style="width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--ac2));display:inline-flex;align-items:center;justify-content:center;font-size:22px;color:#fff;font-weight:800;margin-bottom:10px;">${esc(uname.charAt(0).toUpperCase())}</div>
                    <h3 style="margin-bottom:4px;font-size:16px;">${esc(uname)}</h3>
                    <div style="display:inline-block;padding:2px 8px;border-radius:5px;font-size:10px;font-weight:700;background:${role.color}20;color:${role.color};margin-bottom:14px;">${esc(role.name)}</div>
                    <div style="display:flex;gap:8px;flex-direction:column;">
                      <button class="mb sec" onclick="openDMDirect('${uid}','${esc(uname)}')">${I.dm} Mesaj Gönder</button>
                      <button class="mb ${isBlocked?'':'danger'}" onclick="toggleBlockUser('${uid}')">${isBlocked?t('unblock'):t('block')}</button>
                    </div>
                  </div>`;
                openModal('userInfoModal'); }
            window.showUserInfo = showUserInfo;
            window.toggleBlockUser = function(uid) { const s = G(); if (s.blockedUsers.includes(uid)) s.blockedUsers = s.blockedUsers
                    .filter(u => u !== uid); else s.blockedUsers.push(uid);
                S.persist();
                loadMessages();
                closeModal('userInfoModal');
                toast(s.blockedUsers.includes(uid) ? 'Engellendi' : 'Engel kaldırıldı'); };
            window.openDMDirect = function(uid, uname) { closeModal('userInfoModal'); const s = G(); if (!s.dmFriends.find(f => f.id ===
                    uid)) s.dmFriends.push({ id: uid, username: uname, messages: [], time: 'Şimdi' });
                S.persist();
                openModal('dmModal');
                loadDMList();
                openDM(uid, uname); };

            /* ===== DM ===== */
            function loadDMList() { const c = document.getElementById('dmList'); if (!c) return; const s = G();
                c.innerHTML = s.dmFriends.length ? s.dmFriends.map(f => `
                  <div class="mitem" onclick="openDM('${esc(f.id)}','${esc(f.username)}')">
                    <div class="mav">${esc(f.username.charAt(0).toUpperCase())}</div>
                    <div class="minfo"><div class="mname">${esc(f.username)}</div><div class="msub">${esc(f.last||'DM başlat')}</div></div>
                    ${(s.dmUnread[f.id]||0)>0?`<span class="ub">${s.dmUnread[f.id]}</span>`:''}
                  </div>`).join('') :
                    `<div class="empty-ch">${I.dm}${t('noDM')}</div>`; }
            window.openDMNew = function() { closeModal('dmModal');
                openModal('dmNewModal'); };
            window.startDM = function() { const s = G(); const u = document.getElementById('dmNewUsername')?.value.trim(); if (!u)
                    return; if (!s.dmFriends.find(f => f.username === u)) s.dmFriends.push({ id: genId(), username: u,
                    messages: [], time: 'Şimdi' });
                S.persist();
                closeModal('dmNewModal');
                openModal('dmModal');
                loadDMList(); };
            window.openDM = function(id, uname) { const s = G(); const f = s.dmFriends.find(x => x.id === id); if (!f) return;
                s.dmUnread[id] = 0;
                S.persist();
                document.getElementById('dmChatArea').style.display = 'block';
                document.getElementById('dmChatTitle').textContent = `💬 ${uname}`; const d = document.getElementById('dmMessages'); if (
                    !d) return;
                d.innerHTML = (f.messages || []).map(m =>
                    `<div style="font-size:11px;padding:2px 0;"><b style="color:var(--t1);">${esc(m.sender||'?')}</b><span style="color:var(--t3);font-size:9px;margin:0 5px;">${new Date(m.time||0).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'})}</span>${esc(m.text)}</div>`
                    ).join('');
                d.scrollTop = d.scrollHeight;
                document.getElementById('sendDmBtn').onclick = () => { const inp = document.getElementById('dmInput'); if (!inp?.value
                        .trim()) return; const msg = { sender: s.user?.username || 'Sen', text: inp.value.trim(),
                        time: new Date().toISOString() };
                    f.messages.push(msg);
                    f.last = msg.text;
                    f.time = 'Şimdi';
                    S.persist();
                    d.insertAdjacentHTML('beforeend',
                        `<div style="font-size:11px;padding:2px 0;"><b style="color:var(--t1);">${esc(msg.sender)}</b><span style="color:var(--t3);font-size:9px;margin:0 5px;">${new Date(msg.time).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'})}</span>${esc(msg.text)}</div>`
                        );
                    d.scrollTop = d.scrollHeight;
                    inp.value = ''; if (s.socket) s.socket.emit('dm_message', { to: id, text: msg.text,
                        sender: s.user.username }); };
                document.getElementById('dmInput').onkeypress = e => { if (e.key === 'Enter') document.getElementById('sendDmBtn')
                        .click(); }; };
            window.addFriend = function() { const s = G(); const u = document.getElementById('friendUsername')?.value.trim(); if (!u)
                    return; if (s.dmFriends.find(f => f.username === u)) return toast('Zaten ekli', 'e');
                s.dmFriends.push({ id: genId(), username: u, messages: [], time: 'Şimdi' });
                S.persist();
                closeModal('addFriendModal');
                toast(`${u} eklendi`); };

            /* ===== SEARCH ===== */
            function performSearch() { const q = document.getElementById('searchInput')?.value.toLowerCase().trim(); const r = document
                    .getElementById('searchResults'); if (!r) return; if (!q || q.length < 2) { r.innerHTML = ''; return; } const s =
                    G(); const msgs = s.messageDb.filter(m => (m.content || '').toLowerCase().includes(q) || (m.senderName || '')
                        .toLowerCase().includes(q)).slice(-15).reverse();
                r.innerHTML = msgs.length ? msgs.map(m => `
                  <div class="mitem" onclick="switchChannel('${m.channelId}');closeAllModals()">
                    <div class="mav">${esc((m.senderName||'?').charAt(0).toUpperCase())}</div>
                    <div class="minfo"><div class="mname">${esc(m.senderName||'?')}</div><div class="msub">${esc(m.content.substring(0,60))}</div></div>
                  </div>`).join('') :
                    `<div class="empty-ch">Sonuç bulunamadı</div>`; }

            /* ===== NOTIFICATIONS ===== */
            function renderNotifications() { const c = document.getElementById('notifList'); if (!c) return; const s = G();
                c.innerHTML = s.notifications.length ? [...s.notifications].reverse().slice(0, 30).map(n =>
                    `<div style="padding:6px 0;border-bottom:1px solid var(--b);font-size:11px;">${esc(n.text)}<div style="font-size:9px;color:var(--t3);">${new Date(n.time).toLocaleString('tr-TR')}</div></div>`
                    ).join('') : `<div class="empty-ch">${I.bell}<br>Bildirim yok</div>`; }

            /* ===== POLLS ===== */
            window.createPoll = function() { const s = G(); const q = document.getElementById('pollQuestion')?.value.trim(); const o1 =
                    document.getElementById('pollOption1')?.value.trim(); const o2 = document.getElementById('pollOption2')?.value
                    .trim(); const o3 = document.getElementById('pollOption3')?.value.trim(); if (!q || !o1 || !o2) return toast(
                    'Soru ve en az 2 seçenek gerekli', 'e'); const opts = [o1, o2, ...(o3 ? [o3] : [])]; const mid = genId();
                s.polls[mid] = { question: q, options: opts, votes: new Array(opts.length).fill(0), voters: {} }; const msg = { _id: mid,
                    content: `📊 **${q}**\n${opts.map((o,i)=>`${i+1}. ${o}`).join('\n')}`, senderName: s.user
                    .username, senderId: s.user._id, channelId: s.channel.id, createdAt: new Date().toISOString(),
                reactions: {} };
                s.messageDb.push(msg);
                S.persist();
                closeModal('pollModal');
                addMsgToDOM(msg); [1, 2, 3].forEach(n => { const el = document.getElementById('pollOption' + n); if (el) el.value =
                        ''; });
                document.getElementById('pollQuestion') && (document.getElementById('pollQuestion').value = ''); };
            window.votePoll = function(mid, opt) { const s = G(); const p = s.polls[mid]; if (!p) return; if (p.voters[s.user._id] !==
                    undefined) { toast('Zaten oy verdiniz', 'e'); return; }
                p.voters[s.user._id] = opt;
                p.votes[opt]++;
                S.persist();
                loadMessages(); };

            /* ===== THEME ===== */
            window.toggleLightMode = function() { const isLight = document.body.classList.toggle('light');
                localStorage.setItem('gt_light', isLight ? '1' : '0');
                renderApp(); };
            window.setTheme = function(primary, secondary) { document.documentElement.style.setProperty('--ac', primary);
                document.documentElement.style.setProperty('--ac2', secondary || primary);
                localStorage.setItem('gt_ac', primary);
                localStorage.setItem('gt_ac2', secondary || primary);
                closeModal('themeSettingsModal');
                toast('Tema değişti'); };

            function loadTheme() { const p = localStorage.getItem('gt_ac'),
                    s = localStorage.getItem('gt_ac2'); if (p && s) { document.documentElement.style.setProperty('--ac', p);
                    document.documentElement.style.setProperty('--ac2', s); } if (localStorage.getItem('gt_light') === '1') document
                    .body.classList.add('light'); }

            /* ===== EXPOSE ===== */
            window.openModal = openModal;
            window.closeModal = closeModal;
            window.closeAllModals = closeAllModals;
            window.addReaction = addReaction;
            window.votePoll = window.votePoll;
            window.copyMsg = copyMsg;
            window.deleteMsg = deleteMsg;
            window.pinMsg = pinMsg;
            window.editMsgInline = editMsgInline;
            window.addReactionPrompt = addReactionPrompt;
            window.openDM = window.openDM;
            window.openEditChannel = openEditChannel;
            window.retryConn = window.retryConn;
            window.createChannel = window.createChannel;
            window.createServer = window.createServer;
            window.addCategoryConfirm = window.addCategoryConfirm;
            window.saveServerSettings = window.saveServerSettings;
            window.saveProfile = window.saveProfile;
            window.openDMNew = window.openDMNew;
            window.startDM = window.startDM;
            window.addFriend = window.addFriend;
            window.openEditRole = window.openEditRole;
            window.saveRoleEdit = window.saveRoleEdit;
            window.addRole = window.addRole;
            window.saveChannelEdit = window.saveChannelEdit;
            window.switchChannel = switchChannel;
            window.createPoll = window.createPoll;
            window.toggleLightMode = window.toggleLightMode;
            window.setTheme = window.setTheme;

            /* ===== INIT ===== */
            function init() { document.documentElement.style.setProperty('--scrollbar-w', (window.innerWidth - document
                        .documentElement.clientWidth) + 'px');
                    initThreeJS();
                    loadTheme(); try { const raw = localStorage.getItem('gt_state'); if (raw) { const saved = JSON.parse(raw); const s =
                            G();
                            ['channels', 'categories', 'dmFriends', 'roles', 'userRoles', 'serverSettings', 'pinnedMessages',
                                'userStatuses', 'notifications', 'unreadCounts', 'blockedUsers', 'messageDb', 'polls', 'lang',
                                'dmUnread', 'offlineQueue', 'channelScrollPositions', 'userStatus', 'captchaVerified'
                            ].forEach(k => { if (saved[k] !== undefined) s[k] = saved[k]; }); } } catch (e) {} try { const u =
                        localStorage.getItem('gt_user'),
                        tk = localStorage.getItem('gt_token'); if (u && tk) { const s = G();
                        s.user = JSON.parse(u);
                        s.token = tk; if (!s.userRoles[s.user._id]) s.userRoles[s.user._id] = ['r4']; } } catch (e) {}
                    setTimeout(() => document.getElementById('ls')?.classList.add('hide'), 600);
                    renderApp(); if ('serviceWorker' in navigator) { const swCode =
                        `const CACHE='gettic-v2';self.addEventListener('install',e=>{self.skipWaiting()});self.addEventListener('activate',e=>{e.waitUntil(caches.keys().then(ks=>Promise.all(ks.filter(k=>k!==CACHE).map(k=>caches.delete(k)))));clients.claim()});self.addEventListener('fetch',e=>{if(e.request.method!=='GET')return;e.respondWith(fetch(e.request).then(r=>{const c=r.clone();caches.open(CACHE).then(ca=>ca.put(e.request,c));return r}).catch(()=>caches.match(e.request)))})`;
                        const blob = new Blob([swCode], { type: 'application/javascript' }); const url = URL.createObjectURL(
                        blob);
                        navigator.serviceWorker.register(url).catch(() => {}); }
                    window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault();
                        window._pwaPrompt = e;
                        toast('📱 Uygulama olarak yükleyebilirsiniz'); }); }

            init();
        })();
    </script>
</body>
  </html>
