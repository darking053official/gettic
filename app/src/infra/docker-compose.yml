version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: gettic_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-gettic_db}
      MYSQL_USER: ${MYSQL_USER:-gettic}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-gettic_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../db/migrations:/docker-entrypoint-initdb.d
    networks:
      - gettic_network

  redis:
    image: redis:7-alpine
    container_name: gettic_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - gettic_network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: gettic_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-gettic}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-gettic_password}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - gettic_network

  minio:
    image: minio/minio:latest
    container_name: gettic_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-gettic}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-gettic_password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - gettic_network

  meilisearch:
    image: getmeili/meilisearch:latest
    container_name: gettic_meilisearch
    restart: unless-stopped
    ports:
      - "7700:7700"
    volumes:
      - meilisearch_data:/meili_data
    networks:
      - gettic_network

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:
  minio_data:
  meilisearch_data:

networks:
  gettic_network:
    driver: bridge
