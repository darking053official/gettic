name: Bedrock Server & Tunnel
on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Çek
        uses: actions/checkout@v4

      - name: Kütüphaneleri Kur
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4 openssl unzip libnsl2 wget

      - name: Sunucuyu Hazırla (Garantili Yöntem)
        run: |
          cd mc/minecraft
          # 1. Eski sunucu dosyasını sil (Senin ayarların kalacak)
          rm -f bedrock_server
          
          # 2. Çalışan güncel Linux dosyasını çek
          wget https://minecraft.azureedge.net/bin-linux/bedrock-server-1.21.0.03.zip
          
          # 3. Sadece bedrock_server ve gerekli .so dosyalarını üzerine yaz
          unzip -o bedrock-server-1.21.0.03.zip bedrock_server *.so
          chmod +x bedrock_server
          echo "Sunucu dosyası yenilendi, ayarların korundu."

      - name: Localtonet Kurulumu
        run: |
          curl -L https://localtonet.com/download/localtonet-linux-x64 -o localtonet
          chmod +x localtonet

      - name: Başlat ve Kilitli Tut
        run: |
          ./localtonet authtoken AqtbZxleyWAJD0B8iFVCvsrUMkjzO7YKo
          ./localtonet udp 19132 &
          
          echo "Tünel ve Sunucu başlatılıyor..."
          cd mc/minecraft
          export LD_LIBRARY_PATH=.
          
          # ASIL NOKTA: Sunucu kapansa bile döngü sayesinde işlem bitmeyecek
          until ./bedrock_server; do
              echo "Sunucu çöktü, 5 saniye içinde yeniden başlatılıyor..."
              sleep 5
          done
