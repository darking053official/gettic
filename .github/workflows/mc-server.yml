name: GETTICMC Server

on:
  workflow_dispatch:

jobs:
  mc-server:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Ngrok
        run: |
          curl -sSL https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://ngrok-agent.s3.amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt update && sudo apt install ngrok -y
      
      - name: Setup and Run
        run: |
          ngrok config add-authtoken ${{ secrets.NGROK_AUTH_TOKEN }}
          
          cd mc/minecraft
          cat bedrock_server_part_* > bedrock_server
          chmod +x bedrock_server
          
          # Ngrok'u başlat
          ngrok udp 19132 --log=stderr &
          NGROK_PID=$!
          sleep 5
          
          # URL'yi al
          NGROK_URL=$(curl -s http://localhost:4040/api/tunnels | jq -r '.tunnels[0].public_url')
          echo "========================================="
          echo "Minecraft Bedrock Sunucusu: $NGROK_URL"
          echo "========================================="
          
          # Minecraft'ı arka planda başlat
          ./bedrock_server &
          MC_PID=$!
          
          echo "Sunucu basladi. PID: $MC_PID"
          echo "6 saat calisacak."
          
          # Bekle - sunucu kapanana kadar
          wait $MC_PID
