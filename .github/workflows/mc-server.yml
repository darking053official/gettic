name: Bedrock Server & Tunnel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Setup LocalToNet
      run: |
        wget https://localtonet.com/download/localtonet-linux-x64.zip
        unzip localtonet-linux-x64.zip
        chmod +x localtonet

    - name: Combine Server Parts
      run: |
        cd mc/minecraft
        cat bedrock_server_part_* > bedrock_server
        chmod +x bedrock_server

    - name: Run Server and Tunnel
      run: |
        # 1. Tokeni tırnak içinde sisteme kaydet
        ./localtonet authtoken "aqtbZxleyWAJD0B8iFVCvsrUMkjzO7YKo"
        
        # 2. Tüneli arka planda başlat (UDP 19132)
        ./localtonet udp --port 19132 &
        
        # 3. Tünelin adresi alması için biraz daha uzun bekle
        sleep 20
        
        # 4. Sunucuyu ateşle
        cd mc/minecraft
        LD_LIBRARY_PATH=. ./bedrock_server
