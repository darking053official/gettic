name: Bedrock Server & Tunnel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Setup LocalToNet
      run: |
        wget https://localtonet.com/download/localtonet-linux-x64.zip
        unzip localtonet-linux-x64.zip
        chmod +x localtonet
        # Tokeni sisteme tam olarak kaydet
        ./localtonet authtoken aqtbZxleyWAJD0B8iFVCvsrUMkjzO7YKo

    - name: Combine Server Parts
      run: |
        cd mc/minecraft
        cat bedrock_server_part_* > bedrock_server
        chmod +x bedrock_server

    - name: Run Server and Tunnel
      run: |
        # Tüneli UDP protokolü ve port 19132 ile arka planda başlat
        # --token parametresini doğrudan buraya da ekliyoruz ki "Wrong Token" diyemesin
        ./localtonet udp --port 19132 --token aqtbZxleyWAJD0B8iFVCvsrUMkjzO7YKo &
        
        sleep 10
        
        # Sunucuyu başlat
        cd mc/minecraft
        LD_LIBRARY_PATH=. ./bedrock_server
