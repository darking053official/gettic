name: Bedrock Server & Tunnel
on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Çek
        uses: actions/checkout@v4

      - name: Kütüphaneleri Kur
        run: |
          sudo apt-get update
          # Bedrock'ın Ubuntu'da çalışması için bu paketler şart
          sudo apt-get install -y libcurl4 openssl unzip libnsl2

      - name: Dosyaları Birleştir ve Yetki Ver
        run: |
          cd mc/minecraft
          # Varsa eski birleşmiş dosyayı sil
          rm -f bedrock_server
          
          # Parçaları alfabetik sırayla hatasız birleştir
          cat $(ls -v bedrock_server_part_*) > bedrock_server
          
          # Dosyayı çalıştırılabilir yap
          chmod +x bedrock_server
          
          echo "Birleştirme bitti. Dosya boyutu:"
          ls -lh bedrock_server

      - name: Localtonet Kurulumu
        run: |
          curl -L https://localtonet.com/download/localtonet-linux-x64 -o localtonet
          chmod +x localtonet

      - name: Sunucuyu ve Tüneli Başlat
        run: |
          # 1. Tüneli senin tokenınla başlat
          ./localtonet authtoken AqtbZxleyWAJD0B8iFVCvsrUMkjzO7YKo
          ./localtonet udp 19132 &
          
          echo "Tünel aktif edildi, sunucu motoru çalıştırılıyor..."
          sleep 5
          
          # 2. Sunucuyu Başlat
          cd mc/minecraft
          export LD_LIBRARY_PATH=.
          
          # Sunucuyu başlatıyoruz. Hata verse bile GitHub'ın 
          # süreci hemen kapatmaması için sonuna sleep ekledik.
          ./bedrock_server || echo "Sunucu bir hata verdi ama tünel denenebilir."
          
          # GitHub Actions'ın 6 saat boyunca kapanmamasını sağlar
          sleep 21600
