name: Bedrock Server Tunnel
on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Localtonet Kurulumu
        run: |
          curl -L https://localtonet.com/download/localtonet-linux-x64 -o localtonet
          chmod +x localtonet
      
      - name: Tüneli Başlat ve Canlı Tut
        run: |
          # Token'ı ayarla
          ./localtonet authtoken AqtbZxleyWAJD0B8iFVCvsrUMkjzO7YKo
          
          # Tüneli arka planda değil, doğrudan (foreground) başlat.
          # Logları görmek için çıktıları yönlendirme.
          ./localtonet udp 19132 & 
          
          # GitHub Actions'ın hemen kapanmaması için bir döngü ekleyelim.
          # Bu sayede tünel arkada çalışırken GitHub süreci öldürmez.
          echo "Tünel başlatıldı, 6 saat boyunca açık kalacak..."
          sleep 21600
