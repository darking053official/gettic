name: Bedrock Server & Tunnel
on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Çek (Checkout)
        uses: actions/checkout@v4

      - name: Gerekli Kütüphaneleri Kur
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4 openssl unzip

      - name: Sunucu Dosyalarını Birleştir ve Hazırla
        run: |
          # mc/minecraft klasörüne gir ve parçaları birleştir
          cd mc/minecraft
          cat bedrock_server_part_* > bedrock_server
          chmod +x bedrock_server
          echo "Sunucu dosyası birleştirildi ve yetkilendirildi."

      - name: Localtonet Kurulumu
        run: |
          curl -L https://localtonet.com/download/localtonet-linux-x64 -o localtonet
          chmod +x localtonet

      - name: Sunucuyu ve Tüneli Başlat
        run: |
          # 1. Tüneli arka planda başlat
          ./localtonet authtoken AqtbZxleyWAJD0B8iFVCvsrUMkjzO7YKo
          ./localtonet udp 19132 &
          
          echo "Tünel başlatıldı, sunucu açılıyor..."
          
          # 2. Minecraft sunucusunu başlat (Ön planda kalması için)
          cd mc/minecraft
          LD_LIBRARY_PATH=. ./bedrock_server
