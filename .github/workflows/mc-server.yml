name: GETTICMC Server

on:
  workflow_dispatch:

jobs:
  mc-server:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install LocalXpose
        run: |
          wget https://api.localxpose.io/api/downloads/loclx-linux-amd64.zip
          unzip loclx-linux-amd64.zip
          chmod +x loclx
          sudo mv loclx /usr/local/bin/
      
      - name: Setup and Run
        run: |
          # Login
          loclx login --token ${{ secrets.LOCALXPOSE_TOKEN }}
          
          cd mc/minecraft
          cat bedrock_server_part_* > bedrock_server
          chmod +x bedrock_server
          
          # Minecraft'ı başlat
          ./bedrock_server &
          sleep 3
          
          # Tünel aç
          loclx tunnel udp --port 19132 &
          sleep 3
          
          # Tünel URL'sini al
          echo "========================================="
          loclx tunnel list
          echo "========================================="
          
          # Bekle
          wait
