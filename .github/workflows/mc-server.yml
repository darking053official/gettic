name: Bedrock Server & Tunnel
on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Çek (Checkout)
        uses: actions/checkout@v4

      - name: Gerekli Kütüphaneleri Kur
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4 openssl unzip libnsl2

      - name: Sunucu Dosyalarını Birleştir ve Hazırla
        run: |
          # mc/minecraft klasörüne gir
          cd mc/minecraft
          
          # Parçaları birleştirerek orijinal bedrock_server dosyasını oluştur
          cat bedrock_server_part_* > bedrock_server
          chmod +x bedrock_server
          
          echo "Dosyalar başarıyla birleştirildi:"
          ls -lh bedrock_server

      - name: Localtonet Kurulumu
        run: |
          curl -L https://localtonet.com/download/localtonet-linux-x64 -o localtonet
          chmod +x localtonet

      - name: Sunucuyu ve Tüneli Başlat
        run: |
          # 1. Tüneli başlat ve arka plana at
          ./localtonet authtoken AqtbZxleyWAJD0B8iFVCvsrUMkjzO7YKo
          ./localtonet udp 19132 &
          
          echo "Tünel başlatıldı, sunucu yükleniyor..."
          sleep 5
          
          # 2. Minecraft sunucusunu başlat
          # LD_LIBRARY_PATH'i hem export ediyoruz hem de komut başında belirtiyoruz
          cd mc/minecraft
          export LD_LIBRARY_PATH=.
          
          # Sunucuyu başlat ve çıktısını anlık izle
          ./bedrock_server
