name: Bedrock Server Tunnel
on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Localtonet Kurulumu
        run: |
          curl -L https://localtonet.com/download/localtonet-linux-x64 -o localtonet
          chmod +x localtonet
      
      - name: Tüneli Başlat ve Açık Tut
        run: |
          # Token tanımlama
          ./localtonet authtoken AqtbZxleyWAJD0B8iFVCvsrUMkjzO7YKo
          
          # Tüneli başlat. 
          # Dikkat: Alttaki komut tüneli açar ve terminali meşgul eder. 
          # Böylece GitHub Actions "iş bitti" diyerek kapatmaz.
          ./localtonet udp 19132
