name: Run Gettic with Cloudflare Tunnel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: npm install
      
      - name: Start server with env
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          PORT: "3000"
        run: |
          node server.js &
          sleep 5
          echo "=== SERVER STATUS ==="
          curl -s http://localhost:3000/api/health || echo "Server not ready"
      
      - name: Test Email
        run: |
          echo "=== EMAIL TEST ==="
          curl -s -X POST http://localhost:3000/api/email/send \
            -H "Content-Type: application/json" \
            -d '{"to":"tahakrky@protonmail.com","subject":"Actions Test","html":"<h2>Test</h2>"}'
          echo ""
      
      - name: Start Cloudflare Tunnel
        run: |
          curl -sL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared
          ./cloudflared tunnel --url http://localhost:3000 2>&1 | tee tunnel.log &
          sleep 15
          TUNNEL_URL=$(grep -o 'https://.*trycloudflare.com' tunnel.log | head -1)
          echo "=== TUNNEL URL ==="
          echo "$TUNNEL_URL"
          echo "TUNNEL_URL=$TUNNEL_URL" >> $GITHUB_ENV
      
      - name: Update config.js
        run: |
          echo "=== UPDATING config.js ==="
          OLD=$(grep "const API" app/js/config.js)
          echo "Old: $OLD"
          sed -i "s|const API = .*|const API = '${{ env.TUNNEL_URL }}';|" app/js/config.js
          NEW=$(grep "const API" app/js/config.js)
          echo "New: $NEW"
      
      - name: Commit & Push
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add app/js/config.js
          git diff --cached --quiet && echo "No changes" || git commit -m "Auto-update: ${{ env.TUNNEL_URL }}"
          git push || echo "Push failed"
      
      - name: Keep alive
        run: sleep infinity
