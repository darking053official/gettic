name: Run Gettic with Cloudflare Tunnel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          npm install

      - name: Start server
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          BCRYPT_ROUNDS: ${{ secrets.BCRYPT_ROUNDS }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
          NODE_ENV: production
          PORT: "8080"
        run: |
          node src/server.js &
          sleep 5
          echo "=== SERVER READY ==="
          curl -s http://localhost:8080/health || echo "Health check failed"

      - name: Start Cloudflare Tunnel
        id: tunnel
        run: |
          curl -sL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared
          ./cloudflared tunnel --url http://localhost:8080 2>&1 | tee tunnel.log &
          sleep 10
          TUNNEL_URL=$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' tunnel.log | head -1)
          echo "TUNNEL_URL=$TUNNEL_URL"
          echo "TUNNEL_URL=$TUNNEL_URL" >> $GITHUB_ENV
          echo "tunnel_url=$TUNNEL_URL" >> $GITHUB_OUTPUT

      - name: Update config.js
        if: env.TUNNEL_URL != ''
        run: |
          sed -i "s|const SUPABASE_URL = .*|const SUPABASE_URL = '${{ secrets.SUPABASE_URL }}';|" public/js/config.js
          sed -i "s|const SUPABASE_ANON_KEY = .*|const SUPABASE_ANON_KEY = '${{ secrets.SUPABASE_ANON_KEY }}';|" public/js/config.js
          echo "Updated config.js with Supabase credentials"

      - name: Commit & Push
        if: env.TUNNEL_URL != ''
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add public/js/config.js
          git diff --cached --quiet && echo "No changes" || git commit -m "Update Supabase config: ${{ env.TUNNEL_URL }}"
          git push || echo "Push failed"

      - name: Show URL
        run: |
          echo "=========================================="
          echo "CANLI URL (60 dakika geçerli):"
          echo "${{ env.TUNNEL_URL }}"
          echo "=========================================="
          echo "Health check: ${{ env.TUNNEL_URL }}/health"
          echo "Chat: ${{ env.TUNNEL_URL }}/chat.html"

      - name: Keep alive
        run: |
          sleep infinity
