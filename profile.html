<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profil - Gettic</title>
<meta name="description" content="Gettic profil sayfası">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0a0f">
<link rel="icon" type="image/png" href="logo.png">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>tailwind.config={darkMode:'class',theme:{extend:{colors:{'bg-primary':'#0a0a0f','bg-secondary':'#12121a','bg-tertiary':'#1a1a24','bg-hover':'#22222e','accent':'#7c3aed','accent-hover':'#8b5cf6','border-dark':'#1f1f2e'}}}}</script>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-bg-primary text-white min-h-screen font-sans antialiased">

<nav class="fixed top-0 w-full z-50 glass-strong border-b border-border-dark">
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
<div class="flex items-center justify-between h-16">
<div class="flex items-center gap-3">
<a href="chat.html" class="text-gray-400 hover:text-white transition mr-2"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg></a>
<img src="logo.png" class="w-10 h-10 rounded-xl">
<span class="text-2xl font-bold gradient-text">Gettic</span>
</div>
<div class="flex gap-3">
<a href="chat.html" class="px-4 py-2 bg-bg-tertiary hover:bg-bg-hover rounded-lg transition">Sohbet</a>
<a href="settings.html" class="px-4 py-2 bg-bg-tertiary hover:bg-bg-hover rounded-lg transition">Ayarlar</a>
</div>
</div>
</div>
</nav>

<div class="pt-24 pb-12">
<div class="max-w-3xl mx-auto px-4">

<div class="card-premium p-8 mb-6">
<div class="flex flex-col items-center mb-8">
<div class="relative mb-4">
<img id="profileAvatar" src="logo.png" class="w-32 h-32 rounded-2xl object-cover avatar-premium">
<button onclick="showAvatarUpload()" class="absolute bottom-2 right-2 bg-accent hover:bg-accent-hover rounded-lg p-2 transition shadow-lg glow-effect">
<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
</button>
</div>
<h1 id="profileUsername" class="text-2xl font-bold gradient-text">Kullanıcı</h1>
<p id="profileFullName" class="text-gray-400">Ad Soyad</p>
<span id="profileStatus" class="mt-2 px-3 py-1 bg-green-500/20 text-green-400 rounded-full text-sm badge-premium badge-success">● Çevrimiçi</span>
</div>
<div class="grid grid-cols-3 gap-4 text-center">
<div class="bg-bg-tertiary rounded-xl p-4 hover-lift"><p id="statConversations" class="text-2xl font-bold gradient-text">0</p><p class="text-gray-400 text-sm">Sohbet</p></div>
<div class="bg-bg-tertiary rounded-xl p-4 hover-lift"><p id="statMessages" class="text-2xl font-bold gradient-text">0</p><p class="text-gray-400 text-sm">Mesaj</p></div>
<div class="bg-bg-tertiary rounded-xl p-4 hover-lift"><p id="statFriends" class="text-2xl font-bold gradient-text">0</p><p class="text-gray-400 text-sm">Arkadaş</p></div>
</div>
</div>

<div class="card-premium p-8 mb-6">
<h2 class="text-xl font-bold mb-6">Profili Düzenle</h2>
<form id="profileForm" class="space-y-6">
<div><label class="block text-sm font-medium text-gray-300 mb-2">Kullanıcı Adı</label>
<input type="text" id="username" placeholder="kullanici_adi" class="input-premium"></div>
<div><label class="block text-sm font-medium text-gray-300 mb-2">Ad Soyad</label>
<input type="text" id="fullName" placeholder="Ad Soyad" class="input-premium"></div>
<div><label class="block text-sm font-medium text-gray-300 mb-2">Durum</label>
<select id="status" class="input-premium"><option value="online">Çevrimiçi</option><option value="away">Uzakta</option><option value="busy">Meşgul</option><option value="offline">Görünmez</option></select></div>
<div id="errorMessage" class="hidden bg-red-500/10 border border-red-500/30 rounded-lg p-3 text-red-400 text-sm"></div>
<div id="successMessage" class="hidden bg-green-500/10 border border-green-500/30 rounded-lg p-3 text-green-400 text-sm"></div>
<button type="submit" class="shimmer-button w-full">Değişiklikleri Kaydet</button>
</form>
</div>

<div class="card-premium p-6 mb-6">
<h3 class="font-semibold mb-3 gradient-text">Hesap Bilgileri</h3>
<div class="space-y-2 text-sm">
<p class="text-gray-400">Kayıt Tarihi: <span id="createdAt" class="text-white">-</span></p>
<p class="text-gray-400">Son Görülme: <span id="lastSeen" class="text-white">-</span></p>
</div>
</div>

<div class="bg-red-500/5 border border-red-500/20 rounded-2xl p-6 backdrop-blur-sm">
<h3 class="font-semibold text-red-400 mb-3">Tehlikeli Bölge</h3>
<p class="text-gray-400 text-sm mb-4">Hesabınızı silmek geri alınamaz bir işlemdir.</p>
<button onclick="deleteAccount()" class="btn btn-danger">Hesabımı Sil</button>
</div>
</div>
</div>

<div id="avatarModal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
<div class="bg-bg-secondary rounded-2xl border border-border-dark p-6 w-full max-w-md shadow-2xl">
<h3 class="text-xl font-bold mb-4 gradient-text">Avatar Yükle</h3>
<input type="file" id="avatarInput" accept="image/*" class="w-full mb-4 text-white text-sm bg-bg-tertiary rounded-lg p-3 border border-border-dark">
<p class="text-gray-500 text-xs mb-4">Maks. 2MB • JPG, PNG, GIF, WebP</p>
<div class="flex justify-end gap-3">
<button onclick="hideAvatarUpload()" class="btn btn-secondary">İptal</button>
<button onclick="uploadAvatar()" class="btn btn-primary">Yükle</button>
</div>
</div>
</div>

<script>
const SUPABASE_URL='https://ayucfychcemsvzlgsdqq.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF5dWNmeWNoY2Vtc3Z6bGdzZHFxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4MDAwODksImV4cCI6MjEwNDM3NjA4OX0.XhXZjzy58cWuAhejswK_44_Y8JJKdSzPI4QCUrS8ipg';
const supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
let currentUser=null,currentProfile=null;

window.showAvatarUpload=function(){document.getElementById('avatarModal').classList.remove('hidden')};
window.hideAvatarUpload=function(){document.getElementById('avatarModal').classList.add('hidden')};

window.uploadAvatar=async function(){
const f=document.getElementById('avatarInput').files[0];
if(!f)return alert('Dosya seçin');
if(f.size>2*1024*1024)return alert('Dosya 2MB\'dan büyük olamaz');
const ext=f.name.split('.').pop();
const path=currentUser.id+'/'+Date.now()+'.'+ext;
const{error:upErr}=await supabase.storage.from('avatars').upload(path,f);
if(upErr){alert('Yükleme hatası: '+upErr.message);return}
const{data:{publicUrl}}=supabase.storage.from('avatars').getPublicUrl(path);
const{error:updErr}=await supabase.from('profiles').update({avatar_url:publicUrl}).eq('id',currentUser.id);
if(updErr){alert('Profil güncellenemedi: '+updErr.message);return}
hideAvatarUpload();
loadProfile();
};

window.deleteAccount=async function(){
if(!confirm('Hesabınızı silmek istediğinizden emin misiniz? Bu işlem geri alınamaz.'))return;
const{error}=await supabase.rpc('delete_user');
if(error){alert('Hesap silinemedi: '+error.message);return}
await supabase.auth.signOut();
window.location.href='auth.html';
};

document.addEventListener('DOMContentLoaded',async()=>{
const{data:{user}}=await supabase.auth.getUser();
if(!user){window.location.href='auth.html';return}
currentUser=user;
loadProfile();
});

async function loadProfile(){
const{data:profile}=await supabase.from('profiles').select('*').eq('id',currentUser.id).single();
if(!profile)return;
currentProfile=profile;
document.getElementById('profileUsername').textContent=profile.username||'Kullanıcı';
document.getElementById('profileFullName').textContent=profile.full_name||'';
document.getElementById('profileAvatar').src=profile.avatar_url||'logo.png';
document.getElementById('profileStatus').textContent=getStatusText(profile.status);
document.getElementById('username').value=profile.username||'';
document.getElementById('fullName').value=profile.full_name||'';
document.getElementById('status').value=profile.status||'online';
document.getElementById('createdAt').textContent=profile.created_at?new Date(profile.created_at).toLocaleDateString('tr-TR'):'-';
document.getElementById('lastSeen').textContent=profile.last_seen?new Date(profile.last_seen).toLocaleString('tr-TR'):'-';
loadStats();
}

function getStatusText(s){return{online:'● Çevrimiçi',away:'● Uzakta',busy:'● Meşgul',offline:'● Çevrimdışı'}[s]||'● Çevrimdışı'}

async function loadStats(){
const{data:convs}=await supabase.from('conversation_members').select('conversation_id').eq('user_id',currentUser.id);
const{count:msgCount}=await supabase.from('messages').select('id',{count:'exact'}).eq('sender_id',currentUser.id);
document.getElementById('statConversations').textContent=(convs||[]).length;
document.getElementById('statMessages').textContent=msgCount||0;
document.getElementById('statFriends').textContent=(convs||[]).length;
}

document.getElementById('profileForm').addEventListener('submit',async(e)=>{
e.preventDefault();
const username=document.getElementById('username').value.trim();
const fullName=document.getElementById('fullName').value.trim();
const status=document.getElementById('status').value;
const err=document.getElementById('errorMessage');
const suc=document.getElementById('successMessage');
err.classList.add('hidden');suc.classList.add('hidden');
if(username.length<3||username.length>20){err.textContent='Kullanıcı adı 3-20 karakter arası olmalı';err.classList.remove('hidden');return}
if(!/^[a-zA-Z0-9_]+$/.test(username)){err.textContent='Sadece harf, rakam ve alt çizgi';err.classList.remove('hidden');return}
const{error}=await supabase.from('profiles').update({username,full_name:fullName,status}).eq('id',currentUser.id);
if(error){err.textContent=error.message.includes('duplicate')?'Bu kullanıcı adı zaten kullanılıyor':error.message;err.classList.remove('hidden');return}
suc.textContent='Profil başarıyla güncellendi';suc.classList.remove('hidden');
loadProfile();
});
</script>
</body>
</html>
