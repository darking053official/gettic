<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş / Kayıt - Gettic</title>
    <meta name="description" content="Gettic'e giriş yapın veya ücretsiz kayıt olun">
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a0a0f">
    <link rel="icon" type="image/png" href="logo.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'bg-primary': '#0a0a0f',
                        'bg-secondary': '#12121a',
                        'bg-tertiary': '#1a1a24',
                        'bg-hover': '#22222e',
                        'accent': '#7c3aed',
                        'accent-hover': '#8b5cf6',
                        'border-dark': '#1f1f2e',
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
    
    <script>
        // Supabase İstemcisini Güvenli Başlatma
        const SUPABASE_URL = 'https://ayucfychcemsvzlgsdqq.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF5dWNmeWNoY2Vtc3Z6bGdzZHFxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4MDAwMDksImV4cCI6MjEwNDM3NjA4OX0.XhXZjzy58cWuAhejswK_44_Y8JJKdSzPI4QCUrS8ipg';
        let supabaseClient = null;

        function getClient() {
            if (!supabaseClient) {
                if (window.supabase && typeof window.supabase.createClient === 'function') {
                    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                } else {
                    alert('Supabase SDK henüz yüklenemedi, lütfen sayfayı yenileyin.');
                    return null;
                }
            }
            return supabaseClient;
        }
        
        window.doLogin = function() {
            const client = getClient();
            if (!client) return;

            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            
            if (!email || !password) {
                alert('Email ve şifre gerekli');
                return;
            }
            
            client.auth.signInWithPassword({ email, password })
                .then(({ data, error }) => {
                    if (error) {
                        alert(error.message);
                        return;
                    }
                    window.location.href = 'chat.html';
                })
                .catch(err => alert(err.message));
        };
        
        window.doRegister = function() {
            const client = getClient();
            if (!client) return;

            const username = document.getElementById('regUsername').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value;
            const confirmPassword = document.getElementById('regConfirmPassword').value;
            
            if (!username || !email || !password) {
                alert('Tüm alanları doldurun');
                return;
            }
            
            if (password !== confirmPassword) {
                alert('Şifreler eşleşmiyor');
                return;
            }
            
            if (password.length < 8) {
                alert('Şifre en az 8 karakter olmalı');
                return;
            }
            
            client.auth.signUp({
                email,
                password,
                options: { data: { username, full_name: username } }
            })
                .then(async ({ data, error }) => {
                    if (error) {
                        alert(error.message);
                        return;
                    }
                    if (data.user) {
                        await client.from('profiles').insert([{
                            id: data.user.id,
                            username,
                            full_name: username,
                            status: 'online'
                        }]);
                    }
                    window.location.href = 'chat.html';
                })
                .catch(err => alert(err.message));
        };
        
        window.doGoogleLogin = function() {
            const client = getClient();
            if (!client) return;

            client.auth.signInWithOAuth({
                provider: 'google',
                options: { redirectTo: window.location.origin + '/chat.html' }
            }).then(({ error }) => {
                if (error) alert(error.message);
            }).catch(err => alert(err.message));
        };
        
        window.doGithubLogin = function() {
            const client = getClient();
            if (!client) return;

            client.auth.signInWithOAuth({
                provider: 'github',
                options: { redirectTo: window.location.origin + '/chat.html' }
            }).then(({ error }) => {
                if (error) alert(error.message);
            }).catch(err => alert(err.message));
        };
        
        window.showLoginTab = function() {
            document.getElementById('loginForm').classList.remove('hidden');
            document.getElementById('registerForm').classList.add('hidden');
            document.getElementById('loginTab').className = 'flex-1 py-2 rounded-lg bg-accent text-white font-semibold transition';
            document.getElementById('registerTab').className = 'flex-1 py-2 rounded-lg bg-bg-tertiary text-gray-400 font-semibold transition';
            document.getElementById('subtitle').textContent = 'Tekrar hoş geldiniz';
        };
        
        window.showRegisterTab = function() {
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('registerForm').classList.remove('hidden');
            document.getElementById('loginTab').className = 'flex-1 py-2 rounded-lg bg-bg-tertiary text-gray-400 font-semibold transition';
            document.getElementById('registerTab').className = 'flex-1 py-2 rounded-lg bg-accent text-white font-semibold transition';
            document.getElementById('subtitle').textContent = 'Ücretsiz hesap oluşturun';
        };
        
        window.toggleLoginPass = function() {
            const input = document.getElementById('loginPassword');
            input.type = input.type === 'password' ? 'text' : 'password';
        };
        
        window.toggleRegPass = function() {
            const input = document.getElementById('regPassword');
            input.type = input.type === 'password' ? 'text' : 'password';
        };
    </script>
</head>
