<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>GETTICFM</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  background:#05010a;
  color:#fff;
  font-family:system-ui, -apple-system, sans-serif;
  overflow:hidden;
}

.header{
  height:52px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
  letter-spacing:5px;
  font-size:20px;
  background:linear-gradient(90deg,#ff4fd8,#7a5cff);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
  border-bottom:1px solid #220033;
}

.layout{
  display:grid;
  grid-template-columns:340px 1fr;
  height:calc(100vh - 52px);
}

.sidebar{
  background:#0b0014;
  border-right:1px solid #220033;
  overflow-y:auto;
  overflow-x:hidden;
}

.sidebar::-webkit-scrollbar{width:6px}
.sidebar::-webkit-scrollbar-thumb{background:#333;border-radius:3px}

.search{
  width:100%;
  padding:12px 16px;
  border:none;
  background:#12001f;
  color:#fff;
  outline:none;
  font-size:14px;
  position:sticky;
  top:0;
  z-index:2;
}

.search::placeholder{color:#666}

.sectionTitle{
  padding:12px 16px 8px;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:2px;
  color:#888;
  font-weight:600;
}

.card{
  padding:10px 16px;
  display:flex;
  gap:12px;
  align-items:center;
  cursor:pointer;
  transition:background .15s;
}

.card:hover{background:#1a0030}

.card.active{background:#1a0030;border-left:3px solid #7a5cff}

.card img{
  width:40px;
  height:40px;
  border-radius:10px;
  background:#1a0030;
  object-fit:cover;
  flex-shrink:0;
}

.card .info{min-width:0}

.card .name{
  font-size:14px;
  font-weight:500;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.card .votes{
  font-size:11px;
  color:#888;
  margin-top:2px;
}

.player{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:16px;
  padding:40px;
}

.now-playing{
  text-align:center;
}

.now-playing .station-name{
  font-size:24px;
  font-weight:700;
  margin-bottom:8px;
}

.now-playing .status{
  font-size:13px;
  color:#888;
}

.now-playing .status.live{color:#4ade80}

audio{width:70%;max-width:500px;border-radius:8px}

audio::-webkit-media-controls-panel{background:#1a0030}

.controls{
  display:flex;
  gap:12px;
}

button{
  padding:10px 20px;
  border:none;
  border-radius:10px;
  background:linear-gradient(90deg,#ff4fd8,#7a5cff);
  color:#fff;
  font-weight:600;
  cursor:pointer;
  font-size:14px;
  transition:opacity .2s;
}

button:hover{opacity:.85}

button:active{transform:scale(.97)}

.empty-state{
  text-align:center;
  padding:40px;
  color:#888;
}

.empty-state .icon{font-size:48px;margin-bottom:12px}

.empty-state p{font-size:14px}

/* Mobile responsive */
@media(max-width:768px){
  .layout{grid-template-columns:1fr}
  .sidebar{display:none}
  .sidebar.open{display:block;position:fixed;top:52px;left:0;width:100%;height:calc(100vh - 52px);z-index:10}
  .player{padding:20px}
  audio{width:90%}
  .mobile-toggle{
    display:flex !important;
    position:fixed;
    bottom:20px;
    left:20px;
    z-index:20;
    width:48px;
    height:48px;
    border-radius:50%;
    align-items:center;
    justify-content:center;
    font-size:20px;
  }
}

.mobile-toggle{display:none}

</style>
</head>

<body>

<div class="header">GETTICFM</div>

<div class="layout">

<div class="sidebar" id="sidebar">
  <input class="search" id="search" placeholder="🔍 Radyo ara...">
  <div class="sectionTitle">📻 TÜM İSTASYONLAR</div>
  <div id="list"></div>
  <div id="empty" class="empty-state" style="display:none">
    <div class="icon">📡</div>
    <p>İstasyon bulunamadı</p>
  </div>
</div>

<div class="player">
  <div class="now-playing" id="nowPlaying">
    <div class="station-name">🎵 Radyo Seçin</div>
    <div class="status">Dinlemeye başlamak için bir istasyon seçin</div>
  </div>
  
  <audio id="audio" controls></audio>
  
  <div class="controls">
    <button onclick="prev()">⏮ Önceki</button>
    <button onclick="togglePlay()" id="playBtn">▶ Oynat</button>
    <button onclick="next()">Sonraki ⏭</button>
  </div>
</div>

</div>

<button class="mobile-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">📻</button>

<script>

let all=[];
let currentIndex=-1;
let hls=null;
let isPlaying=false;

const audio=document.getElementById('audio');
const playBtn=document.getElementById('playBtn');

/* =========================
   FALLBACK (garanti liste)
========================= */
const FALLBACK=[
  {name:"Kral FM",stream:"https://playerservices.streamtheworld.com/api/livestream-redirect/KRAL_FM.mp3",logo:"",votes:0},
  {name:"Power FM",stream:"https://listen.powerapp.com.tr/powerfm/mpeg/icecast.audio",logo:"",votes:0},
  {name:"Joy FM",stream:"https://playerservices.streamtheworld.com/api/livestream-redirect/JOY_FM.mp3",logo:"",votes:0},
  {name:"Virgin Radio TR",stream:"https://playerservices.streamtheworld.com/api/livestream-redirect/VIRGIN_RADIO.mp3",logo:"",votes:0},
  {name:"Radyo Voyage",stream:"https://playerservices.streamtheworld.com/api/livestream-redirect/VOYAGE_FM.mp3",logo:"",votes:0}
];

/* =========================
   VALIDATION
========================= */
function valid(r){return r && r.stream && r.name}

/* =========================
   LOAD
========================= */
async function load(){
  try{
    const res=await fetch('channels.json');
    if(!res.ok) throw new Error('channels.json not found');
    const data=await res.json();
    all=data.filter(valid);
    if(all.length===0) throw new Error('empty');
  }catch(e){
    console.warn('channels.json yüklenemedi, fallback kullanılıyor');
    all=FALLBACK;
  }
  render();
}

/* =========================
   RENDER
========================= */
function render(){
  const list=document.getElementById('list');
  const empty=document.getElementById('empty');
  
  if(all.length===0){
    list.innerHTML='';
    empty.style.display='block';
    return;
  }
  
  empty.style.display='none';
  list.innerHTML=all.map((r,i)=>`
    <div class="card${i===currentIndex?' active':''}" onclick="play(${i})">
      <img src="${r.logo||'data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 40 40%22><rect fill=%22%23333%22 width=%2240%22 height=%2240%22 rx=%2210%22/><text x=%2220%22 y=%2226%22 text-anchor=%22middle%22 fill=%22%23fff%22 font-size=%2216%22>📻</text></svg>'}" alt="${r.name}" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 40 40%22><rect fill=%22%23333%22 width=%2240%22 height=%2240%22 rx=%2210%22/><text x=%2220%22 y=%2226%22 text-anchor=%22middle%22 fill=%22%23fff%22 font-size=%2216%22>📻</text></svg>'">
      <div class="info">
        <div class="name">${r.name}</div>
        ${r.votes?`<div class="votes">👍 ${r.votes}</div>`:''}
      </div>
    </div>
  `).join('');
}

/* =========================
   STOP
========================= */
function stop(){
  if(hls){hls.destroy();hls=null}
  audio.pause();
  audio.src='';
  audio.removeAttribute('src');
  isPlaying=false;
  updatePlayBtn();
}

/* =========================
   PLAY
========================= */
function play(index){
  if(index<0||index>=all.length) return;
  
  currentIndex=index;
  const r=all[index];
  
  stop();
  
  document.getElementById('nowPlaying').innerHTML=`
    <div class="station-name">📻 ${r.name}</div>
    <div class="status live">🔴 CANLI</div>
  `;
  
  render();
  
  if(!r.stream){next();return}
  
  if(r.stream.includes('.m3u8')&&Hls.isSupported()){
    hls=new Hls();
    hls.loadSource(r.stream);
    hls.attachMedia(audio);
    
    hls.on(Hls.Events.MANIFEST_PARSED,()=>{
      audio.play().then(()=>{isPlaying=true;updatePlayBtn()}).catch(()=>next());
    });
    
    hls.on(Hls.Events.ERROR,()=>{
      console.warn('HLS error, sonrakine geçiliyor');
      setTimeout(()=>next(),2000);
    });
  }else{
    audio.src=r.stream;
    audio.load();
    audio.play().then(()=>{isPlaying=true;updatePlayBtn()}).catch(()=>{
      console.warn('Play hatası, sonrakine geçiliyor');
      setTimeout(()=>next(),2000);
    });
  }
  
  // Mobile: sidebar'ı kapat
  document.getElementById('sidebar').classList.remove('open');
}

/* =========================
   NEXT / PREV
========================= */
function next(){
  if(all.length===0) return;
  currentIndex=(currentIndex+1)%all.length;
  play(currentIndex);
}

function prev(){
  if(all.length===0) return;
  currentIndex=(currentIndex-1+all.length)%all.length;
  play(currentIndex);
}

/* =========================
   TOGGLE PLAY
========================= */
function togglePlay(){
  if(!audio.src&&all.length>0){
    play(currentIndex>=0?currentIndex:0);
    return;
  }
  
  if(isPlaying){
    audio.pause();
    isPlaying=false;
  }else{
    audio.play().then(()=>{isPlaying=true}).catch(()=>{});
  }
  updatePlayBtn();
}

function updatePlayBtn(){
  playBtn.textContent=isPlaying?'⏸ Durdur':'▶ Oynat';
}

/* =========================
   AUDIO EVENTS
========================= */
audio.addEventListener('play',()=>{isPlaying=true;updatePlayBtn()});
audio.addEventListener('pause',()=>{isPlaying=false;updatePlayBtn()});
audio.addEventListener('ended',()=>{isPlaying=false;updatePlayBtn();next()});
audio.addEventListener('error',()=>{
  console.warn('Audio error, sonrakine geçiliyor');
  setTimeout(()=>next(),2000);
});

/* =========================
   SEARCH
========================= */
document.getElementById('search').addEventListener('input',(e)=>{
  const q=e.target.value.toLowerCase().trim();
  
  if(!q){
    render();
    return;
  }
  
  const filtered=all.filter(r=>r.name.toLowerCase().includes(q));
  const list=document.getElementById('list');
  const empty=document.getElementById('empty');
  
  if(filtered.length===0){
    list.innerHTML='';
    empty.style.display='block';
    return;
  }
  
  empty.style.display='none';
  list.innerHTML=filtered.map((r,i)=>{
    const origIndex=all.indexOf(r);
    return `
    <div class="card${origIndex===currentIndex?' active':''}" onclick="play(${origIndex})">
      <img src="${r.logo||''}" alt="${r.name}" onerror="this.style.display='none'">
      <div class="info">
        <div class="name">${r.name}</div>
        ${r.votes?`<div class="votes">👍 ${r.votes}</div>`:''}
      </div>
    </div>`;
  }).join('');
});

/* =========================
   KEYBOARD
========================= */
document.addEventListener('keydown',(e)=>{
  if(e.code==='Space'&&e.target===document.body){
    e.preventDefault();
    togglePlay();
  }
});

/* =========================
   START
========================= */
load();

</script>
</body>
  </html>
