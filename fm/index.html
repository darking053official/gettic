<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>GetticFM</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  background:#05010a;
  color:#fff;
  font-family:system-ui, -apple-system, sans-serif;
  overflow:hidden;
}

.header{
  height:52px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
  font-weight:900;
  letter-spacing:3px;
  font-size:18px;
  background:linear-gradient(90deg,#ff4fd8,#7a5cff);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
  border-bottom:1px solid #220033;
}

.header .sync-status{
  font-size:10px;
  font-weight:400;
  letter-spacing:1px;
  display:flex;
  align-items:center;
  gap:6px;
}

.sync-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#4ade80;
  animation:pulse 2s infinite;
}

.sync-dot.warning{background:#fbbf24}
.sync-dot.error{background:#ef4444}

@keyframes pulse{
  0%,100%{opacity:1}
  50%{opacity:.3}
}

.layout{
  display:grid;
  grid-template-columns:340px 1fr;
  height:calc(100vh - 52px);
}

.sidebar{
  background:#0b0014;
  border-right:1px solid #220033;
  overflow-y:auto;
  overflow-x:hidden;
}

.sidebar::-webkit-scrollbar{width:6px}
.sidebar::-webkit-scrollbar-thumb{background:#333;border-radius:3px}

.search{
  width:100%;
  padding:12px 16px;
  border:none;
  background:#12001f;
  color:#fff;
  outline:none;
  font-size:14px;
  position:sticky;
  top:0;
  z-index:2;
}

.search::placeholder{color:#666}

.search-wrapper{
  position:sticky;
  top:0;
  z-index:2;
  background:#0b0014;
  padding:8px;
}

.search-inner{
  display:flex;
  align-items:center;
  background:#12001f;
  border-radius:8px;
  padding:0 12px;
}

.search-inner svg{
  flex-shrink:0;
  opacity:.5;
}

.search-inner input{
  flex:1;
  padding:10px 8px;
  border:none;
  background:transparent;
  color:#fff;
  outline:none;
  font-size:14px;
}

.sectionTitle{
  padding:12px 16px 8px;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:2px;
  color:#888;
  font-weight:600;
  display:flex;
  align-items:center;
  gap:8px;
}

.sectionTitle svg{
  opacity:.6;
}

.card{
  padding:10px 16px;
  display:flex;
  gap:12px;
  align-items:center;
  cursor:pointer;
  transition:background .15s;
}

.card:hover{background:#1a0030}

.card.active{background:#1a0030;border-left:3px solid #7a5cff}

.card .icon{
  width:40px;
  height:40px;
  border-radius:10px;
  background:linear-gradient(135deg,#2a0040,#1a0030);
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
}

.card .icon svg{
  opacity:.7;
}

.card .info{min-width:0}

.card .name{
  font-size:14px;
  font-weight:500;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.card .votes{
  font-size:11px;
  color:#888;
  margin-top:2px;
  display:flex;
  align-items:center;
  gap:4px;
}

.player{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:16px;
  padding:40px;
}

.now-playing{
  text-align:center;
}

.now-playing .icon-large{
  margin-bottom:16px;
  opacity:.3;
}

.now-playing .station-name{
  font-size:24px;
  font-weight:700;
  margin-bottom:8px;
}

.now-playing .status{
  font-size:13px;
  color:#888;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
}

.status-dot{
  width:6px;
  height:6px;
  border-radius:50%;
  background:#4ade80;
}

.status-dot.connecting{background:#fbbf24;animation:pulse 1s infinite}
.status-dot.error{background:#ef4444}

audio{width:70%;max-width:500px;border-radius:8px}

audio::-webkit-media-controls-panel{background:#1a0030}

.controls{
  display:flex;
  gap:12px;
  align-items:center;
}

button{
  padding:10px 20px;
  border:none;
  border-radius:10px;
  background:linear-gradient(90deg,#ff4fd8,#7a5cff);
  color:#fff;
  font-weight:600;
  cursor:pointer;
  font-size:14px;
  transition:opacity .2s;
  display:flex;
  align-items:center;
  gap:6px;
}

button:hover{opacity:.85}

button:active{transform:scale(.97)}

button:disabled{
  opacity:.4;
  cursor:not-allowed;
  transform:none;
}

.btn-icon{
  width:40px;
  height:40px;
  padding:0;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
}

.empty-state{
  text-align:center;
  padding:40px;
  color:#888;
}

.empty-state svg{
  opacity:.3;
  margin-bottom:12px;
}

.empty-state p{font-size:14px}

.toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:#1a0030;
  border:1px solid #333;
  color:#fff;
  padding:10px 20px;
  border-radius:8px;
  font-size:12px;
  font-weight:500;
  letter-spacing:1px;
  opacity:0;
  transition:opacity .3s;
  z-index:100;
  pointer-events:none;
  display:flex;
  align-items:center;
  gap:8px;
}

.toast.show{opacity:1}

.retry-btn{
  display:none;
  margin-top:8px;
  padding:8px 20px;
  font-size:12px;
}

.retry-btn.show{display:flex}

/* Mobile responsive */
@media(max-width:768px){
  .layout{grid-template-columns:1fr}
  .sidebar{display:none}
  .sidebar.open{display:block;position:fixed;top:52px;left:0;width:100%;height:calc(100vh - 52px);z-index:10}
  .player{padding:20px}
  audio{width:90%}
  .mobile-toggle{
    display:flex !important;
    position:fixed;
    bottom:20px;
    left:20px;
    z-index:20;
    width:48px;
    height:48px;
    border-radius:50%;
    align-items:center;
    justify-content:center;
    box-shadow:0 4px 20px rgba(0,0,0,.5);
  }
}

.mobile-toggle{display:none}

</style>
</head>

<body>

<div class="header">
  <span>GetticFM</span>
  <span class="sync-status" id="syncStatus">
    <span class="sync-dot" id="syncDot"></span>
    <span id="syncText">YÜKLENIYOR</span>
  </span>
</div>

<div class="layout">

<div class="sidebar" id="sidebar">
  <div class="search-wrapper">
    <div class="search-inner">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input id="search" placeholder="Radyo ara...">
    </div>
  </div>
  
  <div class="sectionTitle">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" x2="12" y1="2" y2="22"/></svg>
    TÜM İSTASYONLAR
  </div>
  <div id="list"></div>
  <div id="empty" class="empty-state" style="display:none">
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/><path d="M12 8v8"/></svg>
    <p>İstasyon bulunamadı</p>
  </div>
</div>

<div class="player">
  <div class="now-playing" id="nowPlaying">
    <div class="icon-large">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
    </div>
    <div class="station-name">Radyo seçin</div>
    <div class="status">Dinlemeye başlamak için radyo kanalı seçin</div>
  </div>
  
  <audio id="audio" controls></audio>
  
  <div class="controls">
    <button onclick="prev()" id="prevBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
      Önceki
    </button>
    <button onclick="togglePlay()" id="playBtn" class="btn-icon">
      <svg id="playIcon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <button onclick="next()" id="nextBtn">
      Sonraki
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18V6l8.5 6zm10 0V6h2v12z"/></svg>
    </button>
  </div>
  
  <button class="retry-btn" id="retryBtn" onclick="retryCurrent()">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
    Tekrar Dene
  </button>
</div>

</div>

<button class="mobile-toggle btn-icon" onclick="document.getElementById('sidebar').classList.toggle('open')">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
</button>

<div class="toast" id="toast"></div>

<script>

const API_URL = 'https://de1.api.radio-browser.info/json/stations/search?country=Turkey&limit=200&hidebroken=true&order=votes&reverse=true';
const SYNC_INTERVAL = 10 * 60 * 1000;
const STREAM_TIMEOUT = 20000;
const MAX_RETRIES = 2;

let all=[];
let currentIndex=-1;
let hls=null;
let isPlaying=false;
let streamTimeout=null;
let retryCount=0;
let isSwitchingStation=false;

const audio=document.getElementById('audio');
const playBtn=document.getElementById('playBtn');
const playIcon=document.getElementById('playIcon');
const retryBtn=document.getElementById('retryBtn');
const syncDot=document.getElementById('syncDot');
const syncText=document.getElementById('syncText');

// Play/Pause SVG ikonlari
const PLAY_ICON = '<path d="M8 5v14l11-7z"/>';
const PAUSE_ICON = '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';

// Ses dalgasi SVG ikonu
const RADIO_WAVE = '<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4.5 9.5v5"/><path d="M8 7v10"/><path d="M11.5 4.5v15"/><path d="M15 7v10"/><path d="M18.5 9.5v5"/></svg>';

/* =========================
   FALLBACK
========================= */
const FALLBACK=[
  {name:"Kral FM",stream:"https://playerservices.streamtheworld.com/api/livestream-redirect/KRAL_FM.mp3",logo:"",votes:0},
  {name:"Power FM",stream:"https://listen.powerapp.com.tr/powerfm/mpeg/icecast.audio",logo:"",votes:0},
  {name:"Joy FM",stream:"https://playerservices.streamtheworld.com/api/livestream-redirect/JOY_FM.mp3",logo:"",votes:0},
  {name:"Virgin Radio TR",stream:"https://playerservices.streamtheworld.com/api/livestream-redirect/VIRGIN_RADIO.mp3",logo:"",votes:0},
  {name:"Radyo Voyage",stream:"https://playerservices.streamtheworld.com/api/livestream-redirect/VOYAGE_FM.mp3",logo:"",votes:0}
];

/* =========================
   VALIDATION
========================= */
function valid(r){return r && r.stream && r.name}

/* =========================
   SYNC STATUS UI
========================= */
function setSyncStatus(status){
  syncDot.className='sync-dot';
  switch(status){
    case 'loading':
      syncDot.classList.add('warning');
      syncText.textContent='YÜKLENIYOR';
      break;
    case 'ready':
      syncText.textContent='HAZIR';
      break;
    case 'api':
      syncText.textContent='API GÜNCEL';
      break;
    case 'fallback':
      syncDot.classList.add('error');
      syncText.textContent='FALLBACK';
      break;
    case 'error':
      syncDot.classList.add('warning');
      syncText.textContent='GÜNCELLENEMEDİ';
      break;
  }
}

/* =========================
   LOAD
========================= */
async function load(){
  setSyncStatus('loading');
  
  try{
    const res=await fetch('channels.json');
    if(!res.ok) throw new Error('not found');
    const data=await res.json();
    all=data.filter(valid);
    if(all.length===0) throw new Error('empty');
    setSyncStatus('ready');
    console.log('channels.json yuklendi:', all.length);
  }catch(e){
    console.log('channels.json yok, API deneniyor...');
    await fetchFromAPI();
  }
  render();
  startAutoSync();
}

/* =========================
   API'den cek
========================= */
async function fetchFromAPI(silent=false){
  if(!silent) setSyncStatus('loading');
  
  try{
    const res=await fetch(API_URL);
    if(!res.ok) throw new Error('API error');
    const data=await res.json();
    
    const newStations=data
      .filter(r=>r.url_resolved&&r.name)
      .map(r=>({
        name:r.name.trim(),
        stream:r.url_resolved,
        logo:r.favicon||'',
        votes:r.votes||0
      }))
      .filter((s,i,arr)=>i===arr.findIndex(x=>x.stream===s.stream))
      .slice(0,100);
    
    if(newStations.length===0) throw new Error('empty');
    
    if(!silent||all.length===0){
      all=newStations;
      setSyncStatus('api');
      console.log('API guncel:', all.length);
      if(!silent) showToast('Liste guncellendi', 'success');
    }
    
  }catch(e){
    console.warn('API hatası:', e.message);
    if(all.length===0){
      all=FALLBACK;
      setSyncStatus('fallback');
    }else{
      if(!silent) setSyncStatus('error');
    }
    if(!silent) showToast('Güncelleme başarısız', 'warning');
  }
}

/* =========================
   OTO-SYNC
========================= */
function startAutoSync(){
  console.log('Otomatik güncelleme:', SYNC_INTERVAL/60000+'dk');
  setInterval(()=>fetchFromAPI(true), SYNC_INTERVAL);
}

/* =========================
   TOAST
========================= */
function showToast(msg, type){
  const toast=document.getElementById('toast');
  const icons={
    success:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>',
    warning:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fbbf24" stroke-width="2"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>'
  };
  toast.innerHTML=(icons[type]||'')+msg;
  toast.classList.add('show');
  setTimeout(()=>toast.classList.remove('show'),3000);
}

/* =========================
   RENDER
========================= */
function render(){
  const list=document.getElementById('list');
  const empty=document.getElementById('empty');
  
  if(all.length===0){
    list.innerHTML='';
    empty.style.display='block';
    return;
  }
  
  empty.style.display='none';
  list.innerHTML=all.map((r,i)=>`
    <div class="card${i===currentIndex?' active':''}" onclick="play(${i})">
      <div class="icon">${RADIO_WAVE}</div>
      <div class="info">
        <div class="name">${r.name}</div>
        ${r.votes?`<div class="votes"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/></svg>${r.votes}</div>`:''}
      </div>
    </div>
  `).join('');
}

/* =========================
   STOP
========================= */
function stop(){
  if(streamTimeout){
    clearTimeout(streamTimeout);
    streamTimeout=null;
  }
  if(hls){
    hls.destroy();
    hls=null;
  }
  audio.pause();
  audio.src='';
  audio.removeAttribute('src');
  audio.load();
  isPlaying=false;
  retryCount=0;
  retryBtn.classList.remove('show');
  updatePlayBtn();
}

/* =========================
   NOW PLAYING UI
========================= */
function updateNowPlaying(r, status){
  const np=document.getElementById('nowPlaying');
  const statusDotClass=status==='live'?'':status==='connecting'?' connecting':' error';
  const statusText=status==='live'?'CANLI':status==='connecting'?'Baglaniyor':'Hata';
  
  np.innerHTML=`
    <div class="icon-large">${RADIO_WAVE}</div>
    <div class="station-name">${r.name}</div>
    <div class="status"><span class="status-dot${statusDotClass}"></span>${statusText}</div>
  `;
}

function handleStreamError(msg){
  clearTimeout(streamTimeout);
  streamTimeout=null;
  
  const r=all[currentIndex];
  if(r) updateNowPlaying(r, 'error');
  
  console.warn('Stream hatası:', msg);
  
  if(retryCount < MAX_RETRIES){
    retryCount++;
    console.log('Tekrar deneniyor:', retryCount+'/'+MAX_RETRIES);
    retryBtn.classList.add('show');
    updatePlayBtn();
    setTimeout(()=>{
      if(!isPlaying) play(currentIndex, true);
    },2000);
  }else{
    retryBtn.classList.add('show');
    updatePlayBtn();
    showToast('Bağlanamadı, sonraki istasyon deneniyor', 'warning');
    setTimeout(()=>{
      if(!isPlaying) next();
    },4000);
  }
}

function retryCurrent(){
  retryCount=0;
  retryBtn.classList.remove('show');
  play(currentIndex, true);
}

/* =========================
   PLAY
========================= */
function play(index, isRetry=false){
  if(index<0||index>=all.length) return;
  
  if(!isRetry){
    isSwitchingStation=true;
    setTimeout(()=>{isSwitchingStation=false},1500);
  }
  
  currentIndex=index;
  const r=all[index];
  
  stop();
  updateNowPlaying(r, 'connecting');
  render();
  
  if(!r.stream){
    handleStreamError('Stream URL yok');
    return;
  }
  
  streamTimeout=setTimeout(()=>{
    if(!isPlaying) handleStreamError('Baglanti zaman asimi');
  },STREAM_TIMEOUT);
  
  if(r.stream.includes('.m3u8')&&Hls.isSupported()){
    playHLS(r);
  }else{
    playMP3(r);
  }
  
  document.getElementById('sidebar').classList.remove('open');
}

function playHLS(r){
  try{
    hls=new Hls({maxBufferLength:30,maxMaxBufferLength:60});
    hls.loadSource(r.stream);
    hls.attachMedia(audio);
    
    hls.on(Hls.Events.MANIFEST_PARSED,()=>{
      clearTimeout(streamTimeout);
      audio.play().then(()=>{
        isPlaying=true;
        retryCount=0;
        updatePlayBtn();
        updateNowPlaying(r,'live');
      }).catch(e=>{
        if(!isSwitchingStation) handleStreamError(e.message);
      });
    });
    
    hls.on(Hls.Events.ERROR,(event,data)=>{
      if(data.fatal){
        if(data.type===Hls.ErrorTypes.MEDIA_ERROR&&retryCount<MAX_RETRIES){
          retryCount++;
          hls.recoverMediaError();
        }else{
          handleStreamError('HLS hatasi');
        }
      }
    });
    
  }catch(e){
    handleStreamError(e.message);
  }
}

function playMP3(r){
  audio.src=r.stream;
  audio.load();
  
  audio.play().then(()=>{
    clearTimeout(streamTimeout);
    isPlaying=true;
    retryCount=0;
    updatePlayBtn();
    updateNowPlaying(r,'live');
  }).catch(e=>{
    if(isSwitchingStation) return;
    
    if(retryCount<MAX_RETRIES){
      retryCount++;
      setTimeout(()=>play(currentIndex,true),2000);
    }else{
      handleStreamError(e.message);
    }
  });
}

/* =========================
   NEXT / PREV
========================= */
function next(){
  if(all.length===0) return;
  isSwitchingStation=true;
  setTimeout(()=>{isSwitchingStation=false},1500);
  currentIndex=(currentIndex+1)%all.length;
  play(currentIndex);
}

function prev(){
  if(all.length===0) return;
  isSwitchingStation=true;
  setTimeout(()=>{isSwitchingStation=false},1500);
  currentIndex=(currentIndex-1+all.length)%all.length;
  play(currentIndex);
}

/* =========================
   TOGGLE PLAY
========================= */
function togglePlay(){
  if(!audio.src&&all.length>0){
    play(currentIndex>=0?currentIndex:0);
    return;
  }
  isPlaying?audio.pause():audio.play().catch(()=>{});
}

function updatePlayBtn(){
  playIcon.innerHTML=isPlaying?PAUSE_ICON:PLAY_ICON;
}

/* =========================
   AUDIO EVENTS
========================= */
audio.addEventListener('play',()=>{isPlaying=true;updatePlayBtn()});
audio.addEventListener('pause',()=>{isPlaying=false;updatePlayBtn()});
audio.addEventListener('ended',()=>{isPlaying=false;updatePlayBtn();if(!isSwitchingStation)next()});
audio.addEventListener('error',()=>{
  if(!isSwitchingStation&&all[currentIndex]) handleStreamError('Ses hatasi');
});

/* =========================
   SEARCH
========================= */
document.getElementById('search').addEventListener('input',(e)=>{
  const q=e.target.value.toLowerCase().trim();
  if(!q){render();return}
  
  const filtered=all.filter(r=>r.name.toLowerCase().includes(q));
  const list=document.getElementById('list');
  const empty=document.getElementById('empty');
  
  if(filtered.length===0){
    list.innerHTML='';
    empty.style.display='block';
    return;
  }
  
  empty.style.display='none';
  list.innerHTML=filtered.map(r=>{
    const i=all.indexOf(r);
    return `
    <div class="card${i===currentIndex?' active':''}" onclick="play(${i})">
      <div class="icon">${RADIO_WAVE}</div>
      <div class="info">
        <div class="name">${r.name}</div>
        ${r.votes?`<div class="votes"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/></svg>${r.votes}</div>`:''}
      </div>
    </div>`;
  }).join('');
});

/* =========================
   KEYBOARD
========================= */
document.addEventListener('keydown',(e)=>{
  if(e.code==='Space'&&e.target===document.body){
    e.preventDefault();
    togglePlay();
  }
});

/* =========================
   START
========================= */
load();

</script>
