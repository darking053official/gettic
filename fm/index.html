<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>GETTICFM</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  background:#05010a;
  color:#fff;
  font-family:system-ui, -apple-system, sans-serif;
  overflow:hidden;
}

.header{
  height:52px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
  font-weight:900;
  letter-spacing:3px;
  font-size:18px;
  background:linear-gradient(90deg,#ff4fd8,#7a5cff);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
  border-bottom:1px solid #220033;
}

.header .sync-status{
  font-size:10px;
  font-weight:400;
  letter-spacing:1px;
  background:linear-gradient(90deg,#4ade80,#22c55e);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
}

.layout{
  display:grid;
  grid-template-columns:340px 1fr;
  height:calc(100vh - 52px);
}

.sidebar{
  background:#0b0014;
  border-right:1px solid #220033;
  overflow-y:auto;
  overflow-x:hidden;
}

.sidebar::-webkit-scrollbar{width:6px}
.sidebar::-webkit-scrollbar-thumb{background:#333;border-radius:3px}

.search{
  width:100%;
  padding:12px 16px;
  border:none;
  background:#12001f;
  color:#fff;
  outline:none;
  font-size:14px;
  position:sticky;
  top:0;
  z-index:2;
}

.search::placeholder{color:#666}

.sectionTitle{
  padding:12px 16px 8px;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:2px;
  color:#888;
  font-weight:600;
}

.card{
  padding:10px 16px;
  display:flex;
  gap:12px;
  align-items:center;
  cursor:pointer;
  transition:background .15s;
}

.card:hover{background:#1a0030}

.card.active{background:#1a0030;border-left:3px solid #7a5cff}

.card img{
  width:40px;
  height:40px;
  border-radius:10px;
  background:#1a0030;
  object-fit:cover;
  flex-shrink:0;
}

.card .info{min-width:0}

.card .name{
  font-size:14px;
  font-weight:500;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.card .votes{
  font-size:11px;
  color:#888;
  margin-top:2px;
}

.player{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:16px;
  padding:40px;
}

.now-playing{
  text-align:center;
}

.now-playing .station-name{
  font-size:24px;
  font-weight:700;
  margin-bottom:8px;
}

.now-playing .status{
  font-size:13px;
  color:#888;
}

.now-playing .status.live{color:#4ade80}

audio{width:70%;max-width:500px;border-radius:8px}

audio::-webkit-media-controls-panel{background:#1a0030}

.controls{
  display:flex;
  gap:12px;
}

button{
  padding:10px 20px;
  border:none;
  border-radius:10px;
  background:linear-gradient(90deg,#ff4fd8,#7a5cff);
  color:#fff;
  font-weight:600;
  cursor:pointer;
  font-size:14px;
  transition:opacity .2s;
}

button:hover{opacity:.85}

button:active{transform:scale(.97)}

.empty-state{
  text-align:center;
  padding:40px;
  color:#888;
}

.empty-state .icon{font-size:48px;margin-bottom:12px}

.empty-state p{font-size:14px}

.toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:#1a0030;
  color:#4ade80;
  padding:12px 24px;
  border-radius:8px;
  font-size:12px;
  font-weight:500;
  letter-spacing:1px;
  opacity:0;
  transition:opacity .3s;
  z-index:100;
  pointer-events:none;
}

.toast.show{opacity:1}

/* Mobile responsive */
@media(max-width:768px){
  .layout{grid-template-columns:1fr}
  .sidebar{display:none}
  .sidebar.open{display:block;position:fixed;top:52px;left:0;width:100%;height:calc(100vh - 52px);z-index:10}
  .player{padding:20px}
  audio{width:90%}
  .mobile-toggle{
    display:flex !important;
    position:fixed;
    bottom:20px;
    left:20px;
    z-index:20;
    width:48px;
    height:48px;
    border-radius:50%;
    align-items:center;
    justify-content:center;
    font-size:20px;
  }
}

.mobile-toggle{display:none}

</style>
</head>

<body>

<div class="header">
  <span>GETTICFM</span>
  <span class="sync-status" id="syncStatus">🔄 SENKRONIZE</span>
</div>

<div class="layout">

<div class="sidebar" id="sidebar">
  <input class="search" id="search" placeholder="🔍 Radyo ara...">
  <div class="sectionTitle">📻 TÜM İSTASYONLAR</div>
  <div id="list"></div>
  <div id="empty" class="empty-state" style="display:none">
    <div class="icon">📡</div>
    <p>İstasyon bulunamadı</p>
  </div>
</div>

<div class="player">
  <div class="now-playing" id="nowPlaying">
    <div class="station-name">🎵 Radyo Seçin</div>
    <div class="status">Dinlemeye başlamak için bir istasyon seçin</div>
  </div>
  
  <audio id="audio" controls></audio>
  
  <div class="controls">
    <button onclick="prev()">⏮ Önceki</button>
    <button onclick="togglePlay()" id="playBtn">▶ Oynat</button>
    <button onclick="next()">Sonraki ⏭</button>
  </div>
</div>

</div>

<button class="mobile-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">📻</button>

<div class="toast" id="toast"></div>

<script>

const API_URL = 'https://de1.api.radio-browser.info/json/stations/search?country=Turkey&limit=200&hidebroken=true&order=votes&reverse=true';
const SYNC_INTERVAL = 10 * 60 * 1000; // 10 dakika

let all=[];
let currentIndex=-1;
let hls=null;
let isPlaying=false;

const audio=document.getElementById('audio');
const playBtn=document.getElementById('playBtn');
const syncStatus=document.getElementById('syncStatus');

/* =========================
   FALLBACK (garanti liste)
========================= */
const FALLBACK=[
  {name:"Kral FM",stream:"https://playerservices.streamtheworld.com/api/livestream-redirect/KRAL_FM.mp3",logo:"",votes:0},
  {name:"Power FM",stream:"https://listen.powerapp.com.tr/powerfm/mpeg/icecast.audio",logo:"",votes:0},
  {name:"Joy FM",stream:"https://playerservices.streamtheworld.com/api/livestream-redirect/JOY_FM.mp3",logo:"",votes:0},
  {name:"Virgin Radio TR",stream:"https://playerservices.streamtheworld.com/api/livestream-redirect/VIRGIN_RADIO.mp3",logo:"",votes:0},
  {name:"Radyo Voyage",stream:"https://playerservices.streamtheworld.com/api/livestream-redirect/VOYAGE_FM.mp3",logo:"",votes:0}
];

/* =========================
   VALIDATION
========================= */
function valid(r){return r && r.stream && r.name}

/* =========================
   LOAD (önce channels.json, yoksa API)
========================= */
async function load(){
  syncStatus.textContent = '🔄 YÜKLENİYOR...';
  
  try{
    // Önce channels.json'ı dene
    const res=await fetch('channels.json');
    if(!res.ok) throw new Error('channels.json not found');
    const data=await res.json();
    all=data.filter(valid);
    if(all.length===0) throw new Error('empty');
    syncStatus.textContent = '✅ HAZIR';
    console.log(`📻 channels.json'dan ${all.length} istasyon yüklendi`);
  }catch(e){
    // channels.json yoksa API'den çek
    console.log('channels.json bulunamadı, API deneniyor...');
    await fetchFromAPI();
  }
  render();
}

/* =========================
   API'den çek
========================= */
async function fetchFromAPI(){
  syncStatus.textContent = '🔄 API ÇEKİLİYOR...';
  
  try{
    const res=await fetch(API_URL);
    if(!res.ok) throw new Error('API error');
    const data=await res.json();
    
    all=data
      .filter(r => r.url_resolved && r.name && r.name.trim().length > 0)
      .map(r => ({
        name: r.name.trim(),
        stream: r.url_resolved,
        logo: r.favicon || '',
        votes: r.votes || 0
      }))
      .filter((station, index, self) => 
        index === self.findIndex(s => s.stream === station.stream)
      )
      .slice(0, 100);
    
    if(all.length===0) throw new Error('empty API');
    
    syncStatus.textContent = '✅ API GÜNCEL';
    console.log(`📡 API'den ${all.length} istasyon çekildi`);
    showToast('🔄 Radyo listesi güncellendi');
    
  }catch(e){
    console.warn('API hatası:', e.message);
    if(all.length===0){
      all=FALLBACK;
      syncStatus.textContent = '⚠️ FALLBACK';
    }else{
      syncStatus.textContent = '⚠️ GÜNCEL DEĞİL';
    }
    showToast('⚠️ Güncelleme başarısız, mevcut liste korundu');
  }
}

/* =========================
   OTO-SYNC (10 dk)
========================= */
function startAutoSync(){
  console.log(`⏰ Her ${SYNC_INTERVAL/60000} dakikada bir otomatik güncelleme aktif`);
  
  setInterval(async () => {
    console.log('🔄 Otomatik güncelleme başladı...');
    const oldLength = all.length;
    await fetchFromAPI();
    
    if(all.length !== oldLength){
      render();
      console.log(`📊 Liste güncellendi: ${oldLength} → ${all.length}`);
      showToast(`📡 Liste güncellendi (${all.length} istasyon)`);
    }
  }, SYNC_INTERVAL);
}

/* =========================
   TOAST
========================= */
function showToast(msg){
  const toast=document.getElementById('toast');
  toast.textContent=msg;
  toast.classList.add('show');
  setTimeout(()=>toast.classList.remove('show'),3000);
}

/* =========================
   RENDER
========================= */
function render(){
  const list=document.getElementById('list');
  const empty=document.getElementById('empty');
  
  if(all.length===0){
    list.innerHTML='';
    empty.style.display='block';
    return;
  }
  
  empty.style.display='none';
  list.innerHTML=all.map((r,i)=>`
    <div class="card${i===currentIndex?' active':''}" onclick="play(${i})">
      <img src="${r.logo||''}" alt="${r.name}" onerror="this.style.display='none'">
      <div class="info">
        <div class="name">${r.name}</div>
        ${r.votes?`<div class="votes">👍 ${r.votes}</div>`:''}
      </div>
    </div>
  `).join('');
}

/* =========================
   STOP
========================= */
function stop(){
  if(hls){hls.destroy();hls=null}
  audio.pause();
  audio.src='';
  audio.removeAttribute('src');
  isPlaying=false;
  updatePlayBtn();
}

/* =========================
   PLAY
========================= */
function play(index){
  if(index<0||index>=all.length) return;
  
  currentIndex=index;
  const r=all[index];
  
  stop();
  
  document.getElementById('nowPlaying').innerHTML=`
    <div class="station-name">📻 ${r.name}</div>
    <div class="status live">🔴 CANLI</div>
  `;
  
  render();
  
  if(!r.stream){next();return}
  
  if(r.stream.includes('.m3u8')&&Hls.isSupported()){
    hls=new Hls();
    hls.loadSource(r.stream);
    hls.attachMedia(audio);
    
    hls.on(Hls.Events.MANIFEST_PARSED,()=>{
      audio.play().then(()=>{isPlaying=true;updatePlayBtn()}).catch(()=>next());
    });
    
    hls.on(Hls.Events.ERROR,()=>{
      console.warn('HLS error, sonrakine geçiliyor');
      setTimeout(()=>next(),2000);
    });
  }else{
    audio.src=r.stream;
    audio.load();
    audio.play().then(()=>{isPlaying=true;updatePlayBtn()}).catch(()=>{
      console.warn('Play hatası, sonrakine geçiliyor');
      setTimeout(()=>next(),2000);
    });
  }
  
  document.getElementById('sidebar').classList.remove('open');
}

/* =========================
   NEXT / PREV
========================= */
function next(){
  if(all.length===0) return;
  currentIndex=(currentIndex+1)%all.length;
  play(currentIndex);
}

function prev(){
  if(all.length===0) return;
  currentIndex=(currentIndex-1+all.length)%all.length;
  play(currentIndex);
}

/* =========================
   TOGGLE PLAY
========================= */
function togglePlay(){
  if(!audio.src&&all.length>0){
    play(currentIndex>=0?currentIndex:0);
    return;
  }
  
  if(isPlaying){
    audio.pause();
    isPlaying=false;
  }else{
    audio.play().then(()=>{isPlaying=true}).catch(()=>{});
  }
  updatePlayBtn();
}

function updatePlayBtn(){
  playBtn.textContent=isPlaying?'⏸ Durdur':'▶ Oynat';
}

/* =========================
   AUDIO EVENTS
========================= */
audio.addEventListener('play',()=>{isPlaying=true;updatePlayBtn()});
audio.addEventListener('pause',()=>{isPlaying=false;updatePlayBtn()});
audio.addEventListener('ended',()=>{isPlaying=false;updatePlayBtn();next()});
audio.addEventListener('error',()=>{
  console.warn('Audio error, sonrakine geçiliyor');
  setTimeout(()=>next(),2000);
});

/* =========================
   SEARCH
========================= */
document.getElementById('search').addEventListener('input',(e)=>{
  const q=e.target.value.toLowerCase().trim();
  
  if(!q){render();return}
  
  const filtered=all.filter(r=>r.name.toLowerCase().includes(q));
  const list=document.getElementById('list');
  const empty=document.getElementById('empty');
  
  if(filtered.length===0){
    list.innerHTML='';
    empty.style.display='block';
    return;
  }
  
  empty.style.display='none';
  list.innerHTML=filtered.map(r=>{
    const origIndex=all.indexOf(r);
    return `
    <div class="card${origIndex===currentIndex?' active':''}" onclick="play(${origIndex})">
      <img src="${r.logo||''}" alt="${r.name}" onerror="this.style.display='none'">
      <div class="info">
        <div class="name">${r.name}</div>
        ${r.votes?`<div class="votes">👍 ${r.votes}</div>`:''}
      </div>
    </div>`;
  }).join('');
});

/* =========================
   KEYBOARD
========================= */
document.addEventListener('keydown',(e)=>{
  if(e.code==='Space'&&e.target===document.body){
    e.preventDefault();
    togglePlay();
  }
});

/* =========================
   START
========================= */
load().then(()=>{
  startAutoSync();
});

</script>
</body>
</html>
