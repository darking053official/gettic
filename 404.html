<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Sayfa Bulunamadı | Gettic</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0a0a14;
            color: #e8e8f8;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        canvas#bg {
            position: fixed;
            inset: 0;
            z-index: 0;
        }

        .overlay {
            position: fixed;
            inset: 0;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            pointer-events: none;
        }

        .content {
            pointer-events: auto;
            max-width: 500px;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 12px;
            color: #dbbff9;
            text-shadow: 0 0 40px rgba(181, 123, 238, .5);
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        p {
            color: #9898b8;
            font-size: 14px;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        a.home-btn {
            display: inline-block;
            padding: 14px 32px;
            background: linear-gradient(135deg, #b57bee, #c99df2);
            color: #fff;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 700;
            font-size: 15px;
            transition: all .3s;
            box-shadow: 0 4px 30px rgba(181, 123, 238, .4);
            letter-spacing: .5px;
        }

        a.home-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 40px rgba(181, 123, 238, .6);
            filter: brightness(1.1);
        }

        .links {
            margin-top: 25px;
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .links a {
            background: rgba(255, 255, 255, .06);
            color: #9898b8;
            text-decoration: none;
            font-size: 12px;
            padding: 8px 18px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, .08);
            transition: all .2s;
        }

        .links a:hover {
            background: rgba(255, 255, 255, .12);
            color: #fff;
            border-color: rgba(181, 123, 238, .4);
        }

        .particle-hint {
            position: fixed;
            bottom: 30px;
            z-index: 2;
            color: #585878;
            font-size: 11px;
            text-align: center;
            width: 100%;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <canvas id="bg"></canvas>

    <div class="overlay">
        <div class="content">
            <h1>🔮 Sayfa Bulunamadı</h1>
            <p>Aradığın sayfa taşınmış, silinmiş veya hiç var olmamış olabilir.<br>Doğru adresi yazdığından emin ol.</p>
            <a href="/" class="home-btn">🏠 Ana Sayfaya Dön</a>
            <div class="links">
                <a href="/ai">🤖 Gettic AI</a>
                <a href="/apis/list">📋 API Listesi</a>
                <a href="/mc">🎮 Minecraft</a>
            </div>
        </div>
    </div>

    <div class="particle-hint">🖱️ Fareyi hareket ettir - partiküller seni takip etsin</div>

    <script>
        // ==================== THREE.JS 3D SAHNE ====================
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 20;

        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('bg'), alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        // ==================== PARTİKÜL SİSTEMİ ====================
        const particlesGeom = new THREE.BufferGeometry();
        const particlesCount = 600;
        const posArray = new Float32Array(particlesCount * 3);
        const colorArray = new Float32Array(particlesCount * 3);

        for (let i = 0; i < particlesCount * 3; i += 3) {
            posArray[i] = (Math.random() - 0.5) * 40;
            posArray[i + 1] = (Math.random() - 0.5) * 30;
            posArray[i + 2] = (Math.random() - 0.5) * 20;

            colorArray[i] = 0.6 + Math.random() * 0.4;
            colorArray[i + 1] = 0.4 + Math.random() * 0.3;
            colorArray[i + 2] = 0.8 + Math.random() * 0.2;
        }

        particlesGeom.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        particlesGeom.setAttribute('color', new THREE.BufferAttribute(colorArray, 3));

        const particlesMat = new THREE.PointsMaterial({
            size: 0.08,
            vertexColors: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            transparent: true,
            opacity: 0.8,
        });

        const particles = new THREE.Points(particlesGeom, particlesMat);
        scene.add(particles);

        // ==================== 3D "404" YAZISI ====================
        const textGroup = new THREE.Group();

        function createDigit(shape, x, color) {
            const geom = new THREE.ShapeGeometry(shape);
            const mat = new THREE.MeshPhongMaterial({
                color: color,
                emissive: color,
                emissiveIntensity: 0.6,
                shininess: 100,
                transparent: true,
                opacity: 0.9,
                side: THREE.DoubleSide,
            });
            const mesh = new THREE.Mesh(geom, mat);
            mesh.position.x = x;
            return mesh;
        }

        function createFour(x) {
            const shape = new THREE.Shape();
            shape.moveTo(-1.5, 3);
            shape.lineTo(0.5, 3);
            shape.lineTo(0.5, 0.5);
            shape.lineTo(-1.5, 0.5);
            shape.lineTo(-1.5, -1);
            shape.lineTo(0.5, -1);
            shape.lineTo(0.5, -3);
            shape.lineTo(-1.5, -3);
            shape.lineTo(-1.5, 3);
            return createDigit(shape, x, 0xb57bee);
        }

        function createZero(x) {
            const shape = new THREE.Shape();
            shape.moveTo(-1.5, 3);
            shape.lineTo(1.5, 3);
            shape.lineTo(1.5, -3);
            shape.lineTo(-1.5, -3);
            shape.lineTo(-1.5, 3);

            const hole = new THREE.Path();
            hole.moveTo(-0.7, 2);
            hole.lineTo(0.7, 2);
            hole.lineTo(0.7, -2);
            hole.lineTo(-0.7, -2);
            shape.holes.push(hole);

            return createDigit(shape, x, 0xc99df2);
        }

        textGroup.add(createFour(-5));
        textGroup.add(createZero(0));
        textGroup.add(createFour(5));

        textGroup.position.y = 1;
        scene.add(textGroup);

        // ==================== IŞIKLANDIRMA ====================
        const ambientLight = new THREE.AmbientLight(0x333355, 0.6);
        scene.add(ambientLight);

        const pointLight1 = new THREE.PointLight(0xb57bee, 1.5, 30);
        pointLight1.position.set(8, 5, 10);
        scene.add(pointLight1);

        const pointLight2 = new THREE.PointLight(0xc99df2, 1.2, 25);
        pointLight2.position.set(-8, -3, 8);
        scene.add(pointLight2);

        const pointLight3 = new THREE.PointLight(0xdbbff9, 0.8, 20);
        pointLight3.position.set(0, 0, 15);
        scene.add(pointLight3);

        // ==================== MOUSE TAKİBİ ====================
        let mouseX = 0,
            mouseY = 0;
        let targetX = 0,
            targetY = 0;

        document.addEventListener('mousemove', (e) => {
            targetX = (e.clientX / window.innerWidth) * 2 - 1;
            targetY = -(e.clientY / window.innerHeight) * 2 + 1;
        });

        document.addEventListener('touchmove', (e) => {
            targetX = (e.touches[0].clientX / window.innerWidth) * 2 - 1;
            targetY = -(e.touches[0].clientY / window.innerHeight) * 2 + 1;
        });

        // ==================== ANİMASYON DÖNGÜSÜ ====================
        function animate() {
            requestAnimationFrame(animate);

            mouseX += (targetX - mouseX) * 0.05;
            mouseY += (targetY - mouseY) * 0.05;

            particles.rotation.y += 0.0003;
            particles.rotation.x += 0.0001;

            textGroup.rotation.y = mouseX * 0.5;
            textGroup.rotation.x = mouseY * 0.3;
            textGroup.position.y = 1 + Math.sin(Date.now() * 0.001) * 0.3;

            const t = Date.now() * 0.001;
            pointLight1.intensity = 1.2 + Math.sin(t * 0.8) * 0.4;
            pointLight2.intensity = 1.0 + Math.cos(t * 0.6) * 0.3;
            pointLight3.intensity = 0.7 + Math.sin(t * 1.2) * 0.2;

            renderer.render(scene, camera);
        }

        // ==================== RESIZE ====================
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
